     on a row without the detail sheet being open behind it.  `done()` is
     the caller's guard release, and every path through releases it. */
  function pinEntry(eid, done) {
    apiFetch('/api/pin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entry_id: eid }),
    })
      .then(function (res) {
        done();
        if (res.status === 403) { notifyTokenExpired(); return; }
        var pinned = !!(res.data && res.data.pinned);
        var item = findHistById(eid);
        if (res.data && res.data.ok && item) {
          item.pinned = pinned;
          reorderHistoryPinnedFirst();
          renderHistory();
          // Only while that clip is the one the detail sheet is showing.
          if (eid === modalEntryId) updateModalUtils();
          showToast(pinned ? T.histPinnedToast : T.histUnpinnedToast);
        } else {
          showToast(T.histPinFail, true);
        }
      })
      .catch(function () {
        done();
        showToast(T.histPinFail + ' · ' + failHint(), true);
      });
  }

  histPinBtn.addEventListener('click', function () {
    modalAction(function (done) { pinEntry(modalEntryId, done); });
  });

  // Keep the local list ordered like the server returns it (pinned first,
  // relative order preserved) so subsequent page merges and load-mores don't
  // interleave pinned rows unpredictably.
  function reorderHistoryPinnedFirst() {
    var pinnedArr = [];
    var rest = [];
    for (var i = 0; i < historyItems.length; i++) {
      (historyItems[i] && historyItems[i].pinned ? pinnedArr : rest).push(historyItems[i]);
    }
    historyItems.splice(0, historyItems.length);
    for (var p = 0; p < pinnedArr.length; p++) historyItems.push(pinnedArr[p]);
    for (var r = 0; r < rest.length; r++) historyItems.push(rest[r]);
  }

  // Push the FULL entry (all stored formats — text, HTML, image bytes) back
  // onto the computer's clipboard. This is the phone's "paste into the PC"
  // gesture and works for images too, unlike the phone-local copy button.
  function pushEntry(eid, done) {
    apiFetch('/api/paste-rich', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entry_id: eid }),
    })
      .then(function (res) {
        done();
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok) {
          showToast(T.histPushOk);
        } else {
          showToast(apiError(res.data, T.histPushFail), true);
        }
      })
      .catch(function () {
        done();
        showToast(T.histPushFail + ' · ' + failHint(), true);
      });
  }

  histPushBtn.addEventListener('click', function () {
    modalAction(function (done) { pushEntry(modalEntryId, done); });
  });

  // Save the entry's full text as a favorite (mirrors the desktop context
  // menu: fetch the complete payload, not the truncated list preview).
  function favoriteEntry(eid, done) {
    getJson('/api/history/item?entry_id=' + encodeURIComponent(eid))
      .then(function (data) {
        var full = (data && data.item) || {};
        var content = getFullText(full) || full.text_preview ||
          (findHistById(eid) || {}).text_preview || '';
        if (!content) throw new Error('empty');
        var titleLine = content.split('\n')[0].trim().slice(0, 60);
        return apiFetch('/api/favorites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: titleLine, content: content, group: '' }),
        });
      })
      .then(function (res) {
        done();
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok !== false) {
          showToast(T.histFavOk);
        } else {
          showToast(apiError(res.data, T.histFavFail), true);
        }
      })
      .catch(function () {
        done();
        showToast(T.histFavFail + ' · ' + failHint(), true);
      });
  }

  histFavBtn.addEventListener('click', function () {
    modalAction(function (done) { favoriteEntry(modalEntryId, done); });
  });

  function deleteEntry(eid, done) {
    if (!window.confirm(T.histDeleteConfirm)) { done(); return; }
    apiFetch('/api/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entry_id: eid }),
    })
      .then(function (res) {
        done();
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok) {
          for (var i = 0; i < historyItems.length; i++) {
            if (historyItems[i] && historyItems[i].entry_id === eid) {
              historyItems.splice(i, 1);
              break;
            }
          }
          // Shrink the pagination cursor with the array so "load more"
          // doesn't skip the entry that shifted into the deleted slot
          // (same contract as store.historyOffset on the desktop).
          historyOffset = Math.max(0, historyOffset - 1);
          // The detail sheet is showing the clip that just went away.
          if (eid === modalEntryId) closeModal();
          renderHistory();
          showToast(T.histDeleted);
        } else {
          showToast(apiError(res.data, T.histDelFail), true);
        }
      })
      .catch(function () {
        done();
        showToast(T.histDelFail + ' · ' + failHint(), true);
      });
  }

  histDelBtn.addEventListener('click', function () {
    modalAction(function (done) { deleteEntry(modalEntryId, done); });
  });

  /* ── History row menu (⋯) ────────────────────────────────────
     The same sheet idiom as the clip's detail, one action per line, and no
     content: the point is to act on a row without reading it first.  It
     closes before the action runs, so the toast lands on the list rather
     than behind a sheet. */
  var rowSheetEl = document.getElementById('rowSheet');
  var rowSheetBox = document.getElementById('rowSheetBox');
  var rowSheetTitle = document.getElementById('rowSheetTitle');
  var rowPinBtn = document.getElementById('rowPinBtn');
  var rowPushBtn = document.getElementById('rowPushBtn');
  var rowFavBtn = document.getElementById('rowFavBtn');
  var rowDelBtn = document.getElementById('rowDelBtn');
  var sheetEntryId = null;
  var sheetBusy = false;
  var sheetReturnFocus = null;

  function openRowSheet(item, from) {
    if (!rowSheetEl || !item || !item.entry_id) return;
    sheetEntryId = item.entry_id;
    sheetBusy = false;
    sheetReturnFocus = from || document.activeElement;
    // The clip's own first line, as the answer to "which one is this?" —
    // the row was just tapped, and the sheet covers it.
    var title = previewText(item) || item.content_type || T.emptyPreview;
    rowSheetTitle.textContent = title.length > 60 ? title.slice(0, 60) + '…' : title;
    rowPinBtn.textContent = item.pinned ? T.histUnpin : T.histPin;
    rowPushBtn.textContent = T.histPush;
    rowFavBtn.textContent = T.histFav;
    rowDelBtn.textContent = T.histDel;
    // Favorites are text: the detail sheet disables this action for an
    // image-only clip, and the row's type is enough to apply the same rule.
    rowFavBtn.style.display = isImageRow(item) ? 'none' : '';
    rowSheetEl.classList.add('modal-mask--show');
    rowSheetEl.setAttribute('aria-hidden', 'false');
    if (rowSheetBox && rowSheetBox.focus) rowSheetBox.focus();
  }

  function closeRowSheet() {
    if (!rowSheetEl || !rowSheetEl.classList.contains('modal-mask--show')) return;
    rowSheetEl.classList.remove('modal-mask--show');
    rowSheetEl.setAttribute('aria-hidden', 'true');
    sheetEntryId = null;
    // The row may be gone by now — an action re-renders the list — and
    // focusing a detached node drops focus to the body, which is worse than
    // leaving it on the list.
    if (sheetReturnFocus && sheetReturnFocus.isConnected && sheetReturnFocus.focus) {
      sheetReturnFocus.focus();
    }
    sheetReturnFocus = null;
  }

  function rowSheetRun(action) {
    var eid = sheetEntryId;
    if (!eid || sheetBusy) return;
    sheetBusy = true;
    closeRowSheet();
    var done = function () { sheetBusy = false; };
    if (action === 'pin') pinEntry(eid, done);
    else if (action === 'push') pushEntry(eid, done);
    else if (action === 'fav') favoriteEntry(eid, done);
    else if (action === 'del') deleteEntry(eid, done);
    else done();
  }

  if (rowSheetEl) {
    rowPinBtn.addEventListener('click', function () { rowSheetRun('pin'); });
    rowPushBtn.addEventListener('click', function () { rowSheetRun('push'); });
    rowFavBtn.addEventListener('click', function () { rowSheetRun('fav'); });
    rowDelBtn.addEventListener('click', function () { rowSheetRun('del'); });
    document.getElementById('rowSheetClose').addEventListener('click', closeRowSheet);
    // A tap on the mask reads as "never mind", exactly as it does on the
    // clip's own sheet.
    rowSheetEl.addEventListener('click', function (event) {
      if (event.target === rowSheetEl) closeRowSheet();
    });
    rowSheetEl.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') { event.preventDefault(); closeRowSheet(); return; }
      if (event.key !== 'Tab') return;
      trapTab(event, rowSheetEl, rowSheetBox);
    });
  }

  /* ── Send ──────────────────────────────────────────────────── */

  /** The send box's limit, and the one line under it.
   *
   * The desktop window's own 推送文本 box caps at 100 000 characters; this one
   * had no cap at all, so a paste that went through the phone was neither cut
   * nor refused for a length its sibling accepts -- there was simply nothing
   * saying where the end was.  `maxlength` on the textarea enforces the same
   * number, and the hint only starts counting in the last stretch of it: a
   * counter from the first keystroke is a limit the reader is being pushed
   * towards, and this one is far enough away to be ignored until it is not.
   */
  var SEND_MAX = 100000;
  var SEND_COUNT_FROM = SEND_MAX - 1000;
  function renderSendHint() {
    var hint = document.getElementById('sendHint');
    var n = (sendText.value || '').length;
    if (n < SEND_COUNT_FROM) { hint.textContent = T.sendHint; return; }
    var pattern = n >= SEND_MAX ? T.sendLimitHint : T.sendCountHint;
    hint.textContent = pattern.replace('{n}', String(n)).replace('{max}', String(SEND_MAX));
  }
  sendText.addEventListener('input', renderSendHint);

  /* Tap to paste, at the caret rather than over whatever is already typed: the
     clipboard is a second half of a sentence as often as it is the whole one.
     `readText` needs a real gesture and may still be refused — on refusal the
     answer is the long press the reader would have used anyway, said out loud
     rather than the button appearing to do nothing.  See U177. */
  var pasteBtn = document.getElementById('pasteBtn');
  if (pasteBtn) {
    pasteBtn.textContent = T.paste;
    pasteBtn.addEventListener('click', function () {
      if (!navigator.clipboard || !navigator.clipboard.readText) {
        showToast(T.pasteBlocked, true);
        return;
      }
      navigator.clipboard.readText().then(function (text) {
        if (!text) { showToast(T.pasteEmpty, true); return; }
        var start = sendText.selectionStart;
        var end = sendText.selectionEnd;
        if (typeof start === 'number' && typeof end === 'number' && sendText.setRangeText) {
          sendText.setRangeText(text, start, end, 'end');
        } else {
          sendText.value += text;
        }
        renderSendHint();
        try { sendText.focus(); } catch (e) {}
      }).catch(function () { showToast(T.pasteBlocked, true); });
    });
  }

  var sendBtn = document.getElementById('sendBtn');
  sendBtn.addEventListener('click', function () {
    var text = sendText.value.trim();
    if (!text) { showToast(T.sendEmpty, true); return; }
    sendBtn.disabled = true;
    apiFetch('/api/push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text }),
    })
      .then(function (res) {
        sendBtn.disabled = false;
        // A 403 (stale token) surfaces as the localized token-expired message
        // instead of the server's English error string.
        if (res.status === 403) {
          showToast(T.tokenExpired, true);
          return;
        }
        if (res.data.ok) {
          showToast(T.sendOk);
          sendText.value = '';
          renderSendHint();
        } else {
          showToast(apiError(res.data, T.sendFail), true);
        }
      })
      .catch(function () {
        sendBtn.disabled = false;
        showToast(T.sendFail + ' · ' + failHint(), true);
      });
  });

  /* ── Files: upload ─────────────────────────────────────────── */

  document.getElementById('uploadBtn').addEventListener('click', function () {
    fileInput.click();
  });

  function resetUploadUI() {
    uploadXhr = null;
    var btn = document.getElementById('uploadBtn');
    btn.textContent = T.uploadBtn;
    btn.disabled = false;
    uploadProgressWrap.style.display = 'none';
    fileInput.value = '';
  }

  function hideUploadResult() {
    uploadFailed = [];
    uploadResult.style.display = 'none';
    uploadResultText.textContent = '';
  }

  /* One line for the whole batch: how many landed, how many did not, and which
     ones did not.  A count alone leaves the reader guessing, and the names are
     the only part that says what to go and pick again. */
  function uploadSummary(okCount, failed) {
    var names = [];
    for (var i = 0; i < failed.length && i < 3; i++) names.push(failed[i].name);
    var joined = names.join(T.uploadNameSep);
    if (failed.length > 3) joined += T.uploadMore.replace('{n}', String(failed.length - 3));
    return T.uploadPartial
      .replace('{ok}', String(okCount))
      .replace('{fail}', String(failed.length))
      .replace('{names}', joined);
  }

  function showUploadResult(okCount, failed) {
    // The File objects, not their names: a retry has to send the bytes again,
    // and the name alone is not something FormData can append.
    uploadFailed = failed.slice();
    uploadResultText.textContent = uploadSummary(okCount, failed);
    uploadRetryBtn.textContent = T.uploadRetry.replace('{n}', String(failed.length));
    uploadDismissBtn.textContent = T.uploadDismiss;
    uploadResult.style.display = 'block';
    // The batch ended badly; the retry is the next thing to do with it, and it
    // is also the only way to hear the sentence a second time.
    uploadRetryBtn.focus();
  }

  function startUpload(files) {
    var btn = document.getElementById('uploadBtn');
    var totalBytes = 0;
    for (var k = 0; k < files.length; k++) totalBytes += files[k].size;
    // A zero-byte file would make every percentage NaN, and a bar that never
    // moves is worse than a wrong one.
    if (totalBytes <= 0) totalBytes = 1;
    var uploadedBytes = 0;
    var doneCount = 0;
    var cancelled = false;
    var failed = [];

    hideUploadResult();
    btn.textContent = T.uploading;
    btn.disabled = true;
    uploadProgressFill.style.width = '0%';
    uploadProgressWrap.style.display = 'flex';
    uploadCancelBtn.textContent = T.uploadCancel;

    // The server upload endpoint accepts ONE file per request, so queue the
    // selected files and upload them one at a time (cumulative progress).
    var queue = files.slice();

    function uploadNext() {
      if (cancelled) return;
      if (queue.length === 0) {
        resetUploadUI();
        loadFiles();
        // Nothing to retry when everything landed; a toast is the whole story.
        if (failed.length === 0) showToast(T.uploadOk);
        else showUploadResult(doneCount, failed);
        return;
      }
      var file = queue.shift();
      var form = new FormData();
      form.append('file', file);

      var xhr = new XMLHttpRequest();
      uploadXhr = xhr;
      xhr.open('POST', HOST + '/api/upload');
      if (TOKEN) xhr.setRequestHeader('Authorization', 'Bearer ' + TOKEN);
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) {
          var pct = Math.round(((uploadedBytes + e.loaded) / totalBytes) * 100);
          if (pct > 100) pct = 100;
          uploadProgressFill.style.width = pct + '%';
        }
      };
      xhr.onload = function () {
        if (cancelled) return;
        var data = null;
        try { data = JSON.parse(xhr.responseText); } catch (e) { /* ignore */ }
        var ok = xhr.status >= 200 && xhr.status < 300 && data && data.ok;
        // A batch is a job, not a request: one 413 must not throw away the
        // seven files queued behind it.  Count the bytes either way — this file
        // is done being sent, whatever the answer was.
        uploadedBytes += file.size;
        if (ok) doneCount += 1;
        else failed.push(file);
        uploadNext();
      };
      xhr.onerror = function () {
        if (cancelled) return;
        uploadedBytes += file.size;
        failed.push(file);
        uploadNext();
      };
      xhr.onabort = function () {
        cancelled = true;
        resetUploadUI();
        // The ones that landed are on the server now; the list has to say so
        // even though the reader stopped the rest.
        if (doneCount > 0) loadFiles();
        showToast(doneCount > 0
          ? T.uploadCancelledSome.replace('{n}', String(doneCount))
          : T.uploadCancelled);
      };
      xhr.send(form);
    }

    uploadNext();
  }

  fileInput.addEventListener('change', function () {
    if (!fileInput.files || fileInput.files.length === 0) return;
    var files = Array.prototype.slice.call(fileInput.files);
    var total = 0;
    for (var i = 0; i < files.length; i++) total += files[i].size;
    // Pre-flight check: the server buffers the whole body and hard-caps at
    // 32 MB — reject oversized selections before starting the upload.  Leave
    // a 64 KB headroom so multipart boundaries / headers never push the actual
    // request body past the server's Content-Length cap.
    if (total > MAX_UPLOAD_BYTES - 64 * 1024) {
      showToast(T.uploadTooLarge, true);
      fileInput.value = '';
      return;
    }
    startUpload(files);
  });

  uploadCancelBtn.addEventListener('click', function () {
    if (uploadXhr) uploadXhr.abort();
  });

  uploadRetryBtn.addEventListener('click', function () {
    var again = uploadFailed.slice();
    if (again.length === 0) { hideUploadResult(); return; }
    startUpload(again);
  });

  uploadDismissBtn.addEventListener('click', hideUploadResult);

  /* ── Files: list + download ────────────────────────────────── */

  var filesLoading = false;
  function loadFiles(silent) {
    // Skip a silent poll tick while a request is already in flight.
    if (filesLoading && silent) return;
    filesLoading = true;
    if (!silent) {
      fileList.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    }
    getJson('/api/files')
      .then(function (data) {
        filesLoading = false;
        var files = (data && data.files) || [];
        if (files.length === 0) {
          fileList.innerHTML = '<div class="empty"><div class="empty__icon">📁</div><div class="empty__text">' + esc(T.emptyFiles) + '</div></div>';
          return;
        }
        fileList.innerHTML = '';
        files.forEach(function (f) {
          var el = document.createElement('div');
          el.className = 'f-item';
          el.innerHTML =
            '<div class="f-item__icon">📄</div>' +
            '<div class="f-item__body">' +
              '<div class="f-item__name">' + esc(f.name) + '</div>' +
              '<div class="f-item__meta">' + esc(f.size) + ' · ' + esc(f.time) + '</div>' +
            '</div>' +
            '<button class="f-item__delete" title="' + esc(T.fileDelete) + '">✕</button>';
          el.addEventListener('click', function () {
            var a = document.createElement('a');
            a.href = apiUrl('/api/download?file=' + encodeURIComponent(f.name));
            a.download = f.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast(T.fileDownload);
          });
          // The row itself downloads on tap; the delete button stops
          // propagation so it deletes instead of triggering a download.
          el.querySelector('.f-item__delete').addEventListener('click', function (ev) {
            ev.stopPropagation();
            deleteFile(f.name);
          });
          fileList.appendChild(el);
        });
      })
      .catch(function (err) {
        filesLoading = false;
        // Same stale-token handling as history: notify even on silent polls.
        if (err && err.status === 403) notifyTokenExpired();
        if (!silent) {
          var msg = (err && err.status === 403)
            ? esc(T.tokenExpired)
            : esc(T.loadFail) + '<br>' + esc(failHint(err));
          fileList.innerHTML = '<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__text">' + msg + '</div></div>';
        }
      });
  }

  function deleteFile(name) {
    var label = '“' + name + '”';
    if (!window.confirm(ZH ? '删除文件 ' + label + '？' : 'Delete file ' + label + '?')) return;
    apiFetch('/api/files', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok) {
          showToast(T.fileDeleted);
          loadFiles();
        } else {
          showToast(apiError(res.data, T.uploadFail), true);
        }
      })
      .catch(function () {
        showToast(T.uploadFail + ' · ' + failHint(), true);
      });
  }

  /* ── Shared formatting helpers ──────────────────────────────── */

  function fmtSize(bytes) {
    return ClipsyncFormat.size(bytes);
  }

  function fmtSpeed(bytesPerSec) {
    return ClipsyncFormat.speed(bytesPerSec);
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function fmtClock(ts) {
    if (!ts) return '';
    var d = new Date(ts * 1000);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  /* ── Chat ──────────────────────────────────────────────────── */

  var chatDevices = [];
  var chatSessions = [];
  // A fixed conversation with this computer, distinct from peer sessions.
  var PHONE_CHAT_ID = '__computer__';
  var phoneChatMessages = [];
  var phoneChatLastId = 0;
  var chatOpenSession = null;
  var chatMessages = [];
  var chatLoading = false;
  var chatInviteBusy = '';
  var chatLastMsgCount = 0;
  var chatScrollBottom = false;
  var chatConvSigPrev = '';
  // What the computer conversation currently on screen was built from.  A poll
  // that arrives with the same messages must not rebuild the DOM: a rebuild is
  // a visible jump (and can scroll the transcript away) for no new content.
  var chatComputerSigPrev = '';
  // Typing indicator: peer display deadline (ms epoch) + our own report
  // bookkeeping.  The server lazily expires its flag ~4s after the last
  // frame; the local deadline hides the row even when no poll lands.
  var chatPeerTypingUntil = 0;
  var chatTypingLastState = null;
  var chatTypingLastSent = 0;
  var chatSending = false;
  // Per-peer mute set from GET /api/chat/sessions (`muted: [peer_id...]`) —
  // the backend persists it and suppresses desktop notifications for muted
  // peers, so the phone bell mirrors the same state the desktop shows.
  var chatMutedSet = {};
  // Whether nearby devices may send without asking, from the same response
  // (`open_to_all`).  An offered file sits at `await_accept` for an instant in
  // both modes, so this — not the status alone — is what says whether the
  // Accept button below belongs to a decision the user still has to make.
  var chatOpenToAll = true;
  // Chat file attachment: busy flag (rendered into the composer template so
  // poll re-renders keep the state) + the session the picked file belongs to.
  var chatFileBusy = false;
  var chatFileSession = null;

  function chatStatusLabel(s) {
    var map = {
      invited: 'chatStatusInvited',
      inviting: 'chatStatusInviting',
      uninviting: 'chatStatusInviting',
      active: 'chatStatusActive',
      declined: 'chatStatusDeclined',
      declined_remote: 'chatStatusDeclined',
      closed: 'chatStatusClosed',
    };
    return T[map[s] || 'chatStatusInvited'] || '';
  }

  function chatStatusClass(s) {
    if (s === 'active') return 'chat-session__status--ok';
    if (s === 'invited' || s === 'inviting' || s === 'uninviting') return 'chat-session__status--warn';
    if (s === 'declined' || s === 'declined_remote') return 'chat-session__status--err';
    return '';
  }

  // The server's system-message text_keys are dotted keys that live in the
  // shared locale JSON (locales/*.json, injected as __I18N_JSON__) — prefer
  // that single source via jt(); fall back to the inline T dict below for
  // older payloads that don't carry a resolvable text_key.
  function chatSystemText(entry) {
    var tk = entry && entry.text_key;
    var raw = tk ? jt(tk) : '';
    if (!raw || raw === tk) {
      var tkey = '';
      if (tk === 'chat.system.peer_offline') tkey = 'chatSystemPeerOffline';
      else if (tk === 'chat.system.session_closed_by_peer') tkey = 'chatSystemClosedByPeer';
      else if (tk === 'chat.system.file_declined') tkey = 'chatSystemFileDeclined';
      else if (tk === 'chat.system.file_cancelled') tkey = 'chatSystemFileCancelled';
      raw = tkey ? T[tkey] : (entry ? entry.text || T.chatSystemUnknown : T.chatSystemUnknown);
    }
    if (!raw) return '';
    var fmt = (entry && entry.fmt) || {};
    var name = fmt.name || '';
    if (!name && chatOpenSession) {
      for (var i = 0; i < chatSessions.length; i++) {
        if (chatSessions[i].session_id === chatOpenSession) {
          name = chatSessions[i].peer_name || '';
          break;
        }
      }
    }
    if (name) raw = raw.replace(/\{name\}/g, name);
    return raw;
  }

  function chatFileStatus(m) {
    var st = (m && m.status) || 'pending';
    if (st === 'done') return m.outgoing ? T.chatFileSent : T.chatFileReceived;
    if (st === 'sending' && !m.outgoing) return T.chatFileReceiving;
    var map = {
      pending: 'chatFilePending',
      await_accept: 'chatFileAwaitAccept',
      sending: 'chatFileSending',
      failed: 'chatFileFailed',
      declined: 'chatFileDeclined',
      rejected: 'chatFileDeclined',
      cancelled: 'chatFileCancelled',
      cancelled_by_peer: 'chatFileCancelled',
      peer_offline: 'chatFileFailed',
      error_timeout: 'chatFileFailed',
      error_size_mismatch: 'chatFileFailed',
      error_security: 'chatFileFailed',
      error_disk: 'chatFileFailed',
    };
    return T[map[st] || 'chatFilePending'] || '';
  }

  function chatOpenSessionObj() {
    if (!chatOpenSession) return null;
    for (var i = 0; i < chatSessions.length; i++) {
      if (chatSessions[i].session_id === chatOpenSession) return chatSessions[i];
    }
    return null;
  }

  // Re-arm the local typing-display deadline from the latest session
  // snapshot (server flag lazily expires ~4s after the peer's last frame).
  function refreshChatPeerTyping() {
    var sess = chatOpenSessionObj();
    if (sess && sess.status === 'active' && sess.peer_typing) {
      chatPeerTypingUntil = Date.now() + 4500;
    } else {
      chatPeerTypingUntil = 0;
    }
  }

  // A cheap signature of the open conversation so silent polls can skip the
  // re-render (and the composer's focus) when nothing changed.
  function chatConvSignature() {
    if (chatOpenSession === PHONE_CHAT_ID) {
      return phoneChatMessages.map(function (m) { return m.id + ':' + m.sender; }).join('|');
    }
    var parts = [];
    for (var i = 0; i < chatMessages.length; i++) {
      var m = chatMessages[i];
      parts.push(m.entry_id + ':' + (m.status || '') + ':' + (m.ts || '') + ':' + (m.saved_path || ''));
    }
    var sess = chatOpenSessionObj();
    parts.push('s:' + (sess ? sess.status + ':' + (sess.unread || 0) + ':' + (sess.online ? '1' : '0') : 'none'));
    // The peer's typing flag participates in the signature so the indicator
    // appears/disappears on the next poll without a forced re-render.
    parts.push('t:' + (Date.now() < chatPeerTypingUntil ? '1' : '0'));
    return parts.join('|');
  }

  function chatMsgHtml(m) {
    if (m.kind === 'system') {
      return '<div class="chat-msg-row"><div class="chat-system">' + esc(chatSystemText(m)) + '</div></div>';
    }
    if (m.kind === 'text') {
      var failed = !!(m.outgoing && m.status === 'failed');
      var meta = '';
      if (failed) {
        meta += '<span class="chat-bubble__failed">' + esc(T.chatTextFailed) + '</span>';
        meta += '<button class="chat-bubble__retry" data-resend-entry="' + esc(m.entry_id) + '" title="' + esc(T.chatResend) + '">⟳</button>';
      }
      // Text bubbles get an explicit copy affordance — mobile webviews make
      // long-press selection unreliable, so the meta row always carries a
      // small copy button (label + tooltip share the localized copy string).
      meta += '<button class="chat-bubble__copy" data-copy-msg title="' + esc(T.copy) + '">' + esc(T.copy) + '</button>';
      return '<div class="chat-msg-row"><div class="chat-bubble' + (m.outgoing ? ' chat-bubble--out' : ' chat-bubble--in') + (failed ? ' chat-bubble--failed' : '') + '">' +
        '<div class="chat-bubble__text">' + esc(m.text || '') + '</div>' +
        '<div class="chat-bubble__meta">' + meta + esc(fmtClock(m.ts)) + '</div>' +
      '</div></div>';
    }
    // File card.
    var acts = '';
    if (!chatOpenToAll && !m.outgoing && m.status === 'await_accept') {
      acts += '<button class="chat-action-btn chat-action-btn--accept" data-file-action="accept" data-transfer-id="' + esc(m.transfer_id) + '">' + esc(T.chatAccept) + '</button>';
      acts += '<button class="chat-action-btn chat-action-btn--decline" data-file-action="decline" data-transfer-id="' + esc(m.transfer_id) + '">' + esc(T.chatDecline) + '</button>';
    } else if (m.status === 'sending') {
      acts += '<button class="chat-action-btn chat-action-btn--danger" data-file-action="cancel" data-transfer-id="' + esc(m.transfer_id) + '">' + esc(T.chatCancel) + '</button>';
    } else if (m.status === 'done' && m.saved_path) {
      acts += '<button class="chat-action-btn chat-action-btn--accept" data-download-transfer="' + esc(m.transfer_id) + '" data-filename="' + esc(m.file_name || '') + '">' + esc(T.chatDownload) + '</button>';
    }
    return '<div class="chat-msg-row"><div class="chat-file' + (m.outgoing ? ' chat-file--out' : ' chat-file--in') + '">' +
      '<div class="chat-file__icon">📄</div>' +
      '<div class="chat-file__body">' +
        '<div class="chat-file__name">' + esc(m.file_name || T.trUnknownFile) + '</div>' +
        '<div class="chat-file__meta"><span>' + esc(fmtSize(m.file_size)) + '</span><span class="chat-file__status"> · ' + esc(chatFileStatus(m)) + '</span></div>' +
      '</div>' +
      (acts ? '<div class="chat-file__actions">' + acts + '</div>' : '') +
    '</div></div>';
  }

  /* A filter over the nearby devices, when there are enough of them to be worth
     one.  Six is the threshold: below it the whole list is on screen and a field
     would be furniture, above it the list is a scroll and the reader knows the
     name they are looking for.  See U114.
     The field lives OUTSIDE `#chatView`, because that panel is rebuilt from an
     `innerHTML` string on every poll and a field inside it would lose the caret
     every few seconds.  It hides rows instead, and each render re-applies the
     query it holds. */
  var chatDeviceFilter = '';

  function syncDeviceFilterBar() {
    var view = document.getElementById('chatView');
    if (!view || !view.parentNode) return;
    var bar = document.getElementById('chatDeviceFilterBar');
    // The list itself is the other half of the condition: a conversation takes
    // the panel over, and a filter over a list that is not on screen is a
    // field with nothing to filter.
    var wanted = chatDevices.length > 6 && !!document.getElementById('chatDeviceList');
    if (!wanted) {
      if (bar) bar.parentNode.removeChild(bar);
      return;
    }
    if (bar) return;
    bar = document.createElement('div');
    bar.className = 'chat-filter';
    bar.id = 'chatDeviceFilterBar';
    bar.innerHTML =
      '<input type="search" id="chatDeviceFilter" autocomplete="off" ' +
        'aria-controls="chatDeviceList" aria-label="' + esc(T.chatFilterDevices) + '" ' +
        'placeholder="' + esc(T.chatFilterDevices) + '">' +
      '<p class="chat-filter__empty" id="chatDeviceFilterEmpty" role="status" hidden>' +
        esc(T.chatFilterEmpty) + '</p>';
    var input = bar.querySelector('#chatDeviceFilter');
    input.value = chatDeviceFilter;
    input.addEventListener('input', function () {
      chatDeviceFilter = input.value;
      applyDeviceFilter();
    });
    view.parentNode.insertBefore(bar, view);
  }

  function applyDeviceFilter() {
    var rows = document.querySelectorAll('#chatDeviceList .chat-device');
    if (!rows.length) return;
    var query = String(chatDeviceFilter || '').trim().toLowerCase();
    var shown = 0;
    for (var i = 0; i < rows.length; i++) {
      var name = String(rows[i].getAttribute('data-device-name') || '').toLowerCase();
      var hit = !query || name.indexOf(query) >= 0;
      rows[i].hidden = !hit;
      if (hit) shown++;
    }
    // Said rather than shown as an empty list: the devices are there, the query
    // is what is keeping them off screen, and that is a different thing.
    var empty = document.getElementById('chatDeviceFilterEmpty');
    if (empty) empty.hidden = !(query && shown === 0);
  }

  function renderChatList() {
    var html = '';
    // The local computer is always addressable, even with no peer online.
    var lastPhone = phoneChatMessages.length
      ? phoneChatMessages[phoneChatMessages.length - 1]
      : null;
    html += '<div class="chat-session" data-session-id="' + PHONE_CHAT_ID + '">' +
      '<span class="chat-session__dot chat-session__dot--on"></span>' +
      '<div class="chat-session__body">' +
        '<div class="chat-session__top">' +
          '<span class="chat-session__name">' + esc(T.chatComputer) + '</span>' +
          '<span class="chat-session__status">' + esc(T.chatComputerStatus) + '</span>' +
        '</div>' +
        '<div class="chat-session__preview">' + esc(lastPhone ? lastPhone.text : T.chatComputerEmpty) + '</div>' +
      '</div>' +
      '<button class="chat-btn chat-btn--accent" data-open-session="' + PHONE_CHAT_ID + '">' + esc(T.chatEnter) + '</button>' +
    '</div>';
    html += '<div class="chat-hdr">💻 ' + esc(T.chatDevices) + '</div>';
    if (chatDevices.length === 0) {
      html += '<div class="empty"><div class="empty__icon">📡</div><div class="empty__text">' + esc(T.chatEmptyDevices) + '</div></div>';
    } else {
      /* The rows carry the name they are found by, because the filter above
         them hides rows rather than re-rendering the list: a list rebuilt on
         every poll cannot hold a field's caret.  See U114. */
      html += '<div id="chatDeviceList">';
      for (var i = 0; i < chatDevices.length; i++) {
        var d = chatDevices[i];
        var busy = chatInviteBusy === d.peer_id;
        var devName = ClipsyncFormat.deviceName(d) || d.peer_id || '';
        html += '<div class="chat-device" data-device-name="' + esc(devName) + '">' +
          '<div class="chat-device__info">' +
            '<div class="chat-device__name">' + esc(devName) + '</div>' +
            '<div class="chat-device__badge' + (d.paired ? ' chat-device__badge--on' : '') + '">' + esc(d.paired ? T.chatPaired : T.chatUnpaired) + '</div>' +
          '</div>' +
          '<button class="chat-btn chat-btn--accent" data-start-peer="' + esc(d.peer_id) + '"' + (busy ? ' disabled' : '') + '>' + (busy ? '…' : esc(T.chatStart)) + '</button>' +
        '</div>';
      }
      html += '</div>';
    }
    html += '<div class="chat-hdr">💬 ' + esc(T.chatSessions) + '</div>';
    if (chatSessions.length === 0) {
      html += '<div class="empty"><div class="empty__icon">💬</div><div class="empty__text">' + esc(T.chatEmptySessions) + '</div></div>';
    } else {
      for (var j = 0; j < chatSessions.length; j++) {
        var s = chatSessions[j];
        // Mute bell (desktop chat-panel parity): toggles the persisted
        // per-peer mute set. The delegated click handler owns it, so a tap
        // here never opens the conversation.
        var bell = '';
        if (s.peer_id) {
          var muted = !!chatMutedSet[s.peer_id];
          bell = '<button class="chat-bell" data-mute-peer="' + esc(s.peer_id) + '" title="' + esc(muted ? T.chatUnmute : T.chatMute) + '">' + (muted ? '🔕' : '🔔') + '</button>';
        }
        html += '<div class="chat-session" data-session-id="' + esc(s.session_id) + '">' +
          '<span class="chat-session__dot' + (s.online ? ' chat-session__dot--on' : '') + '"></span>' +
          '<div class="chat-session__body">' +
            '<div class="chat-session__top">' +
              '<span class="chat-session__name">' + esc(s.peer_name || s.peer_id) + '</span>' +
              '<span class="chat-session__status ' + chatStatusClass(s.status) + '">' + esc(chatStatusLabel(s.status)) + '</span>' +
            '</div>' +
            '<div class="chat-session__preview">' + esc(s.last_preview || '') + '</div>' +
          '</div>' +
          bell +
          ((s.unread || 0) > 0 ? '<span class="chat-session__badge">' + ((s.unread > 99) ? '99+' : s.unread) + '</span>' : '') +
        '</div>';
      }
    }
    chatView.innerHTML = html;
    syncDeviceFilterBar();
    applyDeviceFilter();
  }

  function renderChatConversation() {
    if (chatOpenSession === PHONE_CHAT_ID) { renderComputerConversation(); return; }
    var sess = chatOpenSessionObj();
    var name = sess ? (sess.peer_name || sess.peer_id) : '';
    var status = sess ? chatStatusLabel(sess.status) : '';
    // Preserve the draft across re-renders: the composer input is rebuilt by
    // this render, and a poll landing mid-typing (incoming message, status
    // flip, typing-indicator change) must not wipe what the user has typed.
    var prevInput = document.getElementById('chatInput');
    var draft = prevInput ? prevInput.value : null;
    var html = '';
    html += '<div class="chat-conv__hdr">' +
      '<button class="chat-btn chat-btn--ghost" id="chatBackBtn">' + esc(T.chatBack) + '</button>' +
      '<div class="chat-conv__name">' + esc(name) + '</div>' +
      '<div class="chat-conv__status">' + esc(status) + '</div>' +
      (sess ? '<button class="chat-btn chat-btn--dangerghost" id="chatCloseBtn" title="' + esc(T.chatCloseSession) + '">🗑</button>' : '') +
    '</div>';
    if (sess && sess.status === 'invited') {
      html += '<div class="chat-invite-banner">' +
        '<span class="chat-invite-banner__name">' + esc(name) + '</span>' +
        '<span>' + esc(T.chatInviteBanner) + '</span>' +
        '<button class="chat-action-btn chat-action-btn--accept" data-invite-action="accept">' + esc(T.chatAccept) + '</button>' +
        '<button class="chat-action-btn chat-action-btn--decline" data-invite-action="decline">' + esc(T.chatDecline) + '</button>' +
      '</div>';
    }
    html += '<div class="chat-conv__msgs">';
    if (chatMessages.length === 0) {
      html += '<div class="empty"><div class="empty__icon">💬</div><div class="empty__text">' + esc(T.chatEmptyConv) + '</div></div>';
    } else {
      for (var i = 0; i < chatMessages.length; i++) {
        html += chatMsgHtml(chatMessages[i]);
      }
    }
    html += '</div>';
    html += '<div class="chat-typing" id="chatTypingRow"' +
      (Date.now() < chatPeerTypingUntil ? '' : ' style="display:none"') + '>' +
      esc(T.chatTyping) + '</div>';
    html += '<div class="chat-composer">' +
      (window.__CLIPSYNC_REMOTE__ ? '' : '<button class="chat-composer__attach" id="chatAttachBtn" title="' + esc(T.chatAttach) + '"' + (chatFileBusy ? ' disabled' : '') + '>' + (chatFileBusy ? '…' : '📎') + '</button>') +
      '<input class="chat-composer__input" id="chatInput" placeholder="' + esc(T.chatInputPlaceholder) + '" maxlength="4000" autocomplete="off">' +
      '<button class="chat-composer__send" id="chatSendBtn">' + esc(T.chatSend) + '</button>' +
    '</div>';
    chatView.innerHTML = html;
    syncDeviceFilterBar();
    var input = document.getElementById('chatInput');
    if (input) {
      if (draft !== null && input.value !== draft) input.value = draft;
      try { input.focus(); } catch (e) {}
      try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
    }
    if (chatScrollBottom) {
      chatScrollBottom = false;
      scrollChatToBottom();
    }
  }

  function phoneChatSignature() {
    if (!phoneChatMessages.length) return '0';
    var last = phoneChatMessages[phoneChatMessages.length - 1];
    return phoneChatMessages.length + ':' + (last && last.id);
  }

  function phoneChatAsMessage(message) {
    return {
      kind: 'text',
      outgoing: message.sender === 'phone',
      text: message.text,
      ts: message.ts,
      entry_id: 'phone-' + message.id,
    };
  }
  function renderComputerConversation() {
    var prevInput = document.getElementById('chatInput');
    var draft = prevInput ? prevInput.value : null;
    var html = '';
    html += '<div class="chat-conv__hdr">' +
      '<button class="chat-btn chat-btn--ghost" id="chatBackBtn">' + esc(T.chatBack) + '</button>' +
      '<div class="chat-conv__name">' + esc(T.chatComputer) + '</div>' +
      '<div class="chat-conv__status">' + esc(T.chatComputerStatus) + '</div>' +
    '</div>';
    html += '<div class="chat-conv__msgs">';
    if (!phoneChatMessages.length) {
      html += '<div class="empty"><div class="empty__icon">💬</div><div class="empty__text">' + esc(T.chatComputerEmpty) + '</div></div>';
    } else {
      for (var i = 0; i < phoneChatMessages.length; i++) html += chatMsgHtml(phoneChatAsMessage(phoneChatMessages[i]));
    }
    html += '</div>';
    html += '<div class="chat-composer">' +
      '<input class="chat-composer__input" id="chatInput" placeholder="' + esc(T.chatInputPlaceholder) + '" maxlength="4000" autocomplete="off">' +
      '<button class="chat-composer__send" id="chatSendBtn">' + esc(T.chatSend) + '</button>' +
    '</div>';
    chatView.innerHTML = html;
    syncDeviceFilterBar();
    var input = document.getElementById('chatInput');
    if (input) {
      if (draft !== null && input.value !== draft) input.value = draft;
      try { input.focus(); } catch (e) {}
      try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
    }
    if (chatScrollBottom) { chatScrollBottom = false; scrollChatToBottom(); }
    chatComputerSigPrev = phoneChatSignature();
  }

  function scrollChatToBottom() {
    contentEl.scrollTop = contentEl.scrollHeight;
  }

  /*
   * The one read a remote chat poll needs.
   *
   * The full load is three reads (devices, sessions, messages).  At the page's
   * five-second cadence that alone would spend the desktop's whole 20/min
   * remote budget on the chat tab, and the 429s that followed made a live
   * conversation look dead.  A silent poll now refreshes exactly what the
   * visible view is built from -- one read -- and the three-read load is kept
   * for opening the tab and for actions.
   */
  function refreshChatLight() {
    if (chatLoading) return;
    chatLoading = true;
    var done = function () { chatLoading = false; };
    if (chatOpenSession === PHONE_CHAT_ID) {
      getJson('/api/phone-chat/messages?after_id=0').then(function (d) {
        phoneChatMessages = (d && d.messages) || phoneChatMessages;
        phoneChatLastId = (d && d.last_id) || phoneChatLastId;
        done();
        // Only a changed transcript is worth rebuilding the view for: the
        // poll used to redraw every few seconds, which scrolled the reader's
        // place away (and looked like the page had emptied and come back).
        if (phoneChatSignature() !== chatComputerSigPrev) renderComputerConversation();
      }, function (err) {
        done();
        if (err && err.status === 403) notifyTokenExpired();
      });
      return;
    }
    if (chatOpenSession) {
      getJson('/api/chat/messages?session_id=' + encodeURIComponent(chatOpenSession)).then(function (d) {
        var msgs = (d && d.messages) || [];
        done();
        if (msgs.length > chatLastMsgCount) chatScrollBottom = true;
        chatLastMsgCount = msgs.length;
        chatMessages = msgs;
        var sig = chatConvSignature();
        if (sig !== chatConvSigPrev) {
          chatConvSigPrev = sig;
          renderChatConversation();
        }
      }, function (err) {
        done();
        if (err && err.status === 403) notifyTokenExpired();
      });
      return;
    }
    getJson('/api/chat/sessions').then(function (d) {
      chatSessions = (d && d.sessions) || [];
      var muted = (d && d.muted) || [];
      chatMutedSet = {};
      for (var i = 0; i < muted.length; i++) chatMutedSet[muted[i]] = true;
      if (d && typeof d.open_to_all === 'boolean') chatOpenToAll = d.open_to_all;
      done();
      renderChatList();
    }, function (err) {
      done();
      if (err && err.status === 403) notifyTokenExpired();
    });
  }

  function loadChat(silent) {
    if (chatLoading) return;
    if (silent && window.__CLIPSYNC_REMOTE__ && window.__CLIPSYNC_REMOTE__.online) {
      refreshChatLight();
      return;
    }
    chatLoading = true;
    if (!silent && chatOpenSession === null && chatDevices.length === 0 && chatSessions.length === 0) {
      chatView.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    }
    var pPhone = getJson('/api/phone-chat/messages?after_id=0')
      .then(function (d) { return d || {}; }, function () { return {}; });
    var pDev = getJson('/api/chat/devices').then(function (d) { return d.devices || []; }, function (err) { if (err && err.status === 403) notifyTokenExpired(); return []; });
    var pSess = getJson('/api/chat/sessions').then(function (d) { return d || {}; }, function (err) { if (err && err.status === 403) notifyTokenExpired(); return {}; });
    Promise.all([pDev, pSess, pPhone]).then(function (out) {
      chatDevices = out[0];
      chatSessions = (out[1] && out[1].sessions) || [];
      var mutedList = (out[1] && out[1].muted) || [];
      chatMutedSet = {};
      for (var mi = 0; mi < mutedList.length; mi++) chatMutedSet[mutedList[mi]] = true;
      if (out[1] && typeof out[1].open_to_all === 'boolean') chatOpenToAll = out[1].open_to_all;
      phoneChatMessages = (out[2] && out[2].messages) || [];
      phoneChatLastId = (out[2] && out[2].last_id) || 0;
      if (chatOpenSession === PHONE_CHAT_ID) {
        getJson('/api/phone-chat/messages?after_id=0&mark_read=1')
          .then(function (d) {
            phoneChatMessages = (d && d.messages) || phoneChatMessages;
            chatLoading = false;
            renderComputerConversation();
          }, function () { chatLoading = false; renderComputerConversation(); });
        return;
      }
      refreshChatPeerTyping();
      if (!chatOpenSession) {
        chatLoading = false;
        renderChatList();
        return;
      }
      var found = false;
      for (var i = 0; i < chatSessions.length; i++) {
        if (chatSessions[i].session_id === chatOpenSession) { found = true; break; }
      }
      if (!found) {
        chatOpenSession = null;
        chatLastMsgCount = 0;
        chatConvSigPrev = '';
        chatLoading = false;
        renderChatList();
        return;
      }
      getJson('/api/chat/messages?session_id=' + encodeURIComponent(chatOpenSession))
        .then(function (d) {
          var msgs = (d && d.messages) || [];
          chatLoading = false;
          if (msgs.length > chatLastMsgCount) chatScrollBottom = true;
          chatLastMsgCount = msgs.length;
          chatMessages = msgs;
          var sig = chatConvSignature();
          if (sig !== chatConvSigPrev || !silent) {
            chatConvSigPrev = sig;
            renderChatConversation();
          }
        })
        .catch(function (err) {
          chatLoading = false;
          chatMessages = [];
          if (err && err.status === 403) notifyTokenExpired();
          if (!silent) renderChatConversation();
        });
    });
  }

  function chatOpen(sessionId) {
    chatOpenSession = sessionId;
    chatLastMsgCount = 0;
    chatConvSigPrev = '';
    chatComputerSigPrev = '';
    chatScrollBottom = true;
    resetChatTypingState();
    loadChat(false);
  }

  function chatBack() {
    chatOpenSession = null;
    chatLastMsgCount = 0;
    chatConvSigPrev = '';
    chatComputerSigPrev = '';
    resetChatTypingState();
    renderChatList();
  }

  // Reset OUR typing-report bookkeeping (session switch / send).  The peer's
  // indicator deadline is refreshed separately from snapshots.
  function resetChatTypingState() {
    chatTypingLastState = null;
    chatTypingLastSent = 0;
    chatPeerTypingUntil = 0;
  }

  // Throttled typing report: same state within 2s is suppressed (the server
  // throttles too); a state CHANGE always goes out immediately, which is
  // what makes the peer's indicator vanish the moment typing stops.
  function chatSendTyping(typing) {
    if (!chatOpenSession || chatOpenSession === PHONE_CHAT_ID) return;
    var now = Date.now();
    if (typing === chatTypingLastState && (now - chatTypingLastSent) < 2000) return;
    chatTypingLastState = !!typing;
    chatTypingLastSent = now;
    apiFetch('/api/chat/typing', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: chatOpenSession, typing: !!typing }),
    }).catch(function () { /* fire-and-forget; never a user-visible error */ });
  }

  function chatReportTyping() {
    if (!chatOpenSession) return;
    var input = document.getElementById('chatInput');
    chatSendTyping(!!(input && input.value.trim()));
  }

  function chatStartInvite(peerId) {
    var name = peerId;
    for (var i = 0; i < chatDevices.length; i++) {
      if (chatDevices[i].peer_id === peerId) { name = chatDevices[i].name || peerId; break; }
    }
    chatInviteBusy = peerId;
    apiFetch('/api/chat/invite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ peer_id: peerId, peer_name: name }),
    })
      .then(function (res) {
        chatInviteBusy = '';
        if (res.status === 403) { notifyTokenExpired(); return; }
        var d = res.data || {};
        if (d.session_id) {
          chatOpen(d.session_id);
        } else if (d.connecting) {
          showToast(T.chatConnecting);
        } else if (d.ok === false) {
          showToast(apiError(d, T.chatInviteFailed), true);
        }
      })
      .catch(function () {
        chatInviteBusy = '';
        showToast(T.chatInviteFailed + ' · ' + failHint(), true);
      });
  }

  function chatSend() {
    var input = document.getElementById('chatInput');
    if (!input || !chatOpenSession) return;
    // Double-submit guard: two rapid taps must not POST twice before the
    // first response clears the input.
    if (chatSending) return;
    var text = input.value.trim();
    if (!text) { showToast(T.chatSendEmpty, true); return; }
    chatSending = true;
    if (chatOpenSession === PHONE_CHAT_ID) {
      apiFetch('/api/phone-chat/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text }),
      }).then(function (res) {
        chatSending = false;
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok) { input.value = ''; chatScrollBottom = true; loadChat(true); }
        else showToast(apiError(res.data, T.chatSendFail), true);
      }).catch(function () { chatSending = false; showToast(T.chatSendFail + ' · ' + failHint(), true); });
      return;
    }
    apiFetch('/api/chat/text', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: chatOpenSession, text: text }),
    })
      .then(function (res) {
        chatSending = false;
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok) {
          input.value = '';
          // The message went out — the receiver drops our indicator on
          // arrival; restart OUR bookkeeping from "not typing".
          chatTypingLastState = false;
          chatTypingLastSent = Date.now();
          chatScrollBottom = true;
          loadChat(true);
        } else {
          showToast(apiError(res.data, T.chatSendFail), true);
        }
      })
      .catch(function () {
        chatSending = false;
        showToast(T.chatSendFail + ' · ' + failHint(), true);
      });
  }

  function chatInviteAction(action) {
    if (!chatOpenSession) return;
    apiFetch('/api/chat/' + action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: chatOpenSession }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (action === 'decline') {
          chatBack();
        } else {
          loadChat(true);
        }
      })
      .catch(function () {
        showToast(T.chatSendFail + ' · ' + failHint(), true);
      });
  }

  function chatResend(entryId) {
    if (!chatOpenSession || !entryId) return;
    apiFetch('/api/chat/resend', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: chatOpenSession, entry_id: entryId }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (!res.data || res.data.ok !== true) {
          showToast(apiError(res.data, T.chatResendFail), true);
        }
        chatScrollBottom = true;
        loadChat(true);
      })
      .catch(function () {
        showToast(T.chatResendFail + ' · ' + failHint(), true);
      });
  }

  // Copy a text bubble's contents to the phone clipboard. The message text is
  // rendered from m.text into the bubble DOM, so read it back from there —
  // same clipboard chain as the item-modal copy: navigator.clipboard first,
  // then a hidden-textarea execCommand fallback on plain-HTTP LAN.
  function chatCopyMsg(btn) {
    var bubble = btn.closest ? btn.closest('.chat-bubble') : null;
    if (!bubble) return;
    var textEl = bubble.querySelector('.chat-bubble__text');
    var text = textEl ? (textEl.textContent || '') : '';
    if (!text) return;
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { showToast(T.copied); return; }
      } catch (e) { /* fall through */ }
      showToast(T.copyFail, true);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast(T.copied);
      }).catch(fallback);
    } else {
      fallback();
    }
  }

  function chatFileAction(action, transferId) {
    if (!chatOpenSession || !transferId) return;
    apiFetch('/api/chat/file/' + action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: chatOpenSession, transfer_id: transferId }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (!res.data || res.data.ok !== true) {
          showToast((res.data && res.data.error === 'expired') ? T.chatOfferExpired : apiError(res.data, T.chatSendFail), true);
        }
        chatScrollBottom = true;
        loadChat(true);
      })
      .catch(function () {
        showToast(T.chatSendFail + ' · ' + failHint(), true);
      });
  }

  function chatDownload(transferId, filename) {
    if (!transferId) return;
    var a = document.createElement('a');
    a.href = apiUrl('/api/chat/download?transfer_id=' + encodeURIComponent(transferId));
    a.download = filename || '';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // Mute/unmute a session's peer (desktop chat-panel parity). Optimistic
  // local flip so the bell reacts instantly; the server's authoritative mute
  // set replaces it on success, and a failure reverts it.
  var chatMuteBusy = '';
  function chatToggleMute(peerId) {
    if (!peerId || chatMuteBusy === peerId) return;
    chatMuteBusy = peerId;
    var newMuted = !chatMutedSet[peerId];
    chatMutedSet[peerId] = newMuted;
    if (!chatOpenSession) renderChatList();
    apiFetch('/api/chat/mute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ peer_id: peerId, muted: newMuted }),
    })
      .then(function (res) {
        chatMuteBusy = '';
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok) {
          var list = (res.data && res.data.muted) || [];
          chatMutedSet = {};
          for (var i = 0; i < list.length; i++) chatMutedSet[list[i]] = true;
          if (!chatOpenSession) renderChatList();
        } else {
          chatMutedSet[peerId] = !newMuted;
          if (!chatOpenSession) renderChatList();
          showToast(apiError(res.data, T.chatMuteFail), true);
        }
      })
      .catch(function () {
        chatMuteBusy = '';
        chatMutedSet[peerId] = !newMuted;
        if (!chatOpenSession) renderChatList();
        showToast(T.chatMuteFail + ' · ' + failHint(), true);
      });
  }

  // Close (and remove) the open conversation — desktop parity for the
  // context-menu "close session" on a chat row.
  var chatClosing = false;
  function chatCloseSession() {
    if (!chatOpenSession || chatClosing) return;
    if (!window.confirm(T.chatCloseConfirm)) return;
    chatClosing = true;
    apiFetch('/api/chat/close', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: chatOpenSession }),
    })
      .then(function (res) {
        chatClosing = false;
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok !== false) {
          chatBack();
        } else {
          showToast(apiError(res.data, T.chatSendFail), true);
        }
      })
      .catch(function () {
        chatClosing = false;
        // Keep the conversation open and say why — a silent failure would
        // leave the user staring at a session that never goes away.
        showToast(T.chatSendFail + ' · ' + failHint(), true);
      });
  }

  /* ── Chat: file attachment ─────────────────────────────────── */

  // Attach a phone-side file to the open conversation. Two steps, same as
  // the desktop chat panel: upload with purpose=chat (lands in a server temp
  // dir, no receive notification / Files record), then POST /api/chat/file
  // with the returned absolute temp path.
  function pickChatFile() {
    if (chatFileBusy || !chatOpenSession) return;
    chatFileSession = chatOpenSession;
    chatFileInput.click();
  }

  function uploadChatAttachment(file) {
    if (!file || !chatFileSession) return;
    // Same pre-flight cap as the Files tab: the server buffers whole bodies
    // up to 32 MB — reject oversized picks before burning the bandwidth.
    if (file.size > MAX_UPLOAD_BYTES - 64 * 1024) {
      showToast(T.uploadTooLarge, true);
      chatFileInput.value = '';
      return;
    }
    chatFileBusy = true;
    var btn = document.getElementById('chatAttachBtn');
    if (btn) { btn.disabled = true; btn.textContent = '…'; }
    var sid = chatFileSession;
    var form = new FormData();
    form.append('file', file);
    form.append('purpose', 'chat');

    // Plain XHR rather than fetchWithTimeout: an 8s abort cap is fine for
    // API calls but kills large uploads mid-flight.
    var xhr = new XMLHttpRequest();
    xhr.open('POST', HOST + '/api/upload');
    if (TOKEN) xhr.setRequestHeader('Authorization', 'Bearer ' + TOKEN);
    xhr.onload = function () {
      var data = null;
      try { data = JSON.parse(xhr.responseText); } catch (e) { /* ignore */ }
      if (!(xhr.status >= 200 && xhr.status < 300 && data && data.ok && data.path)) {
        finishChatAttachment();
        showToast(apiError(data, T.chatFileSendFail), true);
        return;
      }
      apiFetch('/api/chat/file', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sid, file_path: data.path }),
      })
        .then(function (res) {
          finishChatAttachment();
          if (res.status === 403) { notifyTokenExpired(); return; }
          if (res.data && res.data.ok) {
            showToast(T.chatFileSentOk);
            if (chatOpenSession === sid) {
              chatScrollBottom = true;
              loadChat(true);
            }
          } else {
            showToast(apiError(res.data, T.chatFileSendFail), true);
          }
        })
        .catch(function () {
          finishChatAttachment();
          showToast(T.chatFileSendFail + ' · ' + failHint(), true);
        });
    };
    xhr.onerror = function () {
      finishChatAttachment();
      showToast(T.chatFileSendFail + ' · ' + failHint(), true);
    };
    xhr.onabort = function () {
      finishChatAttachment();
    };
    xhr.send(form);
  }

  function finishChatAttachment() {
    chatFileBusy = false;
    chatFileInput.value = '';
    var btn = document.getElementById('chatAttachBtn');
    if (btn) { btn.disabled = false; btn.textContent = '📎'; }
  }

  chatFileInput.addEventListener('change', function () {
    var f = chatFileInput.files && chatFileInput.files[0];
    if (!f) return;
    uploadChatAttachment(f);
  });

  // Delegated events for the chat view — the panel is re-rendered on every
  // poll, so bind once on the container instead of re-binding per render.
  chatView.addEventListener('click', function (e) {
    var el = e.target;
    // The explicit "进入聊天" button on a row.  It lives inside the session
    // row, so it has to be handled before the row itself -- the row handler
    // deliberately ignores clicks on buttons.
    var openBtn = el.closest ? el.closest('[data-open-session]') : null;
    if (openBtn) { chatOpen(openBtn.getAttribute('data-open-session')); return; }
    var startBtn = el.closest ? el.closest('[data-start-peer]') : null;
    if (startBtn) { chatStartInvite(startBtn.getAttribute('data-start-peer')); return; }
    // Mute bell — must be checked BEFORE the session row: the bell lives
    // inside the row, and toggling mute must never open the conversation.
    var muteBtn = el.closest ? el.closest('[data-mute-peer]') : null;
    if (muteBtn) { chatToggleMute(muteBtn.getAttribute('data-mute-peer')); return; }
    var sessRow = el.closest ? el.closest('[data-session-id]') : null;
    if (sessRow && !el.closest('button')) { chatOpen(sessRow.getAttribute('data-session-id')); return; }
    if (el.closest && el.closest('#chatBackBtn')) { chatBack(); return; }
    if (el.closest && el.closest('#chatCloseBtn')) { chatCloseSession(); return; }
    if (el.closest && el.closest('#chatAttachBtn')) { pickChatFile(); return; }
    if (el.closest && el.closest('#chatSendBtn')) { chatSend(); return; }
    var invBtn = el.closest ? el.closest('[data-invite-action]') : null;
    if (invBtn) { chatInviteAction(invBtn.getAttribute('data-invite-action')); return; }
    var dlBtn = el.closest ? el.closest('[data-download-transfer]') : null;
    if (dlBtn) { chatDownload(dlBtn.getAttribute('data-download-transfer'), dlBtn.getAttribute('data-filename') || ''); return; }
    var resendBtn = el.closest ? el.closest('[data-resend-entry]') : null;
    if (resendBtn) {
      resendBtn.disabled = true;
      chatResend(resendBtn.getAttribute('data-resend-entry'));
      return;
    }
    var copyBtn = el.closest ? el.closest('[data-copy-msg]') : null;
    if (copyBtn) { chatCopyMsg(copyBtn); return; }
    var fileBtn = el.closest ? el.closest('[data-file-action]') : null;
    if (fileBtn) {
      chatFileAction(fileBtn.getAttribute('data-file-action'), fileBtn.getAttribute('data-transfer-id'));
      return;
    }
  });

  chatView.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'chatInput') {
      e.preventDefault();
      chatSend();
    }
  });

  // Typing reports — delegated like the click handler above (the composer is
  // re-rendered on every poll, so bind once on the container).
  chatView.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'chatInput') chatReportTyping();
  });

  /* ── Transfers ──────────────────────────────────────────────── */

  var transferActive = [];
  var transferHistory = [];
  var transfersLoading = false;
  var transfersCancellingAll = false;
  var retryBusyId = '';

  // An incoming P2P request the desktop is asking about: the manager's state
  // is "pending" until the user accepts (then "receiving"). Also match any
  // future wait/await/request phrasing defensively.
  function isTransferRequest(t) {
    var s = String(t.status || '');
    if (s === 'pending') return true;
    return /^(wait|await|request)/i.test(s);
  }

  function trActiveStatusLabel(t) {
    var s = t.status || '';
    if (s === 'paused') return T.trStatePaused;
    if (s === 'finalizing' || t.state === 'finalizing') return T.trStateFinalizing;
    if (s === 'awaiting_ack' || t.state === 'awaiting_ack') return T.trStateAwaitingAck;
    if (isTransferRequest(t)) return T.trStateAwaiting;
    return '';
  }

  function trActionButtons(t) {
    var id = esc(t.id);
    var b = '';
    if (isTransferRequest(t)) {
      b += '<button class="tr-btn tr-btn--ok" data-act="accept" data-id="' + id + '">' + esc(T.trAccept) + '</button>';
      b += '<button class="tr-btn tr-btn--bad" data-act="reject" data-id="' + id + '">' + esc(T.trReject) + '</button>';
    } else if (t.status === 'paused') {
      b += '<button class="tr-btn tr-btn--ok" data-act="resume" data-id="' + id + '">' + esc(T.trResume) + '</button>';
      b += '<button class="tr-btn tr-btn--bad" data-act="cancel" data-id="' + id + '">' + esc(T.trCancel) + '</button>';
    } else {
      b += '<button class="tr-btn tr-btn--warn" data-act="cancel" data-id="' + id + '">' + esc(T.trCancel) + '</button>';
      b += '<button class="tr-btn tr-btn--ok" data-act="pause" data-id="' + id + '">' + esc(T.trPause) + '</button>';
    }
    return b;
  }

  function trHistoryStatusLabel(t) {
    if (t.status === 'completed') return T.trStatusCompleted;
    var reason = t.reason || t.status || '';
    var map = {
      cancelled: 'trReasonCancelled',
      rejected: 'trReasonRejected',
      error_disk: 'trReasonDisk',
      error_size_mismatch: 'trReasonSizeMismatch',
      error_missing_chunks: 'trReasonMissingChunks',
      error_security: 'trReasonSecurity',
      peer_offline: 'trReasonPeerOffline',
      timeout: 'trReasonTimeout',
      error_timeout: 'trReasonTimeout',
      error_internal: 'trReasonInternal',
    };
    var k = map[reason];
    if (k) return T[k];
    if (t.status === 'failed') return T.trStatusFailed;
    return T.trStatusCancelled;
  }

  // Mirror of the desktop panel's canRetry: only failed OUTGOING rows can
  // actually be re-sent — the host's retry branch resolves the history row
  // by its original transfer id and re-sends to the original peer.
  function canRetryTransfer(h) {
    return !!h && h.id !== undefined && h.id !== null && h.id !== '' &&
      h.direction === 'up' &&
      h.status !== 'completed' &&
      !(h.status === 'cancelled' || h.cancelled);
  }

  function renderTransfers() {
    var html = '';
    html += '<div class="tr-section"><div class="tr-hdrrow"><div class="chat-hdr">📡 ' + esc(T.trActive) + '</div>' +
      (transferActive.length > 0
        ? '<button class="tr-cancelall" data-act="cancelall"' + (transfersCancellingAll ? ' disabled' : '') + '>' + esc(transfersCancellingAll ? '…' : T.trCancelAll) + '</button>'
        : '') +
      '</div>';
    if (transferActive.length === 0) {
      html += '<div class="empty"><div class="empty__icon">📤</div><div class="empty__text">' + esc(T.trEmptyActive) + '</div></div>';
    } else {
      for (var i = 0; i < transferActive.length; i++) {
        var t = transferActive[i];
        var dir = t.direction === 'up' ? '↑' : '↓';
        var pct = Math.min(100, Math.max(0, Math.round(t.progress || 0)));
        // The bar alone cannot be read to a number: 60% and 65% are the same
        // bar width at this size, and 待测速 aside, the one question on this
        // row is how much longer.
        var meta = pct + '%';
        if (t.size != null) meta += ' · ' + esc(fmtSize(t.size));
        var st = trActiveStatusLabel(t);
        if (st) meta += (meta ? ' · ' : '') + esc(st);
        var speed = fmtSpeed(t.speed);
        if (t.eta) speed += (speed ? ' · ' : '') + '⏱ ' + esc(t.eta);
        html += '<div class="tr-item">' +
          '<div class="tr-item__icon tr-item__icon--' + (t.direction === 'up' ? 'up' : 'down') + '">' + dir + '</div>' +
          '<div class="tr-item__body">' +
            '<div class="tr-item__name">' + esc(t.filename || T.trUnknownFile) + '</div>' +
            '<div class="tr-item__meta">' + meta + '</div>' +
            '<div class="tr-item__bar" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100" aria-label="' + esc(t.filename || T.trUnknownFile) + '">' +
              '<div class="tr-item__fill" style="width:' + pct + '%"></div></div>' +
            (speed ? '<div class="tr-item__speed">' + speed + '</div>' : '') +
          '</div>' +
          '<div class="tr-item__actions">' + trActionButtons(t) + '</div>' +
        '</div>';
      }
    }
    html += '</div>';
    html += '<div class="tr-section"><div class="chat-hdr">📚 ' + esc(T.trHistory) + '</div>';
    if (transferHistory.length === 0) {
      html += '<div class="empty"><div class="empty__icon">🗂</div><div class="empty__text">' + esc(T.trEmptyHistory) + '</div></div>';
    } else {
      for (var j = 0; j < transferHistory.length; j++) {
        var h = transferHistory[j];
        var dir2 = h.direction === 'up' ? '↑' : '↓';
        var ok = h.status === 'completed';
        var cancelled = h.status === 'cancelled' || h.cancelled;
        var cls = ok ? 'tr-hitem__icon--ok' : (cancelled ? 'tr-hitem__icon--warn' : 'tr-hitem__icon--err');
        var retryBtn = '';
        if (canRetryTransfer(h)) {
          retryBtn = '<button class="tr-hitem__retry" data-retry-id="' + esc(h.id) + '"' +
            (retryBusyId === h.id ? ' disabled' : '') +
            ' title="' + esc(T.trRetry) + '">' + (retryBusyId === h.id ? '…' : '↻') + '</button>';
        }
        html += '<div class="tr-hitem">' +
          '<div class="tr-hitem__icon ' + cls + '">' + (ok ? '✓' : '✕') + '</div>' +
          '<div class="tr-hitem__body">' +
            '<div class="tr-hitem__name">' + dir2 + ' ' + esc(h.filename || T.trUnknownFile) + '</div>' +
            '<div class="tr-hitem__meta">' + (h.size != null ? esc(fmtSize(h.size)) + ' · ' : '') + esc(trHistoryStatusLabel(h)) + '</div>' +
          '</div>' +
          retryBtn +
        '</div>';
      }
    }
    html += '</div>';
    transfersView.innerHTML = html;
  }

  function loadTransfers(silent) {
    if (transfersLoading) return;
    transfersLoading = true;
    if (!silent) transfersView.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    getJson('/api/transfer')
      .then(function (data) {
        transfersLoading = false;
        transferActive = (data && data.active) || [];
        transferHistory = (data && data.history) || [];
        renderTransfers();
      })
      .catch(function (err) {
        transfersLoading = false;
        if (err && err.status === 403) notifyTokenExpired();
        if (!silent) {
          var msg = (err && err.status === 403) ? esc(T.tokenExpired) : esc(T.loadFail) + '<br>' + esc(failHint(err));
          transfersView.innerHTML = '<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__text">' + msg + '</div></div>';
        }
      });
  }

  // Cancel every ACTIVE transfer at once (desktop panel parity). The server
  // walks its own live list and cancels each through the same per-transfer
  // action a single-row ✕ uses; it reports how many actually cancelled.
  function transferCancelAll() {
    if (transfersCancellingAll) return;
    transfersCancellingAll = true;
    renderTransfers();
    apiFetch('/api/transfer/cancel-all', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}',
    })
      .then(function (res) {
        transfersCancellingAll = false;
        if (res.status === 403) { notifyTokenExpired(); renderTransfers(); return; }
        if (res.data && res.data.ok) {
          var n = (res.data && typeof res.data.cancelled === 'number') ? res.data.cancelled : 0;
          if (n > 0) showToast(T.trCancelAllDone.replace('{n}', String(n)));
        } else {
          showToast(apiError(res.data, T.trActionFail), true);
        }
        loadTransfers(true);
      })
      .catch(function () {
        transfersCancellingAll = false;
        renderTransfers();
        showToast(T.trActionFail + ' · ' + failHint(), true);
      });
  }

  // Re-send one FAILED OUTGOING history row to its original peer. The busy
  // flag is per row so two different rows can retry in parallel, but a
  // double-tap on the same row can't fire twice.
  function transferRetry(id) {
    if (!id || retryBusyId === id) return;
    retryBusyId = id;
    renderTransfers();
    apiFetch('/api/transfer/retry', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transfer_id: id }),
    })
      .then(function (res) {
        retryBusyId = '';
        if (res.status === 403) { notifyTokenExpired(); renderTransfers(); return; }
        if (!res.data || res.data.ok !== true) {
          showToast(apiError(res.data, T.trRetryFail), true);
        }
        // On success the fresh transfer appears under Active via this
        // refresh — that row IS the feedback, no toast needed.
        loadTransfers(true);
      })
      .catch(function () {
        retryBusyId = '';
        renderTransfers();
        showToast(T.trRetryFail + ' · ' + failHint(), true);
      });
  }

  function transferAction(act, id) {
    apiFetch('/api/transfer/' + act, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transfer_id: id }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (!res.data || res.data.ok !== true) {
          showToast(apiError(res.data, T.trActionFail), true);
        }
        loadTransfers(true);
      })
      .catch(function () {
        showToast(T.trActionFail + ' · ' + failHint(), true);
      });
  }

  transfersView.addEventListener('click', function (e) {
    var el = e.target;
    var retryBtn = el.closest ? el.closest('[data-retry-id]') : null;
    if (retryBtn) {
      transferRetry(retryBtn.getAttribute('data-retry-id'));
      return;
    }
    var btn = el.closest ? el.closest('[data-act]') : null;
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'cancelall') { transferCancelAll(); return; }
    transferAction(act, btn.getAttribute('data-id'));
  });

  /* ── Favorites ──────────────────────────────────────────────── */

  var favoritesItems = [];
  var favoritesLoading = false;
  /* ── Favorites search + group chips ──────────────────────────
     The phone's copy of the window's favourites toolbar.  Filtering is the
     server's (GET /api/favorites?q=&group=); the group chips are drawn from
     the library's own groups, and their counts are the library's — not the
     search's — so a number does not move while the reader types. */
  var favoritesQuery = '';
  var favoritesGroup = '';
  var favoritesGroups = [];
  var favoritesGroupCounts = null;
  var favoritesLibraryTotal = 0;
  /* Which request owns `favoritesItems`, same shape as the history list's.
     The stakes are lower here — the service never echoes the group back, so a
     stale response cannot move a chip — but the failure is the same one the
     server's `_clean_choice` exists to prevent: a rail that says "工作" over a
     list of everything. */
  var favoritesRequestId = 0;
  var favoritesReloadPending = false;
  /* The rail's nodes and the group names they were built from: the library's
     groups can change under it, so it is rebuilt only when they do. */
  var favoriteChipNodes = null;
  var favoriteChipNames = null;

  function favoritesUrl() {
    var parts = [];
    if (favoritesQuery) parts.push('q=' + encodeURIComponent(favoritesQuery));
    if (favoritesGroup) parts.push('group=' + encodeURIComponent(favoritesGroup));
    return '/api/favorites' + (parts.length ? '?' + parts.join('&') : '');
  }

  function favoritesFilterActive() {
    return !!favoritesQuery || !!favoritesGroup;
  }

  function renderFavoritesChips() {
    // With an empty library there is nothing to group or search.
    favTools.style.display = favoritesLibraryTotal > 0 ? 'block' : 'none';
    if (!favoritesLibraryTotal) return;
    var names = favoritesGroups || [];
    // Rebuilt only when the set of groups changed; a poll that brings the same
    // groups must not reset the rail's scroll or drop focus (see the history
    // rail's own note).
    if (!favoriteChipNames || !sameNames(names, favoriteChipNames)) buildFavoriteChips(names);
    favoriteChipNodes.forEach(function (node) {
      var active = favoritesGroup === node.name;
      node.el.className = 'chip' + (active ? ' chip--active' : '');
      node.el.setAttribute('aria-pressed', active ? 'true' : 'false');
      // 全部's number is the library, not a group's: it is the one chip whose
      // count changes when a favourite is deleted anywhere.
      var count = node.name === ''
        ? favoritesLibraryTotal
        : (favoritesGroupCounts ? favoritesGroupCounts[node.name] : null);
      node.countEl.textContent = count == null ? '' : String(count);
      node.countEl.style.display = count == null ? 'none' : '';
    });
  }

  function sameNames(a, b) {
    if (!b || a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) {
      if (a[i] !== b[i]) return false;
    }
    return true;
  }

  function buildFavoriteChips(names) {
    favChips.innerHTML = '';
    favoriteChipNodes = [];
    [''].concat(names).forEach(function (name) {
      var el = document.createElement('button');
      el.type = 'button';
      var label = document.createElement('span');
      label.textContent = name === '' ? T.favGroupAll : name;
      var countEl = document.createElement('span');
      countEl.className = 'chip__count';
      el.appendChild(label);
      el.appendChild(countEl);
