  /* ── Live polling ──────────────────────────────────────────── */

  function activeTabName() {
    var active = document.querySelector('.tab--active');
    return active ? active.getAttribute('data-tab') : 'history';
  }

  // Lightweight poll: refresh the ACTIVE tab every 5s while the page is
  // visible. Paused when hidden to avoid background battery drain; tab
  // switching still reloads immediately.
  function startPolling() {
    stopPolling();
    pollTimer = setInterval(function () {
      if (document.visibilityState !== 'visible') return;
      var name = activeTabName();
      if (name === 'history') loadHistory(true);
      else if (name === 'files') loadFiles(true);
      else if (name === 'chat') loadChat(true);
      else if (name === 'transfers') loadTransfers(true);
      else if (name === 'favorites') loadFavorites(true);
      else if (name === 'settings') loadSettings(true);
    }, 5000);
  }

  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      startPolling();
      // Refresh the active tab right away so the user sees fresh data.
      var name = activeTabName();
      if (name === 'history') loadHistory(true);
      else if (name === 'files') loadFiles(true);
      else if (name === 'chat') loadChat(true);
      else if (name === 'transfers') loadTransfers(true);
      else if (name === 'favorites') loadFavorites(true);
      else if (name === 'settings') loadSettings(true);
    } else {
      stopPolling();
    }
  });

  /* ── API helpers ───────────────────────────────────────────── */

  function apiUrl(path) {
    var sep = path.indexOf('?') !== -1 ? '&' : '?';
    return HOST + path + sep + 'token=' + encodeURIComponent(TOKEN);
  }

  var REQUEST_TIMEOUT = 8000;

  // fetch wrapper with an AbortController timeout so a phone on a different
  // network doesn't hang over shimmering skeletons indefinitely.
  function fetchWithTimeout(url, options) {
    var opts = options || {};
    var controller = new AbortController();
    opts.signal = controller.signal;
    var timer = setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT);
    return fetch(url, opts).then(function (r) {
      clearTimeout(timer);
      return r;
    }).catch(function (e) {
      clearTimeout(timer);
      if (e && e.name === 'AbortError') {
        var err = new Error('timeout');
        err.timeout = true;
        throw err;
      }
      throw e;
    });
  }

  function getJson(path) {
    return fetchWithTimeout(apiUrl(path)).then(function (r) {
      if (!r.ok) {
        var e = new Error('HTTP ' + r.status);
        e.status = r.status;
        throw e;
      }
      return r.json();
    });
  }

  // fetch helper that always resolves to {status, data} so callers can inspect
  // the HTTP status (403 = stale token) alongside the parsed body — shared by
  // the send flow and file delete so both treat 403 identically.  getJson
  // (used by the polling refresh paths) keeps its own error-throwing behavior.
  function apiFetch(path, opts) {
    return fetchWithTimeout(apiUrl(path), opts).then(function (r) {
      return r.json().then(function (data) {
        return { status: r.status, data: data };
      });
    });
  }

  /* ── Toast ─────────────────────────────────────────────────── */

  function showToast(msg, isError) {
    if (toastTimer) clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.className = 'toast toast--show' + (isError ? ' toast--error' : '');
    toastTimer = setTimeout(function () { toastEl.className = 'toast'; }, 2400);
  }

  // A stale token 403s every background poll tick; pop the localized
  // "re-scan the QR code" message at most once so the phone isn't spammed.
  var tokenExpiredNotified = false;
  function notifyTokenExpired() {
    if (tokenExpiredNotified) return;
    tokenExpiredNotified = true;
    showToast(T.tokenExpired, true);
  }

  /* ── History ───────────────────────────────────────────────── */

  function typeIcon(ct) {
    var t = (ct || '').toUpperCase();
    if (t === 'TEXT' || t === 'HTML' || t === 'RTF') return '📝';
    if (t.indexOf('IMAGE') === 0) return '🖼';
    if (t === 'FILE') return '📄';
    return '📋';
  }

  function relTime(ts) {
    if (!ts) return '';
    var d = Math.floor(Date.now() / 1000) - ts;
    if (d < 60) return T.timeJust;
    if (d < 3600) return Math.floor(d / 60) + T.timeMin;
    if (d < 86400) return Math.floor(d / 3600) + T.timeHour;
    return Math.floor(d / 86400) + T.timeDay;
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var historyLoading = false;
  var historyOffset = 0;
  var historyHasMore = true;
  // Mobile has no store object, so it keeps its own copy of the load-more
  // cursor convention (offset = visible length pinned to total; hasMore =
  // length < total, preserved when total is unknown).  Keep in step with
  // store.setHistoryCursor().
  function _setHistCursor(total) {
    historyOffset = (total != null) ? Math.min(historyItems.length, total) : historyItems.length;
    historyHasMore = (total != null) ? (historyItems.length < total) : historyHasMore;
  }
  // Timestamp of the last full-history calibration (limit=total).  A full
  // download is expensive, so it is throttled to one per 30s per client —
  // inside the window the cursor is pinned but no refetch happens.  EVERY
  // terminal state (success write-back and failure) stamps it, so a
  // persistently-failing calibration backs off instead of re-entering a full
  // download on every poll (mirrors store.calibrateHistory).
  var _lastCalibMobile = null;

  // Reconcile a page-1 snapshot into the already-loaded list (dedupe by
  // entry_id, upsert in place, prepend genuinely-new entries).  When
  // *pruneMissing* is true — the NOT-paged path, where the snapshot is fully
  // authoritative — entries the snapshot no longer reports are dropped FIRST,
  // so items deleted on the desktop can't linger as ghost rows.  The paged
  // path (length > limit) calls with pruneMissing=false: the snapshot only
  // governs the first page, so pruning would collapse loaded pages 31..N on
  // every 5s poll; deletions there heal via the WS broadcast / next load-more,
  // and the caller trims the tail to the snapshot's `total` when present.
  // The load-more path (offset>0) never prunes; it stays a pure append merge.
  function mergeHistoryPage(items, pruneMissing) {
    var snapshotIds = {};
    for (var si = 0; si < items.length; si++) {
      var sit = items[si];
      if (sit && sit.entry_id !== undefined) snapshotIds[sit.entry_id] = true;
    }
    if (pruneMissing) {
      for (var pr = historyItems.length - 1; pr >= 0; pr--) {
        var cur = historyItems[pr];
        if (cur && cur.entry_id !== undefined && !snapshotIds[cur.entry_id]) {
          historyItems.splice(pr, 1);
        }
      }
    }
    var idxById = {};
    for (var i = 0; i < historyItems.length; i++) {
      var cur2 = historyItems[i];
      if (cur2 && cur2.entry_id !== undefined) idxById[cur2.entry_id] = i;
    }
    var fresh = [];
    for (var j = 0; j < items.length; j++) {
      var inc = items[j];
      if (!inc) continue;
      var found = (inc.entry_id !== undefined && idxById[inc.entry_id] !== undefined) ? idxById[inc.entry_id] : -1;
      if (found !== -1) {
        historyItems[found] = inc;
      } else {
        fresh.push(inc);
      }
    }
    for (var k = fresh.length - 1; k >= 0; k--) {
      historyItems.unshift(fresh[k]);
    }
    return fresh.length;
  }

  function loadHistory(silent, appendOffset) {
    // Skip while a request is already in flight (poll ticks AND user-initiated
    // loads) so slow responses can't overlap and render out of order.  A
    // user-initiated load that arrives mid-flight simply waits for the next
    // poll, which is already queued.
    if (historyLoading) return;
    historyLoading = true;
    var isAppend = (appendOffset !== undefined && appendOffset !== null);
    // Silent background refreshes and pagination appends keep the current list
    // on screen; only the user-initiated first load shows the skeleton.
    if (!silent && !isAppend) {
      historyList.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    }
    var url = '/api/history?limit=30';
    if (isAppend && appendOffset > 0) {
      url += '&offset=' + appendOffset;
    }
    getJson(url)
      .then(function (data) {
        historyLoading = false;
        var items = (data.items || []).slice(0, 30);
        var total = data.total != null ? data.total : null;
        if (isAppend) {
          // Append the next page, deduping against what is already loaded so a
          // raced poll + scroll can't show the same entry twice.
          var seen = {};
          for (var i = 0; i < historyItems.length; i++) {
            var cur = historyItems[i];
            if (cur && cur.entry_id !== undefined) seen[cur.entry_id] = true;
          }
          var added = 0;
          for (var j = 0; j < items.length; j++) {
            var it = items[j];
            if (!it) continue;
            if (it.entry_id === undefined || !seen[it.entry_id]) {
              if (it.entry_id !== undefined) seen[it.entry_id] = true;
              historyItems.push(it);
              added++;
            }
          }
          historyHasMore = (total != null) ? (historyItems.length < total) : (added > 0);
        } else if (historyItems.length > 30) {
          // Refresh of page 1 (offset=0) while more pages are loaded.  The
          // snapshot is authoritative only for the FIRST page — pruning from
          // it would collapse the 31..N pages the user already loaded on every
          // 5s poll.  Merge in place (upsert/prepend) WITHOUT pruning; deleted
          // entries heal via the full calibration below, the next load-more,
          // or a full refresh.  History is ordered pinned-DESC, timestamp-DESC,
          // so a deleted row can sit at the TOP (pinned) or in the MIDDLE — a
          // tail-trim would evict LIVE oldest entries and keep the ghost, and
          // mobile has no WS broadcast to self-heal from.  When the snapshot's
          // `total` says the loaded list has ghosts (length > total), fetch the
          // authoritative list (limit=total returns every remaining item) and
          // replace wholesale.
          mergeHistoryPage(items, false);
          if (total != null && historyItems.length > total) {
            // Full calibration: fetch the authoritative list at limit=total
            // and replace wholesale.  Mirrors store.calibrateHistory() in
            // app.js/ws.js — same contract (replace, recompute cursor,
            // re-render) plus a 30s throttle (mobile's 5s poll self-heals, but
            // a full limit=total download on every ghosted poll is wasteful).
            var calibNow = Date.now();
            if (_lastCalibMobile && (calibNow - _lastCalibMobile) < 30000) {
              // Throttled — just pin the cursor so Load-more can't skip live
              // entries; the next poll retries after the window elapses.
              _setHistCursor(total);
              renderHistory();
              return;
            }
            historyLoading = true;
            getJson('/api/history?limit=' + total)
              .then(function (calData) {
                historyLoading = false;
                _lastCalibMobile = Date.now();
                var calItems = (calData.items || []).slice(0, total);
                historyItems.splice(0, historyItems.length);
                for (var c = 0; c < calItems.length; c++) {
                  if (calItems[c] == null) continue;  // never store a malformed row
                  historyItems.push(calItems[c]);
                }
                _setHistCursor(calData.total != null ? calData.total : null);
                renderHistory();
              })
              .catch(function () {
                historyLoading = false;
                // Calibration failed — pin the cursor to min(length, total) so
                // Load-more can't skip live entries (mirrors the shared
                // function's failure path) and re-render so the list reflects
                // the current state.  A terminal state: stamp the throttle
                // budget so a persistently-failing server doesn't re-enter a
                // full download on every poll.
                _lastCalibMobile = Date.now();
                _setHistCursor(total != null ? total : null);
                renderHistory();
              });
            return;
          }
          historyHasMore = (total != null) ? (historyItems.length < total) : historyHasMore;
        } else {
          // Not paged: the page-1 snapshot is fully authoritative — prune rows
          // the snapshot no longer reports (desktop deletions) then merge in
          // place.  A cleared history arrives as an empty snapshot, which
          // prunes everything and empties the list.
          mergeHistoryPage(items, true);
          historyHasMore = (total != null) ? (historyItems.length < total) : true;
        }
        historyOffset = historyItems.length;
        renderHistory();
      })
      .catch(function (err) {
        historyLoading = false;
        // A 403 means the token this page was opened with is no longer valid
        // (it was regenerated / cleared) — tell the user to re-scan the QR
        // code, not to check Wi-Fi.  Surface it even on silent background
        // polls, otherwise the UI looks fresh while every refresh silently
        // 403s.
        if (err && err.status === 403) notifyTokenExpired();
        if (!silent) {
          var msg = (err && err.status === 403)
            ? esc(T.tokenExpired)
            : esc(T.loadFail) + '<br>' + esc(T.loadFailHint);
          historyList.innerHTML = '<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__text">' + msg + '</div></div>';
        }
      });
  }

  function renderHistory() {
    if (historyItems.length === 0) {
      historyList.innerHTML = '<div class="empty"><div class="empty__icon">📋</div><div class="empty__text">' + esc(T.emptyHistory) + '</div></div>';
      return;
    }
    historyList.innerHTML = '';
    historyItems.forEach(function (item, i) {
      var el = document.createElement('div');
      el.className = 'h-item';
      el.style.animation = 'none';
      el.innerHTML =
        '<div class="h-item__icon">' + typeIcon(item.content_type) + '</div>' +
        '<div class="h-item__body">' +
          '<div class="h-item__text">' + esc(item.text_preview || item.content_type || T.emptyPreview) + '</div>' +
          '<div class="h-item__meta">' + esc(relTime(item.timestamp)) + '</div>' +
        '</div>';
      el.addEventListener('click', function () { openItem(i); });
      historyList.appendChild(el);
    });
  }

  // Infinite scroll: load the next history page when the list scrolls to the
  // bottom.  Only fires while the history tab is active; the append keeps the
  // current scroll position (the scrollTop property survives the re-render).
  var contentEl = document.querySelector('.content');
  contentEl.addEventListener('scroll', function () {
    if (activeTabName() !== 'history') return;
    if (historyLoading || !historyHasMore) return;
    if (contentEl.scrollTop + contentEl.clientHeight >= contentEl.scrollHeight - 48) {
      loadHistory(true, historyOffset);
    }
  });

  /* ── Item detail + copy to phone ───────────────────────────── */

  function getFullText(item) {
    if (item.types && item.types.TEXT) {
      try {
        var raw = atob(item.types.TEXT);
        var bytes = new Uint8Array(raw.length);
        for (var j = 0; j < raw.length; j++) bytes[j] = raw.charCodeAt(j);
        return new TextDecoder('utf-8').decode(bytes);
      } catch (e) { /* fall through */ }
    }
    return item.text_preview || '';
  }

  // The backend stores image bytes under the "IMAGE" type (EMF under
  // "IMAGE_EMF"); item.image_fmt says how they were encoded. Pick the
  // matching MIME so BMP/TIFF clips render instead of breaking — the
  // bytes are NOT re-encoded server-side.
  function imageDataUrl(item) {
    var types = item.types || {};
    var fmt = item.image_fmt || '';
    var mime = fmt === 'bmp' ? 'image/bmp'
             : fmt === 'tiff' ? 'image/tiff'
             : 'image/png';
    if (types.IMAGE) return 'data:' + mime + ';base64,' + types.IMAGE;
    if (types.IMAGE_EMF) return 'data:image/x-emf;base64,' + types.IMAGE_EMF;
    return '';
  }

  function showImageModal(url) {
    modalImage.src = url;
    modalImage.alt = T.tabHistory;
    modalImage.style.display = '';
    modalText.style.display = 'none';
    modalCopyBtn.style.display = 'none';
    modalImage.classList.remove('modal__image--zoomed');
  }

  function setModalContent(item) {
    var imgUrl = imageDataUrl(item);
    if (imgUrl) {
      showImageModal(imgUrl);
    } else {
      // Drop any stale image from a previously-opened clip before showing text.
      modalImage.style.display = 'none';
      modalImage.removeAttribute('src');
      modalText.style.display = '';
      modalCopyBtn.style.display = '';
      modalText.textContent = getFullText(item) || item.text_preview || T.emptyPreview;
    }
  }

  function openItem(i) {
    var item = historyItems[i];
    modalTitle.textContent = T.tabHistory + ' · ' + relTime(item.timestamp);
    setModalContent(item);
    modalEl.classList.add('modal-mask--show');
    // The list no longer carries full content — fetch it when the modal opens.
    if (item.entry_id) {
      getJson('/api/history/item?entry_id=' + encodeURIComponent(item.entry_id))
        .then(function (data) {
          if (data && data.item) setModalContent(data.item);
        })
        .catch(function () { /* keep the preview */ });
    }
  }

  function closeModal() {
    modalEl.classList.remove('modal-mask--show');
    modalImage.classList.remove('modal__image--zoomed');
  }

  // Tap the image to zoom in / out.
  modalImage.addEventListener('click', function () {
    modalImage.classList.toggle('modal__image--zoomed');
  });

  document.getElementById('modalClose').addEventListener('click', closeModal);
  modalEl.addEventListener('click', function (e) { if (e.target === modalEl) closeModal(); });

  document.getElementById('modalCopy').addEventListener('click', function () {
    // Copy is text-only — no-op when an image is being displayed.
    if (modalText.style.display === 'none') return;
    var text = modalText.textContent;
    if (!text) return;
    // navigator.clipboard needs a secure context (HTTPS) — on plain HTTP LAN
    // fall back to a hidden textarea + execCommand, and finally tell the user
    // to long-press the visible text.
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { showToast(T.copied); return; }
      } catch (e) { /* fall through */ }
      showToast(T.copyFail, true);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast(T.copied);
      }).catch(fallback);
    } else {
      fallback();
    }
  });

  /* ── Send ──────────────────────────────────────────────────── */

  var sendBtn = document.getElementById('sendBtn');
  sendBtn.addEventListener('click', function () {
    var text = sendText.value.trim();
    if (!text) { showToast(T.sendEmpty, true); return; }
    sendBtn.disabled = true;
    apiFetch('/api/push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text }),
    })
      .then(function (res) {
        sendBtn.disabled = false;
        // A 403 (stale token) surfaces as the localized token-expired message
        // instead of the server's English error string.
        if (res.status === 403) {
          showToast(T.tokenExpired, true);
          return;
        }
        if (res.data.ok) {
          showToast(T.sendOk);
          sendText.value = '';
        } else {
          showToast(res.data.error || T.sendFail, true);
        }
      })
      .catch(function () {
        sendBtn.disabled = false;
        showToast(T.sendFail + ' · ' + T.loadFailHint, true);
      });
  });

  /* ── Files: upload ─────────────────────────────────────────── */

  document.getElementById('uploadBtn').addEventListener('click', function () {
    fileInput.click();
  });

  function resetUploadUI() {
    uploadXhr = null;
    var btn = document.getElementById('uploadBtn');
    btn.textContent = T.uploadBtn;
    btn.disabled = false;
    uploadProgressWrap.style.display = 'none';
    fileInput.value = '';
  }

  function startUpload(files) {
    var btn = document.getElementById('uploadBtn');
    var totalBytes = 0;
    for (var k = 0; k < files.length; k++) totalBytes += files[k].size;
    var uploadedBytes = 0;
    var cancelled = false;

    btn.textContent = T.uploading;
    btn.disabled = true;
    uploadProgressFill.style.width = '0%';
    uploadProgressWrap.style.display = 'flex';
    uploadCancelBtn.textContent = T.uploadCancel;

    // The server upload endpoint accepts ONE file per request, so queue the
    // selected files and upload them one at a time (cumulative progress).
    var queue = files.slice();

    function uploadNext() {
      if (cancelled) return;
      if (queue.length === 0) {
        resetUploadUI();
        showToast(T.uploadOk);
        loadFiles();
        return;
      }
      var file = queue.shift();
      var form = new FormData();
      form.append('file', file);

      var xhr = new XMLHttpRequest();
      uploadXhr = xhr;
      xhr.open('POST', apiUrl('/api/upload'));
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) {
          var pct = Math.round(((uploadedBytes + e.loaded) / totalBytes) * 100);
          if (pct > 100) pct = 100;
          uploadProgressFill.style.width = pct + '%';
        }
      };
      xhr.onload = function () {
        var data = null;
        try { data = JSON.parse(xhr.responseText); } catch (e) { /* ignore */ }
        var ok = xhr.status >= 200 && xhr.status < 300 && data && data.ok;
        if (ok) {
          uploadedBytes += file.size;
          uploadNext();
        } else {
          resetUploadUI();
          showToast((data && data.error) || T.uploadFail, true);
        }
      };
      xhr.onerror = function () {
        resetUploadUI();
        showToast(T.uploadFail + ' · ' + T.loadFailHint, true);
      };
      xhr.onabort = function () {
        cancelled = true;
        resetUploadUI();
        showToast(T.uploadCancelled);
      };
      xhr.send(form);
    }

    uploadNext();
  }

  fileInput.addEventListener('change', function () {
    if (!fileInput.files || fileInput.files.length === 0) return;
    var files = Array.prototype.slice.call(fileInput.files);
    var total = 0;
    for (var i = 0; i < files.length; i++) total += files[i].size;
    // Pre-flight check: the server buffers the whole body and hard-caps at
    // 128 MB — reject oversized selections before starting the upload.  Leave
    // a 64 KB headroom so multipart boundaries / headers never push the actual
    // request body past the server's Content-Length cap.
    if (total > MAX_UPLOAD_BYTES - 64 * 1024) {
      showToast(T.uploadTooLarge, true);
      fileInput.value = '';
      return;
    }
    startUpload(files);
  });

  uploadCancelBtn.addEventListener('click', function () {
    if (uploadXhr) uploadXhr.abort();
  });

  /* ── Files: list + download ────────────────────────────────── */

  var filesLoading = false;
  function loadFiles(silent) {
    // Skip a silent poll tick while a request is already in flight.
    if (filesLoading && silent) return;
    filesLoading = true;
    if (!silent) {
      fileList.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    }
    getJson('/api/files')
      .then(function (data) {
        filesLoading = false;
        var files = (data && data.files) || [];
        if (files.length === 0) {
          fileList.innerHTML = '<div class="empty"><div class="empty__icon">📁</div><div class="empty__text">' + esc(T.emptyFiles) + '</div></div>';
          return;
        }
        fileList.innerHTML = '';
        files.forEach(function (f) {
          var el = document.createElement('div');
          el.className = 'f-item';
          el.innerHTML =
            '<div class="f-item__icon">📄</div>' +
            '<div class="f-item__body">' +
              '<div class="f-item__name">' + esc(f.name) + '</div>' +
              '<div class="f-item__meta">' + esc(f.size) + ' · ' + esc(f.time) + '</div>' +
            '</div>' +
            '<button class="f-item__delete" title="' + esc(T.fileDelete) + '">✕</button>';
          el.addEventListener('click', function () {
            var a = document.createElement('a');
            a.href = apiUrl('/api/download?file=' + encodeURIComponent(f.name));
            a.download = f.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast(T.fileDownload);
          });
          // The row itself downloads on tap; the delete button stops
          // propagation so it deletes instead of triggering a download.
          el.querySelector('.f-item__delete').addEventListener('click', function (ev) {
            ev.stopPropagation();
            deleteFile(f.name);
          });
          fileList.appendChild(el);
        });
      })
      .catch(function (err) {
        filesLoading = false;
        // Same stale-token handling as history: notify even on silent polls.
        if (err && err.status === 403) notifyTokenExpired();
        if (!silent) {
          var msg = (err && err.status === 403)
            ? esc(T.tokenExpired)
            : esc(T.loadFail) + '<br>' + esc(T.loadFailHint);
          fileList.innerHTML = '<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__text">' + msg + '</div></div>';
        }
      });
  }

  function deleteFile(name) {
    var label = '“' + name + '”';
    if (!window.confirm(ZH ? '删除文件 ' + label + '？' : 'Delete file ' + label + '?')) return;
    apiFetch('/api/files', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok) {
          showToast(T.fileDeleted);
          loadFiles();
        } else {
          showToast((res.data && res.data.error) || T.uploadFail, true);
        }
      })
      .catch(function () {
        showToast(T.uploadFail + ' · ' + T.loadFailHint, true);
      });
  }

  /* ── Shared formatting helpers ──────────────────────────────── */

  function fmtSize(bytes) {
    if (!bytes && bytes !== 0) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }

  function fmtSpeed(bytesPerSec) {
    if (!bytesPerSec || bytesPerSec <= 0) return '';
    if (bytesPerSec < 1024) return Math.round(bytesPerSec) + ' B/s';
    if (bytesPerSec < 1024 * 1024) return (bytesPerSec / 1024).toFixed(1) + ' KB/s';
    return (bytesPerSec / (1024 * 1024)).toFixed(1) + ' MB/s';
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function fmtClock(ts) {
    if (!ts) return '';
    var d = new Date(ts * 1000);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  /* ── Chat ──────────────────────────────────────────────────── */

  var chatDevices = [];
  var chatSessions = [];
  var chatOpenSession = null;
  var chatMessages = [];
  var chatLoading = false;
  var chatInviteBusy = '';
  var chatLastMsgCount = 0;
  var chatScrollBottom = false;
  var chatConvSigPrev = '';

  function chatStatusLabel(s) {
    var map = {
      invited: 'chatStatusInvited',
      inviting: 'chatStatusInviting',
      uninviting: 'chatStatusInviting',
      active: 'chatStatusActive',
      declined: 'chatStatusDeclined',
      declined_remote: 'chatStatusDeclined',
      closed: 'chatStatusClosed',
    };
    return T[map[s] || 'chatStatusInvited'] || '';
  }

  function chatStatusClass(s) {
    if (s === 'active') return 'chat-session__status--ok';
    if (s === 'invited' || s === 'inviting' || s === 'uninviting') return 'chat-session__status--warn';
    if (s === 'declined' || s === 'declined_remote') return 'chat-session__status--err';
    return '';
  }

  // Local key map for the server's system-message text_keys — the mobile page
  // carries its own T dict, so translate here instead of via the dashboard i18n.
  function chatSystemText(entry) {
    var tk = entry && entry.text_key;
    var tkey = '';
    if (tk === 'chat.system.peer_offline') tkey = 'chatSystemPeerOffline';
    else if (tk === 'chat.system.session_closed_by_peer') tkey = 'chatSystemClosedByPeer';
    else if (tk === 'chat.system.file_declined') tkey = 'chatSystemFileDeclined';
    else if (tk === 'chat.system.file_cancelled') tkey = 'chatSystemFileCancelled';
    var raw = tkey ? T[tkey] : (entry ? entry.text || T.chatSystemUnknown : T.chatSystemUnknown);
    if (!raw) return '';
    var fmt = (entry && entry.fmt) || {};
    var name = fmt.name || '';
    if (!name && chatOpenSession) {
      for (var i = 0; i < chatSessions.length; i++) {
        if (chatSessions[i].session_id === chatOpenSession) {
          name = chatSessions[i].peer_name || '';
          break;
        }
      }
    }
    if (name) raw = raw.replace(/\{name\}/g, name);
    return raw;
  }

  function chatFileStatus(m) {
    var st = (m && m.status) || 'pending';
    if (st === 'done') return m.outgoing ? T.chatFileSent : T.chatFileReceived;
    if (st === 'sending' && !m.outgoing) return T.chatFileReceiving;
    var map = {
      pending: 'chatFilePending',
      await_accept: 'chatFileAwaitAccept',
      sending: 'chatFileSending',
      failed: 'chatFileFailed',
      declined: 'chatFileDeclined',
      rejected: 'chatFileDeclined',
      cancelled: 'chatFileCancelled',
      cancelled_by_peer: 'chatFileCancelled',
      peer_offline: 'chatFileFailed',
      error_timeout: 'chatFileFailed',
      error_size_mismatch: 'chatFileFailed',
      error_security: 'chatFileFailed',
      error_disk: 'chatFileFailed',
    };
    return T[map[st] || 'chatFilePending'] || '';
  }

  function chatOpenSessionObj() {
    if (!chatOpenSession) return null;
    for (var i = 0; i < chatSessions.length; i++) {
      if (chatSessions[i].session_id === chatOpenSession) return chatSessions[i];
    }
    return null;
  }

  // A cheap signature of the open conversation so silent polls can skip the
  // re-render (and the composer's focus) when nothing changed.
  function chatConvSignature() {
    var parts = [];
    for (var i = 0; i < chatMessages.length; i++) {
      var m = chatMessages[i];
      parts.push(m.entry_id + ':' + (m.status || '') + ':' + (m.ts || '') + ':' + (m.saved_path || ''));
    }
    var sess = chatOpenSessionObj();
    parts.push('s:' + (sess ? sess.status + ':' + (sess.unread || 0) + ':' + (sess.online ? '1' : '0') : 'none'));
    return parts.join('|');
  }

  function chatMsgHtml(m) {
    if (m.kind === 'system') {
      return '<div class="chat-msg-row"><div class="chat-system">' + esc(chatSystemText(m)) + '</div></div>';
    }
    if (m.kind === 'text') {
      var failed = !!(m.outgoing && m.status === 'failed');
      var meta = '';
      if (failed) {
        meta += '<span class="chat-bubble__failed">' + esc(T.chatTextFailed) + '</span>';
        meta += '<button class="chat-bubble__retry" data-resend-entry="' + esc(m.entry_id) + '" title="' + esc(T.chatResend) + '">⟳</button>';
      }
      return '<div class="chat-msg-row"><div class="chat-bubble' + (m.outgoing ? ' chat-bubble--out' : ' chat-bubble--in') + (failed ? ' chat-bubble--failed' : '') + '">' +
        '<div class="chat-bubble__text">' + esc(m.text || '') + '</div>' +
        '<div class="chat-bubble__meta">' + meta + esc(fmtClock(m.ts)) + '</div>' +
      '</div></div>';
    }
    // File card.
    var acts = '';
    if (!m.outgoing && m.status === 'await_accept') {
      acts += '<button class="chat-action-btn chat-action-btn--accept" data-file-action="accept" data-transfer-id="' + esc(m.transfer_id) + '">' + esc(T.chatAccept) + '</button>';
      acts += '<button class="chat-action-btn chat-action-btn--decline" data-file-action="decline" data-transfer-id="' + esc(m.transfer_id) + '">' + esc(T.chatDecline) + '</button>';
    } else if (m.status === 'sending') {
      acts += '<button class="chat-action-btn chat-action-btn--danger" data-file-action="cancel" data-transfer-id="' + esc(m.transfer_id) + '">' + esc(T.chatCancel) + '</button>';
    } else if (m.status === 'done' && m.saved_path) {
      acts += '<button class="chat-action-btn chat-action-btn--accept" data-download-transfer="' + esc(m.transfer_id) + '" data-filename="' + esc(m.file_name || '') + '">' + esc(T.chatDownload) + '</button>';
    }
    return '<div class="chat-msg-row"><div class="chat-file' + (m.outgoing ? ' chat-file--out' : ' chat-file--in') + '">' +
      '<div class="chat-file__icon">📄</div>' +
      '<div class="chat-file__body">' +
        '<div class="chat-file__name">' + esc(m.file_name || T.trUnknownFile) + '</div>' +
        '<div class="chat-file__meta"><span>' + esc(fmtSize(m.file_size)) + '</span><span class="chat-file__status"> · ' + esc(chatFileStatus(m)) + '</span></div>' +
      '</div>' +
      (acts ? '<div class="chat-file__actions">' + acts + '</div>' : '') +
    '</div></div>';
  }

  function renderChatList() {
    var html = '';
    html += '<div class="chat-hdr">💻 ' + esc(T.chatDevices) + '</div>';
    if (chatDevices.length === 0) {
      html += '<div class="empty"><div class="empty__icon">📡</div><div class="empty__text">' + esc(T.chatEmptyDevices) + '</div></div>';
    } else {
      for (var i = 0; i < chatDevices.length; i++) {
        var d = chatDevices[i];
        var busy = chatInviteBusy === d.peer_id;
        html += '<div class="chat-device">' +
          '<div class="chat-device__info">' +
            '<div class="chat-device__name">' + esc(d.name || d.peer_id) + '</div>' +
            '<div class="chat-device__badge' + (d.paired ? ' chat-device__badge--on' : '') + '">' + esc(d.paired ? T.chatPaired : T.chatUnpaired) + '</div>' +
          '</div>' +
          '<button class="chat-btn chat-btn--accent" data-start-peer="' + esc(d.peer_id) + '"' + (busy ? ' disabled' : '') + '>' + (busy ? '…' : esc(T.chatStart)) + '</button>' +
        '</div>';
      }
    }
    html += '<div class="chat-hdr">💬 ' + esc(T.chatSessions) + '</div>';
    if (chatSessions.length === 0) {
      html += '<div class="empty"><div class="empty__icon">💬</div><div class="empty__text">' + esc(T.chatEmptySessions) + '</div></div>';
    } else {
      for (var j = 0; j < chatSessions.length; j++) {
        var s = chatSessions[j];
        html += '<div class="chat-session" data-session-id="' + esc(s.session_id) + '">' +
          '<span class="chat-session__dot' + (s.online ? ' chat-session__dot--on' : '') + '"></span>' +
          '<div class="chat-session__body">' +
            '<div class="chat-session__top">' +
              '<span class="chat-session__name">' + esc(s.peer_name || s.peer_id) + '</span>' +
              '<span class="chat-session__status ' + chatStatusClass(s.status) + '">' + esc(chatStatusLabel(s.status)) + '</span>' +
            '</div>' +
            '<div class="chat-session__preview">' + esc(s.last_preview || '') + '</div>' +
          '</div>' +
          ((s.unread || 0) > 0 ? '<span class="chat-session__badge">' + ((s.unread > 99) ? '99+' : s.unread) + '</span>' : '') +
        '</div>';
      }
    }
    chatView.innerHTML = html;
  }

  function renderChatConversation() {
    var sess = chatOpenSessionObj();
    var name = sess ? (sess.peer_name || sess.peer_id) : '';
    var status = sess ? chatStatusLabel(sess.status) : '';
    var html = '';
    html += '<div class="chat-conv__hdr">' +
      '<button class="chat-btn chat-btn--ghost" id="chatBackBtn">' + esc(T.chatBack) + '</button>' +
      '<div class="chat-conv__name">' + esc(name) + '</div>' +
      '<div class="chat-conv__status">' + esc(status) + '</div>' +
    '</div>';
    if (sess && sess.status === 'invited') {
      html += '<div class="chat-invite-banner">' +
        '<span class="chat-invite-banner__name">' + esc(name) + '</span>' +
        '<span>' + esc(T.chatInviteBanner) + '</span>' +
        '<button class="chat-action-btn chat-action-btn--accept" data-invite-action="accept">' + esc(T.chatAccept) + '</button>' +
        '<button class="chat-action-btn chat-action-btn--decline" data-invite-action="decline">' + esc(T.chatDecline) + '</button>' +
      '</div>';
    }
    html += '<div class="chat-conv__msgs">';
    if (chatMessages.length === 0) {
      html += '<div class="empty"><div class="empty__icon">💬</div><div class="empty__text">' + esc(T.chatEmptyConv) + '</div></div>';
    } else {
      for (var i = 0; i < chatMessages.length; i++) {
        html += chatMsgHtml(chatMessages[i]);
      }
    }
    html += '</div>';
    html += '<div class="chat-composer">' +
      '<input class="chat-composer__input" id="chatInput" placeholder="' + esc(T.chatInputPlaceholder) + '" maxlength="4000" autocomplete="off">' +
      '<button class="chat-composer__send" id="chatSendBtn">' + esc(T.chatSend) + '</button>' +
    '</div>';
    chatView.innerHTML = html;
    var input = document.getElementById('chatInput');
    if (input) {
      try { input.focus(); } catch (e) {}
      try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
    }
    if (chatScrollBottom) {
      chatScrollBottom = false;
      scrollChatToBottom();
    }
  }

  function scrollChatToBottom() {
    contentEl.scrollTop = contentEl.scrollHeight;
  }

  function loadChat(silent) {
    if (chatLoading) return;
    chatLoading = true;
    if (!silent && chatOpenSession === null && chatDevices.length === 0 && chatSessions.length === 0) {
      chatView.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    }
    var pDev = getJson('/api/chat/devices').then(function (d) { return d.devices || []; }, function () { return []; });
    var pSess = getJson('/api/chat/sessions').then(function (d) { return d.sessions || []; }, function () { return []; });
    Promise.all([pDev, pSess]).then(function (out) {
      chatDevices = out[0];
      chatSessions = out[1];
      if (!chatOpenSession) {
        chatLoading = false;
        renderChatList();
        return;
      }
      var found = false;
      for (var i = 0; i < chatSessions.length; i++) {
        if (chatSessions[i].session_id === chatOpenSession) { found = true; break; }
      }
      if (!found) {
        chatOpenSession = null;
        chatLastMsgCount = 0;
        chatConvSigPrev = '';
        chatLoading = false;
        renderChatList();
        return;
      }
      getJson('/api/chat/messages?session_id=' + encodeURIComponent(chatOpenSession))
        .then(function (d) {
          var msgs = (d && d.messages) || [];
          chatLoading = false;
          if (msgs.length > chatLastMsgCount) chatScrollBottom = true;
          chatLastMsgCount = msgs.length;
          chatMessages = msgs;
          var sig = chatConvSignature();
          if (sig !== chatConvSigPrev || !silent) {
            chatConvSigPrev = sig;
            renderChatConversation();
          }
        })
        .catch(function () {
          chatLoading = false;
          chatMessages = [];
          if (!silent) renderChatConversation();
        });
    });
  }

  function chatOpen(sessionId) {
    chatOpenSession = sessionId;
    chatLastMsgCount = 0;
    chatConvSigPrev = '';
    chatScrollBottom = true;
    loadChat(false);
  }

  function chatBack() {
    chatOpenSession = null;
    chatLastMsgCount = 0;
    chatConvSigPrev = '';
    renderChatList();
  }

  function chatStartInvite(peerId) {
    var name = peerId;
    for (var i = 0; i < chatDevices.length; i++) {
      if (chatDevices[i].peer_id === peerId) { name = chatDevices[i].name || peerId; break; }
    }
    chatInviteBusy = peerId;
    apiFetch('/api/chat/invite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ peer_id: peerId, peer_name: name }),
    })
      .then(function (res) {
        chatInviteBusy = '';
        if (res.status === 403) { notifyTokenExpired(); return; }
        var d = res.data || {};
        if (d.session_id) {
          chatOpen(d.session_id);
        } else if (d.connecting) {
          showToast(T.chatConnecting);
        } else if (d.ok === false) {
          showToast(d.error || T.chatInviteFailed, true);
        }
      })
      .catch(function () {
        chatInviteBusy = '';
        showToast(T.chatInviteFailed + ' · ' + T.loadFailHint, true);
      });
  }

  function chatSend() {
    var input = document.getElementById('chatInput');
    if (!input || !chatOpenSession) return;
    var text = input.value.trim();
    if (!text) { showToast(T.chatSendEmpty, true); return; }
    apiFetch('/api/chat/text', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: chatOpenSession, text: text }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok) {
          input.value = '';
          chatScrollBottom = true;
          loadChat(true);
        } else {
          showToast((res.data && res.data.error) || T.chatSendFail, true);
        }
      })
      .catch(function () {
        showToast(T.chatSendFail + ' · ' + T.loadFailHint, true);
      });
  }

  function chatInviteAction(action) {
    if (!chatOpenSession) return;
    apiFetch('/api/chat/' + action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: chatOpenSession }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (action === 'decline') {
          chatBack();
        } else {
          loadChat(true);
        }
      })
      .catch(function () {
        showToast(T.chatSendFail + ' · ' + T.loadFailHint, true);
      });
  }

  function chatResend(entryId) {
    if (!chatOpenSession || !entryId) return;
    apiFetch('/api/chat/resend', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: chatOpenSession, entry_id: entryId }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (!res.data || res.data.ok !== true) {
          showToast((res.data && res.data.error) || T.chatResendFail, true);
        }
        chatScrollBottom = true;
        loadChat(true);
      })
      .catch(function () {
        showToast(T.chatResendFail + ' · ' + T.loadFailHint, true);
      });
  }

  function chatFileAction(action, transferId) {
    if (!chatOpenSession || !transferId) return;
    apiFetch('/api/chat/file/' + action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: chatOpenSession, transfer_id: transferId }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (!res.data || res.data.ok !== true) {
          showToast((res.data && res.data.error === 'expired') ? T.chatOfferExpired : ((res.data && res.data.error) || T.chatSendFail), true);
        }
        chatScrollBottom = true;
        loadChat(true);
      })
      .catch(function () {
        showToast(T.chatSendFail + ' · ' + T.loadFailHint, true);
      });
  }

  function chatDownload(transferId, filename) {
    if (!transferId) return;
    var a = document.createElement('a');
    a.href = apiUrl('/api/chat/download?transfer_id=' + encodeURIComponent(transferId));
    a.download = filename || '';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // Delegated events for the chat view — the panel is re-rendered on every
  // poll, so bind once on the container instead of re-binding per render.
  chatView.addEventListener('click', function (e) {
    var el = e.target;
    var startBtn = el.closest ? el.closest('[data-start-peer]') : null;
    if (startBtn) { chatStartInvite(startBtn.getAttribute('data-start-peer')); return; }
    var sessRow = el.closest ? el.closest('[data-session-id]') : null;
    if (sessRow && !el.closest('button')) { chatOpen(sessRow.getAttribute('data-session-id')); return; }
    if (el.closest && el.closest('#chatBackBtn')) { chatBack(); return; }
    if (el.closest && el.closest('#chatSendBtn')) { chatSend(); return; }
    var invBtn = el.closest ? el.closest('[data-invite-action]') : null;
    if (invBtn) { chatInviteAction(invBtn.getAttribute('data-invite-action')); return; }
    var dlBtn = el.closest ? el.closest('[data-download-transfer]') : null;
    if (dlBtn) { chatDownload(dlBtn.getAttribute('data-download-transfer'), dlBtn.getAttribute('data-filename') || ''); return; }
    var resendBtn = el.closest ? el.closest('[data-resend-entry]') : null;
    if (resendBtn) {
      resendBtn.disabled = true;
      chatResend(resendBtn.getAttribute('data-resend-entry'));
      return;
    }
    var fileBtn = el.closest ? el.closest('[data-file-action]') : null;
    if (fileBtn) {
      chatFileAction(fileBtn.getAttribute('data-file-action'), fileBtn.getAttribute('data-transfer-id'));
      return;
    }
  });

  chatView.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'chatInput') {
      e.preventDefault();
      chatSend();
    }
  });

  /* ── Transfers ──────────────────────────────────────────────── */

  var transferActive = [];
  var transferHistory = [];
  var transfersLoading = false;

  // An incoming P2P request the desktop is asking about: the manager's state
  // is "pending" until the user accepts (then "receiving"). Also match any
  // future wait/await/request phrasing defensively.
  function isTransferRequest(t) {
    var s = String(t.status || '');
    if (s === 'pending') return true;
    return /^(wait|await|request)/i.test(s);
  }

  function trActiveStatusLabel(t) {
    var s = t.status || '';
    if (s === 'paused') return T.trStatePaused;
    if (s === 'finalizing' || t.state === 'finalizing') return T.trStateFinalizing;
    if (s === 'awaiting_ack' || t.state === 'awaiting_ack') return T.trStateAwaitingAck;
    if (isTransferRequest(t)) return T.trStateAwaiting;
    return '';
  }

  function trActionButtons(t) {
    var id = esc(t.id);
    var b = '';
    if (isTransferRequest(t)) {
      b += '<button class="tr-btn tr-btn--ok" data-act="accept" data-id="' + id + '">' + esc(T.trAccept) + '</button>';
      b += '<button class="tr-btn tr-btn--bad" data-act="reject" data-id="' + id + '">' + esc(T.trReject) + '</button>';
    } else if (t.status === 'paused') {
      b += '<button class="tr-btn tr-btn--ok" data-act="resume" data-id="' + id + '">' + esc(T.trResume) + '</button>';
      b += '<button class="tr-btn tr-btn--bad" data-act="cancel" data-id="' + id + '">' + esc(T.trCancel) + '</button>';
    } else {
      b += '<button class="tr-btn tr-btn--warn" data-act="cancel" data-id="' + id + '">' + esc(T.trCancel) + '</button>';
      b += '<button class="tr-btn tr-btn--ok" data-act="pause" data-id="' + id + '">' + esc(T.trPause) + '</button>';
    }
    return b;
  }

  function trHistoryStatusLabel(t) {
    if (t.status === 'completed') return T.trStatusCompleted;
    var reason = t.reason || t.status || '';
    var map = {
      cancelled: 'trReasonCancelled',
      rejected: 'trReasonRejected',
      error_disk: 'trReasonDisk',
      error_size_mismatch: 'trReasonSizeMismatch',
      error_missing_chunks: 'trReasonMissingChunks',
      error_security: 'trReasonSecurity',
      peer_offline: 'trReasonPeerOffline',
      timeout: 'trReasonTimeout',
      error_timeout: 'trReasonTimeout',
      error_internal: 'trReasonInternal',
    };
    var k = map[reason];
    if (k) return T[k];
    if (t.status === 'failed') return T.trStatusFailed;
    return T.trStatusCancelled;
  }

  function renderTransfers() {
    var html = '';
    html += '<div class="tr-section"><div class="chat-hdr">📡 ' + esc(T.trActive) + '</div>';
    if (transferActive.length === 0) {
      html += '<div class="empty"><div class="empty__icon">📤</div><div class="empty__text">' + esc(T.trEmptyActive) + '</div></div>';
    } else {
      for (var i = 0; i < transferActive.length; i++) {
        var t = transferActive[i];
        var dir = t.direction === 'up' ? '↑' : '↓';
        var pct = Math.min(100, Math.max(0, Math.round(t.progress || 0)));
        var meta = (t.size != null) ? esc(fmtSize(t.size)) : '';
        var st = trActiveStatusLabel(t);
        if (st) meta += (meta ? ' · ' : '') + esc(st);
        var speed = fmtSpeed(t.speed);
        if (t.eta) speed += (speed ? ' · ' : '') + '⏱ ' + esc(t.eta);
        html += '<div class="tr-item">' +
          '<div class="tr-item__icon tr-item__icon--' + (t.direction === 'up' ? 'up' : 'down') + '">' + dir + '</div>' +
          '<div class="tr-item__body">' +
            '<div class="tr-item__name">' + esc(t.filename || T.trUnknownFile) + '</div>' +
            '<div class="tr-item__meta">' + meta + '</div>' +
            '<div class="tr-item__bar"><div class="tr-item__fill" style="width:' + pct + '%"></div></div>' +
            (speed ? '<div class="tr-item__speed">' + speed + '</div>' : '') +
          '</div>' +
          '<div class="tr-item__actions">' + trActionButtons(t) + '</div>' +
        '</div>';
      }
    }
    html += '</div>';
    html += '<div class="tr-section"><div class="chat-hdr">📚 ' + esc(T.trHistory) + '</div>';
    if (transferHistory.length === 0) {
      html += '<div class="empty"><div class="empty__icon">🗂</div><div class="empty__text">' + esc(T.trEmptyHistory) + '</div></div>';
    } else {
      for (var j = 0; j < transferHistory.length; j++) {
        var h = transferHistory[j];
        var dir2 = h.direction === 'up' ? '↑' : '↓';
        var ok = h.status === 'completed';
        var cancelled = h.status === 'cancelled' || h.cancelled;
        var cls = ok ? 'tr-hitem__icon--ok' : (cancelled ? 'tr-hitem__icon--warn' : 'tr-hitem__icon--err');
        html += '<div class="tr-hitem">' +
          '<div class="tr-hitem__icon ' + cls + '">' + (ok ? '✓' : '✕') + '</div>' +
          '<div class="tr-hitem__body">' +
            '<div class="tr-hitem__name">' + dir2 + ' ' + esc(h.filename || T.trUnknownFile) + '</div>' +
            '<div class="tr-hitem__meta">' + (h.size != null ? esc(fmtSize(h.size)) + ' · ' : '') + esc(trHistoryStatusLabel(h)) + '</div>' +
          '</div>' +
        '</div>';
      }
    }
    html += '</div>';
    transfersView.innerHTML = html;
  }

  function loadTransfers(silent) {
    if (transfersLoading) return;
    transfersLoading = true;
    if (!silent) transfersView.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    getJson('/api/transfer')
      .then(function (data) {
        transfersLoading = false;
        transferActive = (data && data.active) || [];
        transferHistory = (data && data.history) || [];
        renderTransfers();
      })
      .catch(function (err) {
        transfersLoading = false;
        if (err && err.status === 403) notifyTokenExpired();
        if (!silent) {
          var msg = (err && err.status === 403) ? esc(T.tokenExpired) : esc(T.loadFail) + '<br>' + esc(T.loadFailHint);
          transfersView.innerHTML = '<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__text">' + msg + '</div></div>';
        }
      });
  }

  function transferAction(act, id) {
    apiFetch('/api/transfer/' + act, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transfer_id: id }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (!res.data || res.data.ok !== true) {
          showToast((res.data && res.data.error) || T.trActionFail, true);
        }
        loadTransfers(true);
      })
      .catch(function () {
        showToast(T.trActionFail + ' · ' + T.loadFailHint, true);
      });
  }

  transfersView.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!btn) return;
    transferAction(btn.getAttribute('data-act'), btn.getAttribute('data-id'));
  });

  /* ── Favorites ──────────────────────────────────────────────── */

  var favoritesItems = [];
  var favoritesLoading = false;

  function favIcon(f) {
    var content = ((f.content || '') + ' ' + (f.title || '')).trim();
    if (/^https?:\/\//i.test(content)) return '🔗';
    return '📋';
  }

  function favTypeLabel(f) {
    if (/^https?:\/\//i.test((f.content || '').trim()) || /^https?:\/\//i.test((f.title || '').trim())) return T.favTypeLink;
    return T.favTypeText;
  }

  function renderFavorites() {
    // The one-click export only makes sense with something to export.
    favExportBtn.style.display = favoritesItems.length === 0 ? 'none' : 'flex';
    if (favoritesItems.length === 0) {
      favoritesList.innerHTML = '<div class="empty"><div class="empty__icon">⭐</div><div class="empty__text">' + esc(T.favEmpty) + '</div></div>';
      return;
    }
    favoritesList.innerHTML = '';
    favoritesItems.forEach(function (f) {
      var el = document.createElement('div');
      el.className = 'fav-item';
      var title = (f.title || '').trim() || (f.content_preview || '');
      var preview = (f.content || '').trim();
      el.innerHTML =
        '<div class="fav-item__icon">' + favIcon(f) + '</div>' +
        '<div class="fav-item__body">' +
          '<div class="fav-item__title">' + esc(title) + '</div>' +
          (preview ? '<div class="fav-item__preview">' + esc(preview) + '</div>' : '') +
          '<div class="fav-item__meta">' + esc(favTypeLabel(f)) + ' · ' + esc(relTime(f.created)) + '</div>' +
        '</div>' +
        '<button class="f-item__delete" title="' + esc(T.favDelete) + '">✕</button>';
      el.addEventListener('click', function () { favCopy(f); });
      el.querySelector('.f-item__delete').addEventListener('click', function (ev) {
        ev.stopPropagation();
        favDelete(f);
      });
      favoritesList.appendChild(el);
    });
  }

  function loadFavorites(silent) {
    if (favoritesLoading) return;
    favoritesLoading = true;
    if (!silent) favoritesList.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    getJson('/api/favorites')
      .then(function (data) {
        favoritesLoading = false;
        favoritesItems = (data && data.favorites) || [];
        renderFavorites();
      })
      .catch(function (err) {
        favoritesLoading = false;
        if (err && err.status === 403) notifyTokenExpired();
        if (!silent) {
          var msg = (err && err.status === 403) ? esc(T.tokenExpired) : esc(T.loadFail) + '<br>' + esc(T.loadFailHint);
          favoritesList.innerHTML = '<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__text">' + msg + '</div></div>';
        }
      });
  }

  // A favorite is plain text (title + content) — push it to the desktop
  // clipboard via /api/push. paste-rich would need a history entry_id, which
  // a favorite doesn't carry.
  function favCopy(f) {
    var text = ((f.title || '') + '\n' + (f.content || '')).trim();
    if (!text) { showToast(T.favEmpty, true); return; }
    apiFetch('/api/push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok) {
          showToast(T.favCopied);
        } else {
          showToast((res.data && res.data.error) || T.favCopyFail, true);
        }
      })
      .catch(function () {
        showToast(T.favCopyFail + ' · ' + T.loadFailHint, true);
      });
  }

  function favDelete(f) {
    if (!window.confirm(T.favDeleteConfirm)) return;
    apiFetch('/api/favorites', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: f.id }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok !== false) {
          showToast(T.favDeleted);
          loadFavorites(true);
        } else {
          showToast((res.data && res.data.error) || T.favDeleteFail, true);
        }
      })
      .catch(function () {
        showToast(T.favDeleteFail + ' · ' + T.loadFailHint, true);
      });
  }

  // One-click export: ask the desktop to write ALL favorites to a Markdown
  // file (same Downloads location the history export uses) and toast where
  // it landed — handy for moving saved clips off the phone for good.
  favExportBtn.textContent = T.favExport;
  favExportBtn.addEventListener('click', function () {
    if (favExportBusy) return;
    favExportBusy = true;
    favExportBtn.textContent = '...';
    apiFetch('/api/favorites/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ format: 'markdown' }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok) {
          showToast(T.favExportDone.replace('{n}', String((res.data && res.data.count) || 0)));
        } else {
          showToast((res.data && res.data.error) || T.favExportFail, true);
        }
      })
      .catch(function () {
        showToast(T.favExportFail + ' · ' + T.loadFailHint, true);
      })
      .then(function () {
        // Manual reset instead of .finally (older-webview friendly).
        favExportBusy = false;
        favExportBtn.textContent = T.favExport;
      });
  });

  /* ── Settings ───────────────────────────────────────────────── */

  function isLightTheme() {
    try { return localStorage.getItem('clipsync_mobile_theme') === 'light'; }
    catch (e) { return false; }
  }

  function applyTheme() {
    document.body.classList.toggle('light', isLightTheme());
  }

  function themeLabel() {
    return isLightTheme() ? T.setThemeLight : T.setThemeDark;
  }

  function toggleTheme() {
    var light = !isLightTheme();
    try { localStorage.setItem('clipsync_mobile_theme', light ? 'light' : 'dark'); } catch (e) {}
    applyTheme();
    var toggle = document.getElementById('themeToggle');
    if (toggle) toggle.textContent = themeLabel();
  }

  function renderSettings(deviceName, settings) {
    var ver = (settings && (settings.version || settings.app_version)) || '';
    var html = '';
    html += '<div class="set-card">' +
      '<div class="set-row"><span class="set-row__label">' + esc(T.setDeviceName) + '</span><span class="set-row__value">' + esc(deviceName || '—') + '</span></div>';
    if (ver) {
      html += '<div class="set-row"><span class="set-row__label">' + esc(T.setVersion) + '</span><span class="set-row__value">' + esc(ver) + '</span></div>';
    }
    html += '<div class="set-row"><span class="set-row__label">' + esc(T.setWebAddress) + '</span><span class="set-row__value">' + esc(window.location.origin + window.location.pathname) + '</span></div>' +
      '<div class="set-row"><span class="set-row__label">' + esc(T.setLanguage) + '</span><span class="set-row__value">' + esc(ZH ? '中文' : 'English') + '</span></div>' +
    '</div>';
    html += '<div class="set-card">' +
      '<div class="set-row"><span class="set-row__label">' + esc(T.setTheme) + '</span><button class="set-toggle" id="themeToggle">' + esc(themeLabel()) + '</button></div>' +
    '</div>';
    html += '<a class="set-link" href="' + esc(HOST + '/index.html?token=' + encodeURIComponent(TOKEN)) + '">' + esc(T.setFullPanel) + ' →</a>';
    settingsView.innerHTML = html;
    var toggle = document.getElementById('themeToggle');
    if (toggle) toggle.addEventListener('click', toggleTheme);
  }

  function loadSettings(silent) {
    getJson('/api/status')
      .then(function (s) {
        var deviceName = (s && s.device) || '';
        getJson('/api/settings')
          .then(function (s2) {
            var settings = (s2 && s2.settings) || {};
            renderSettings(deviceName || settings.device_name, settings);
          })
          .catch(function () {
            renderSettings(deviceName, {});
          });
      })
      .catch(function (err) {
        if (err && err.status === 403) { notifyTokenExpired(); return; }
        getJson('/api/settings')
          .then(function (s2) {
            var settings = (s2 && s2.settings) || {};
            renderSettings(settings.device_name, settings);
          })
          .catch(function () {
            if (!silent) {
              settingsView.innerHTML = '<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__text">' + esc(T.loadFail) + '<br>' + esc(T.loadFailHint) + '</div></div>';
            }
          });
      });
  }

  /* ── Init ──────────────────────────────────────────────────── */

  applyTheme();
  loadHistory();
  startPolling();

})();
</script>

</body>
</html>
