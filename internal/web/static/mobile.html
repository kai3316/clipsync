<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060D">
<!-- iOS / Android standalone ("Add to Home Screen") metadata. The
     apple-touch-icon points at the token-protected icon endpoint; the token
     is interpolated server-side, and the icon route itself is exempt from
     token auth so a stale-token page still shows an icon. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icon-192.png?token=__TOKEN__">
<link rel="manifest" href="/manifest.json?page=mobile&token=__TOKEN__">
<title>ClipSync</title>
<script>
/* The server injects the app-configured locale here (__CLIPSYNC_I18N_LOCALE__
   becomes e.g. "zh-CN"); the fallback keeps this page valid if it is ever
   served without interpolation. */
try { window.__I18N_LOCALE__ = __CLIPSYNC_I18N_LOCALE__; }
catch (e) { window.__I18N_LOCALE__ = ''; }
/* Same shared locale JSON the dashboard uses (locales/*.json), so dotted keys
   (netpair_*, diag.v2.*, chat.*, ...) can be resolved via jt() below instead
   of duplicating them in the inline T dict. */
try { window.__I18N_JSON__ = __CLIPSYNC_I18N_DATA__; }
catch (e) { window.__I18N_JSON__ = null; }
</script>
<script>
/* Register the service worker so an installed phone page keeps working when
   offline (same as the dashboard).  Fails silently on plain-HTTP LAN access —
   browsers refuse SW registration outside secure contexts; expected. */
try {
  if ('serviceWorker' in navigator) {
    var _tok = (location.search.match(/[?&]token=([^&]+)/) || [])[1] || '';
    navigator.serviceWorker.register('/sw.js?token=' + encodeURIComponent(_tok)).catch(function () {});
  }
} catch (e) {}
</script>
<script>
/* The theme, before the first paint.
   `applyTheme()` runs at the bottom of the page, which is one paint too late: a
   reader who chose the light palette saw the dark one for a frame first, and on
   a phone in daylight that is the frame they noticed.  The class goes on
   `<html>` because `<body>` does not exist up here, which is why the palette
   rules below name `html.light` rather than `body.light`.
   With nothing chosen, the phone's own setting decides: a device set to light
   should not open a dark page, and the toggle in Settings is what overrides it. */
(function () {
  var light = false;
  try {
    var saved = localStorage.getItem('clipsync_mobile_theme');
    light = saved ? saved === 'light'
      : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
  } catch (e) {}
  if (light) {
    document.documentElement.classList.add('light');
    /* The status bar's tint is part of the same frame: the meta above says the
       dark value, and on a light page a dark status bar is a strip of the wrong
       palette above the header.  `applyTheme()` writes the same value later. */
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', '#E9EDF5');
  }
})();
</script>
<style>
/* ═══════════════════════════════════════════════════════════════════
   ClipSync Mobile — phone companion
   Three tabs: clipboard history / send text / file transfer.
   Tokens mirror css/theme.css for a consistent look on a small screen.
   ═══════════════════════════════════════════════════════════════════ */

:root {
  --bg: #06080D;
  --surface: #0C1020;
  --panel: #111827;
  --panel-2: #161E32;
  --fg: #E8EDF5;
  --fg-muted: #8899B4;
  --fg-subtle: #556680;
  --accent: #22D3EE;
  --accent-2: #A78BFA;
  --accent-glow: rgba(34,211,238,0.15);
  --accent-glow-strong: rgba(34,211,238,0.30);
  --violet-glow: rgba(167,139,250,0.16);
  --pink-glow: rgba(244,114,182,0.14);
  --success: #00E599;
  --danger: #FF4060;
  --border: rgba(100,140,200,0.08);
  --border-strong: rgba(100,140,200,0.16);
  --mark: rgba(34,211,238,0.26);
  --radius: 12px;
  --radius-sm: 8px;
  --font: "SF Pro Display", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", "Fira Code", monospace;
  --spring: 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --fast: 120ms cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  overscroll-behavior: none;
  display: flex;
  flex-direction: column;
}

/* ── Aurora wash ─────────────────────────────────────────────── */

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse 60% 45% at 12% -10%, var(--violet-glow), transparent),
    radial-gradient(ellipse 60% 45% at 88% -10%, var(--pink-glow), transparent),
    radial-gradient(ellipse 80% 55% at 50% -20%, var(--accent-glow), transparent);
  /* Static wash — the drift animation is removed on mobile to save battery
     (a phone repaints the full-screen fixed layer every frame for 18s loops). */
}

.app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }

/* ── Header ─────────────────────────────────────────────────── */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(10,14,30,0.6), rgba(10,14,30,0.3));
  backdrop-filter: blur(18px) saturate(170%);
  -webkit-backdrop-filter: blur(18px) saturate(170%);
}

.header__left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.header__title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.2;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header__sub {
  font-size: 0.7500rem;
  color: var(--fg-muted);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 60vw;
}

/* ── Tab bar ────────────────────────────────────────────────── */

.tabs {
  display: flex;
  gap: 4px;
  margin: 10px 12px 4px;
  background: rgba(12,16,32,0.6);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px;
  flex-shrink: 0;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  /* Seven tabs won't fit a phone width — keep them at a usable size and
     scroll the bar horizontally instead of crushing them. */
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  flex-wrap: nowrap;
}

.tabs::-webkit-scrollbar { display: none; }

/* A bar that scrolls with nothing saying so reads as a bar that is broken:
   the tab at the edge is cut mid-word and there is no cue that the rest of
   it exists.  The fades are the cue — an edge with more content past it
   dissolves as it leaves, and stops fading once it is the end. */
.tabs--more-right {
  -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 28px), transparent 100%);
  mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 28px), transparent 100%);
}

.tabs--more-left {
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 28px, #000 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 28px, #000 100%);
}

.tabs--more-left.tabs--more-right {
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%);
}

@media (prefers-reduced-motion: no-preference) {
  .tabs { scroll-behavior: smooth; }
}

.tab {
  flex: 1 0 auto;
  min-width: 76px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 12px;
  min-height: 44px; /* ≥44px touch target */
  border-radius: 10px;
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--fg-muted);
  border: none;
  background: transparent;
  font-family: var(--font);
  cursor: pointer;
  transition: all var(--fast);
  -webkit-tap-highlight-color: transparent;
}

.tab--active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  box-shadow: 0 2px 12px var(--accent-glow-strong);
}

/* ── Content ────────────────────────────────────────────────── */

.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
  /* The pull gesture lives at the top of this box; letting the overscroll
     chain out to the page makes iOS bounce the whole body under the chip. */
  overscroll-behavior-y: contain;
}

/* ── Pull to refresh ────────────────────────────────────────── */

/* Zero height on purpose: the chip hangs below its own box, over the first row,
   so the list does not move while the finger does.  Nothing here is reachable
   by pointer — the gesture is the whole surface. */
.pull {
  position: relative;
  height: 0;
  text-align: center;
  pointer-events: none;
}

.pull__pill {
  position: relative;
  z-index: 3;
  display: inline-block;
  margin-top: 6px;
  padding: 5px 14px;
  font-size: 0.75rem;
  line-height: 1.4;
  color: var(--fg-muted);
  /* Float, don't sit: the chip covers the first row of the list, so it needs
     its own surface and a shadow to read as a thing on top of the page. */
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
  opacity: 0;
  transform: translateY(-40px);
  /* Only the return trip animates.  A transition on `transform` while the
     finger is down makes the chip lag behind the touch it is reporting. */
  transition: transform 180ms ease, opacity 120ms ease;
}

.pull--busy .pull__pill { color: var(--accent); border-color: var(--accent); }

.panel { display: none; }
.panel--active { display: block; }

/* ── History items ──────────────────────────────────────────── */

.h-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(12,16,32,0.8), rgba(17,24,39,0.8));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  cursor: pointer;
  transition: all var(--spring);
  margin-bottom: 8px;
}

.h-item:active {
  border-color: var(--accent);
  transform: scale(0.99);
}

.h-item__icon {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  background: var(--panel);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}

.h-item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }

.h-item__text {
  font-size: 0.8750rem;
  line-height: 1.4;
  color: var(--fg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  /* The page opts out of selection so it behaves like an app — but the text of
     a clip is exactly what a reader might want half of: a path, a token, one
     line of a paragraph.  Copying the whole row was the only way to get any of
     it, and the native long-press callout is restored with it. */
  -webkit-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}

.h-item__meta {
  font-size: 0.7500rem;
  color: var(--fg-subtle);
  font-family: var(--font-mono);
}

/* The source is a control, not a label.  The row already knows which
   machine it came from, so "only that machine" is a tap on the name
   rather than a search the reader has to spell out. */
.h-item__source {
  font: inherit;
  color: var(--accent);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-decoration: underline dotted;
  text-underline-offset: 2px;
}
/* The filter it is already applying: still tappable (a second tap is a
   no-op), but no longer offering to do something it has done. */
.h-item__source[aria-pressed="true"] {
  color: var(--fg-muted);
  text-decoration: none;
}

/* An image row shows the picture.  In the list every screenshot was the
   same 🖼, which made the most recognisable clips the least. */
.h-item__icon--thumb {
  width: 44px;
  height: 44px;
  padding: 0;
  overflow: hidden;
}
.h-item__thumb {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Tidy-up used to mean opening the clip first, because pin and delete
   live inside the detail sheet — which covers the list.  The row's own
   menu is one tap from the row. */
.h-item__more {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  margin: -8px -8px -8px 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--fg-subtle);
  font-size: 1.1250rem;
  line-height: 1;
  cursor: pointer;
}
.h-item__more:active { background: var(--panel-2); color: var(--fg); }

/* A filter the reader cannot see is a filter they cannot turn off. */
.hist-source {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 10px;
  padding: 7px 8px 7px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--panel);
  font-size: 0.7500rem;
  font-family: var(--font-mono);
  color: var(--fg-muted);
}
.hist-source__text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hist-source__clear {
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  border: 0;
  border-radius: 50%;
  background: var(--panel-2);
  color: var(--fg);
  font-size: 0.8750rem;
  line-height: 1;
  cursor: pointer;
}

/* A searched row says why it survived.  A highlighter pen rather than a badge:
   the words stay where they were read, and the colour is a wash the text sits
   on, so a row of matches does not turn into a row of labels. */
.h-item__text mark,
.fav-item__title mark,
.fav-item__preview mark {
  background: var(--mark);
  color: inherit;
  border-radius: 3px;
  padding: 0 1px;
}

/* ── Send panel ─────────────────────────────────────────────── */

.send-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(12,16,32,0.8), rgba(17,24,39,0.8));
  padding: 14px;
}

.send-card textarea {
  width: 100%;
  min-height: 140px;
  resize: none;
  background: var(--panel);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  /* ≥16px so iOS Safari does not auto-zoom when the field is focused. */
  font-size: 16px;
  font-family: var(--font);
  line-height: 1.5;
  outline: none;
  -webkit-user-select: text;
  user-select: text;
  transition: border-color var(--fast);
}

.send-card textarea:focus { border-color: var(--accent); }

/* The one button beside the box.  Right-aligned and quiet: it is a shortcut for
   something the textarea already does with a long press, so it should not read
   as the primary action — 发送 below it is. */
.send-tools { display: flex; justify-content: flex-end; margin-top: 8px; }

.paste-btn {
  padding: 8px 14px;
  min-height: 36px;
  border: 1px solid var(--border-strong);
  border-radius: 18px;
  background: var(--panel-2);
  color: var(--fg-muted);
  font: inherit;
  font-size: 0.7500rem;
  font-weight: 600;
}

.paste-btn:active { transform: scale(0.97); }

.send-btn {
  width: 100%;
  margin-top: 12px;
  padding: 14px 0;
  border: none;
  border-radius: var(--radius);
  font-size: 0.9375rem;
  font-weight: 700;
  font-family: var(--font);
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  cursor: pointer;
  box-shadow: 0 4px 16px var(--accent-glow-strong);
  transition: all var(--fast);
  -webkit-tap-highlight-color: transparent;
}

.send-btn:active { transform: scale(0.98); }
.send-btn:disabled { opacity: 0.5; }

.send-hint { font-size: 0.7500rem; color: var(--fg-muted); margin-top: 10px; line-height: 1.5; }

/* ── Files panel ────────────────────────────────────────────── */

.upload-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 14px 0;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  background: rgba(12,16,32,0.6);
  color: var(--fg);
  font-size: 0.8750rem;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  margin-bottom: 12px;
  transition: all var(--fast);
  -webkit-tap-highlight-color: transparent;
}

.upload-btn:active { border-color: var(--accent); color: var(--accent); }
.fav-export {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 12px 0;
  margin-bottom: 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: rgba(12,16,32,0.6);
  color: var(--fg);
  font-size: 0.8125rem;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.fav-export:active { border-color: var(--accent); color: var(--accent); }

.f-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(12,16,32,0.8), rgba(17,24,39,0.8));
  margin-bottom: 8px;
  cursor: pointer;
  transition: all var(--spring);
}

.f-item:active { border-color: var(--accent); transform: scale(0.99); }

.f-item__icon {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  background: var(--panel);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}

.f-item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }

.f-item__name {
  font-size: 0.8750rem;
  color: var(--fg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.f-item__meta { font-size: 0.7500rem; color: var(--fg-subtle); font-family: var(--font-mono); }

.f-item__delete,
.f-item__edit {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--panel);
  color: var(--fg-subtle);
  font-size: 0.8125rem;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}

.f-item__delete:active { border-color: var(--danger); color: var(--danger); }
.f-item__edit:active { border-color: var(--accent); color: var(--accent); }

/* ── Upload progress ───────────────────────────────────────── */

.upload-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.upload-progress__bar {
  flex: 1;
  height: 8px;
  border-radius: 4px;
  background: var(--panel);
  border: 1px solid var(--border);
  overflow: hidden;
}

.upload-progress__fill {
  height: 100%;
  width: 0%;
  border-radius: 4px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  transition: width var(--fast);
}

.upload-progress__cancel {
  flex-shrink: 0;
  min-height: 44px;
  padding: 10px 14px;
  font-size: 0.7500rem;
  font-weight: 600;
  font-family: var(--font);
  color: var(--fg-muted);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--fast);
  -webkit-tap-highlight-color: transparent;
}

.upload-progress__cancel:active { border-color: var(--danger); color: var(--danger); }

/* What the batch did.  A toast is gone in three seconds, and this one carries
   an action — the failed files are still in hand, so "retry" is the only useful
   thing to say about them. */
.upload-result {
  margin-bottom: 12px;
  padding: 10px 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}

.upload-result__text {
  margin: 0 0 10px;
  font-size: 0.8125rem;
  line-height: 1.5;
  color: var(--fg-muted);
  overflow-wrap: anywhere;
}

.upload-result__actions {
  display: flex;
  gap: 8px;
}

.upload-result__retry,
.upload-result__dismiss {
  flex: 1;
  min-height: 44px;
  padding: 10px 14px;
  font-size: 0.75rem;
  font-weight: 600;
  font-family: var(--font);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--fast);
  -webkit-tap-highlight-color: transparent;
}

.upload-result__retry {
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--accent);
}

.upload-result__retry:active { background: var(--accent); color: var(--panel); }

.upload-result__dismiss {
  color: var(--fg-muted);
  background: var(--panel);
  border: 1px solid var(--border);
}

/* ── Light theme ────────────────────────────────────────────── */
/* The :root variables above are the dark look (default). A phone-side
   `html.light` class swaps only the palette tokens; the layout stays. */

html.light {
  --bg: #E9EDF5;
  --surface: #FFFFFF;
  --panel: #F2F5FB;
  --panel-2: #E3E9F4;
  --fg: #18233A;
  --fg-muted: #46536E;
  --fg-subtle: #72809C;
  --accent: #0E7490;
  --accent-2: #7C3AED;
  --accent-glow: rgba(14,116,144,0.16);
  --accent-glow-strong: rgba(14,116,144,0.30);
  --violet-glow: rgba(124,58,237,0.14);
  --pink-glow: rgba(219,39,119,0.12);
  --success: #047857;
  --danger: #BE123C;
  --border: rgba(30,50,90,0.10);
  --border-strong: rgba(30,50,90,0.18);
  --mark: rgba(250,204,21,0.45);
}

html.light .header {
  background: linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.45));
}

html.light .tabs { background: rgba(255,255,255,0.72); }

/* ── Chat ───────────────────────────────────────────────────── */

.chat-hdr {
  font-size: 0.7500rem;
  font-weight: 700;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin: 14px 2px 8px;
}

.chat-device, .chat-session {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(12,16,32,0.8), rgba(17,24,39,0.8));
  margin-bottom: 8px;
}

html.light .chat-device,
html.light .chat-session,
html.light .tr-item,
html.light .fav-item,
html.light .set-card,
html.light .h-item,
html.light .f-item,
html.light .send-card,
html.light .fav-export,
html.light .upload-btn {
  background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(240,244,251,0.92));
}

.chat-device { cursor: default; }
/* A filtered-out row is `hidden`, and `display: flex` above would keep it on
   screen: the attribute is a UA rule and the class wins over it.  See U114. */
.chat-device[hidden] { display: none; }
/* The device filter, above the chat list.  It only exists when there are more
   than six devices, so it is drawn at the density of the header rows around it
   rather than as a search box the page is built around. */
.chat-filter { padding: 4px 0 2px; }
.chat-filter input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--panel);
  color: var(--fg);
  /* ≥16px so iOS Safari does not zoom the page when the field is focused. */
  font: inherit;
  font-size: 16px;
  outline: none;
}
.chat-filter input:focus { border-color: var(--accent); }
.chat-filter__empty { margin: 6px 2px 0; color: var(--fg-muted); font-size: 0.7500rem; }
.chat-session { cursor: pointer; transition: all var(--spring); }
.chat-session:active { border-color: var(--accent); transform: scale(0.99); }

.chat-device__info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.chat-device__name { font-size: 0.8750rem; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-device__badge { font-size: 0.7500rem; font-weight: 600; color: var(--fg-subtle); }
.chat-device__badge--on { color: var(--success); }

.chat-session__dot { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--fg-subtle); }
.chat-session__dot--on { background: var(--success); box-shadow: 0 0 8px rgba(0,229,153,0.5); }

.chat-session__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.chat-session__top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.chat-session__name { font-size: 0.8750rem; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-session__status { flex-shrink: 0; font-size: 0.7500rem; font-weight: 600; padding: 2px 7px; border-radius: 20px; background: var(--panel); border: 1px solid var(--border); color: var(--fg-muted); }
.chat-session__status--ok { color: var(--success); border-color: rgba(0,229,153,0.35); }
.chat-session__status--warn { color: #FBBF24; border-color: rgba(251,191,36,0.35); }
.chat-session__status--err { color: var(--danger); border-color: rgba(255,64,96,0.35); }
.chat-session__preview { font-size: 0.7500rem; color: var(--fg-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-session__badge { flex-shrink: 0; min-width: 18px; height: 18px; line-height: 18px; text-align: center; font-size: 0.7500rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-radius: 9px; padding: 0 5px; }

.chat-btn {
  flex-shrink: 0;
  min-height: 44px;
  padding: 8px 14px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.8125rem;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  transition: all var(--fast);
  -webkit-tap-highlight-color: transparent;
}
.chat-btn--accent { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.chat-btn--ghost { color: var(--fg-muted); background: var(--panel); border: 1px solid var(--border); }
.chat-btn--danger { color: #fff; background: linear-gradient(135deg, var(--danger), #ff6b6b); }
.chat-btn:active { transform: scale(0.97); }
.chat-btn:disabled { opacity: 0.5; }

/* Conversation */
.chat-conv__hdr { display: flex; align-items: center; gap: 8px; padding: 6px 0 10px; }
.chat-conv__name { flex: 1; min-width: 0; font-size: 0.9375rem; font-weight: 700; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-conv__status { font-size: 0.7500rem; color: var(--fg-subtle); }

.chat-invite-banner {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid rgba(251,191,36,0.35);
  background: rgba(251,191,36,0.10);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  font-size: 0.7500rem;
  color: var(--fg);
}
.chat-invite-banner__name { font-weight: 700; }

.chat-conv__msgs {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 4px 0 8px;
  -webkit-user-select: text;
  user-select: text;
  /* Let iOS show the native long-press callout (copy/lookup) on messages —
     the body-level -webkit-touch-callout:none must not suppress it here. */
  -webkit-touch-callout: default;
}

.chat-msg-row { display: flex; flex-direction: column; }

.chat-system {
  align-self: center;
  text-align: center;
  font-size: 0.7500rem;
  color: var(--fg-subtle);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 5px 12px;
  max-width: 88%;
}

.chat-bubble {
  align-self: flex-start;
  max-width: 80%;
  padding: 10px 13px;
  border-radius: 16px 16px 16px 4px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  font-size: 0.8750rem;
  line-height: 1.45;
  color: var(--fg);
  word-break: break-word;
}
.chat-bubble--out {
  align-self: flex-end;
  border-radius: 16px 16px 4px 16px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  border-color: transparent;
}
.chat-bubble__meta { margin-top: 3px; font-size: 0.7500rem; opacity: 0.7; text-align: right; }
/* Failed outgoing text: red edge + label so a delivery failure is visible
   (text bubbles never rendered status before). */
.chat-bubble--failed { border-color: var(--danger); }
.chat-bubble__failed { color: #ff8a8f; font-weight: 700; margin-right: 5px; opacity: 1; }
.chat-bubble__retry {
  display: inline-block;
  margin-right: 5px;
  padding: 0 6px;
  font-size: 0.7500rem;
  line-height: 16px;
  font-family: inherit;
  color: inherit;
  background: transparent;
  border: 1px solid currentColor;
  border-radius: 9px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.chat-bubble__retry:disabled { opacity: 0.45; }

.chat-bubble__copy {
  display: inline-block;
  margin-right: 5px;
  padding: 0 6px;
  font-size: 0.7500rem;
  line-height: 16px;
  font-family: inherit;
  color: inherit;
  background: transparent;
  border: 1px solid currentColor;
  border-radius: 9px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.chat-bubble__copy:active { opacity: 0.6; }

.chat-file {
  align-self: flex-start;
  max-width: 88%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--panel);
}
.chat-file--out { align-self: flex-end; }
.chat-file__icon { flex-shrink: 0; font-size: 20px; }
.chat-file__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.chat-file__name { font-size: 0.8125rem; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-file__meta { font-size: 0.7500rem; color: var(--fg-subtle); }
.chat-file__status { color: var(--fg-muted); }
.chat-file__actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }

.chat-action-btn {
  min-height: 44px;
  padding: 6px 12px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.7500rem;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}
.chat-action-btn--accept { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.chat-action-btn--decline { color: var(--fg-muted); background: var(--panel); border: 1px solid var(--border); }
.chat-action-btn--danger { color: #fff; background: linear-gradient(135deg, var(--danger), #ff6b6b); }
.chat-action-btn:active { transform: scale(0.97); }
.chat-action-btn:disabled { opacity: 0.5; }

.chat-composer {
  position: sticky;
  bottom: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0 2px;
  background: var(--bg);
}
.chat-composer__input {
  flex: 1;
  min-width: 0;
  min-height: 42px;
  padding: 10px 12px;
  background: var(--panel);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 16px;
  font-family: var(--font);
  outline: none;
  -webkit-user-select: text;
  user-select: text;
  transition: border-color var(--fast);
}
.chat-composer__input:focus { border-color: var(--accent); }
.chat-composer__send {
  flex-shrink: 0;
  min-height: 44px;
  padding: 0 18px;
  border: none;
  border-radius: 21px;
  font-size: 0.8750rem;
  font-weight: 700;
  font-family: var(--font);
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.chat-composer__send:active { transform: scale(0.97); }

.chat-typing {
  padding: 0 6px 6px;
  font-size: 0.7500rem;
  color: var(--fg-subtle);
  font-style: italic;
  animation: csTypingFade 1.4s ease-in-out infinite;
}
@keyframes csTypingFade { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

/* ── Transfers ───────────────────────────────────────────────── */

.tr-section { margin-bottom: 6px; }

.tr-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(12,16,32,0.8), rgba(17,24,39,0.8));
  margin-bottom: 8px;
}

.tr-item__icon {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.tr-item__icon--up { color: var(--accent); background: var(--accent-glow); }
.tr-item__icon--down { color: var(--accent-2); background: var(--violet-glow); }

.tr-item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tr-item__name { font-size: 0.8125rem; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-item__meta { font-size: 0.7500rem; color: var(--fg-subtle); font-family: var(--font-mono); }
.tr-item__bar { height: 6px; border-radius: 3px; background: var(--panel); border: 1px solid var(--border); overflow: hidden; }
.tr-item__fill { height: 100%; border-radius: 3px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); transition: width var(--fast); }
.tr-item__speed { font-size: 0.7500rem; color: var(--fg-subtle); font-family: var(--font-mono); }
.tr-item__actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }

.tr-btn {
  min-height: 44px;
  padding: 7px 13px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.7500rem;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}
.tr-btn--ok { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.tr-btn--bad { color: #fff; background: linear-gradient(135deg, var(--danger), #ff6b6b); }
.tr-btn--warn { color: var(--fg); background: var(--panel); border: 1px solid var(--border); }
.tr-btn:active { transform: scale(0.97); }

.tr-hitem {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--panel);
  margin-bottom: 8px;
}
.tr-hitem__icon {
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8125rem;
  font-weight: 700;
  border-radius: 50%;
  border: 1px solid var(--border);
}
.tr-hitem__icon--ok { color: var(--success); border-color: rgba(0,229,153,0.35); }
.tr-hitem__icon--err { color: var(--danger); border-color: rgba(255,64,96,0.35); }
.tr-hitem__icon--warn { color: #FBBF24; border-color: rgba(251,191,36,0.35); }
.tr-hitem__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.tr-hitem__name { font-size: 0.8125rem; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-hitem__meta { font-size: 0.7500rem; color: var(--fg-subtle); font-family: var(--font-mono); }

/* ── Favorites ───────────────────────────────────────────────── */

.fav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(12,16,32,0.8), rgba(17,24,39,0.8));
  margin-bottom: 8px;
  cursor: pointer;
  transition: all var(--spring);
}
.fav-item:active { border-color: var(--accent); transform: scale(0.99); }

.fav-item__icon {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  background: var(--panel);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.fav-item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.fav-item__title { font-size: 0.8750rem; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fav-item__preview { font-size: 0.7500rem; color: var(--fg-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fav-item__meta { font-size: 0.7500rem; color: var(--fg-subtle); font-family: var(--font-mono); }

/* ── History search + kind chips ────────────────────────────── */

.hist-tools, .fav-tools { margin-bottom: 10px; }

/* ── Relay status (remote mode) ─────────────────────────────── */

.relay-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 12px 8px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(251,191,36,0.35);
  background: rgba(251,191,36,0.12);
  color: #FBBF24;
  font-size: 0.7500rem;
  font-weight: 500;
  line-height: 1.45;
}
/* Add to home screen: an offer, not a notice — it sits in the same strip as
   the relay bar and is the same shape, but it can be put away for good. */
.install-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 12px 8px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--panel);
  color: var(--fg-muted);
  font-size: 0.7500rem;
  line-height: 1.45;
}
.install-bar__text { flex: 1; min-width: 0; }
.install-bar__btn {
  flex-shrink: 0;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #06231E;
  font-size: 0.7500rem;
  font-weight: 600;
}
.install-bar__close {
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  border: 0;
  background: none;
  color: var(--fg-muted);
  font-size: 16px;
  line-height: 1;
}
.relay-bar--ok {
  border-color: rgba(0,229,153,0.35);
  background: rgba(0,229,153,0.12);
  color: var(--success);
}
.relay-bar__spinner {
  flex-shrink: 0;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid currentColor;
  border-top-color: transparent;
  animation: relay-spin 900ms linear infinite;
}
@keyframes relay-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .relay-bar__spinner { animation: none; opacity: 0.7; }
}

.search-field {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--panel);
  transition: border-color var(--fast);
}
.search-field:focus-within { border-color: var(--accent); }

.search-field__icon { font-size: 0.8125rem; opacity: 0.7; flex-shrink: 0; }

.search-field input {
  flex: 1;
  min-width: 0;
  min-height: 44px;
  border: 0;
  background: none;
  color: var(--fg);
  /* ≥16px so iOS Safari does not auto-zoom when the field is focused. */
  font-size: 16px;
  font-family: var(--font);
  outline: none;
  -webkit-user-select: text;
  /* The platform's own search-field chrome (WebKit's cancel button) is
     replaced by .search-field__clear so both platforms look the same. */
  -webkit-appearance: none;
  appearance: none;
}
.search-field input::-webkit-search-cancel-button { display: none; }
.search-field input::placeholder { color: var(--fg-subtle); }

.search-field__clear {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 50%;
  background: var(--panel-2);
  color: var(--fg-muted);
  font-size: 17px;
  line-height: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.search-field__clear[hidden] { display: none; }

.chip-rail {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  overflow-x: auto;
  /* Horizontal chip rail: no wrap, no scrollbar, and the last chip keeps its
     full padding instead of being clipped by the scroll container. */
  padding-bottom: 2px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.chip-rail::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 34px;
  padding: 5px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 17px;
  background: var(--panel);
  color: var(--fg-muted);
  font-size: 0.7500rem;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}
.chip--active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-glow);
}
.chip:disabled { opacity: 0.4; cursor: default; }
.chip__count {
  font-family: var(--font-mono);
  font-size: 0.7500rem;
  color: var(--fg-subtle);
}
.chip--active .chip__count { color: var(--accent); opacity: 0.8; }
.chip--sort { margin-left: auto; }

/* ── Item modal: per-item utility row ───────────────────────── */

.modal__utils {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.modal__util {
  flex: 1;
  min-height: 42px;
  padding: 9px 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--panel);
  color: var(--fg);
  font-size: 0.7500rem;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  /* Four of these share one row on a phone, so a label has to stay on one
     line: wrapped, the shortest button becomes the tallest thing in the sheet
     and the row changes height between clips. */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: all var(--fast);
}
.modal__util:active { border-color: var(--accent); }
.modal__util--danger { color: var(--danger); }
.modal__util--danger:active { border-color: var(--danger); background: rgba(255,64,96,0.08); }
.modal__util:disabled { opacity: 0.45; }

/* The open button's label is fixed at two characters ("打开"), while the pin
   one flips to "取消置顶" on a clip that is already pinned — four.  Sharing the
   row in equal parts would ellipsise the long label on a 320 px screen, so
   this button takes just its own width and the other three split the rest. */
#histOpenBtn {
  flex: 0 0 auto;
  padding-left: 10px;
  padding-right: 10px;
}

.modal__actions + .modal__actions { margin-top: 8px; }

/* ── Transfers: section header row + retry ──────────────────── */

.tr-hdrrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.tr-cancelall {
  min-height: 44px;
  padding: 6px 13px;
  border: 1px solid rgba(255,64,96,0.35);
  border-radius: 17px;
  background: var(--panel);
  color: var(--danger);
  font-size: 0.7500rem;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}
.tr-cancelall:active { background: rgba(255,64,96,0.10); }
.tr-cancelall:disabled { opacity: 0.5; }

.tr-hitem__retry {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(251,191,36,0.4);
  border-radius: 50%;
  background: var(--panel);
  color: #FBBF24;
  font-size: 0.9375rem;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}
.tr-hitem__retry:active { transform: scale(0.95); }
.tr-hitem__retry:disabled { opacity: 0.5; }

/* ── Chat: mute bell / close / attach ───────────────────────── */

.chat-bell {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 50%;
  background: transparent;
  font-size: 16px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--fast);
}
.chat-bell:active { background: var(--panel); }

.chat-btn--dangerghost {
  color: var(--danger);
  background: transparent;
  border: 1px solid rgba(255,64,96,0.35);
}

.chat-composer__attach {
  flex-shrink: 0;
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--panel);
  color: var(--fg);
  font-size: 17px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}
.chat-composer__attach:active { transform: scale(0.95); border-color: var(--accent); }
.chat-composer__attach:disabled { opacity: 0.5; }

/* ── Diagnostics card (settings tab) ────────────────────────── */

.diag-intro { font-size: 0.7500rem; color: var(--fg-muted); line-height: 1.55; padding: 10px 0 6px; }

.diag-run {
  width: 100%;
  min-height: 42px;
  margin-bottom: 6px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.8750rem;
  font-weight: 700;
  font-family: var(--font);
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.diag-run:active { transform: scale(0.98); }
.diag-run:disabled { opacity: 0.6; }

.diag-check {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 9px 0;
  border-top: 1px solid var(--border);
}
.diag-check:first-child { border-top: none; }

.diag-check__status {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 0.7500rem;
  font-weight: 700;
  background: var(--panel);
  color: var(--fg-subtle);
}
.diag-check__status--ok { color: var(--success); background: rgba(0,229,153,0.12); }
.diag-check__status--bad { color: var(--danger); background: rgba(255,64,96,0.12); }

.diag-check__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.diag-check__label { font-size: 0.8125rem; font-weight: 600; color: var(--fg); }
.diag-check__detail { font-size: 0.7500rem; color: var(--fg-subtle); word-break: break-word; }
.diag-check__guidance { font-size: 0.7500rem; color: var(--fg-muted); line-height: 1.45; word-break: break-word; }

.diag-fix {
  align-self: flex-start;
  min-height: 30px;
  margin-top: 4px;
  padding: 4px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 15px;
  background: var(--panel);
  color: var(--accent);
  font-size: 0.7500rem;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.diag-fix:disabled { opacity: 0.5; }

/* A repair that is a command rather than a button: this page cannot run one,
   so it offers the only thing it can — the line itself, selectable by hand and
   copyable in one tap.  See U192. */
.diag-cmd { display: grid; gap: 6px; margin-top: 6px; }
.diag-cmd__label { font-size: 0.7500rem; color: var(--fg-subtle); }
.diag-cmd__text {
  display: block;
  padding: 8px 10px;
  font-family: var(--font-mono);
  font-size: 0.7500rem;
  line-height: 1.5;
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  /* Breaks at spaces first and only inside a word when there is no other way:
     a command split mid-token is still copyable, but it reads as a mistake. */
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  /* Selectable even when the clipboard API is not there: plain-HTTP LAN access
     is not a secure context, and that is the common case for this page. */
  -webkit-user-select: text;
  user-select: text;
}
/* The button under it is the width of its words, not of the card: it is one
   action on one line, and a full-width box would read as the block's primary
   control.  In a grid the inline axis is `justify-self`, not `align-self`. */
.diag-cmd .diag-copy { justify-self: start; }

.diag-summary {
  margin-top: 8px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.7500rem;
  font-weight: 700;
  text-align: center;
  background: var(--panel);
  color: var(--fg-muted);
}
.diag-summary--ok { color: var(--success); background: rgba(0,229,153,0.10); }
.diag-summary--warn { color: #FBBF24; background: rgba(251,191,36,0.10); }
.diag-summary--fail { color: var(--danger); background: rgba(255,64,96,0.10); }

/* ── Settings ───────────────────────────────────────────────── */

.set-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(12,16,32,0.8), rgba(17,24,39,0.8));
  padding: 4px 14px;
  margin-bottom: 12px;
}

.set-card--danger { border-color: rgba(255,64,96,0.35); }
.set-card--danger .chat-hdr { color: var(--danger); }
.set-danger {
  width: 100%;
  min-height: 44px;
  margin: 4px 0 10px;
  border: 1px solid var(--danger);
  border-radius: 18px;
  background: rgba(255,64,96,0.08);
  color: var(--danger);
  font-family: var(--font);
  font-size: 0.8125rem;
  font-weight: 700;
  cursor: pointer;
}
.set-danger:active { background: rgba(255,64,96,0.16); }
.set-danger:disabled { opacity: 0.5; }

.set-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.8750rem;
}
.set-row:last-child { border-bottom: none; }
.set-row__label { color: var(--fg); font-weight: 600; flex-shrink: 0; }
.set-row__value { color: var(--fg-muted); text-align: right; min-width: 0; word-break: break-all; }

.set-toggle {
  min-height: 44px;
  padding: 7px 16px;
  border: none;
  border-radius: 18px;
  font-size: 0.8125rem;
  font-weight: 700;
  font-family: var(--font);
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* ── Empty / loading ────────────────────────────────────────── */

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 48px 20px;
  text-align: center;
}

.empty__icon { font-size: 34px; opacity: 0.45; }
.empty__text { font-size: 0.8125rem; color: var(--fg-muted); font-weight: 500; }
.empty__hint { font-size: 0.7500rem; color: var(--fg-subtle); font-weight: 400; }

.skeleton {
  height: 52px;
  border-radius: var(--radius);
  background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 40%, var(--panel) 80%);
  background-size: 200% 100%;
  margin-bottom: 8px;
  animation: mShimmer 1.6s ease-in-out infinite;
}

@keyframes mShimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ── Item detail modal ──────────────────────────────────────── */

.modal-mask {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(4,6,10,0.7);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--fast);
}

.modal-mask--show { opacity: 1; pointer-events: auto; }

.modal {
  width: 100%;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform var(--spring);
}

.modal-mask--show .modal { transform: translateY(0); }
/* The box takes focus so the title is read before the buttons, and a ring round
   the whole sheet would be the browser saying "this element is focused" about
   something that is not a control. */
.modal:focus { outline: none; }

.modal__title { font-size: 0.8125rem; font-weight: 700; color: var(--fg-muted); margin-bottom: 10px; }

.modal__text {
  font-size: 0.9375rem;
  line-height: 1.6;
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  max-height: 46vh;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-word;
  -webkit-user-select: text;
  user-select: text;
}

/* The rename sheet's two fields.  A label above its input rather than beside
   it: both values can be a whole line long, and an inline label on a 390px
   screen leaves the input too narrow to see what is being edited. */
.fav-edit__field { display: block; margin-bottom: 12px; }
.fav-edit__field > span { display: block; margin-bottom: 5px; font-size: 0.7500rem; color: var(--fg-subtle); }
.fav-edit__field input {
  width: 100%;
  box-sizing: border-box;
  padding: 11px 12px;
  font-family: var(--font);
  font-size: 0.9375rem;
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  -webkit-appearance: none;
  appearance: none;
}
.fav-edit__field input:focus { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: -1px; }

.modal__image {
  width: 100%;
  max-height: 40vh;
  object-fit: contain;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--panel);
  cursor: zoom-in;
  transition: max-height var(--fast);
}

.modal__image--zoomed {
  max-height: 74vh;
  cursor: zoom-out;
}

.modal__actions { display: flex; gap: 10px; margin-top: 14px; }

.modal__btn {
  flex: 1;
  padding: 13px 0;
  border: none;
  border-radius: var(--radius);
  font-size: 0.8750rem;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  transition: all var(--fast);
  -webkit-tap-highlight-color: transparent;
}

.modal__btn--primary { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.modal__btn--ghost { color: var(--fg-muted); background: var(--panel); border: 1px solid var(--border); }
.modal__btn:active { transform: scale(0.97); }

/* The row menu: one action per line, because these read as a list of
   verbs rather than as a choice of two. */
.modal--menu .modal__btn {
  flex: 0 0 auto;
  width: 100%;
  padding: 13px 14px;
  text-align: left;
}
.modal--menu .modal__btn + .modal__btn { margin-top: 8px; }
/* One line, whatever the clip is: the sheet's height should follow the
   actions, not the length of the first line of a paragraph. */
.modal--menu .modal__title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.modal--menu .modal__btn--danger { color: var(--danger); }

/* ── Toast ──────────────────────────────────────────────────── */

.toast {
  position: fixed;
  bottom: calc(24px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  padding: 10px 20px;
  background: color-mix(in srgb, var(--surface) 86%, var(--accent) 14%);
  color: var(--fg);
  border: 1px solid var(--accent);
  border-radius: 24px;
  font-size: 0.8125rem;
  font-weight: 600;
  box-shadow: 0 8px 28px rgba(5,6,13,0.5), 0 0 0 1px var(--accent-glow-strong);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--fast);
  /* Long server error strings must wrap instead of truncating. */
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: break-word;
  text-align: center;
  max-width: 88vw;
}

.toast--show { opacity: 1; }

.toast--error {
  background: color-mix(in srgb, var(--surface) 86%, var(--danger) 14%);
  border-color: var(--danger);
}

/* ── The dead end a stale token leads to ────────────────────── */

/* Above everything, tab bar included: the token is not about one tab — every
   request this page makes is refused — so nothing under this works either.
   The scrim is the page's own background at full strength rather than a
   translucent black, so the frozen list behind it does not read as content
   that is still standing by. */
.dead-end {
  position: fixed;
  inset: 0;
  z-index: 120;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px calc(20px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));
  background: var(--bg);
}

.dead-end__card {
  width: 100%;
  max-width: 340px;
  display: grid;
  gap: 12px;
  justify-items: center;
  text-align: center;
  padding: 24px 20px;
  background: var(--panel);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
}

/* The lock is the one colour on the card that is not text: what happened is a
   refusal, and a reader should be able to tell that from the shape alone. */
.dead-end__glyph { color: var(--danger); }

.dead-end__card h2 { font-size: 16px; font-weight: 650; margin: 0; }

/* The explanation is the body of the message, so it keeps the paragraph's own
   leading rather than the label's single line. */
.dead-end__card p { margin: 0; color: var(--fg-muted); font-size: 0.8125rem; line-height: 1.65; }

.dead-end__retry {
  margin-top: 4px;
  padding: 11px 22px;
  min-height: 44px;
  border: 1px solid var(--accent);
  border-radius: 22px;
  background: var(--accent-glow);
  color: var(--accent);
  font: inherit;
  font-size: 0.8125rem;
  font-weight: 650;
}

.dead-end__retry:active { transform: scale(0.97); }

/* ── Scrollbar ──────────────────────────────────────────────── */

.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
.modal__text::-webkit-scrollbar { width: 4px; }
.modal__text::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

/* ── Reduced motion: freeze aurora / shimmer animations ───────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}

  /* ── Visual pass: the phone now uses the desktop's tokens, not a second
     palette.  Kept as an override block so the legacy rules above still
     document the old layout; every colour, radius and font below is the
     desktop app's own value. ─────────────────────────────────────────── */
  :root {
    --bg: #202423;
    --surface: #252b28;
    --panel: #2c322f;
    --panel-2: #343b37;
    --fg: #e4e7e5;
    --fg-muted: #a6b1ab;
    --fg-subtle: #8b978f;
    --accent: #65c6a6;
    --accent-2: #65c6a6;
    --accent-glow: rgba(101,198,166,0.10);
    --accent-glow-strong: rgba(101,198,166,0.18);
    --violet-glow: transparent;
    --pink-glow: transparent;
    --success: #65c6a6;
    --danger: #ffb1a8;
    --border: #3d4642;
    --border-strong: #4c5752;
    --radius: 8px;
    --radius-sm: 5px;
    --font: "Segoe UI", -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;
    --spring: 160ms ease;
    --fast: 120ms ease;
  }

  html.light {
    --bg: #f5f7f6;
    --surface: #ffffff;
    --panel: #eef2f0;
    --panel-2: #e5ebe8;
    --fg: #1f2a25;
    --fg-muted: #5a6b63;
    --fg-subtle: #5f6d66;
    --accent: #087c6b;
    --accent-2: #087c6b;
    --accent-glow: rgba(8,124,107,0.10);
    --accent-glow-strong: rgba(8,124,107,0.18);
    --success: #0b7a5c;
    --danger: #b3261e;
    --border: #d6e0da;
    --border-strong: #bccbc3;
    --mark: rgba(202,158,20,0.32);
  }

  /* The old page leaned on glows and gradients for hierarchy; the desktop
     uses borders and spacing instead.  Flatten those surfaces rather than
     chasing each legacy rule. */
  .header, .tabs {
    background: var(--bg) !important;
    border-color: var(--border) !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
  }
  html.light .header, html.light .tabs { background: var(--bg) !important; }
  .h-item, .f-item, .setting-block--card, .modal, .chat-msg {
    background: var(--surface) !important;
    border-color: var(--border) !important;
    box-shadow: none !important;
  }
  .tab, button, input, select, .searchbar {
    border-radius: var(--radius-sm) !important;
  }
  .h-item, .f-item, .modal { border-radius: var(--radius) !important; }
  .h-item:active, .f-item:active, .tab:active { background: var(--panel) !important; }
  .tab { min-width: 64px; padding: 9px 10px; font-size: 0.7500rem; }
  .tab--active {
    background: var(--accent) !important;
    color: #102018 !important;
    box-shadow: none !important;
  }
  * { text-shadow: none !important; }

</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header__left">
      <div class="header__title">&#x1F4CB; <span id="title">ClipSync</span></div>
      <div class="header__sub" id="subtitle"></div>
    </div>
  </header>

  <!-- Seven tabs over seven panels, and the relationship was carried by a class
       name alone: a reader on a screen reader was told "button" seven times and
       had no way to know which of them was showing or what it would show.  The
       roles are static here; which one is selected is set in JS, because that
       is the part that changes. -->
  <nav class="tabs" role="tablist">
    <button class="tab tab--active" data-tab="history" id="tabHistory" role="tab" aria-selected="true" aria-controls="panelHistory"></button>
    <button class="tab" data-tab="send" id="tabSend" role="tab" aria-selected="false" tabindex="-1" aria-controls="panelSend"></button>
    <button class="tab" data-tab="files" id="tabFiles" role="tab" aria-selected="false" tabindex="-1" aria-controls="panelFiles"></button>
    <button class="tab" data-tab="chat" id="tabChat" role="tab" aria-selected="false" tabindex="-1" aria-controls="panelChat"></button>
    <button class="tab" data-tab="transfers" id="tabTransfers" role="tab" aria-selected="false" tabindex="-1" aria-controls="panelTransfers"></button>
    <button class="tab" data-tab="favorites" id="tabFavorites" role="tab" aria-selected="false" tabindex="-1" aria-controls="panelFavorites"></button>
    <button class="tab" data-tab="settings" id="tabSettings" role="tab" aria-selected="false" tabindex="-1" aria-controls="panelSettings"></button>
  </nav>

  <!-- Remote mode only: what the relay tunnel is doing right now.  Hidden in
       LAN mode, where there is no relay to report on. -->
  <div class="relay-bar" id="relayBar" style="display:none" role="status" aria-live="polite"></div>

  <!-- The page already works as an app once it is on the home screen — it
       declares a manifest and runs standalone — and nothing ever said so.  iOS
       has no install prompt to defer, so that half is a sentence telling the
       reader where the Share sheet is; Android's `beforeinstallprompt` is held
       and offered as a button.  Both can be put away for good. -->
  <div class="install-bar" id="installBar" style="display:none">
    <span class="install-bar__text" id="installText"></span>
    <button class="install-bar__btn" id="installBtn" type="button" style="display:none"></button>
    <button class="install-bar__close" id="installClose" type="button">×</button>
  </div>

  <main class="content">

    <!-- Pull to refresh.  Hidden from assistive tech: it reports a gesture that
         only exists as a gesture, and the same two lists are refreshed by
         switching tabs or by the five-second poll. -->
    <div class="pull" id="pull" aria-hidden="true"><span class="pull__pill" id="pullPill"></span></div>

    <!-- History -->
    <section class="panel panel--active" id="panelHistory" role="tabpanel" aria-labelledby="tabHistory">
      <div class="hist-tools" id="histTools" style="display:none">
        <div class="search-field">
          <span class="search-field__icon" aria-hidden="true">🔍</span>
          <input id="histSearch" type="search" autocomplete="off" enterkeyhint="search"
                 spellcheck="false" placeholder="" aria-label="">
          <button class="search-field__clear" id="histSearchClear" type="button" hidden>×</button>
        </div>
        <div class="chip-rail" id="histChips" role="group" aria-label=""></div>
        <!-- Named, and dismissable: a source filter that only lived in the
             request would leave the reader looking at a third of their
             history with no way to ask for the rest. -->
        <div class="hist-source" id="histSourceBar" style="display:none">
          <span class="hist-source__text" id="histSourceText"></span>
          <button class="hist-source__clear" id="histSourceClear" type="button">×</button>
        </div>
      </div>
      <div id="historyList"></div>
    </section>

    <!-- Send -->
    <section class="panel" id="panelSend" role="tabpanel" aria-labelledby="tabSend">
      <div class="send-card">
        <textarea id="sendText" placeholder="" maxlength="100000"></textarea>
        <!-- Pasting into a phone textarea means a long-press, a menu and a
             thumb on 粘贴 — the one interaction this whole page exists to avoid
             repeating.  The button reads the clipboard on a tap.  It never reads
             it on its own: that is a permission prompt with no gesture behind
             it, which is both rude and blocked.  See U177. -->
        <div class="send-tools">
          <button type="button" class="paste-btn" id="pasteBtn"></button>
        </div>
        <button class="send-btn" id="sendBtn"></button>
        <p class="send-hint" id="sendHint"></p>
      </div>
    </section>

    <!-- Files -->
    <section class="panel" id="panelFiles" role="tabpanel" aria-labelledby="tabFiles">
      <button class="upload-btn" id="uploadBtn"></button>
      <div class="upload-progress" id="uploadProgressWrap" style="display:none">
        <div class="upload-progress__bar"><div class="upload-progress__fill" id="uploadProgressFill"></div></div>
        <button class="upload-progress__cancel" id="uploadCancelBtn"></button>
      </div>
      <div class="upload-result" id="uploadResult" style="display:none" role="status">
        <p class="upload-result__text" id="uploadResultText"></p>
        <div class="upload-result__actions">
          <button class="upload-result__retry" id="uploadRetryBtn" type="button"></button>
          <button class="upload-result__dismiss" id="uploadDismissBtn" type="button"></button>
        </div>
      </div>
      <div id="fileList"></div>
    </section>

    <!-- Chat -->
    <section class="panel" id="panelChat" role="tabpanel" aria-labelledby="tabChat">
      <div id="chatView"></div>
    </section>

    <!-- Transfers -->
    <section class="panel" id="panelTransfers" role="tabpanel" aria-labelledby="tabTransfers">
      <div id="transfersView"></div>
    </section>

    <!-- Favorites -->
    <section class="panel" id="panelFavorites" role="tabpanel" aria-labelledby="tabFavorites">
      <div class="fav-tools" id="favTools" style="display:none">
        <div class="search-field">
          <span class="search-field__icon" aria-hidden="true">🔍</span>
          <input id="favSearch" type="search" autocomplete="off" enterkeyhint="search"
                 spellcheck="false" placeholder="" aria-label="">
          <button class="search-field__clear" id="favSearchClear" type="button" hidden>×</button>
        </div>
        <div class="chip-rail" id="favChips" role="group" aria-label=""></div>
      </div>
      <button class="fav-export" id="favExportBtn" style="display:none"></button>
      <div id="favoritesList"></div>
    </section>

    <!-- Settings -->
    <section class="panel" id="panelSettings" role="tabpanel" aria-labelledby="tabSettings">
      <div id="settingsView"></div>
    </section>

  </main>
</div>

<!-- Item detail modal.  `role="dialog"` and the label are static; whether it is
     announced at all follows `aria-hidden`, because the mask is hidden with
     opacity and stays in the accessibility tree without it.  A real <dialog>
     would bring the focus trap and the Esc key with it, but it does not exist on
     iOS below 15.4 and this page has to open on those phones too. -->
<div class="modal-mask" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="modal" id="modalBox" tabindex="-1">
    <div class="modal__title" id="modalTitle"></div>
    <img class="modal__image" id="modalImage" alt="" style="display:none">
    <div class="modal__text" id="modalText"></div>
    <!-- Per-item actions (desktop context-menu parity): open (only for a clip
         that is a link) / pin / favorite / delete on a compact row, then the
         full-width push-to-desktop primary, then the original close/copy
         pair. -->
    <div class="modal__utils" id="modalUtils">
      <button class="modal__util" id="histOpenBtn"></button>
      <button class="modal__util" id="histPinBtn"></button>
      <button class="modal__util" id="histFavBtn"></button>
      <button class="modal__util modal__util--danger" id="histDelBtn"></button>
    </div>
    <div class="modal__actions">
      <button class="modal__btn modal__btn--primary" id="histPushBtn"></button>
    </div>
    <div class="modal__actions">
      <button class="modal__btn modal__btn--ghost" id="modalClose"></button>
      <button class="modal__btn modal__btn--primary" id="modalCopy"></button>
    </div>
  </div>
</div>

<!-- A row's own menu.  Same mask-and-sheet idiom as the clip's detail
     sheet (and the same four behaviours: focus in, Tab stays in, Esc gets
     out, focus returns), but one action per line and no content — the
     point is to act on a row without reading it first. -->
<div class="modal-mask" id="rowSheet" role="dialog" aria-modal="true" aria-labelledby="rowSheetTitle" aria-hidden="true">
  <div class="modal modal--menu" id="rowSheetBox" tabindex="-1">
    <p class="modal__title" id="rowSheetTitle"></p>
    <button class="modal__btn modal__btn--ghost" id="rowPinBtn" type="button"></button>
    <button class="modal__btn modal__btn--ghost" id="rowPushBtn" type="button"></button>
    <button class="modal__btn modal__btn--ghost" id="rowFavBtn" type="button"></button>
    <button class="modal__btn modal__btn--ghost modal__btn--danger" id="rowDelBtn" type="button"></button>
    <button class="modal__btn modal__btn--ghost" id="rowSheetClose" type="button"></button>
  </div>
</div>

<!-- Renaming a favourite.  The phone could create one and delete one but not
     rename one, though `PATCH /api/favorites` has been there all along — the
     only thing missing was a way to reach it.  Same mask-and-sheet idiom as the
     row menu, and the same four behaviours (focus in, Tab stays in, Esc gets
     out, focus returns), because this is the same kind of surface. -->
<div class="modal-mask" id="favEdit" role="dialog" aria-modal="true" aria-labelledby="favEditTitle" aria-hidden="true">
  <div class="modal" id="favEditBox" tabindex="-1">
    <p class="modal__title" id="favEditTitle"></p>
    <label class="fav-edit__field">
      <span id="favEditNameLabel"></span>
      <input id="favEditName" type="text" maxlength="256" autocomplete="off" enterkeyhint="done">
    </label>
    <label class="fav-edit__field">
      <span id="favEditGroupLabel"></span>
      <input id="favEditGroup" type="text" maxlength="128" autocomplete="off" list="favEditGroupOptions" enterkeyhint="done">
    </label>
    <!-- The groups already in the library: typing one that exists is how a
         favorite moves between groups, and typing a new one is how a group is
         made.  A picker would do the first and not the second. -->
    <datalist id="favEditGroupOptions"></datalist>
    <div class="modal__actions">
      <button class="modal__btn modal__btn--ghost" id="favEditCancel" type="button"></button>
      <button class="modal__btn modal__btn--primary" id="favEditSave" type="button"></button>
    </div>
  </div>
</div>

<!-- A live region, not just a rectangle: the message is the only answer a
     reader on a phone gets, and a screen reader was not told it appeared. -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<input type="file" id="fileInput" multiple style="display:none">
<!-- Chat attachment picker — separate from the Files-tab input so an
     in-flight chat send never disturbs the files upload queue state. -->
<input type="file" id="chatFileInput" style="display:none">

  document.getElementById('title').textContent = T.title;
