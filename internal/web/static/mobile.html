      el.addEventListener('click', function () {
        if (favoritesGroup === name) return;
        favoritesGroup = name;
        renderFavoritesChips();
        reloadFavorites();
      });
      favChips.appendChild(el);
      favoriteChipNodes.push({ name: name, el: el, countEl: countEl });
    });
    favoriteChipNames = names.slice();
  }

  var favoritesSearchTimer = null;
  favSearch.addEventListener('input', function () {
    var value = favSearch.value || '';
    favSearchClear.hidden = !value;
    if (favoritesSearchTimer) clearTimeout(favoritesSearchTimer);
    favoritesSearchTimer = setTimeout(function () {
      favoritesSearchTimer = null;
      if (value.trim() === favoritesQuery) return;
      favoritesQuery = value.trim();
      reloadFavorites();
    }, 250);
  });
  favSearch.addEventListener('search', function () {
    if (!favSearch.value) {
      if (favoritesSearchTimer) { clearTimeout(favoritesSearchTimer); favoritesSearchTimer = null; }
      favSearchClear.hidden = true;
      if (favoritesQuery) { favoritesQuery = ''; reloadFavorites(); }
    }
  });
  favSearchClear.addEventListener('click', function () {
    favSearch.value = '';
    favSearchClear.hidden = true;
    if (favoritesSearchTimer) { clearTimeout(favoritesSearchTimer); favoritesSearchTimer = null; }
    if (favoritesQuery) { favoritesQuery = ''; reloadFavorites(); }
    favSearch.focus();
  });

  function favIcon(f) {
    var content = ((f.content || '') + ' ' + (f.title || '')).trim();
    if (/^https?:\/\//i.test(content)) return '🔗';
    return '📋';
  }

  function favTypeLabel(f) {
    if (/^https?:\/\//i.test((f.content || '').trim()) || /^https?:\/\//i.test((f.title || '').trim())) return T.favTypeLink;
    return T.favTypeText;
  }

  function renderFavorites() {
    // The one-click export only makes sense with something to export.
    favExportBtn.style.display = favoritesItems.length === 0 ? 'none' : 'flex';
    if (favoritesItems.length === 0) {
      if (favoritesFilterActive() && favoritesLibraryTotal > 0) {
        favoritesList.innerHTML = '<div class="empty"><div class="empty__icon">🔍</div><div class="empty__text">' +
          esc(T.favNoMatch) + '<br><span class="empty__hint">' + esc(T.favNoMatchHint) + '</span></div></div>';
      } else {
        favoritesList.innerHTML = '<div class="empty"><div class="empty__icon">⭐</div><div class="empty__text">' + esc(T.favEmpty) + '</div></div>';
      }
      return;
    }
    favoritesList.innerHTML = '';
    favoritesItems.forEach(function (f) {
      var el = document.createElement('div');
      el.className = 'fav-item';
      var title = (f.title || '').trim() || (f.content_preview || '');
      var preview = (f.content || '').trim();
      el.innerHTML =
        '<div class="fav-item__icon">' + favIcon(f) + '</div>' +
        '<div class="fav-item__body">' +
          '<div class="fav-item__title">' + highlightMarks(title, favoritesQuery) + '</div>' +
          (preview ? '<div class="fav-item__preview">' + highlightMarks(preview, favoritesQuery) + '</div>' : '') +
          // The group is how the phone's chip rail narrows the list, so a row
          // that does not say which group it is in cannot be found again by
          // looking at it.
          '<div class="fav-item__meta">' +
            (f.group ? esc(f.group) + ' · ' : '') +
            esc(favTypeLabel(f)) + ' · ' + esc(relTime(f.created)) + '</div>' +
        '</div>' +
        '<button class="f-item__edit" title="' + esc(T.favEditAction) +
          '" aria-label="' + esc(T.favEditAction) + '">✎</button>' +
        '<button class="f-item__delete" title="' + esc(T.favDelete) + '">✕</button>';
      el.addEventListener('click', function () { favCopy(f); });
      var editButton = el.querySelector('.f-item__edit');
      editButton.addEventListener('click', function (ev) {
        // The row copies on a tap, so an action inside it has to stop the tap
        // from reaching the row — otherwise renaming a favorite also pushes it.
        ev.stopPropagation();
        favEditShow(f, editButton);
      });
      el.querySelector('.f-item__delete').addEventListener('click', function (ev) {
        ev.stopPropagation();
        favDelete(f);
      });
      favoritesList.appendChild(el);
    });
  }

  // Same hand-off as the history list's `historySettled`.
  function favoritesSettled(requestId) {
    favoritesLoading = false;
    if (requestId !== favoritesRequestId) {
      if (favoritesReloadPending) {
        favoritesReloadPending = false;
        loadFavorites();
      }
      return false;
    }
    favoritesReloadPending = false;
    return true;
  }

  // The rail or the search box moved: retire whatever is in flight and ask
  // again.  The id bump is what makes the reply already on its way stale.
  function reloadFavorites() {
    favoritesRequestId += 1;
    favoritesReloadPending = true;
    loadFavorites();
  }

  function loadFavorites(silent) {
    if (favoritesLoading) {
      // Same contract as the history list: a filter change with nothing behind
      // it leaves the rows answering a question the reader walked away from.
      if (!silent) favoritesReloadPending = true;
      return;
    }
    favoritesLoading = true;
    var requestId = ++favoritesRequestId;
    if (!silent) favoritesList.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    getJson(favoritesUrl())
      .then(function (data) {
        if (!favoritesSettled(requestId)) return;
        favoritesItems = (data && data.favorites) || [];
        // The library's groups and their counts come back with every list so
        // the chips track changes made on the desktop.
        if (data && data.groups) favoritesGroups = data.groups;
        if (data && data.group_counts) favoritesGroupCounts = data.group_counts;
        if (data && data.library_total != null) favoritesLibraryTotal = data.library_total;
        renderFavoritesChips();
        renderFavorites();
      })
      .catch(function (err) {
        if (!favoritesSettled(requestId)) return;
        if (err && err.status === 403) notifyTokenExpired();
        if (!silent) {
          var msg = (err && err.status === 403) ? esc(T.tokenExpired) : esc(T.loadFail) + '<br>' + esc(failHint(err));
          favoritesList.innerHTML = '<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__text">' + msg + '</div></div>';
        }
      });
  }

  // A favorite is plain text (title + content) — push it to the desktop
  // clipboard via /api/push. paste-rich would need a history entry_id, which
  // a favorite doesn't carry.
  function favCopy(f) {
    var text = ((f.title || '') + '\n' + (f.content || '')).trim();
    if (!text) { showToast(T.favEmpty, true); return; }
    apiFetch('/api/push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok) {
          showToast(T.favCopied);
        } else {
          showToast(apiError(res.data, T.favCopyFail), true);
        }
      })
      .catch(function () {
        showToast(T.favCopyFail + ' · ' + failHint(), true);
      });
  }

  /* ── Editing a favorite's title and group ──────────────────────
     The phone could create one and delete one but not rename one: `PATCH
     /api/favorites` has been there all along (`update_favorites`), and only the
     way to reach it was missing.  Renaming is the more common gesture of the
     three — a favorite saved from the clipboard arrives titled with the clip's
     own first line. */
  var favEditEl = document.getElementById('favEdit');
  var favEditBox = document.getElementById('favEditBox');
  var favEditName = document.getElementById('favEditName');
  var favEditGroup = document.getElementById('favEditGroup');
  var favEditTarget = null;
  var favEditReturn = null;

  function favEditShow(f, opener) {
    if (!favEditEl) return;
    favEditTarget = f;
    favEditReturn = opener || null;
    document.getElementById('favEditTitle').textContent = T.favEditSheet;
    document.getElementById('favEditNameLabel').textContent = T.favEditNameLabel;
    document.getElementById('favEditGroupLabel').textContent = T.favEditGroupLabel;
    document.getElementById('favEditCancel').textContent = T.favEditCancel;
    document.getElementById('favEditSave').textContent = T.favEditSave;
    favEditName.value = f.title || '';
    favEditGroup.value = f.group || '';
    // The library's own groups, so a rename can move a favorite into one that
    // exists without the reader having to spell it exactly right.
    var options = document.getElementById('favEditGroupOptions');
    options.innerHTML = '';
    (favoritesGroups || []).forEach(function (name) {
      var option = document.createElement('option');
      option.value = name;
      options.appendChild(option);
    });
    favEditEl.classList.add('modal-mask--show');
    favEditEl.setAttribute('aria-hidden', 'false');
    // The title first: it is the field being renamed, and on iOS focusing it
    // also raises the keyboard without a second tap.
    favEditName.focus();
    favEditName.select();
  }

  function favEditHide() {
    if (!favEditEl || !favEditEl.classList.contains('modal-mask--show')) return;
    favEditEl.classList.remove('modal-mask--show');
    favEditEl.setAttribute('aria-hidden', 'true');
    favEditTarget = null;
    // Back to the button that opened this: the reader is mid-list, and
    // dropping focus to the top of the page loses their place.  The row may
    // have been re-rendered by the save, so a detached button is not focused.
    if (favEditReturn && favEditReturn.isConnected && favEditReturn.focus) {
      favEditReturn.focus();
    }
    favEditReturn = null;
  }

  function favEditSubmit() {
    var f = favEditTarget;
    if (!f) return;
    var save = document.getElementById('favEditSave');
    save.disabled = true;
    apiFetch('/api/favorites', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      // Sent as one body for one item, the shape this route has always taken:
      // the batch form exists for a gesture that moves several at once.
      body: JSON.stringify({ id: f.id, title: favEditName.value.trim(), group: favEditGroup.value.trim() }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok !== false) {
          showToast(T.favEditSaved);
          favEditHide();
          // A rename can add a group or empty one, and the chip rail is drawn
          // from the list — so ask again rather than patch the row in place.
          reloadFavorites();
        } else {
          showToast(apiError(res.data, T.favEditFail), true);
        }
      })
      .catch(function () {
        showToast(T.favEditFail + ' · ' + failHint(), true);
      })
      .then(function () { save.disabled = false; });
  }

  if (favEditEl) {
    document.getElementById('favEditCancel').addEventListener('click', favEditHide);
    document.getElementById('favEditSave').addEventListener('click', favEditSubmit);
    favEditEl.addEventListener('click', function (event) {
      if (event.target === favEditEl) favEditHide();
    });
    favEditEl.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') { event.preventDefault(); favEditHide(); return; }
      // Enter in either field saves: this sheet has one outcome, and on a phone
      // the keyboard's own "done" key is the natural way to reach it.
      if (event.key === 'Enter' && event.target && event.target.tagName === 'INPUT') {
        event.preventDefault();
        favEditSubmit();
        return;
      }
      if (event.key !== 'Tab') return;
      trapTab(event, favEditEl, favEditBox);
    });
  }

  function favDelete(f) {
    if (!window.confirm(T.favDeleteConfirm)) return;
    apiFetch('/api/favorites', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: f.id }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok !== false) {
          showToast(T.favDeleted);
          // A refresh, and the reader asked for it by deleting: if a poll is in
          // flight this one has to be queued, or the row they just removed
          // stays on screen until the next tick.
          reloadFavorites();
        } else {
          showToast(apiError(res.data, T.favDeleteFail), true);
        }
      })
      .catch(function () {
        showToast(T.favDeleteFail + ' · ' + failHint(), true);
      });
  }

  // One-click export: ask the desktop to write ALL favorites to a Markdown
  // file (same Downloads location the history export uses) and toast where
  // it landed — handy for moving saved clips off the phone for good.
  favExportBtn.textContent = T.favExport;
  favExportBtn.addEventListener('click', function () {
    if (favExportBusy) return;
    favExportBusy = true;
    favExportBtn.textContent = '...';
    apiFetch('/api/favorites/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ format: 'markdown' }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok) {
          showToast(T.favExportDone.replace('{n}', String((res.data && res.data.count) || 0)));
        } else {
          showToast(apiError(res.data, T.favExportFail), true);
        }
      })
      .catch(function () {
        showToast(T.favExportFail + ' · ' + failHint(), true);
      })
      .then(function () {
        // Manual reset instead of .finally (older-webview friendly).
        favExportBusy = false;
        favExportBtn.textContent = T.favExport;
      });
  });

  /* ── Settings ───────────────────────────────────────────────── */

  function savedTheme() {
    try { return localStorage.getItem('clipsync_mobile_theme'); }
    catch (e) { return null; }
  }

  function prefersLight() {
    try {
      return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
    } catch (e) { return false; }
  }

  /* Chosen light / chosen dark / nothing chosen, in that order.  The system's
     own setting is the default rather than a hard-coded dark: a phone set to a
     light appearance kept opening a dark page, and the only thing that said
     otherwise was a toggle nobody had found yet. */
  function isLightTheme() {
    var saved = savedTheme();
    return saved ? saved === 'light' : prefersLight();
  }

  function applyTheme() {
    var light = isLightTheme();
    /* On the document element, not the body: the same class has to be there
       before the body exists, so the early script in <head> sets it there and
       the two must agree on where it lives. */
    document.documentElement.classList.toggle('light', light);
    // Keep the browser UI chrome (address-bar tint on Android, iOS status
    // bar) in step with the app theme instead of always using the dark value.
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', light ? '#E9EDF5' : '#05060D');
    var toggle = document.getElementById('themeToggle');
    if (toggle) {
      toggle.textContent = themeLabel();
      // The label is which palette is on, and a button whose name is a state it
      // is already in reads as a state, not as the thing it does: pressed says
      // the same in a way a screen reader can answer.
      toggle.setAttribute('aria-pressed', light ? 'true' : 'false');
    }
  }

  function themeLabel() {
    return isLightTheme() ? T.setThemeLight : T.setThemeDark;
  }

  function toggleTheme() {
    var light = !isLightTheme();
    try { localStorage.setItem('clipsync_mobile_theme', light ? 'light' : 'dark'); } catch (e) {}
    applyTheme();
  }

  /* Follow the phone when nothing was chosen here, and leave the choice alone
     once it was: a reader who picked dark on a light phone meant it. */
  try {
    var schemeQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
    if (schemeQuery && schemeQuery.addEventListener) {
      schemeQuery.addEventListener('change', function () { if (!savedTheme()) applyTheme(); });
    }
  } catch (e) {}

  /* ── Diagnostics card ──────────────────────────────────────── */

  // Scan state lives outside the rendered HTML because loadSettings
  // re-renders this whole view on every poll tick — the results must
  // survive that (and do, via renderDiag() after each rebuild).
  var diagState = { scanning: false, checks: [], revealed: 0, summary: '', requested: false };
  var lastSettingsSig = null;

  function diagLabel(id) {
    var map = {
      server_port: T.diagServerPort,
      discovery: T.diagDiscovery,
      advertising: T.diagAdvertising,
      web_companion: T.diagWeb,
      network: T.diagNetwork,
      firewall: T.diagFirewall,
      permissions: T.diagPermissions,
      mdns: T.diagMdns,
      clipboard_tool: T.diagClipboardTool,
      error: T.diagTitle,
    };
    return map[id] || id;
  }

  function diagSummaryText(s) {
    if (s === 'ok') return T.diagAllOk;
    if (s === 'warn') return T.diagWarn;
    return T.diagFail;
  }

  function renderDiag() {
    var box = document.getElementById('diagResults');
    if (!box) return;
    var html = '';
    if (diagState.checks.length === 0 && !diagState.scanning) {
      box.innerHTML = '';
      return;
    }
    for (var i = 0; i < diagState.checks.length; i++) {
      var chk = diagState.checks[i];
      var shown = i < diagState.revealed;
      var statusCls = !shown ? '' : (chk.ok ? ' diag-check__status--ok' : ' diag-check__status--bad');
      // The server resolves the report's i18n keys into `*_text` fields for the
      // language it injects as `__SERVER_LOCALE__` — the same one this page
      // speaks — and leaves the raw builder strings beside them. Prefer the
      // resolved ones: reading `detail` alone showed English on a Chinese phone.
      var detail = shown ? ((chk && (chk.detail_text || chk.detail)) || '') : '';
      var guidance = shown ? ((chk && (chk.guidance_text || chk.guidance)) || '') : '';
      html += '<div class="diag-check">' +
        '<span class="diag-check__status' + statusCls + '">' + (shown ? (chk.ok ? '✓' : '✕') : '·') + '</span>' +
        '<div class="diag-check__body">' +
          '<span class="diag-check__label">' + esc(diagLabel(chk.id)) + '</span>' +
          (detail ? '<span class="diag-check__detail">' + esc(detail) + '</span>' : '') +
          (guidance ? '<span class="diag-check__guidance">💡 ' + esc(guidance) + '</span>' : '');
      // The desktop offers a one-tap fix for exactly these two checks —
      // mirror it so a phone can trigger the same elevated repair flow.
      if (shown && (chk.id === 'firewall' || chk.id === 'permissions')) {
        html += '<button class="diag-fix" data-diag-fix="' + esc(chk.id) + '"' + (diagState.requested ? ' disabled' : '') + '>' + esc(T.diagFix) + '</button>';
      }
      // Everything the one-tap fix does not reach.  A failed check that carries
      // a repair command hands the reader the command rather than a button that
      // would have to run it for them — the phone cannot, and a greyed-out
      // button with no explanation is the shape this check used to have.
      if (shown && !chk.ok && chk.command) {
        html += '<div class="diag-cmd">' +
          '<span class="diag-cmd__label">' + esc(T.diagCmdLabel) + '</span>' +
          '<code class="diag-cmd__text">' + esc(chk.command) + '</code>' +
          '<button class="diag-fix diag-copy" data-diag-copy="' + esc(chk.id) + '">' + esc(T.diagCopyCmd) + '</button>' +
        '</div>';
      }
      html += '</div></div>';
    }
    var done = !diagState.scanning && diagState.checks.length > 0 && diagState.revealed >= diagState.checks.length;
    if (done) {
      html += '<div class="diag-summary diag-summary--' + esc(diagState.summary) + '">' + esc(diagSummaryText(diagState.summary)) + '</div>';
    }
    box.innerHTML = html;
  }

  function runDiagnostics() {
    if (diagState.scanning) return;
    diagState.scanning = true;
    diagState.checks = [];
    diagState.revealed = 0;
    diagState.summary = '';
    renderSettingsView();
    getJson('/api/diagnostics')
      .then(function (res) {
        diagState.scanning = false;
        diagState.checks = (res && res.checks) || [];
        diagState.summary = (res && res.summary) || 'ok';
        diagState.revealed = 0;
        // Reveal each check one by one (the same scan effect as the desktop).
        for (var i = 0; i < diagState.checks.length; i++) {
          (function (idx) {
            setTimeout(function () {
              diagState.revealed = idx + 1;
              renderSettingsView();
            }, 350 * (idx + 1));
          })(i);
        }
        if (diagState.checks.length === 0) renderSettingsView();
      })
      .catch(function () {
        diagState.scanning = false;
        diagState.checks = [{ id: 'error', ok: false, detail: '', guidance: '' }];
        diagState.revealed = 1;
        diagState.summary = 'fail';
        showToast(T.diagScanFail, true);
        renderSettingsView();
      });
  }

  /** Copy a check's repair command.
   *
   *  The phone cannot run it, and this page is usually reached over plain HTTP
   *  on a LAN — which is not a secure context, so `navigator.clipboard` is
   *  simply absent there.  Both outcomes are said out loud: a copy button that
   *  does nothing reads as broken, and the command above it can still be
   *  selected by hand.
   */
  function copyDiagCommand(checkId) {
    var cmd = '';
    for (var i = 0; i < diagState.checks.length; i++) {
      if (diagState.checks[i].id === checkId) { cmd = diagState.checks[i].command || ''; break; }
    }
    if (!cmd) return;
    if (!navigator.clipboard || !navigator.clipboard.writeText) {
      showToast(T.diagCopyFail, true);
      return;
    }
    navigator.clipboard.writeText(cmd)
      .then(function () { showToast(T.diagCopied); })
      .catch(function () { showToast(T.diagCopyFail, true); });
  }

  function requestDiagFix(checkId) {
    var action = checkId === 'permissions' ? 'local_network' : (checkId === 'firewall' ? 'firewall' : null);
    if (!action || diagState.requested) return;
    diagState.requested = true;
    renderDiag();
    apiFetch('/api/diagnostics/request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: action }),
    })
      .then(function (res) {
        diagState.requested = false;
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok === true) {
          showToast(T.diagFixDone);
          // An elevated netsh process may take a moment — re-scan so the fix
          // shows up as OK (mirrors the desktop panel's timing).
          if (action === 'firewall') setTimeout(runDiagnostics, 2500);
        } else {
          showToast(apiError(res.data, T.diagFixFail), true);
        }
        renderDiag();
      })
      .catch(function () {
        diagState.requested = false;
        showToast(T.diagFixFail + ' · ' + failHint(), true);
        renderDiag();
      });
  }

  function renderSettings(deviceName, settings) {
    var ver = (settings && (settings.version || settings.app_version)) || '';
    var html = '';
    html += '<div class="set-card">' +
      '<div class="set-row"><span class="set-row__label">' + esc(T.setDeviceName) + '</span><span class="set-row__value">' + esc(deviceName || '—') + '</span></div>';
    if (ver) {
      html += '<div class="set-row"><span class="set-row__label">' + esc(T.setVersion) + '</span><span class="set-row__value">' + esc(ver) + '</span></div>';
    }
    html += '<div class="set-row"><span class="set-row__label">' + esc(T.setWebAddress) + '</span><span class="set-row__value">' + esc(window.location.origin + window.location.pathname) + '</span></div>' +
      '<div class="set-row"><span class="set-row__label">' + esc(T.setLanguage) + '</span><span class="set-row__value">' + esc(ZH ? '中文' : 'English') + '</span></div>' +
      // Where the settings that are not here actually live.  A page that shows
      // a device and then stops reads as "there is nothing to change"; this
      // says what is missing and where it went.
      '<p class="diag-intro">' + esc(T.setRestHint) + '</p>' +
    '</div>';
    // Sync first: it is the one setting a phone user reaches for (the rest are
    // about how much is kept and where it goes, which need the window anyway).
    // Read off the same /api/settings the poll already fetches, so the switch
    // says what the computer is actually doing rather than what this page last
    // asked for; a pause that times out flips it back on the next tick.
    var syncOn = syncEnabledNow();
    html += '<div class="set-card">' +
      '<div class="chat-hdr" style="margin-top:10px">' + esc(T.setSyncTitle) + '</div>' +
      '<div class="set-row"><span class="set-row__label">' + esc(syncOn ? T.setSyncOn : T.setSyncOff) + '</span>' +
        '<button class="set-toggle" id="syncToggle"' + (syncBusy ? ' disabled' : '') + '>' +
        esc(syncOn ? T.setSyncPause : T.setSyncResume) + '</button></div>' +
      syncPausedLine() +
      '<p class="diag-intro">' + esc(T.setSyncHint.replace('{n}', String(T.setSyncPauseMinutes))) + '</p>' +
    '</div>';
    html += '<div class="set-card">' +
      '<div class="set-row"><span class="set-row__label">' + esc(T.setTheme) + '</span><button class="set-toggle" id="themeToggle" aria-pressed="' + (isLightTheme() ? 'true' : 'false') + '">' + esc(themeLabel()) + '</button></div>' +
    '</div>';
    // Diagnostics scan (desktop diagnostics-panel parity, compact form):
    // answers the phone user's main question — "why isn't it syncing?"
    html += '<div class="set-card">' +
      '<div class="chat-hdr" style="margin-top:10px">' + esc(T.diagTitle) + '</div>' +
      '<p class="diag-intro">' + esc(T.diagHint) + '</p>' +
      '<button class="diag-run" id="diagRunBtn"' + (diagState.scanning ? ' disabled' : '') + '>' + esc(diagState.scanning ? T.diagScanning : T.diagRun) + '</button>' +
      '<div id="diagResults"></div>' +
    '</div>';
    html += '<div class="set-card set-card--danger">' +
      '<div class="chat-hdr" style="margin-top:10px">' + esc(T.setDangerTitle) + '</div>' +
      '<p class="diag-intro">' + esc(T.setDangerHint) + '</p>' +
      '<button class="set-danger" id="settingsHistClearBtn">' + esc(T.histClear) + '</button>' +
    '</div>';
    settingsView.innerHTML = html;
    var toggle = document.getElementById('themeToggle');
    if (toggle) toggle.addEventListener('click', toggleTheme);
    var syncBtn = document.getElementById('syncToggle');
    if (syncBtn) syncBtn.addEventListener('click', toggleSync);
    var runBtn = document.getElementById('diagRunBtn');
    if (runBtn) runBtn.addEventListener('click', runDiagnostics);
    var clearBtn = document.getElementById('settingsHistClearBtn');
    if (clearBtn) clearBtn.addEventListener('click', clearAllHistory);
    renderDiag();
  }

  /* ── Sync switch ───────────────────────────────────────────── */

  var syncBusy = false;
  // When a pause started from this page will lift, as epoch ms.  The deadline
  // lives in the computer's config and is not part of /api/settings, so it is
  // only known here for the pause this page itself asked for — a pause started
  // from the tray shows as "paused" without a time rather than with a guess.
  var syncPausedUntil = 0;
  // The state this page just asked for, held for one poll so a read that left
  // before the change landed cannot flip the button back (see
  // `applySettingsData`).
  var syncGraceState = '';
  var syncGraceUntil = 0;

  function syncEnabledNow() {
    return !(_lastSettingsObj && _lastSettingsObj.sync_enabled === false);
  }

  function syncPausedLine() {
    if (syncEnabledNow() || !syncPausedUntil || syncPausedUntil <= Date.now()) return '';
    var d = new Date(syncPausedUntil);
    var hh = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    return '<div class="set-row"><span class="set-row__value" style="text-align:left">' +
      esc(T.setSyncPausedUntil.replace('{time}', hh)) + '</span></div>';
  }

  // Toggling reads the state the computer reported, not the button's label: a
  // pause that expired while this tab sat idle would otherwise "pause" again.
  function toggleSync() {
    if (syncBusy) return;
    var pausing = syncEnabledNow();
    var minutes = T.setSyncPauseMinutes;
    syncBusy = true;
    renderSettingsView();
    apiFetch(pausing ? '/api/sync/pause' : '/api/sync/resume', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(pausing ? { minutes: minutes } : {}),
    })
      .then(function (r) {
        syncBusy = false;
        if (r.status === 403) { notifyTokenExpired(); renderSettingsView(); return; }
        var data = r.data || {};
        if (r.status >= 400 || data.ok === false) {
          renderSettingsView();
          showToast(T.setSyncFail + ' · ' + failHint({ status: r.status }), true);
          return;
        }
        if (pausing) {
          _lastSettingsObj = Object.assign({}, _lastSettingsObj, { sync_enabled: false });
          syncGraceState = 'off';
          var until = Number(data.until || 0);
          syncPausedUntil = until > 0 ? until * 1000 : Date.now() + minutes * 60000;
          showToast(T.setSyncPausedDone.replace('{n}', String(minutes)));
        } else {
          _lastSettingsObj = Object.assign({}, _lastSettingsObj, { sync_enabled: true });
          syncGraceState = 'on';
          syncPausedUntil = 0;
          showToast(T.setSyncResumedDone);
        }
        syncGraceUntil = Date.now() + 8000;
        renderSettingsView();
      })
      .catch(function () {
        syncBusy = false;
        renderSettingsView();
        showToast(T.setSyncFail + ' · ' + failHint(), true);
      });
  }

  // One rebuild entry point with a change signature: the poll calls this
  // every 5s, but rebuilding the DOM under an open scan (or just for show)
  // resets nothing-visible-yet costs flicker — skip when nothing changed.
  function renderSettingsView() {
    var sig = [
      _lastDeviceName,
      diagState.scanning ? '1' : '0',
      String(diagState.revealed),
      diagState.summary,
      String(diagState.checks.length),
      themeLabel(),
      // The sync card's own state: a pause that lifts on the computer, or one
      // this page just asked for, has to reach the button.
      syncEnabledNow() ? 'on' : 'off',
      syncBusy ? 'busy' : 'idle',
      String(syncPausedUntil),
    ].join('|');
    if (sig === lastSettingsSig) {
      // Nothing structural changed; still refresh the results box in case a
      // reveal step or fix-button disable landed between renders.
      renderDiag();
      return;
    }
    lastSettingsSig = sig;
    _rebuildSettingsNow();
  }

  function _rebuildSettingsNow() {
    // Resolve the currently displayed values from the last fetch.
    renderSettings(_lastDeviceName || '—', _lastSettingsObj || {});
  }

  var _lastDeviceName = '';
  var _lastSettingsObj = {};

  function loadSettings(silent) {
    getJson('/api/status')
      .then(function (s) {
        var deviceName = (s && s.device) || '';
        getJson('/api/settings')
          .then(function (s2) {
            var settings = (s2 && s2.settings) || {};
            applySettingsData(deviceName || settings.device_name, settings);
          })
          .catch(function () {
            applySettingsData(deviceName, {});
          });
      })
      .catch(function (err) {
        if (err && err.status === 403) { notifyTokenExpired(); return; }
        getJson('/api/settings')
          .then(function (s2) {
            var settings = (s2 && s2.settings) || {};
            applySettingsData(settings.device_name, settings);
          })
          .catch(function () {
            if (!silent) {
              settingsView.innerHTML = '<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__text">' + esc(T.loadFail) + '<br>' + esc(failHint()) + '</div></div>';
            }
          });
      });
  }

  function applySettingsData(deviceName, settings) {
    _lastDeviceName = deviceName || '';
    var next = settings || {};
    // The computer is the authority on whether sync is on — except for the one
    // poll right after this page changed it.  A read that left before the pause
    // landed comes back saying "on", and taking it would flip the button back
    // and read as "the pause did not take" until the next tick.
    var reported = next.sync_enabled === false ? 'off' : 'on';
    if (syncGraceState && Date.now() < syncGraceUntil && reported !== syncGraceState) {
      next = Object.assign({}, next, { sync_enabled: syncGraceState === 'on' });
    } else {
      syncGraceState = '';
    }
    if (next.sync_enabled !== false) syncPausedUntil = 0;
    _lastSettingsObj = next;
    renderSettingsView();
  }

  // Delegated: the diagnostics card is rebuilt by renders/poll ticks, so
  // bind the fix buttons on the container instead of per render.
  settingsView.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-diag-fix]') : null;
    if (btn) { requestDiagFix(btn.getAttribute('data-diag-fix')); return; }
    var copy = e.target.closest ? e.target.closest('[data-diag-copy]') : null;
    if (!copy) return;
    copyDiagCommand(copy.getAttribute('data-diag-copy'));
  });

  /* ── Init ──────────────────────────────────────────────────── */

  applyTheme();
  loadHistory();
  startPolling();
  syncTabEdges();

})();
</script>

</body>
</html>
