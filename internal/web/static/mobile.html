    : T.sub;

  // Remote mode cannot carry an upload body yet (and should not pretend it
  // can).  Hide the two entry points that would only fail; downloads, history
  // and the relay chat stay available.
  // Declared before the subscription below, which may fire synchronously with
  // the state the tunnel is already in.
  var relayHideTimer = null;
  // Whether the last state the page saw was online, so the first read blocked
  // by the handshake can be redone exactly once per connection.
  var relayWasOnline = false;

  if (window.__CLIPSYNC_REMOTE__) {
    var remoteSettingsTab = document.getElementById('tabSettings');
    if (remoteSettingsTab) remoteSettingsTab.style.display = 'none';
    var remoteUploadBtn = document.getElementById('uploadBtn');
    if (remoteUploadBtn) remoteUploadBtn.style.display = 'none';
    var remoteFileInput = document.getElementById('fileInput');
    if (remoteFileInput) remoteFileInput.disabled = true;
    // What the tunnel is doing, which is not something the page's two states
    // (loaded / "load failed") could express: a phone still dialling relay #2
    // used to look exactly like a computer that was switched off.
    if (typeof window.__CLIPSYNC_REMOTE__.onState === 'function') {
      window.__CLIPSYNC_REMOTE__.onState(showRelayState);
    }
    // Runtime events replace most of the polling: the affected tab is redrawn
    // when the computer says something changed, not up to a poll later.
    if (typeof window.__CLIPSYNC_REMOTE__.onEvent === 'function') {
      window.__CLIPSYNC_REMOTE__.onEvent(handleRelayEvent);
    }
  }

  function relayReasonLabel(reason) {
    return {
      timeout: T.relayReasonTimeout,
      refused: T.relayReasonRefused,
      closed: T.relayReasonClosed,
      stale: T.relayReasonStale,
      open: T.relayReasonOpen,
      // The phone reached a broker but the computer never answered hello on it
      // (or stopped answering pings later): the relay is up, the other end is
      // not.  Saying "no response" is the difference between dialling a
      // problem and reporting a broker that is merely busy.
      computer: T.relayReasonComputer,
    }[reason] || '';
  }

  function relayLabel(info) {
    if (!info) return '';
    if (info.state === 'connecting') {
      // Every broker is dialled at once now; "2/3" would name a step that does
      // not exist.  (Older payloads still carry index/total, so the old label
      // stays for them.)
      if (info.parallel) return T.relayDialing;
      return T.relayConnecting
        .replace('{n}', String(info.index || 1))
        .replace('{m}', String(info.total || 1));
    }
    if (info.state === 'verifying') return T.relayVerifying;
    if (info.state === 'retrying') {
      var text = T.relayRetrying.replace('{s}', String(info.delay || 0));
      var why = relayReasonLabel(info.reason);
      // The reason is a clause about the failed attempt, not a second sentence:
      // the middle dot read as another status field ("· 超时") rather than as
      // the cause of the retry it sits next to.
      if (!why) return text;
      return ZH ? text + '（' + why + '）' : text + ' · ' + why;
    }
    if (info.state === 'online') return '✓ ' + T.relayOnline;
    return '';
  }

  // Opening a tab, and keeping the ones that are not open warm.
  //
  // A remote read is one broker round trip (0.6-1.5 s measured on a phone), so
  // a cold tab used to blank the panel and wait that long before drawing
  // anything.  The other tabs are read once when the relay comes up
  // (prefetchRelayTabs), and a tap on one draws what is already there, only
  // refreshing behind it when that copy is older than a poll interval.  A LAN
  // page keeps its old synchronous load.
  var tabWarmAt = {};
  // When an event last refreshed a tab, so a burst of events (a transfer's
  // progress, a chat exchange) coalesces into one read instead of one each.
  var relayEventAt = {};

  /*
   * The computer pushes runtime events over the tunnel (clipboard changed,
   * chat message, transfer progress...).  The page uses them as a refresh
   * signal for the tab the reader is looking at: that turns "wait for the next
   * poll" into "redraw now", and takes polling load off the desktop's request
   * budget.  Events are best-effort QoS 0; the fallback poll and the reconnect
   * resync cover a dropped one, so losing an event costs freshness, never
   * correctness.
   */
  function relayEventReload(tab) {
    if (!window.__CLIPSYNC_REMOTE__ || !window.__CLIPSYNC_REMOTE__.online) return;
    if (activeTabName() !== tab) return;
    var now = Date.now();
    if (relayEventAt[tab] && now - relayEventAt[tab] < 800) return;
    relayEventAt[tab] = now;
    /*
     * A read that is already in flight swallows the silent refresh (the loaders
     * drop a second silent read rather than queue it), and that read may have
     * been issued before the event.  Give it one short retry so the pushed
     * change does not have to wait for the fallback poll.
     */
    var attempt = function (retriesLeft) {
      if (!window.__CLIPSYNC_REMOTE__ || !window.__CLIPSYNC_REMOTE__.online) return;
      loadTab(tab, true, true);
      if (retriesLeft > 0) {
        setTimeout(function () {
          if (activeTabName() === tab) attempt(retriesLeft - 1);
        }, 700);
      }
    };
    attempt(1);
  }

  function handleRelayEvent(name) {
    if (name === 'history.changed') return relayEventReload('history');
    if (name === 'favorites.changed') return relayEventReload('favorites');
    if (name === 'chat.message' || name === 'chat.sessions.changed' ||
        name === 'chat.file.progress' || name === 'chat.file.done') {
      return relayEventReload('chat');
    }
    if (name === 'transfer.progress' || name === 'transfer.complete' ||
        name === 'relay.delivery.changed') {
      return relayEventReload('transfers');
    }
  }

  function loadTab(name, silent, force) {
    var remote = !!(window.__CLIPSYNC_REMOTE__ && window.__CLIPSYNC_REMOTE__.online);
    function run(quietChoice) {
      if (name === 'history') loadHistory(quietChoice);
      else if (name === 'files') loadFiles(quietChoice);
      else if (name === 'chat') loadChat(quietChoice);
      else if (name === 'transfers') loadTransfers(quietChoice);
      else if (name === 'favorites') loadFavorites(quietChoice);
      else if (name === 'settings') loadSettings(quietChoice);
    }
    if (!remote) {
      // The LAN round trip is local and fast; a page that keeps the old
      // synchronous loads is also a page that cannot regress when the relay
      // code changes.
      if (name === 'favorites') { reloadFavorites(); return; }
      run(false);
      return;
    }
    var warm = tabWarmAt[name] || 0;
    var fresh = warm !== 0 && Date.now() - warm < 4000;
    // A read this recent needs nothing -- except when the computer itself just
    // pushed an event saying this tab changed ("force"): that is newer
    // evidence than the four-second window, and ignoring it is what made an
    // event-pushed change wait for the next poll.
    if (fresh && !force) return;
    if (warm === 0 && silent) {
      // A background prefetch of a tab that has never drawn anything: no
      // skeleton is wanted, the read itself delivers the first content.
      tabWarmAt[name] = Date.now();
      run(true);
      return;
    }
    if (warm !== 0) {
      if (relayBudgetPaused() || !window.__CLIPSYNC_REMOTE__.online) return;
      tabWarmAt[name] = Date.now();
      run(true);
      return;
    }
    // First visit to this tab: show the ordinary loading state, because there
    // is nothing cached to draw and a blank panel reads as a broken page.
    tabWarmAt[name] = Date.now();
    run(false);
  }

  // The initial read of the active tab is issued while the relay is still
  // being dialled.  If the handshake takes longer than that read's timeout, the
  // tab is left holding 加载失败 (or a skeleton) until its next 5 s poll -- even
  // though the computer may have answered a second later.  When the relay
  // comes online, redo that read at once, silently, so an already-rendered tab
  // is not blanked and a failed one does not stay failed.
  function refreshRelayTab() {
    if (document.visibilityState && document.visibilityState !== 'visible') return;
    // Silent, always: this runs on the first handshake and on every reconnect,
    // and it must not blank a panel that is already showing the reader's
    // history or conversation a second time in a row.
    loadTab(activeTabName(), true);
    // Fill the tabs the reader is not on, once per handshake, in the
    // background: the first tap on a cold tab then draws from memory instead
    // of waiting for the broker.
    setTimeout(prefetchRelayTabs, 250);
  }

  /*
   * Read the two cheapest non-active tabs once, one at a time.
   *
   * The desktop caps a remote token at 20 requests a minute, the page's poll
   * uses part of it, and the reader's own actions need room, so the eager
   * prefetch is deliberately small: files and favourites are one read each and
   * are the tabs whose empty/loading state reads as "broken" the longest.
   * Transfers and chat pay their own round trip on first tap instead.
   */
  function prefetchRelayTabs() {
    if (!window.__CLIPSYNC_REMOTE__ || !window.__CLIPSYNC_REMOTE__.online) return;
    if (document.visibilityState && document.visibilityState !== 'visible') return;
    if (relayBudgetPaused()) return;
    var active = activeTabName();
    var jobs = [];
    if (active !== 'files') jobs.push('files');
    if (active !== 'favorites') jobs.push('favorites');
    var run = function (index) {
      if (index >= jobs.length) return;
      if (relayBudgetPaused() || !window.__CLIPSYNC_REMOTE__.online) return;
      loadTab(jobs[index], true);
      setTimeout(function () { run(index + 1); }, 400);
    };
    run(0);
  }

  // How many consecutive failed reconnects a bookmarked page has shown.  A
  // saved pairing keeps working forever *unless* the computer's access token
  // was rotated -- there is no HTTP status for "wrong key", only silence -- so
  // after a while say the one thing that can fix it.
  var relayRetryCount = 0;
  var relayRescanHintShown = false;

  function showRelayState(info) {
    var bar = document.getElementById('relayBar');
    if (!bar || !info) return;
    if (relayHideTimer) { clearTimeout(relayHideTimer); relayHideTimer = null; }
    if (info.state === 'online') {
      relayRetryCount = 0;
      // Connected is the normal state: say so once, then get out of the way so
      // a green band does not read as something that needs attention.
      bar.className = 'relay-bar relay-bar--ok';
      bar.textContent = relayLabel(info);
      bar.style.display = 'flex';
      relayHideTimer = setTimeout(function () { bar.style.display = 'none'; }, 2200);
      if (!relayWasOnline) {
        relayWasOnline = true;
        setTimeout(refreshRelayTab, 0);
      }
      return;
    }
    relayWasOnline = false;
    if (info.state === 'retrying') {
      relayRetryCount += 1;
      if (!relayRescanHintShown && relayRetryCount >= 5 &&
          window.__CLIPSYNC_REMOTE__ &&
          typeof window.__CLIPSYNC_REMOTE__.resumedPairing === 'function' &&
          window.__CLIPSYNC_REMOTE__.resumedPairing()) {
        relayRescanHintShown = true;
        showToast(T.relayRescanHint, true);
      }
    }
    var text = relayLabel(info);
    if (!text) { bar.style.display = 'none'; return; }
    bar.className = 'relay-bar';
    bar.innerHTML = '<span class="relay-bar__spinner" aria-hidden="true"></span><span></span>';
    bar.lastChild.textContent = text;
    bar.style.display = 'flex';
  }
  document.getElementById('tabHistory').textContent = T.tabHistory;

  document.getElementById('tabFiles').textContent = T.tabFiles;

  // Which edges of the tab bar still have content past them.  Selecting a tab
  // has to bring it inside the bar as well as mark it: on a phone the last of
  // the seven is off the right edge, so without this a reader taps a tab and
  // it stays half outside the bar they tapped it in.
  var tabBar = document.querySelector('.tabs');

  function syncTabEdges() {
    if (!tabBar) return;
    var max = tabBar.scrollWidth - tabBar.clientWidth;
    tabBar.classList.toggle('tabs--more-left', tabBar.scrollLeft > 2);
    tabBar.classList.toggle('tabs--more-right', max > 2 && tabBar.scrollLeft < max - 2);
  }

    // sight: seven words on their own do not say they switch panels.
    tabBar.setAttribute('aria-label', T.tabsLabel);
    tabBar.addEventListener('scroll', syncTabEdges, { passive: true });
    window.addEventListener('resize', syncTabEdges);

     and the panel are three answers to one question, so they are set in one
     place.  Only the class changed before, which is why the roles alone would
     have lied — a reader would have been told all seven were unselected. */
  function selectTab(tab) {
    tabs.forEach(function (t) {
      t.classList.remove('tab--active');
      t.setAttribute('aria-selected', t === tab ? 'true' : 'false');
      t.tabIndex = t === tab ? 0 : -1;
    });
    tab.classList.add('tab--active');
    if (tab.scrollIntoView) {
      tab.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
    syncTabEdges();
    var name = tab.getAttribute('data-tab');
    panels.forEach(function (p) {
      p.classList.toggle('panel--active', p.id === 'panel' + name.charAt(0).toUpperCase() + name.slice(1));
    });

    tab.addEventListener('click', function () { selectTab(tab); });
    // A tablist is one stop in the tab order with the arrows moving inside it —
    // that is what the role promises, and without it a keyboard user walked
    // through seven stops to get past a bar they were only passing.  The
    // selection follows the arrow rather than waiting for Enter, because these
    // panels are cheap reads and the second key would be busywork.
    tab.addEventListener('keydown', function (event) {

      else if (event.key === 'Home') next = 0;

  // visible. Paused when hidden to avoid background battery drain; tab
  // switching still reloads immediately.  Remote mode polls at half that rate:
  // the tunnel pushes events for the things that change, and every remote read
  // is a broker round trip against the desktop's request budget.
  var pollTicks = 0;
  var lastRemotePollAt = 0;
  function startPolling() {
    stopPolling();
    pollTimer = setInterval(function () {
      if (document.visibilityState !== 'visible') return;
      // A read issued while the relay is down or over budget does not fail
      // fast: tunnel requests queue behind the handshake.  Skipping the tick
      // keeps those waiters from piling up and flushing as a burst the moment
      // the relay returns (which itself would trip the desktop's rate limit).
      if (window.__CLIPSYNC_REMOTE__ && !window.__CLIPSYNC_REMOTE__.online) return;
      if (relayBudgetPaused()) return;
      if (window.__CLIPSYNC_REMOTE__) {
        var nowMs = Date.now();
        if (lastRemotePollAt && nowMs - lastRemotePollAt < 15000) return;
        lastRemotePollAt = nowMs;
      }
      pollTicks += 1;
      var name = activeTabName();
      if (name === 'history') loadHistory(true);
      else if (name === 'files') loadFiles(true);
      else if (name === 'chat') loadChat(true);
      else if (name === 'transfers') loadTransfers(true);
      else if (name === 'favorites') loadFavorites(true);
      else if (name === 'settings') loadSettings(true);
    }, 5000);
  }

  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

    if (document.visibilityState === 'visible') {

      // hold stale misses from before the screen slept.  Give it a fresh ping
      // before the first visible poll, otherwise the page rotates a healthy
      // tunnel the moment the reader comes back to it.
      if (window.__CLIPSYNC_REMOTE__ && typeof window.__CLIPSYNC_REMOTE__.wake === 'function') {
        window.__CLIPSYNC_REMOTE__.wake();
      }
      startPolling();
      // Refresh the active tab right away so the user sees fresh data.
      if (window.__CLIPSYNC_REMOTE__ && !window.__CLIPSYNC_REMOTE__.online) return;
      if (relayBudgetPaused()) return;
      loadTab(activeTabName(), true);

    }

  /* ── API helpers ───────────────────────────────────────────── */

  // Link and download targets (an <a href> navigation) cannot set an
  // Authorization header, so they keep the token in the URL.
  function apiUrl(path) {
    var sep = path.indexOf('?') !== -1 ? '&' : '?';
    return HOST + path + sep + 'token=' + encodeURIComponent(TOKEN);
  }

  // fetch() calls authenticate with `Authorization: Bearer`, so the token
  // stays out of their URLs.  The page itself is still opened with ?token=
  // (the QR bootstrap) and the static asset tags still carry it.
  function authHeaders(headers) {
    var merged = Object.assign({}, headers || {});
    if (TOKEN) {
      merged['Authorization'] = 'Bearer ' + TOKEN;
    }
    return merged;
  }

  var REQUEST_TIMEOUT = 8000;

  // fetch wrapper with an AbortController timeout so a phone on a different
  // network doesn't hang over shimmering skeletons indefinitely.
  function fetchWithTimeout(url, options) {
    var opts = options || {};
    var controller = new AbortController();
    opts.signal = controller.signal;
    var timer = setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT);
    return fetch(url, opts).then(function (r) {
      clearTimeout(timer);
      return r;
    }).catch(function (e) {
      clearTimeout(timer);
      if (e && e.name === 'AbortError') {
        var err = new Error('timeout');
        err.timeout = true;
        throw err;
      }
      throw e;
    });
  }

  /*
   * A poll or a tab read that meets the desktop's pacing gets two short
   * retries before it is reported: a 429 is the computer asking for a beat,
   * and the read is cheap, so waiting it out is better than painting "failed"
   * over a panel that is merely a second late.
   */
  var READ_RETRY_DELAYS = [1200, 2600];

  function getJson(path, attempt) {
    return fetchWithTimeout(HOST + path, { headers: authHeaders(null) }).then(function (r) {
      if (!r.ok) {
        if (r.status === 429) {
          noteRelayBudgetSpent();
          if ((attempt || 0) < READ_RETRY_DELAYS.length) {
            return new Promise(function (resolve) {
              setTimeout(resolve, READ_RETRY_DELAYS[attempt || 0]);
            }).then(function () { return getJson(path, (attempt || 0) + 1); });
          }
        }
        var e = new Error('HTTP ' + r.status);
        e.status = r.status;
        throw e;
      }
      return r.json();
    });
  }

  // fetch helper that always resolves to {status, data} so callers can inspect
  // the HTTP status (403 = stale token) alongside the parsed body — shared by
  // the send flow and file delete so both treat 403 identically.  getJson
  // (used by the polling refresh paths) keeps its own error-throwing behavior.
  function apiFetch(path, opts) {
    return apiFetchAttempt(path, opts, 0);
  }

  /*
   * A user action is worth a retry: the desktop paces remote reads, and an
   * "open all the tabs quickly" burst can land a poll on the same second as
   * "send" or "delete".  That used to surface as a failed action even though a
   * later attempt would go through.  A 429 is the desktop asking to slow down,
   * not a broken feature, so wait out the sliding window and try again -- three
   * retries with growing gaps, long enough for the window to free.
   */
  var API_RETRY_DELAYS = [1200, 2500, 5000];

  function apiFetchAttempt(path, opts, attempt) {
    var options = Object.assign({}, opts || {});
    options.headers = authHeaders(opts && opts.headers);
    return fetchWithTimeout(HOST + path, options).then(function (r) {
      if (r.status === 429) {
        noteRelayBudgetSpent();
        if (attempt < API_RETRY_DELAYS.length) {
          return new Promise(function (resolve) {
            setTimeout(resolve, API_RETRY_DELAYS[attempt]);
          }).then(function () { return apiFetchAttempt(path, opts, attempt + 1); });
        }
      }
      return r.json().then(function (data) {
        return { status: r.status, data: data };
      });
    });
  }

  /*
   * The desktop's remote tunnel allows 20 requests a minute per token.  A LAN
   * page never meets that limit, but over the relay the phone's 5 s poll plus
   * a chat tab (three reads a tick) can; a rejected read is quick, so without
   * this the page keeps hammering the same ceiling and looks stale instead of
   * slow.  Every 429 is recorded and both the poll and the tab prefetch stand
   * down until the window has slid.
   */
  var relayRateLimitedAt = 0;

  function noteRelayBudgetSpent() { relayRateLimitedAt = Date.now(); }

  function relayBudgetPaused() {
    return relayRateLimitedAt !== 0 && Date.now() - relayRateLimitedAt < 10000;
  }

  /* ── Toast ─────────────────────────────────────────────────── */

  /* Long enough to read a sentence, not just to see that something happened:
     2.4 s was under a comfortable reading time for a Chinese sentence, and a new
     toast replaced the old one outright, so a message that arrived while the
     reader was looking elsewhere was simply never read.  A failure stays
     longer than a success because it is read rather than glanced at — and it
     interrupts the screen reader rather than queuing behind the last one. */
  var TOAST_MS = 3500;
  var TOAST_ERROR_MS = 5000;

     The sidecar answers with an English `error` string plus a stable `code`;
     choosing the sentence here is what keeps a Chinese page from saying
     `not available` to someone who cannot act on it.  A code this table does
     not know keeps the server's own words — a guess would be worse than the
     truth, and `error` is always there. */
  var ERR_CODE_TEXT = {
    unavailable: ZH
      ? '电脑上的 ClipSync 没在运行，先在电脑上打开它再试。'
      : 'ClipSync is not running on the computer. Start it there and try again.',
    not_found: ZH ? '这条内容已经不在了。' : 'That item is no longer there.',
    bad_request: ZH
      ? '这次请求电脑没有看懂，刷新页面后再试一次。'
      : 'The computer could not read this request. Reload and try again.',
    bad_url: ZH ? '只支持 http 或 https 链接。' : 'Only http and https links are supported.',
    bad_path: ZH
      ? '这个位置不在接收文件夹里。'
      : 'That location is not inside the received-files folder.',
    failed: ZH
      ? '电脑那边没有做成这件事，稍后再试一次。'
      : 'The computer could not finish that. Try again in a moment.',
    server_error: ZH
      ? '电脑上出了问题，详情在桌面端的日志里。'
      : 'Something went wrong on the computer — the desktop log has the details.',

     own sentence about what it was trying to do. */

    return body.error || fallback;

  /* Offered once, and only while it is true: the page declares a manifest and
     runs standalone, so a reader who installs it gets a faster entry point than
     the address bar, and nobody ever told them.  iOS cannot be prompted at all
     — the Share sheet is the only route — so there the bar is a sentence.

  var INSTALL_KEY = 'clipsync.installDismissed';
  var installBar = document.getElementById('installBar');
  var installText = document.getElementById('installText');
  var installBtn = document.getElementById('installBtn');
  var installClose = document.getElementById('installClose');
  var deferredInstall = null;

  function installDismissed() {
    try { return localStorage.getItem(INSTALL_KEY) === '1'; } catch (e) { return false; }
  }

  function hideInstallBar() {
    if (installBar) installBar.style.display = 'none';
  }

  function showInstallBar(text) {
    if (!installBar || installDismissed()) return;
    installText.textContent = text;

    if (!installBar) return;

        window.navigator.standalone === true;

    if (standalone) return;
    var ua = navigator.userAgent || '';
    // iPadOS reports itself as a Mac; the touch points are what gives it away.
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if (isIOS) showInstallBar(T.installIos);

    installClose.addEventListener('click', function () {
      try { localStorage.setItem(INSTALL_KEY, '1'); } catch (e) { /* private mode */ }

  var tokenExpiredNotified = false;

     then an empty list with everything below it still polling, so the phone
     looked like a working app that had lost its data.  A refused token cannot
     be recovered by waiting, so the way out has to stay on screen — the reason,
     and the one thing that fixes it.  Built here rather than in the markup so
     the two languages stay in `T` with every other string on this page. */
  function showTokenExpiredPage() {
    var existing = document.getElementById('tokenExpired');
    if (existing) { existing.hidden = false; return; }
    var panel = document.createElement('div');

          'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +

        '<p id="tokenExpiredHint">' + esc(T.tokenExpiredHint) + '</p>' +
        '<button type="button" class="dead-end__retry" id="tokenExpiredRetry">' + esc(T.tokenExpiredRetry) + '</button>' +

         in the middle of a poll, with the caret on a tab that no longer does
         anything; leaving it there is leaving them on a dead control. */
      try { retry.focus(); } catch (e) {}
    }

  function typeIcon(ct) {
    var t = (ct || '').toUpperCase();
    if (t === 'TEXT' || t === 'HTML' || t === 'RTF') return '📝';
    if (t.indexOf('IMAGE') === 0) return '🖼';
    if (t === 'FILE') return '📄';
    return '📋';
  }

  /* A clip with no text of its own is stored under a bracketed English label
     ("[Image]"), which is a label rather than the user's words -- so the phone
     says the same thing in its own language.  "[HTML]" needs no entry: it is
     the format's name in both. */
  var PREVIEW_LABELS = {
    '[Image]': 'tImage',
    '[Vector Image]': 'tVectorImage',
    '[Rich Text]': 'tRichText',
  };

  function previewText(item) {
    // The stored label of an older vector row is "[Vector Image]", but the row
    // has a bitmap beside it now; the kind is the honest label, and the modal
    // will show the picture.
    if (item.content_type && String(item.content_type).toUpperCase().indexOf('IMAGE') === 0) {
      return T.tImage;
    }
    var preview = item.text_preview || '';
    // hasOwnProperty, not a bare lookup: the key comes from stored content,
    // and `PREVIEW_LABELS['constructor']` is a function rather than a key.
    if (!Object.prototype.hasOwnProperty.call(PREVIEW_LABELS, preview)) return preview;
    return T[PREVIEW_LABELS[preview]] || preview;
  }

  function relTime(ts) {
    if (!ts) return '';
    var d = Math.floor(Date.now() / 1000) - ts;
    if (d < 60) return T.timeJust;
    if (d < 3600) return Math.floor(d / 60) + T.timeMin;
    if (d < 86400) return Math.floor(d / 3600) + T.timeHour;
    return Math.floor(d / 86400) + T.timeDay;
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ── What a search box read, and the marks it leaves ─────────
     The server owns the verdict (internal/application/use_cases/search.py):
     whitespace separates terms, every term must be found, a quoted run counts
     as one phrase.  This is the same reading for the one thing the server
     cannot do — mark the words that made the row survive.  It matters because
     a term may match a field the row does not show in the same place: the
     words sit in the body, the application name in the meta line, so without
     the mark a searched list reads as an arbitrary rearrangement of rows. */
  var SEARCH_OPENERS = { '"': '"', '\u201c': '\u201d' };

  function searchTerms(query) {
    var text = String(query == null ? '' : query);
    var out = [];
    var buf = '';
    var closer = '';
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (closer) {
        if (ch === closer) {
          if (buf) out.push(buf);
          buf = '';
          closer = '';
        } else {
          buf += ch;
        }
        continue;
      }
      if (SEARCH_OPENERS[ch]) {
        if (buf) out.push(buf);
        buf = '';
        closer = SEARCH_OPENERS[ch];
        continue;
      }
      // /\s/ already covers the full-width space an IME inserts.
      if (ch === '\u201d' || /\s/.test(ch)) {
        if (buf) out.push(buf);
        buf = '';
        continue;
      }
      buf += ch;
    }
    if (buf) out.push(buf);
    return out
      .map(function (term) { return term.toLowerCase(); })
      .filter(function (term) { return !!term; });
  }

  // Escape everything but the terms: the text comes from a clipboard, so it is
  // built as HTML only after every sliver has been through esc().  Longer terms
  // are tried first so "note" inside "notes" does not win the split.
  function highlightMarks(text, query) {
    var raw = String(text == null ? '' : text);
    var terms = searchTerms(query);
    if (!terms.length) return esc(raw);
    var pattern = terms
      .slice()
      .sort(function (a, b) { return b.length - a.length; })
      .map(function (term) { return term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); })
      .join('|');
    var re = new RegExp('(' + pattern + ')', 'gi');
    var out = '';
    var last = 0;
    var match;
    while ((match = re.exec(raw)) !== null) {
      if (!match[0]) { re.lastIndex += 1; continue; }
      out += esc(raw.slice(last, match.index)) + '<mark>' + esc(match[0]) + '</mark>';
      last = match.index + match[0].length;
    }
    return out + esc(raw.slice(last));
  }

  var historyLoading = false;
  var historyOffset = 0;
  var historyHasMore = true;
  /* ── History search / kind / sort ─────────────────────────────
     The phone's own copy of the window's history toolbar.  The server owns
     the filtering (GET /api/history?q=&kind=&sort=), so these three are only
     the request's parameters: changing any of them invalidates every loaded
     page and reloads from offset 0.  `historyCounts` is the server's chip
     badges and `historyHasAny` is `has_history` — whether there is any clip
     at all, which is what keeps the chip rail on screen when a search
     matches nothing. */
  var historyQuery = '';
  var historyKind = 'all';
  var historySort = 'newest';
  /* Which machine's clips only.  Empty means every source; `local` means
     the rows captured here, whose `source_device` is empty and which an
     empty query parameter therefore could not tell apart from "no
     filter".  The value is the row's own `source_device`, and the label
     beside it is what the reader tapped. */
  var historySource = '';
  var historySourceLabel = '';
  var historyCounts = null;
  var historyHasAny = false;
  /* Which request owns `historyItems`.  A 5s poll can still be in flight when
     the reader changes the filter; that request is about the filter they just
     left, so its rows are exactly the ones being filtered out.  Bumped by every
     filter change and by every request sent, so an answer only writes if it is
     still the newest. */
  var historyRequestId = 0;
  /* A filter change that arrived while a request was in flight.  `loadHistory`
     refuses to overlap requests, so the change would otherwise be dropped and
     wait for the next poll — up to five seconds of a chip that lies. */
  var historyReloadPending = false;
  var HIST_KINDS = [
    { id: 'all', label: 'histKindAll', icon: '' },
    { id: 'text', label: 'histKindText', icon: '' },
    { id: 'image', label: 'histKindImage', icon: '' },
    { id: 'file', label: 'histKindFile', icon: '' },
    { id: 'link', label: 'histKindLink', icon: '' }
  ];

  // Every history GET goes through here so the calibration download and the
  // load-more request cannot silently drop the active filter.
  function historyUrl(opts) {
    opts = opts || {};
    var parts = ['limit=' + (opts.limit != null ? opts.limit : 30)];
    if (opts.offset) parts.push('offset=' + opts.offset);
    if (historyQuery) parts.push('q=' + encodeURIComponent(historyQuery));
    if (historyKind && historyKind !== 'all') parts.push('kind=' + encodeURIComponent(historyKind));
    if (historySort && historySort !== 'newest') parts.push('sort=' + encodeURIComponent(historySort));
    if (historySource) parts.push('source=' + encodeURIComponent(historySource));
    return '/api/history?' + parts.join('&');
  }

  function historyFilterActive() {
    return !!historyQuery || historyKind !== 'all' || historySort !== 'newest' || !!historySource;
  }

  var histSourceBar = document.getElementById('histSourceBar');
  var histSourceText = document.getElementById('histSourceText');

  /* The chip that names the source filter.  It is drawn from the same two
     variables the request is built from, so what the reader sees and what
     the server was asked cannot drift apart. */
  function renderHistorySource() {
    if (!histSourceBar) return;
    histSourceBar.style.display = historySource ? 'flex' : 'none';
    if (!historySource) return;
    var name = historySourceLabel ||
      (historySource === 'local' ? T.histSourceLocal : historySource);
    histSourceText.textContent = T.histSourceActive.replace('{name}', name);
  }

  /* Narrow the list to one machine.  Tapping the label of the source
     already filtered by is a no-op rather than a reload: the row's chip
     says so with `aria-pressed`. */
  function setHistorySource(device, label) {
    if (historySource === device) return;
    historySource = device;
    historySourceLabel = label || '';
    renderHistorySource();
    reloadHistoryFromStart();
  }

  if (histSourceBar) {
    var histSourceClear = document.getElementById('histSourceClear');
    histSourceClear.addEventListener('click', function () {
      setHistorySource('', '');
    });
  }

  // Drop every loaded row and reload page 1.  Called when the query, the chip
  // or the sort changes: the pages already in `historyItems` belong to the
  // previous filter, so keeping them would show rows the filter excludes.
  function reloadHistoryFromStart() {
    historyItems.splice(0, historyItems.length);
    historyOffset = 0;
    historyHasMore = true;
    _lastCalibMobile = null;
    // Retire the request in flight before asking for a new one: whatever it is
    // carrying belongs to the filter the reader just left, and applying it
    // would put rows back that this filter excludes — and drag the chip
    // highlight back to what the server echoed.
    historyRequestId += 1;
    historyReloadPending = true;
    // Draw the empty list now.  The rows on screen are indexed against
    // `historyItems`, which is empty from the line above: leaving them up until
    // a request lands leaves live-looking rows that open nothing (`openItem`
    // would read `historyItems[i]` as undefined), and a load that has to wait
    // for an in-flight poll to finish would leave them up for seconds.
    renderHistory();
    loadHistory();
  }

  /* The rail is built once and then only updated.
     It used to be rebuilt on every response — including the 5 second poll —
     and the rebuild cost two things the reader had already chosen: the rail's
     horizontal position (six chips do not fit on a phone, so it is scrolled)
     and keyboard focus, which fell back to the body mid-tap.  Only the counts
     and the highlight can actually change, so only they are written. */
  var historyChipNodes = null;
  var historySortNode = null;

  function buildHistoryChips() {
    historyChipNodes = {};
    histChips.innerHTML = '';
    HIST_KINDS.forEach(function (chip) {
      var el = document.createElement('button');
      el.type = 'button';
      var label = document.createElement('span');
      label.textContent = T[chip.label];
      var countEl = document.createElement('span');
      countEl.className = 'chip__count';
      countEl.style.display = 'none';
      el.appendChild(label);
      el.appendChild(countEl);
      el.addEventListener('click', function () {
        if (historyKind === chip.id) return;
        historyKind = chip.id;
        renderHistoryChips();
        reloadHistoryFromStart();
      });
      histChips.appendChild(el);
      historyChipNodes[chip.id] = { el: el, countEl: countEl };
    });
    var sortEl = document.createElement('button');
    sortEl.type = 'button';
    sortEl.className = 'chip chip--sort';
    sortEl.title = ZH ? '切换历史排序（最新 / 最旧）' : 'Toggle history order (newest / oldest)';
    sortEl.addEventListener('click', function () {
      historySort = historySort === 'newest' ? 'oldest' : 'newest';
      renderHistoryChips();
      reloadHistoryFromStart();
    });
    histChips.appendChild(sortEl);
    historySortNode = sortEl;
  }

  function renderHistoryChips() {
    // The rail needs something to filter: with no history at all there is no
    // point to a chip row, so the whole toolbar hides with the list.
    histTools.style.display = historyHasAny ? 'block' : 'none';
    if (!historyHasAny) return;
    if (!historyChipNodes) buildHistoryChips();
    HIST_KINDS.forEach(function (chip) {
      var node = historyChipNodes[chip.id];
      if (!node) return;
      var active = historyKind === chip.id;
      // A chip whose count is 0 under the current search is still tappable —
      // disabling it would strand the user on a filter they cannot switch
      // away from if every other chip is also 0.
      node.el.className = 'chip' + (active ? ' chip--active' : '');
      node.el.setAttribute('aria-pressed', active ? 'true' : 'false');
      var count = historyCounts ? historyCounts[chip.id] : null;
      node.countEl.textContent = count == null ? '' : String(count);
      // Hidden rather than empty: `.chip__count` carries its own spacing, and
      // an empty one would sit there as a gap with nothing in it.
      node.countEl.style.display = count == null ? 'none' : '';
    });
    historySortNode.textContent = historySort === 'newest' ? T.histSortNewest : T.histSortOldest;
  }

  var historySearchTimer = null;
  histSearch.addEventListener('input', function () {
    var value = histSearch.value || '';
    histSearchClear.hidden = !value;
    // Debounced: a 5s poll can land mid-typing, and one request per keystroke
    // would race the poll for the same list.
    if (historySearchTimer) clearTimeout(historySearchTimer);
    historySearchTimer = setTimeout(function () {
      historySearchTimer = null;
      if (value.trim() === historyQuery) return;
      historyQuery = value.trim();
      reloadHistoryFromStart();
    }, 250);
  });
  histSearch.addEventListener('search', function () {
    // The platform's own "search" event (Enter, or WebKit's cancel button).
    if (!histSearch.value) {
      if (historySearchTimer) { clearTimeout(historySearchTimer); historySearchTimer = null; }
      histSearchClear.hidden = true;
      if (historyQuery) { historyQuery = ''; reloadHistoryFromStart(); }
    }
  });
  histSearchClear.addEventListener('click', function () {
    histSearch.value = '';
    histSearchClear.hidden = true;
    if (historySearchTimer) { clearTimeout(historySearchTimer); historySearchTimer = null; }
    // Only the query: the button says "clear search", and a chip the reader
    // picked on purpose is not part of what they asked to clear.
    if (historyQuery) {
      historyQuery = '';
      reloadHistoryFromStart();
    }
    histSearch.focus();
  });

  // Mobile has no store object, so it keeps its own copy of the load-more
  // cursor convention (offset = visible length pinned to total; hasMore =
  // length < total, preserved when total is unknown).  Keep in step with
  // store.setHistoryCursor().
  function _setHistCursor(total) {
    historyOffset = (total != null) ? Math.min(historyItems.length, total) : historyItems.length;
    historyHasMore = (total != null) ? (historyItems.length < total) : historyHasMore;
  }
  // Timestamp of the last full-history calibration (limit=total).  A full
  // download is expensive, so it is throttled to one per 30s per client —
  // inside the window the cursor is pinned but no refetch happens.  EVERY
  // terminal state (success write-back and failure) stamps it, so a
  // persistently-failing calibration backs off instead of re-entering a full
  // download on every poll (mirrors store.calibrateHistory).
  var _lastCalibMobile = null;

  // Reconcile a page-1 snapshot into the already-loaded list (dedupe by
  // entry_id, upsert in place, prepend genuinely-new entries).  When
  // *pruneMissing* is true — the NOT-paged path, where the snapshot is fully
  // authoritative — entries the snapshot no longer reports are dropped FIRST,
  // so items deleted on the desktop can't linger as ghost rows.  The paged
  // path (length > limit) calls with pruneMissing=false: the snapshot only
  // governs the first page, so pruning would collapse loaded pages 31..N on
  // every 5s poll; deletions there heal via the WS broadcast / next load-more,
  // and the caller trims the tail to the snapshot's `total` when present.
  // The load-more path (offset>0) never prunes; it stays a pure append merge.
  function mergeHistoryPage(items, pruneMissing) {
    var snapshotIds = {};
    for (var si = 0; si < items.length; si++) {
      var sit = items[si];
      if (sit && sit.entry_id !== undefined) snapshotIds[sit.entry_id] = true;
    }
    if (pruneMissing) {
      for (var pr = historyItems.length - 1; pr >= 0; pr--) {
        var cur = historyItems[pr];
        if (cur && cur.entry_id !== undefined && !snapshotIds[cur.entry_id]) {
          historyItems.splice(pr, 1);
        }
      }
    }
    var idxById = {};
    for (var i = 0; i < historyItems.length; i++) {
      var cur2 = historyItems[i];
      if (cur2 && cur2.entry_id !== undefined) idxById[cur2.entry_id] = i;
    }
    var fresh = [];
    for (var j = 0; j < items.length; j++) {
      var inc = items[j];
      if (!inc) continue;
      var found = (inc.entry_id !== undefined && idxById[inc.entry_id] !== undefined) ? idxById[inc.entry_id] : -1;
      if (found !== -1) {
        historyItems[found] = inc;
      } else {
        fresh.push(inc);
      }
    }
    for (var k = fresh.length - 1; k >= 0; k--) {
      historyItems.unshift(fresh[k]);
    }
    return fresh.length;
  }

  // Hand the single in-flight slot back, and say whether the response that just
  // landed is still the one the list is waiting for.  A response that lost the
  // race is dropped whole — not merged, and its echoed `kind`/`sort` not
  // trusted — because the row it would add is filtered out by the chip the
  // reader just chose, and the chip it would move back is the one they tapped.
  function historySettled(requestId) {
    historyLoading = false;
    if (requestId !== historyRequestId) {
      if (historyReloadPending) {
        historyReloadPending = false;
        loadHistory();
      }
      return false;
    }
    historyReloadPending = false;
    return true;
  }

  function loadHistory(silent, appendOffset) {
    // One request at a time (poll ticks, load-more and user-initiated loads all
    // come through here), so slow responses cannot overlap and render out of
    // order.  A load that arrives mid-flight leaves a note rather than
    // disappearing: see `historyReloadPending`.
    if (historyLoading) {
      // Remember it rather than dropping it: a changed filter with nothing
      // scheduled behind it is a list that stays empty until the next poll.
      if (!silent) historyReloadPending = true;
      return;
    }
    historyLoading = true;
    // The generation this response will be checked against when it lands.
    var requestId = ++historyRequestId;
    var isAppend = (appendOffset !== undefined && appendOffset !== null);
    // Silent background refreshes and pagination appends keep the current list
    // on screen; only the user-initiated first load shows the skeleton.
    if (!silent && !isAppend) {
      historyList.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    }
    var url = historyUrl(isAppend && appendOffset > 0 ? { offset: appendOffset } : {});
    getJson(url)
      .then(function (data) {
        if (!historySettled(requestId)) return;
        var items = (data.items || []).slice(0, 30);
        var total = data.total != null ? data.total : null;
        // The server's chip badges and "is there anything to filter".  Taken
        // from every response, including appends, so the counts track rows
        // added on the desktop while this page stays open.
        if (data.counts) historyCounts = data.counts;
        if (data.has_history != null) historyHasAny = !!data.has_history;
        // Trust the server's echo over the local value: an unknown kind is
        // answered as "all", and a chip highlighted for a filter the server
        // ignored would be a lie.
        if (data.kind) historyKind = data.kind;
        if (data.sort) historySort = data.sort;
        renderHistoryChips();
        if (isAppend) {
          // Append the next page, deduping against what is already loaded so a
          // raced poll + scroll can't show the same entry twice.
          var seen = {};
          for (var i = 0; i < historyItems.length; i++) {
            var cur = historyItems[i];
            if (cur && cur.entry_id !== undefined) seen[cur.entry_id] = true;
          }
          var added = 0;
          for (var j = 0; j < items.length; j++) {
            var it = items[j];
            if (!it) continue;
            if (it.entry_id === undefined || !seen[it.entry_id]) {
              if (it.entry_id !== undefined) seen[it.entry_id] = true;
              historyItems.push(it);
              added++;
            }
          }
          historyHasMore = (total != null) ? (historyItems.length < total) : (added > 0);
        } else if (historyItems.length > 30) {
          // Refresh of page 1 (offset=0) while more pages are loaded.  The
          // snapshot is authoritative only for the FIRST page — pruning from
          // it would collapse the 31..N pages the user already loaded on every
          // 5s poll.  Merge in place (upsert/prepend) WITHOUT pruning; deleted
          // entries heal via the full calibration below, the next load-more,
          // or a full refresh.  History is ordered pinned-DESC, timestamp-DESC,
          // so a deleted row can sit at the TOP (pinned) or in the MIDDLE — a
          // tail-trim would evict LIVE oldest entries and keep the ghost, and
          // mobile has no WS broadcast to self-heal from.  When the snapshot's
          // `total` says the loaded list has ghosts (length > total), fetch the
          // authoritative list (limit=total returns every remaining item) and
          // replace wholesale.
          mergeHistoryPage(items, false);
          if (total != null && historyItems.length > total) {
            // Full calibration: fetch the authoritative list at limit=total
            // and replace wholesale — the contract is replace, recompute the
            // cursor, re-render — plus a 30s throttle (mobile's 5s poll
            // self-heals, but a full limit=total download on every ghosted
            // poll is wasteful).
            var calibNow = Date.now();
            if (_lastCalibMobile && (calibNow - _lastCalibMobile) < 30000) {
              // Throttled — just pin the cursor so Load-more can't skip live
              // entries; the next poll retries after the window elapses.
              _setHistCursor(total);
              renderHistory();
              return;
            }
            historyLoading = true;
            // The calibration refetch must carry the active filter too, or it
            // would replace a filtered list with every row on the machine.
            getJson(historyUrl({ limit: total }))
              .then(function (calData) {
                // The calibration is a second round trip, so the filter can
                // have moved on inside it just as easily — and this branch
                // rewrites the whole list from its answer.
                if (requestId !== historyRequestId) {
                  historyLoading = false;
                  return;
                }
                historyLoading = false;
                _lastCalibMobile = Date.now();
                var calItems = (calData.items || []).slice(0, total);
                historyItems.splice(0, historyItems.length);
                for (var c = 0; c < calItems.length; c++) {
                  if (calItems[c] == null) continue;  // never store a malformed row
                  historyItems.push(calItems[c]);
                }
                _setHistCursor(calData.total != null ? calData.total : null);
                renderHistory();
              })
              .catch(function () {
                if (requestId !== historyRequestId) {
                  historyLoading = false;
                  return;
                }
                historyLoading = false;
                // Calibration failed — pin the cursor to min(length, total) so
                // Load-more can't skip live entries (mirrors the shared
                // function's failure path) and re-render so the list reflects
                // the current state.  A terminal state: stamp the throttle
                // budget so a persistently-failing server doesn't re-enter a
                // full download on every poll.
                _lastCalibMobile = Date.now();
                _setHistCursor(total != null ? total : null);
                renderHistory();
              });
            return;
          }
          historyHasMore = (total != null) ? (historyItems.length < total) : historyHasMore;
        } else {
          // Not paged: the page-1 snapshot is fully authoritative — prune rows
          // the snapshot no longer reports (desktop deletions) then merge in
          // place.  A cleared history arrives as an empty snapshot, which
          // prunes everything and empties the list.
          mergeHistoryPage(items, true);
          historyHasMore = (total != null) ? (historyItems.length < total) : true;
        }
        historyOffset = historyItems.length;
        renderHistory();
        // Remember that this tab has just been read: tab switches use the
        // marker to draw from memory instead of paying another round trip.
        tabWarmAt.history = Date.now();
      })
      .catch(function (err) {
        if (!historySettled(requestId)) return;
        // A 403 means the token this page was opened with is no longer valid
        // (it was regenerated / cleared) — tell the user to re-scan the QR
        // code, not to check Wi-Fi.  Surface it even on silent background
        // polls, otherwise the UI looks fresh while every refresh silently
        // 403s.
        if (err && err.status === 403) notifyTokenExpired();
        if (!silent) {
          var msg = (err && err.status === 403)
            ? esc(T.tokenExpired)
            : esc(T.loadFail) + '<br>' + esc(failHint(err));
          historyList.innerHTML = '<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__text">' + msg + '</div></div>';
        }
      });
  }

  /* The source label as a button, carrying the token the filter takes.
     `source_device` empty means "captured here", which the server knows as
     `local` — an empty parameter would be indistinguishable from no
     filter at all. */
  function sourceChip(item, label) {
    var device = item.source_device ? String(item.source_device) : 'local';
    var name = T.histSourceFilter.replace('{name}', function () { return label; });
    return '<button type="button" class="h-item__source" data-source="' + esc(device) + '"' +
      ' aria-pressed="' + (historySource === device ? 'true' : 'false') + '"' +
      ' title="' + esc(name) + '" aria-label="' + esc(name) + '">' + esc(label) + '</button>';
  }

  /* ── History: image thumbnails ───────────────────────────────
     A screenshot and a photo of a receipt were the same 🖼 in the list.
     The preview endpoint already answers a 320 px JPEG for the detail
     sheet, so the row reuses it — but that is a request per image row, and
     a phone on a relay pays read budget for every one.  Hence:
       · only rows near the viewport ask (IntersectionObserver, no shim);
       · at most five requests are in flight at once;
       · the answer is remembered by entry_id, so the 5 s poll's re-render
         neither re-asks nor flickers, and a failure is not retried on
         every poll either. */
  var THUMB_INFLIGHT_MAX = 5;
  var THUMB_CACHE_MAX = 240;
  var thumbCache = new Map();
  var thumbQueue = [];
  var thumbInflight = 0;
  var thumbObserver = null;

  function isImageRow(item) {
    return String((item && item.content_type) || '').toUpperCase().indexOf('IMAGE') === 0;
  }

  function thumbKey(item) {
    return item && item.entry_id ? String(item.entry_id) : '';
  }

  function paintThumb(node, url, key) {
    if (!node) return;
    // What the row was drawn with: the type icon is the fallback, not a
    // placeholder behind the picture.
    var fallback = node.innerHTML;
    node.className = 'h-item__icon h-item__icon--thumb';
    node.innerHTML = '';
    var img = document.createElement('img');
    img.className = 'h-item__thumb';
    // Decorative: the row's text already says what the clip is, and a
    // screen reader narrating "image" twice helps nobody.
    img.alt = '';
    img.decoding = 'async';
    // A preview the phone cannot decode — a truncated row, a codec it does
    // not have — is not a reason to leave a broken-image glyph in the
    // list.  Put the icon back, and remember the failure so the next
    // re-render does not ask again.
    img.addEventListener('error', function () {
      node.className = 'h-item__icon';
      node.innerHTML = fallback;
      if (key) rememberThumb(key, '');
    });
    img.src = url;
    node.appendChild(img);
  }

  function rememberThumb(key, url) {
    thumbCache.set(key, url);
    // Bounded: these are 10–24 KB strings each and a session scrolls past
    // hundreds of rows.  Oldest out first — a Map keeps insertion order.
    while (thumbCache.size > THUMB_CACHE_MAX) {
      var oldest = thumbCache.keys().next();
      if (!oldest || oldest.done) break;
      thumbCache.delete(oldest.value);
    }
  }

  function paintCachedThumb(node, key) {
    if (!thumbCache.has(key)) return false;
    var url = thumbCache.get(key);
    if (url) paintThumb(node, url, key);
    return true;
  }

  function pumpThumbs() {
    while (thumbInflight < THUMB_INFLIGHT_MAX && thumbQueue.length) {
      (function (task) {
        thumbInflight += 1;
        var settle = function () {
          thumbInflight -= 1;
          pumpThumbs();
        };
        getJson('/api/history/preview?entry_id=' + encodeURIComponent(task.key))
          .then(function (data) {
            var url = (data && data.image) ? data.image : '';
            rememberThumb(task.key, url);
            // A re-render replaces every row, so the node this task was
            // queued for may already be gone; painting it would be a write
            // to nothing (and `isConnected` is the cheap way to know).
            if (url && task.node && task.node.isConnected) paintThumb(task.node, url, task.key);
            settle();
          })
          .catch(function () {
            // Remembered as "no thumbnail" so a row that cannot be
            // previewed does not ask again on every poll.
            rememberThumb(task.key, '');
            settle();
          });
      })(thumbQueue.shift());
    }
  }

  /* One row wants its picture.  Near the viewport it is asked for now;
     further down the list it waits until it is scrolled towards. */
  function askThumb(node, key) {
    if (!node || !key) return;
    if (paintCachedThumb(node, key)) return;
    if (!thumbObserver) {
      thumbQueue.push({ key: key, node: node });
      pumpThumbs();
      return;
    }
    thumbObserver.observe(node);
  }

  /* The viewport as the root, not `.content`: an observation already
     accounts for the scroll container that clips the row, and reaching for
     the element here would race the script that assigns it. */
  function startThumbObserver() {
    if (thumbObserver || !window.IntersectionObserver) return;
    thumbObserver = new IntersectionObserver(function (entries) {
      for (var i = 0; i < entries.length; i++) {
        if (!entries[i].isIntersecting) continue;
        var node = entries[i].target;
        var key = node.getAttribute('data-thumb-key') || '';
        thumbObserver.unobserve(node);
        if (!key) continue;
        if (paintCachedThumb(node, key)) continue;
        thumbQueue.push({ key: key, node: node });
      }
      pumpThumbs();
    }, { rootMargin: '200px 0px' });
  }

  function renderHistory() {
    // The clear-all affordance only makes sense with something to clear.
    if (historyItems.length === 0) {
      // "No history" and "nothing matches" are different dead ends: the first
      // has nothing to suggest, the second has the filter itself as the way
      // out, and the chip rail above is that way out.
      if (historyFilterActive() && historyHasAny) {
        historyList.innerHTML = '<div class="empty"><div class="empty__icon">🔍</div><div class="empty__text">' +
          esc(T.histNoMatch) + '<br><span class="empty__hint">' + esc(T.histNoMatchHint) + '</span></div></div>';
      } else {
        historyList.innerHTML = '<div class="empty"><div class="empty__icon">📋</div><div class="empty__text">' + esc(T.emptyHistory) + '</div></div>';
      }
      return;
    }
    historyList.innerHTML = '';
    historyItems.forEach(function (item, i) {
      // `historyItems` is spliced empty the moment a filter changes, while the
      // rows on screen live one more frame.  A hole in the array is not a row.
      if (!item) return;
      var el = document.createElement('div');
      el.className = 'h-item';
      el.style.animation = 'none';
      // Which machine this clip came from: the phone can be the only screen
      // showing a history it did not capture, and "3 分钟前" alone does not
      // say whether to look for it on the laptop or the desktop.
      var source = (item.source_name || '').trim();
      if (!source && item.source_device) source = String(item.source_device);
      var meta = [];
      if (source) meta.push(sourceChip(item, source));
      meta.push(esc(relTime(item.timestamp)));
      // An image row asks for its thumbnail only once it is near the
      // viewport — see the thumbnail queue below.  The 🖼 stays underneath
      // until the picture arrives, and is what a failed one leaves behind.
      var thumb = isImageRow(item) ? thumbKey(item) : '';
      el.innerHTML =
        '<div class="h-item__icon"' + (thumb ? ' data-thumb-key="' + esc(thumb) + '"' : '') + '>' +
          typeIcon(item.content_type) +
        '</div>' +
        '<div class="h-item__body">' +
          '<div class="h-item__text">' + highlightMarks(previewText(item) || item.content_type || T.emptyPreview, historyQuery) + '</div>' +
          '<div class="h-item__meta">' + (item.pinned ? '📌 ' : '') + meta.join(' · ') + '</div>' +
        '</div>' +
        // A row the server cannot address has no actions to offer, so it
        // does not offer the button either.
        (item.entry_id
          ? '<button type="button" class="h-item__more" aria-label="' + esc(T.histMore) + '">⋯</button>'
          : '');
      el.addEventListener('click', function () { openItem(i); });
      // The source sits inside the row and inside its tap target, so it
      // has to stop the tap it answers from also opening the clip.
      var sourceBtn = el.querySelector('.h-item__source');
      if (sourceBtn) {
        sourceBtn.addEventListener('click', function (event) {
          event.stopPropagation();
          setHistorySource(sourceBtn.getAttribute('data-source'), source);
        });
      }
      if (thumb) askThumb(el.querySelector('.h-item__icon'), thumb);
      var moreBtn = el.querySelector('.h-item__more');
      if (moreBtn) {
        moreBtn.addEventListener('click', function (event) {
          event.stopPropagation();
          openRowSheet(item, moreBtn);
        });
      }
      historyList.appendChild(el);
    });
  }

  /* ── History: clear all ────────────────────────────────────── */

  var historyClearing = false;

  function clearAllHistory() {
    if (historyClearing) return;
    if (!window.confirm(T.histClearConfirm)) return;
    historyClearing = true;
    apiFetch('/api/history/clear', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
      .then(function (res) {
        historyClearing = false;
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok) {
          // Wipe the local list and pagination cursor — mirrors the desktop's
          // post-clear state so "load more" can't resurrect phantom pages.
          historyItems.splice(0, historyItems.length);
          historyOffset = 0;
          historyHasMore = false;
          // Nothing is left to filter, so the chip rail goes with the rows —
          // otherwise a search box would sit above an empty list.
          historyHasAny = false;
          historyCounts = null;
          // An emptied history has no sources to filter by, and a filter
          // left set would come back with the next clip captured.
          historySource = '';
          historySourceLabel = '';
          renderHistorySource();
          renderHistoryChips();
          renderHistory();
          showToast(T.histCleared);
        } else {
          showToast(apiError(res.data, T.histClearFail), true);
        }
      })
      .catch(function () {
        historyClearing = false;
        showToast(T.histClearFail + ' · ' + failHint(), true);
      });
  }

  // Infinite scroll: load the next history page when the list scrolls to the
  // bottom.  Only fires while the history tab is active; the append keeps the
  // current scroll position (the scrollTop property survives the re-render).
  var contentEl = document.querySelector('.content');
  startThumbObserver();
  contentEl.addEventListener('scroll', function () {
    if (activeTabName() !== 'history') return;
    if (historyLoading || !historyHasMore) return;
    if (contentEl.scrollTop + contentEl.clientHeight >= contentEl.scrollHeight - 48) {
      loadHistory(true, historyOffset);
    }
  });

  /* ── Pull to refresh ───────────────────────────────────────── */

  /* Only the two lists that grow from somewhere else: history is fed by the
     desktop, favourites by both sides.  Every other panel on this page holds
     what the reader just did, and re-reading it would answer nothing.
     The threshold is long on purpose (72 px of finger travel, damped to about
     32 px of chip movement) — a short one turns "scroll back to the top" into a
     refresh on the way past it. */
  var pullEl = document.getElementById('pull');
  var pullPill = document.getElementById('pullPill');
  var PULL_TRIGGER = 72;
  var PULL_MAX = 132;
  var PULL_DAMPING = 0.45;
  var PULL_RESTING = 40;
  var pullStartY = 0;
  var pullMoved = false;
  var pullReady = false;
  var pullBusy = false;
  var pullArmed = false;

  pullPill.textContent = T.pullDown;

  function pullPaint(offset, animate) {
    pullPill.style.transition = animate ? 'transform 180ms ease, opacity 120ms ease' : 'none';
    pullPill.style.transform = 'translateY(' + Math.round(offset - PULL_RESTING) + 'px)';
    pullPill.style.opacity = offset > 4 ? '1' : '0';
  }

  function pullLabel(text) {
    if (pullPill.textContent !== text) pullPill.textContent = text;
  }

  function pullReset() {
    pullMoved = false;
    pullReady = false;
    pullArmed = false;
    pullEl.classList.remove('pull--busy');
    pullPaint(0, true);
    // The text is put back after the fade, so the chip does not say "refreshing"
    // while it is still visible.
    setTimeout(function () { if (!pullBusy) pullLabel(T.pullDown); }, 200);
  }

  /* Neither loader returns a promise, but the chip has to stop saying
     "refreshing" when the read actually lands — a fixed delay would be a lie in
     both directions.  The loading flags are this page's own answer to that
     question; the ceiling is there so a request that never answers cannot leave
     a chip on the screen for good. */
  function pullWhenSettled(done) {
    var waited = 0;
    var tick = setInterval(function () {
      waited += 80;
      var busy = activeTabName() === 'favorites' ? favoritesLoading : historyLoading;
      if (!busy || waited >= 4000) {
        clearInterval(tick);
        done();
      }
    }, 80);
  }

  function pullRefresh() {
    pullBusy = true;
    pullEl.classList.add('pull--busy');
    pullLabel(T.pullBusy);
    pullPaint(PULL_RESTING, true);
    // Silent: the rows that are already on screen stay, and the chip above them
    // is what says something is happening.  A skeleton under a "refreshing"
    // chip is two answers to one question.
    if (activeTabName() === 'favorites') loadFavorites(true);
    else loadHistory(true);
    pullWhenSettled(function () {
      pullBusy = false;
      pullReset();
    });
  }

  contentEl.addEventListener('touchstart', function (event) {
    if (pullBusy) return;
    if (event.touches.length !== 1) return;
    var name = activeTabName();
    if (name !== 'history' && name !== 'favorites') return;
    if (contentEl.scrollTop > 0) return;
    pullStartY = event.touches[0].clientY;
    pullArmed = true;
    pullMoved = false;
    pullReady = false;
  }, { passive: true });

  contentEl.addEventListener('touchmove', function (event) {
    if (!pullArmed) return;
    if (pullBusy) { pullArmed = false; return; }
    if (event.touches.length !== 1) { pullArmed = false; pullReset(); return; }
    var dy = event.touches[0].clientY - pullStartY;
    if (dy <= 0) {
      // The finger is going the other way: that is an ordinary scroll, so give
      // the list back and stop watching this gesture.
      if (pullMoved) { pullReset(); return; }
      pullArmed = false;
      return;
    }
    if (contentEl.scrollTop > 0) { pullArmed = false; pullReset(); return; }
    pullMoved = true;
    pullReady = dy >= PULL_TRIGGER;
    if (event.cancelable) event.preventDefault();
    pullLabel(pullReady ? T.pullRelease : T.pullDown);
    pullPaint(Math.min(PULL_MAX, dy * PULL_DAMPING));
  }, { passive: false });

  contentEl.addEventListener('touchend', function () {
    if (!pullArmed) return;
    pullArmed = false;
    if (pullReady) pullRefresh();
    else if (pullMoved) pullReset();
    else pullPaint(0, true);
    pullMoved = false;
    pullReady = false;
  });

  contentEl.addEventListener('touchcancel', function () {
    if (!pullArmed) return;
    pullArmed = false;
    pullMoved = false;
    pullReady = false;
    pullPaint(0, true);
  });

  /* ── Item detail + copy to phone ───────────────────────────── */

  function getFullText(item) {
    if (item.types && item.types.TEXT) {
      try {
        var raw = atob(item.types.TEXT);
        var bytes = new Uint8Array(raw.length);
        for (var j = 0; j < raw.length; j++) bytes[j] = raw.charCodeAt(j);
        return new TextDecoder('utf-8').decode(bytes);
      } catch (e) { /* fall through */ }
    }
    return item.text_preview || '';
  }

  /* The URL a clip holds, if that is what it holds.
     The same rule the desktop's opener applies (internal/system/about.py
     `is_openable_url`): http(s), a host, no whitespace or control characters,
     and short.  A clip is text the user did not type, so a newline in it must
     not travel into whatever a browser makes of the string — and the phone has
     to be stricter than the window, because there is no handler on the other
     side to refuse it. */
  function openableUrl(text) {
    var url = String(text == null ? '' : text).trim();
    if (!url || url.length > 2048) return '';
    if (/\s/.test(url)) return '';
    if (!/^https?:\/\/[^\s/?#]+/i.test(url)) return '';
    return url;
  }

  // The backend stores image bytes under the "IMAGE" type (EMF under
  // "IMAGE_EMF"); item.image_fmt says how they were encoded. Pick the
  // matching MIME so BMP/TIFF clips render instead of breaking — the
  // bytes are NOT re-encoded server-side.
  function imageDataUrl(item) {
    var types = item.types || {};
    var fmt = item.image_fmt || '';
    var mime = fmt === 'bmp' ? 'image/bmp'
             : fmt === 'tiff' ? 'image/tiff'
             : 'image/png';
    if (types.IMAGE) return 'data:' + mime + ';base64,' + types.IMAGE;
    if (types.IMAGE_EMF) return 'data:image/x-emf;base64,' + types.IMAGE_EMF;
    return '';
  }

  function showImageModal(url) {
    modalImage.src = url;
    modalImage.alt = T.tabHistory;
    modalImage.style.display = '';
    modalText.style.display = 'none';
    modalCopyBtn.style.display = 'none';
    modalImage.classList.remove('modal__image--zoomed');
  }

  function setModalContent(item) {
    var imgUrl = imageDataUrl(item);
    if (imgUrl) {
      showImageModal(imgUrl);
    } else {
      // Drop any stale image from a previously-opened clip before showing text.
      modalImage.style.display = 'none';
      modalImage.removeAttribute('src');
      modalText.style.display = '';
      modalCopyBtn.style.display = '';
      modalText.textContent = getFullText(item) || previewText(item) || T.emptyPreview;
    }
  }

  function openItem(i) {
    var item = historyItems[i];
    // The row that was tapped can already be gone: a filter change empties the
    // list and repaints, and a tap that landed in between used to throw
    // `Cannot read properties of undefined` and open nothing at all.
    if (!item) return;
    // Name the machine the clip came from in the title as well: the row's
    // source is easy to miss once the modal covers the list.
    var _src = (item.source_name || '').trim() || (item.source_device ? String(item.source_device) : '');
    modalTitle.textContent = T.tabHistory + ' · ' + (_src ? _src + ' · ' : '') + relTime(item.timestamp);
    setModalContent(item);
    openModalEl();
    // Track which entry the modal shows by id — list indices shift between
    // renders (poll merges, pin reordering), so actions resolve by id.
    modalEntryId = (item.entry_id !== undefined && item.entry_id !== null) ? item.entry_id : null;
    modalDetailItem = null;
    updateModalUtils();
    // The list no longer carries full content — fetch it when the modal opens.
    // An image row is the exception: its full `types` can be megabytes and the
    // relay refuses that frame, so ask for the 480 px preview instead.
    if (item.entry_id) {
      var isImage = String(item.content_type || '').toUpperCase().indexOf('IMAGE') === 0;
      var detail = isImage
        ? '/api/history/preview?entry_id='
        : '/api/history/item?entry_id=';
      getJson(detail + encodeURIComponent(item.entry_id))
        .then(function (data) {
          // The modal may have been closed, or opened onto another clip, while
          // this was in flight — filling it now would show one entry's text
          // under another entry's title, with the actions still pointing at
          // whichever is open.
          if (modalEntryId !== item.entry_id) return;
          if (isImage) {
            if (data && data.image) showImageModal(data.image);
            return;
          }
          if (data && data.item) {
            setModalContent(data.item);
            // Full payload arrived (with `types`) — the favorite button's
            // text-only enablement depends on it, so re-evaluate.
            modalDetailItem = data.item;
            updateModalUtils();
          }
        })
        .catch(function () { /* keep the preview */ });
    }
  }

  /* Where focus came from, so that putting the dialog away puts the reader back
     on the row they opened it from rather than at the top of the document. */
  var modalReturnFocus = null;

  /** The dialog's own keyboard contract.
   *
   * Focus goes in, Tab stays in, Esc gets out, and focus returns to the row it
   * came from.  A `<dialog>` would do all four by itself; this page still runs
   * on iOS versions that do not have one, so the four behaviours are written
   * out — five lines each, and no dependency on a parser the phone may not
   * have.  The box itself is focusable so the reader hears the title before the
   * buttons: which buttons this dialog shows depends on the clip. */
  function openModalEl() {
    modalReturnFocus = document.activeElement;
    modalEl.classList.add('modal-mask--show');
    modalEl.setAttribute('aria-hidden', 'false');
    if (modalBox && modalBox.focus) modalBox.focus();
  }

  function focusablesIn(root) {
    var nodes = root.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    // `getClientRects` rather than `offsetParent`: the mask is a fixed box and
    // a fixed ancestor answers null for everything inside it on some engines.
    return Array.prototype.filter.call(nodes, function (node) {
      return !node.disabled && node.getClientRects().length > 0;
    });
  }

  /* Tab stays inside an open sheet: forward from the last control wraps to
     the first, back from the first (or from the box the focus starts on)
     wraps to the last. */
  function trapTab(event, root, box) {
    var nodes = focusablesIn(root);
    if (!nodes.length) return;
    var first = nodes[0];
    var last = nodes[nodes.length - 1];
    var active = document.activeElement;
    if (event.shiftKey && (active === first || active === box)) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && active === last) {
      event.preventDefault();
      first.focus();
    }
  }

  function closeModal() {
    modalEl.classList.remove('modal-mask--show');
    modalEl.setAttribute('aria-hidden', 'true');
    modalImage.classList.remove('modal__image--zoomed');
    modalEntryId = null;
    modalDetailItem = null;
    if (modalReturnFocus && modalReturnFocus.focus) modalReturnFocus.focus();
    modalReturnFocus = null;
  }

  modalEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') { event.preventDefault(); closeModal(); return; }
    if (event.key !== 'Tab') return;
    trapTab(event, modalEl, modalBox);
  });

  // Tap the image to zoom in / out.
  modalImage.addEventListener('click', function () {
    modalImage.classList.toggle('modal__image--zoomed');
  });

  document.getElementById('modalClose').addEventListener('click', closeModal);
  modalEl.addEventListener('click', function (e) { if (e.target === modalEl) closeModal(); });

  document.getElementById('modalCopy').addEventListener('click', function () {
    // Copy is text-only — no-op when an image is being displayed.
    if (modalText.style.display === 'none') return;
    var text = modalText.textContent;
    if (!text) return;
    // navigator.clipboard needs a secure context (HTTPS) — on plain HTTP LAN
    // fall back to a hidden textarea + execCommand, and finally tell the user
    // to long-press the visible text.
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { showToast(T.copied); return; }
      } catch (e) { /* fall through */ }
      showToast(T.copyFail, true);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast(T.copied);
      }).catch(fallback);
    } else {
      fallback();
    }
  });

  /* ── Modal per-item actions (pin / push / favorite / delete) ── */

  var modalEntryId = null;
  var modalActionBusy = false;
  var modalDetailItem = null;

  function findHistById(eid) {
    for (var i = 0; i < historyItems.length; i++) {
      var it = historyItems[i];
      if (it && it.entry_id === eid) return it;
    }
    return null;
  }

  // Refresh the pin/favorite/delete row for the currently-open entry.
  // Hidden entirely for legacy rows without a stable entry_id — the server
  // can't address them. Favorite is text-only: disabled while an image fills
  // the modal. `types` may only exist on the detail payload, so prefer it
  // for format checks while pinned state comes from the live list row.
  function updateModalUtils() {
    var item = modalEntryId !== null ? findHistById(modalEntryId) : null;
    var has = !!item;
    histPinBtn.style.display = has ? '' : 'none';
    histFavBtn.style.display = has ? '' : 'none';
    histDelBtn.style.display = has ? '' : 'none';
    histPushBtn.style.display = has ? '' : 'none';
    var detail = has && modalDetailItem && modalDetailItem.entry_id === modalEntryId ? modalDetailItem : item;
    // A link is offered as a link only while the modal is showing a clip that
    // *is* one: the button appears once the detail payload says so, and goes
    // away again for the next clip that is not.
    var link = has ? openableUrl(getFullText(detail)) : '';
    histOpenBtn.style.display = link ? '' : 'none';
    // No entry_id means the server cannot address this row, so nothing below
    // has an action to take.
    if (!has) return;
    var types = (detail && detail.types) || {};
    var isImageOnly = !!(types.IMAGE || types.IMAGE_EMF) && !types.TEXT;
    histPinBtn.textContent = item.pinned ? T.histUnpin : T.histPin;
    histFavBtn.textContent = T.histFav;
    histDelBtn.textContent = T.histDel;
    histPushBtn.textContent = T.histPush;
    histOpenBtn.textContent = T.histOpenLink;
    histFavBtn.disabled = isImageOnly;
  }

  // A guard shared by all four actions: one modal, one in-flight mutation —
  // a double-tap must not fire two POSTs for the same entry.
  function modalAction(fn) {
    if (modalActionBusy || modalEntryId === null) return;
    modalActionBusy = true;
    fn(function done() { modalActionBusy = false; });
  }

  histOpenBtn.addEventListener('click', function () {
    if (modalEntryId === null) return;
    var item = (modalDetailItem && modalDetailItem.entry_id === modalEntryId)
      ? modalDetailItem
      : findHistById(modalEntryId);
    var url = item ? openableUrl(getFullText(item)) : '';
    if (!url) {
      showToast(T.histOpenFail, true);
      return;
    }
    // An anchor rather than `window.open`: a popup blocker answers null, and a
    // standalone PWA has no tab of its own to open into, while a link with
    // target=_blank is the one form every mobile browser honours from a tap.
    var link = document.createElement('a');
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    // The browser is coming to the front; leaving the sheet open would put the
    // reader back inside a clip they have already left.
    closeModal();
  });

  /* ── Entry actions, by id ────────────────────────────────────
     Pin, push, favorite and delete are the same four whichever surface
     asked for them — the clip's own sheet, or a row's ⋯ menu.  They take
     the entry id rather than reading `modalEntryId`, so the menu can act
