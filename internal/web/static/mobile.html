<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060D">
<!-- iOS / Android standalone ("Add to Home Screen") metadata. The
     apple-touch-icon points at the token-protected icon endpoint; the token
     is interpolated server-side, and the icon route itself is exempt from
     token auth so a stale-token page still shows an icon. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icon-192.png?token=__TOKEN__">
<link rel="manifest" href="/manifest.json?page=mobile&token=__TOKEN__">
<title>ClipSync</title>
<script>
/* The server injects the app-configured locale here (__CLIPSYNC_I18N_LOCALE__
   becomes e.g. "zh-CN"); the fallback keeps this page valid if it is ever
   served without interpolation. */
try { window.__I18N_LOCALE__ = __CLIPSYNC_I18N_LOCALE__; }
catch (e) { window.__I18N_LOCALE__ = ''; }
/* Same shared locale JSON the dashboard uses (locales/*.json), so dotted keys
   (netpair_*, diag.v2.*, chat.*, ...) can be resolved via jt() below instead
   of duplicating them in the inline T dict. */
try { window.__I18N_JSON__ = __CLIPSYNC_I18N_DATA__; }
catch (e) { window.__I18N_JSON__ = null; }
</script>
<script>
/* Register the service worker so an installed phone page keeps working when
   offline (same as the dashboard).  Fails silently on plain-HTTP LAN access —
   browsers refuse SW registration outside secure contexts; expected. */
try {
  if ('serviceWorker' in navigator) {
    var _tok = (location.search.match(/[?&]token=([^&]+)/) || [])[1] || '';
    navigator.serviceWorker.register('/sw.js?token=' + encodeURIComponent(_tok)).catch(function () {});
  }
} catch (e) {}
</script>
<style>
/* ═══════════════════════════════════════════════════════════════════
   ClipSync Mobile — phone companion
   Three tabs: clipboard history / send text / file transfer.
   Tokens mirror css/theme.css for a consistent look on a small screen.
   ═══════════════════════════════════════════════════════════════════ */

:root {
  --bg: #06080D;
  --surface: #0C1020;
  --panel: #111827;
  --panel-2: #161E32;
  --fg: #E8EDF5;
  --fg-muted: #8899B4;
  --fg-subtle: #556680;
  --accent: #22D3EE;
  --accent-2: #A78BFA;
  --accent-glow: rgba(34,211,238,0.15);
  --accent-glow-strong: rgba(34,211,238,0.30);
  --violet-glow: rgba(167,139,250,0.16);
  --pink-glow: rgba(244,114,182,0.14);
  --success: #00E599;
  --danger: #FF4060;
  --border: rgba(100,140,200,0.08);
  --border-strong: rgba(100,140,200,0.16);
  --radius: 12px;
  --radius-sm: 8px;
  --font: "SF Pro Display", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", "Fira Code", monospace;
  --spring: 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --fast: 120ms cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  overscroll-behavior: none;
  display: flex;
  flex-direction: column;
}

/* ── Aurora wash ─────────────────────────────────────────────── */

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse 60% 45% at 12% -10%, var(--violet-glow), transparent),
    radial-gradient(ellipse 60% 45% at 88% -10%, var(--pink-glow), transparent),
    radial-gradient(ellipse 80% 55% at 50% -20%, var(--accent-glow), transparent);
  /* Static wash — the drift animation is removed on mobile to save battery
     (a phone repaints the full-screen fixed layer every frame for 18s loops). */
}

.app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }

/* ── Header ─────────────────────────────────────────────────── */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(10,14,30,0.6), rgba(10,14,30,0.3));
  backdrop-filter: blur(18px) saturate(170%);
  -webkit-backdrop-filter: blur(18px) saturate(170%);
}

.header__left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.header__title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.2;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header__sub {
  font-size: 11px;
  color: var(--fg-muted);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 60vw;
}

/* ── Tab bar ────────────────────────────────────────────────── */

.tabs {
  display: flex;
  gap: 4px;
  margin: 10px 12px 4px;
  background: rgba(12,16,32,0.6);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px;
  flex-shrink: 0;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  /* Seven tabs won't fit a phone width — keep them at a usable size and
     scroll the bar horizontally instead of crushing them. */
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  flex-wrap: nowrap;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex: 1 0 auto;
  min-width: 76px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 12px;
  min-height: 44px; /* ≥44px touch target */
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--fg-muted);
  border: none;
  background: transparent;
  font-family: var(--font);
  cursor: pointer;
  transition: all var(--fast);
  -webkit-tap-highlight-color: transparent;
}

.tab--active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  box-shadow: 0 2px 12px var(--accent-glow-strong);
}

/* ── Content ────────────────────────────────────────────────── */

.content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); }

.panel { display: none; }
.panel--active { display: block; }

/* ── History items ──────────────────────────────────────────── */

.h-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(12,16,32,0.8), rgba(17,24,39,0.8));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  cursor: pointer;
  transition: all var(--spring);
  margin-bottom: 8px;
}

.h-item:active {
  border-color: var(--accent);
  transform: scale(0.99);
}

.h-item__icon {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  background: var(--panel);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}

.h-item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }

.h-item__text {
  font-size: 14px;
  line-height: 1.4;
  color: var(--fg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.h-item__meta {
  font-size: 10px;
  color: var(--fg-subtle);
  font-family: var(--font-mono);
}

/* ── Send panel ─────────────────────────────────────────────── */

.send-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(12,16,32,0.8), rgba(17,24,39,0.8));
  padding: 14px;
}

.send-card textarea {
  width: 100%;
  min-height: 140px;
  resize: none;
  background: var(--panel);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  /* ≥16px so iOS Safari does not auto-zoom when the field is focused. */
  font-size: 16px;
  font-family: var(--font);
  line-height: 1.5;
  outline: none;
  -webkit-user-select: text;
  user-select: text;
  transition: border-color var(--fast);
}

.send-card textarea:focus { border-color: var(--accent); }

.send-btn {
  width: 100%;
  margin-top: 12px;
  padding: 14px 0;
  border: none;
  border-radius: var(--radius);
  font-size: 15px;
  font-weight: 700;
  font-family: var(--font);
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  cursor: pointer;
  box-shadow: 0 4px 16px var(--accent-glow-strong);
  transition: all var(--fast);
  -webkit-tap-highlight-color: transparent;
}

.send-btn:active { transform: scale(0.98); }
.send-btn:disabled { opacity: 0.5; }

.send-hint { font-size: 12px; color: var(--fg-muted); margin-top: 10px; line-height: 1.5; }

/* ── Files panel ────────────────────────────────────────────── */

.upload-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 14px 0;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  background: rgba(12,16,32,0.6);
  color: var(--fg);
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  margin-bottom: 12px;
  transition: all var(--fast);
  -webkit-tap-highlight-color: transparent;
}

.upload-btn:active { border-color: var(--accent); color: var(--accent); }
.fav-export {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 12px 0;
  margin-bottom: 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: rgba(12,16,32,0.6);
  color: var(--fg);
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.fav-export:active { border-color: var(--accent); color: var(--accent); }

.f-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(12,16,32,0.8), rgba(17,24,39,0.8));
  margin-bottom: 8px;
  cursor: pointer;
  transition: all var(--spring);
}

.f-item:active { border-color: var(--accent); transform: scale(0.99); }

.f-item__icon {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  background: var(--panel);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}

.f-item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }

.f-item__name {
  font-size: 14px;
  color: var(--fg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.f-item__meta { font-size: 11px; color: var(--fg-subtle); font-family: var(--font-mono); }

.f-item__delete {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--panel);
  color: var(--fg-subtle);
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}

.f-item__delete:active { border-color: var(--danger); color: var(--danger); }

/* ── Upload progress ───────────────────────────────────────── */

.upload-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.upload-progress__bar {
  flex: 1;
  height: 8px;
  border-radius: 4px;
  background: var(--panel);
  border: 1px solid var(--border);
  overflow: hidden;
}

.upload-progress__fill {
  height: 100%;
  width: 0%;
  border-radius: 4px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  transition: width var(--fast);
}

.upload-progress__cancel {
  flex-shrink: 0;
  min-height: 44px;
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font);
  color: var(--fg-muted);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--fast);
  -webkit-tap-highlight-color: transparent;
}

.upload-progress__cancel:active { border-color: var(--danger); color: var(--danger); }

/* ── Light theme ────────────────────────────────────────────── */
/* The :root variables above are the dark look (default). A phone-side
   `body.light` class swaps only the palette tokens; the layout stays. */

body.light {
  --bg: #E9EDF5;
  --surface: #FFFFFF;
  --panel: #F2F5FB;
  --panel-2: #E3E9F4;
  --fg: #18233A;
  --fg-muted: #46536E;
  --fg-subtle: #72809C;
  --accent: #0E7490;
  --accent-2: #7C3AED;
  --accent-glow: rgba(14,116,144,0.16);
  --accent-glow-strong: rgba(14,116,144,0.30);
  --violet-glow: rgba(124,58,237,0.14);
  --pink-glow: rgba(219,39,119,0.12);
  --success: #047857;
  --danger: #BE123C;
  --border: rgba(30,50,90,0.10);
  --border-strong: rgba(30,50,90,0.18);
}

body.light .header {
  background: linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.45));
}

body.light .tabs { background: rgba(255,255,255,0.72); }

/* ── Chat ───────────────────────────────────────────────────── */

.chat-hdr {
  font-size: 12px;
  font-weight: 700;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin: 14px 2px 8px;
}

.chat-device, .chat-session {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(12,16,32,0.8), rgba(17,24,39,0.8));
  margin-bottom: 8px;
}

body.light .chat-device,
body.light .chat-session,
body.light .tr-item,
body.light .fav-item,
body.light .set-card,
body.light .h-item,
body.light .f-item,
body.light .send-card,
body.light .fav-export,
body.light .upload-btn {
  background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(240,244,251,0.92));
}

.chat-device { cursor: default; }
.chat-session { cursor: pointer; transition: all var(--spring); }
.chat-session:active { border-color: var(--accent); transform: scale(0.99); }

.chat-device__info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.chat-device__name { font-size: 14px; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-device__badge { font-size: 10px; font-weight: 600; color: var(--fg-subtle); }
.chat-device__badge--on { color: var(--success); }

.chat-session__dot { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--fg-subtle); }
.chat-session__dot--on { background: var(--success); box-shadow: 0 0 8px rgba(0,229,153,0.5); }

.chat-session__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.chat-session__top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.chat-session__name { font-size: 14px; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-session__status { flex-shrink: 0; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; background: var(--panel); border: 1px solid var(--border); color: var(--fg-muted); }
.chat-session__status--ok { color: var(--success); border-color: rgba(0,229,153,0.35); }
.chat-session__status--warn { color: #FBBF24; border-color: rgba(251,191,36,0.35); }
.chat-session__status--err { color: var(--danger); border-color: rgba(255,64,96,0.35); }
.chat-session__preview { font-size: 12px; color: var(--fg-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-session__badge { flex-shrink: 0; min-width: 18px; height: 18px; line-height: 18px; text-align: center; font-size: 11px; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-radius: 9px; padding: 0 5px; }

.chat-btn {
  flex-shrink: 0;
  min-height: 44px;
  padding: 8px 14px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  transition: all var(--fast);
  -webkit-tap-highlight-color: transparent;
}
.chat-btn--accent { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.chat-btn--ghost { color: var(--fg-muted); background: var(--panel); border: 1px solid var(--border); }
.chat-btn--danger { color: #fff; background: linear-gradient(135deg, var(--danger), #ff6b6b); }
.chat-btn:active { transform: scale(0.97); }
.chat-btn:disabled { opacity: 0.5; }

/* Conversation */
.chat-conv__hdr { display: flex; align-items: center; gap: 8px; padding: 6px 0 10px; }
.chat-conv__name { flex: 1; min-width: 0; font-size: 15px; font-weight: 700; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-conv__status { font-size: 11px; color: var(--fg-subtle); }

.chat-invite-banner {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid rgba(251,191,36,0.35);
  background: rgba(251,191,36,0.10);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  font-size: 12px;
  color: var(--fg);
}
.chat-invite-banner__name { font-weight: 700; }

.chat-conv__msgs {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 4px 0 8px;
  -webkit-user-select: text;
  user-select: text;
  /* Let iOS show the native long-press callout (copy/lookup) on messages —
     the body-level -webkit-touch-callout:none must not suppress it here. */
  -webkit-touch-callout: default;
}

.chat-msg-row { display: flex; flex-direction: column; }

.chat-system {
  align-self: center;
  text-align: center;
  font-size: 11px;
  color: var(--fg-subtle);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 5px 12px;
  max-width: 88%;
}

.chat-bubble {
  align-self: flex-start;
  max-width: 80%;
  padding: 10px 13px;
  border-radius: 16px 16px 16px 4px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  font-size: 14px;
  line-height: 1.45;
  color: var(--fg);
  word-break: break-word;
}
.chat-bubble--out {
  align-self: flex-end;
  border-radius: 16px 16px 4px 16px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  border-color: transparent;
}
.chat-bubble__meta { margin-top: 3px; font-size: 10px; opacity: 0.7; text-align: right; }
/* Failed outgoing text: red edge + label so a delivery failure is visible
   (text bubbles never rendered status before). */
.chat-bubble--failed { border-color: var(--danger); }
.chat-bubble__failed { color: #ff8a8f; font-weight: 700; margin-right: 5px; opacity: 1; }
.chat-bubble__retry {
  display: inline-block;
  margin-right: 5px;
  padding: 0 6px;
  font-size: 11px;
  line-height: 16px;
  font-family: inherit;
  color: inherit;
  background: transparent;
  border: 1px solid currentColor;
  border-radius: 9px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.chat-bubble__retry:disabled { opacity: 0.45; }

.chat-bubble__copy {
  display: inline-block;
  margin-right: 5px;
  padding: 0 6px;
  font-size: 11px;
  line-height: 16px;
  font-family: inherit;
  color: inherit;
  background: transparent;
  border: 1px solid currentColor;
  border-radius: 9px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.chat-bubble__copy:active { opacity: 0.6; }

.chat-file {
  align-self: flex-start;
  max-width: 88%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--panel);
}
.chat-file--out { align-self: flex-end; }
.chat-file__icon { flex-shrink: 0; font-size: 20px; }
.chat-file__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.chat-file__name { font-size: 13px; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-file__meta { font-size: 11px; color: var(--fg-subtle); }
.chat-file__status { color: var(--fg-muted); }
.chat-file__actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }

.chat-action-btn {
  min-height: 44px;
  padding: 6px 12px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}
.chat-action-btn--accept { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.chat-action-btn--decline { color: var(--fg-muted); background: var(--panel); border: 1px solid var(--border); }
.chat-action-btn--danger { color: #fff; background: linear-gradient(135deg, var(--danger), #ff6b6b); }
.chat-action-btn:active { transform: scale(0.97); }
.chat-action-btn:disabled { opacity: 0.5; }

.chat-composer {
  position: sticky;
  bottom: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0 2px;
  background: var(--bg);
}
.chat-composer__input {
  flex: 1;
  min-width: 0;
  min-height: 42px;
  padding: 10px 12px;
  background: var(--panel);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 16px;
  font-family: var(--font);
  outline: none;
  -webkit-user-select: text;
  user-select: text;
  transition: border-color var(--fast);
}
.chat-composer__input:focus { border-color: var(--accent); }
.chat-composer__send {
  flex-shrink: 0;
  min-height: 44px;
  padding: 0 18px;
  border: none;
  border-radius: 21px;
  font-size: 14px;
  font-weight: 700;
  font-family: var(--font);
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.chat-composer__send:active { transform: scale(0.97); }

.chat-typing {
  padding: 0 6px 6px;
  font-size: 12px;
  color: var(--fg-subtle);
  font-style: italic;
  animation: csTypingFade 1.4s ease-in-out infinite;
}
@keyframes csTypingFade { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

/* ── Transfers ───────────────────────────────────────────────── */

.tr-section { margin-bottom: 6px; }

.tr-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(12,16,32,0.8), rgba(17,24,39,0.8));
  margin-bottom: 8px;
}

.tr-item__icon {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.tr-item__icon--up { color: var(--accent); background: var(--accent-glow); }
.tr-item__icon--down { color: var(--accent-2); background: var(--violet-glow); }

.tr-item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tr-item__name { font-size: 13px; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-item__meta { font-size: 11px; color: var(--fg-subtle); font-family: var(--font-mono); }
.tr-item__bar { height: 6px; border-radius: 3px; background: var(--panel); border: 1px solid var(--border); overflow: hidden; }
.tr-item__fill { height: 100%; border-radius: 3px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); transition: width var(--fast); }
.tr-item__speed { font-size: 10px; color: var(--fg-subtle); font-family: var(--font-mono); }
.tr-item__actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }

.tr-btn {
  min-height: 44px;
  padding: 7px 13px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}
.tr-btn--ok { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.tr-btn--bad { color: #fff; background: linear-gradient(135deg, var(--danger), #ff6b6b); }
.tr-btn--warn { color: var(--fg); background: var(--panel); border: 1px solid var(--border); }
.tr-btn:active { transform: scale(0.97); }

.tr-hitem {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--panel);
  margin-bottom: 8px;
}
.tr-hitem__icon {
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  border-radius: 50%;
  border: 1px solid var(--border);
}
.tr-hitem__icon--ok { color: var(--success); border-color: rgba(0,229,153,0.35); }
.tr-hitem__icon--err { color: var(--danger); border-color: rgba(255,64,96,0.35); }
.tr-hitem__icon--warn { color: #FBBF24; border-color: rgba(251,191,36,0.35); }
.tr-hitem__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.tr-hitem__name { font-size: 13px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-hitem__meta { font-size: 11px; color: var(--fg-subtle); font-family: var(--font-mono); }

/* ── Favorites ───────────────────────────────────────────────── */

.fav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(12,16,32,0.8), rgba(17,24,39,0.8));
  margin-bottom: 8px;
  cursor: pointer;
  transition: all var(--spring);
}
.fav-item:active { border-color: var(--accent); transform: scale(0.99); }

.fav-item__icon {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  background: var(--panel);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.fav-item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.fav-item__title { font-size: 14px; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fav-item__preview { font-size: 12px; color: var(--fg-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fav-item__meta { font-size: 10px; color: var(--fg-subtle); font-family: var(--font-mono); }

/* ── History toolbar (clear all) ─────────────────────────────── */

.hist-bar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 8px;
}

.hist-clear {
  min-height: 44px;
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 17px;
  background: var(--panel);
  color: var(--fg-muted);
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}
.hist-clear:active { border-color: var(--danger); color: var(--danger); }

/* ── Item modal: per-item utility row ───────────────────────── */

.modal__utils {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.modal__util {
  flex: 1;
  min-height: 42px;
  padding: 9px 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--panel);
  color: var(--fg);
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}
.modal__util:active { border-color: var(--accent); }
.modal__util--danger { color: var(--danger); }
.modal__util--danger:active { border-color: var(--danger); background: rgba(255,64,96,0.08); }
.modal__util:disabled { opacity: 0.45; }

.modal__actions + .modal__actions { margin-top: 8px; }

/* ── Transfers: section header row + retry ──────────────────── */

.tr-hdrrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.tr-cancelall {
  min-height: 44px;
  padding: 6px 13px;
  border: 1px solid rgba(255,64,96,0.35);
  border-radius: 17px;
  background: var(--panel);
  color: var(--danger);
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}
.tr-cancelall:active { background: rgba(255,64,96,0.10); }
.tr-cancelall:disabled { opacity: 0.5; }

.tr-hitem__retry {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(251,191,36,0.4);
  border-radius: 50%;
  background: var(--panel);
  color: #FBBF24;
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}
.tr-hitem__retry:active { transform: scale(0.95); }
.tr-hitem__retry:disabled { opacity: 0.5; }

/* ── Chat: mute bell / close / attach ───────────────────────── */

.chat-bell {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 50%;
  background: transparent;
  font-size: 16px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--fast);
}
.chat-bell:active { background: var(--panel); }

.chat-btn--dangerghost {
  color: var(--danger);
  background: transparent;
  border: 1px solid rgba(255,64,96,0.35);
}

.chat-composer__attach {
  flex-shrink: 0;
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--panel);
  color: var(--fg);
  font-size: 17px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}
.chat-composer__attach:active { transform: scale(0.95); border-color: var(--accent); }
.chat-composer__attach:disabled { opacity: 0.5; }

/* ── Diagnostics card (settings tab) ────────────────────────── */

.diag-intro { font-size: 12px; color: var(--fg-muted); line-height: 1.55; padding: 10px 0 6px; }

.diag-run {
  width: 100%;
  min-height: 42px;
  margin-bottom: 6px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 700;
  font-family: var(--font);
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.diag-run:active { transform: scale(0.98); }
.diag-run:disabled { opacity: 0.6; }

.diag-check {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 9px 0;
  border-top: 1px solid var(--border);
}
.diag-check:first-child { border-top: none; }

.diag-check__status {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 12px;
  font-weight: 700;
  background: var(--panel);
  color: var(--fg-subtle);
}
.diag-check__status--ok { color: var(--success); background: rgba(0,229,153,0.12); }
.diag-check__status--bad { color: var(--danger); background: rgba(255,64,96,0.12); }

.diag-check__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.diag-check__label { font-size: 13px; font-weight: 600; color: var(--fg); }
.diag-check__detail { font-size: 11px; color: var(--fg-subtle); word-break: break-word; }
.diag-check__guidance { font-size: 11px; color: var(--fg-muted); line-height: 1.45; word-break: break-word; }

.diag-fix {
  align-self: flex-start;
  min-height: 30px;
  margin-top: 4px;
  padding: 4px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 15px;
  background: var(--panel);
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.diag-fix:disabled { opacity: 0.5; }

.diag-summary {
  margin-top: 8px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 700;
  text-align: center;
  background: var(--panel);
  color: var(--fg-muted);
}
.diag-summary--ok { color: var(--success); background: rgba(0,229,153,0.10); }
.diag-summary--warn { color: #FBBF24; background: rgba(251,191,36,0.10); }
.diag-summary--fail { color: var(--danger); background: rgba(255,64,96,0.10); }

/* ── Settings ───────────────────────────────────────────────── */

.set-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(12,16,32,0.8), rgba(17,24,39,0.8));
  padding: 4px 14px;
  margin-bottom: 12px;
}

.set-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.set-row:last-child { border-bottom: none; }
.set-row__label { color: var(--fg); font-weight: 600; flex-shrink: 0; }
.set-row__value { color: var(--fg-muted); text-align: right; min-width: 0; word-break: break-all; }

.set-toggle {
  min-height: 44px;
  padding: 7px 16px;
  border: none;
  border-radius: 18px;
  font-size: 13px;
  font-weight: 700;
  font-family: var(--font);
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.set-link {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  margin-top: 4px;
  border-radius: var(--radius);
  border: 1px solid var(--border-strong);
  background: var(--panel);
  color: var(--accent);
  font-size: 14px;
  font-weight: 700;
  font-family: var(--font);
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  transition: all var(--fast);
}
.set-link:active { border-color: var(--accent); }

/* ── Empty / loading ────────────────────────────────────────── */

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 48px 20px;
  text-align: center;
}

.empty__icon { font-size: 34px; opacity: 0.45; }
.empty__text { font-size: 13px; color: var(--fg-muted); font-weight: 500; }

.skeleton {
  height: 52px;
  border-radius: var(--radius);
  background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 40%, var(--panel) 80%);
  background-size: 200% 100%;
  margin-bottom: 8px;
  animation: mShimmer 1.6s ease-in-out infinite;
}

@keyframes mShimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ── Item detail modal ──────────────────────────────────────── */

.modal-mask {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(4,6,10,0.7);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--fast);
}

.modal-mask--show { opacity: 1; pointer-events: auto; }

.modal {
  width: 100%;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform var(--spring);
}

.modal-mask--show .modal { transform: translateY(0); }

.modal__title { font-size: 13px; font-weight: 700; color: var(--fg-muted); margin-bottom: 10px; }

.modal__text {
  font-size: 15px;
  line-height: 1.6;
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  max-height: 46vh;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-word;
  -webkit-user-select: text;
  user-select: text;
}

.modal__image {
  width: 100%;
  max-height: 40vh;
  object-fit: contain;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--panel);
  cursor: zoom-in;
  transition: max-height var(--fast);
}

.modal__image--zoomed {
  max-height: 74vh;
  cursor: zoom-out;
}

.modal__actions { display: flex; gap: 10px; margin-top: 14px; }

.modal__btn {
  flex: 1;
  padding: 13px 0;
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  transition: all var(--fast);
  -webkit-tap-highlight-color: transparent;
}

.modal__btn--primary { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.modal__btn--ghost { color: var(--fg-muted); background: var(--panel); border: 1px solid var(--border); }
.modal__btn:active { transform: scale(0.97); }

/* ── Toast ──────────────────────────────────────────────────── */

.toast {
  position: fixed;
  bottom: calc(24px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  padding: 10px 20px;
  background: color-mix(in srgb, var(--surface) 86%, var(--accent) 14%);
  color: var(--fg);
  border: 1px solid var(--accent);
  border-radius: 24px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 8px 28px rgba(5,6,13,0.5), 0 0 0 1px var(--accent-glow-strong);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--fast);
  /* Long server error strings must wrap instead of truncating. */
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: break-word;
  text-align: center;
  max-width: 88vw;
}

.toast--show { opacity: 1; }

.toast--error {
  background: color-mix(in srgb, var(--surface) 86%, var(--danger) 14%);
  border-color: var(--danger);
}

/* ── Scrollbar ──────────────────────────────────────────────── */

.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
.modal__text::-webkit-scrollbar { width: 4px; }
.modal__text::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

/* ── Reduced motion: freeze aurora / shimmer animations ───────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}
</style>

<body>

<div class="app">
  <header class="header">
    <div class="header__left">
      <div class="header__title">&#x1F4CB; <span id="title">ClipSync</span></div>
      <div class="header__sub" id="subtitle"></div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab tab--active" data-tab="history" id="tabHistory"></button>
    <button class="tab" data-tab="send" id="tabSend"></button>
    <button class="tab" data-tab="files" id="tabFiles"></button>
    <button class="tab" data-tab="chat" id="tabChat"></button>
    <button class="tab" data-tab="transfers" id="tabTransfers"></button>
    <button class="tab" data-tab="favorites" id="tabFavorites"></button>
    <button class="tab" data-tab="settings" id="tabSettings"></button>
  </nav>

  <main class="content">

    <!-- History -->
    <section class="panel panel--active" id="panelHistory">
      <div class="hist-bar" id="histBar" style="display:none">
        <button class="hist-clear" id="histClearBtn"></button>
      </div>
      <div id="historyList"></div>
    </section>

    <!-- Send -->
    <section class="panel" id="panelSend">
      <div class="send-card">
        <textarea id="sendText" placeholder=""></textarea>
        <button class="send-btn" id="sendBtn"></button>
        <p class="send-hint" id="sendHint"></p>
      </div>
    </section>

    <!-- Files -->
    <section class="panel" id="panelFiles">
      <button class="upload-btn" id="uploadBtn"></button>
      <div class="upload-progress" id="uploadProgressWrap" style="display:none">
        <div class="upload-progress__bar"><div class="upload-progress__fill" id="uploadProgressFill"></div></div>
        <button class="upload-progress__cancel" id="uploadCancelBtn"></button>
      </div>
      <div id="fileList"></div>
    </section>

    <!-- Chat -->
    <section class="panel" id="panelChat">
      <div id="chatView"></div>
    </section>

    <!-- Transfers -->
    <section class="panel" id="panelTransfers">
      <div id="transfersView"></div>
    </section>

    <!-- Favorites -->
    <section class="panel" id="panelFavorites">
      <button class="fav-export" id="favExportBtn" style="display:none"></button>
      <div id="favoritesList"></div>
    </section>

    <!-- Settings -->
    <section class="panel" id="panelSettings">

  var REQUEST_TIMEOUT = 8000;

  // fetch wrapper with an AbortController timeout so a phone on a different
  // network doesn't hang over shimmering skeletons indefinitely.
  function fetchWithTimeout(url, options) {
    var opts = options || {};
    var controller = new AbortController();
    opts.signal = controller.signal;
    var timer = setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT);
    return fetch(url, opts).then(function (r) {
      clearTimeout(timer);
      return r;
    }).catch(function (e) {
      clearTimeout(timer);
      if (e && e.name === 'AbortError') {
        var err = new Error('timeout');
        err.timeout = true;
        throw err;
      }
      throw e;
    });
  }

  function getJson(path) {
    return fetchWithTimeout(apiUrl(path)).then(function (r) {
      if (!r.ok) {
        var e = new Error('HTTP ' + r.status);
        e.status = r.status;

      }
      return r.json();

  // the HTTP status (403 = stale token) alongside the parsed body — shared by
  // the send flow and file delete so both treat 403 identically.  getJson
  // (used by the polling refresh paths) keeps its own error-throwing behavior.
  function apiFetch(path, opts) {
    return fetchWithTimeout(apiUrl(path), opts).then(function (r) {
      return r.json().then(function (data) {
        return { status: r.status, data: data };

    });
  }

  }

  /* ── History ───────────────────────────────────────────────── */

  function typeIcon(ct) {
    var t = (ct || '').toUpperCase();
    if (t === 'TEXT' || t === 'HTML' || t === 'RTF') return '📝';
    if (t.indexOf('IMAGE') === 0) return '🖼';
    if (t === 'FILE') return '📄';
    return '📋';
  }

  function relTime(ts) {
    if (!ts) return '';
    var d = Math.floor(Date.now() / 1000) - ts;
    if (d < 60) return T.timeJust;
    if (d < 3600) return Math.floor(d / 60) + T.timeMin;
    if (d < 86400) return Math.floor(d / 3600) + T.timeHour;
    return Math.floor(d / 86400) + T.timeDay;
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var historyLoading = false;
  var historyOffset = 0;
  var historyHasMore = true;
  // Mobile has no store object, so it keeps its own copy of the load-more
  // cursor convention (offset = visible length pinned to total; hasMore =
  // length < total, preserved when total is unknown).  Keep in step with
  // store.setHistoryCursor().
  function _setHistCursor(total) {
    historyOffset = (total != null) ? Math.min(historyItems.length, total) : historyItems.length;
    historyHasMore = (total != null) ? (historyItems.length < total) : historyHasMore;
  }
  // Timestamp of the last full-history calibration (limit=total).  A full
  // download is expensive, so it is throttled to one per 30s per client —
  // inside the window the cursor is pinned but no refetch happens.  EVERY
  // terminal state (success write-back and failure) stamps it, so a
  // persistently-failing calibration backs off instead of re-entering a full
  // download on every poll (mirrors store.calibrateHistory).
  var _lastCalibMobile = null;

  // Reconcile a page-1 snapshot into the already-loaded list (dedupe by
  // entry_id, upsert in place, prepend genuinely-new entries).  When
  // *pruneMissing* is true — the NOT-paged path, where the snapshot is fully
  // authoritative — entries the snapshot no longer reports are dropped FIRST,
  // so items deleted on the desktop can't linger as ghost rows.  The paged
  // path (length > limit) calls with pruneMissing=false: the snapshot only
  // governs the first page, so pruning would collapse loaded pages 31..N on
  // every 5s poll; deletions there heal via the WS broadcast / next load-more,
  // and the caller trims the tail to the snapshot's `total` when present.
  // The load-more path (offset>0) never prunes; it stays a pure append merge.
  function mergeHistoryPage(items, pruneMissing) {
    var snapshotIds = {};
    for (var si = 0; si < items.length; si++) {
      var sit = items[si];
      if (sit && sit.entry_id !== undefined) snapshotIds[sit.entry_id] = true;
    }
    if (pruneMissing) {
      for (var pr = historyItems.length - 1; pr >= 0; pr--) {
        var cur = historyItems[pr];
        if (cur && cur.entry_id !== undefined && !snapshotIds[cur.entry_id]) {
          historyItems.splice(pr, 1);
        }
      }
    }
    var idxById = {};
    for (var i = 0; i < historyItems.length; i++) {
      var cur2 = historyItems[i];
      if (cur2 && cur2.entry_id !== undefined) idxById[cur2.entry_id] = i;
    }
    var fresh = [];
    for (var j = 0; j < items.length; j++) {
      var inc = items[j];
      if (!inc) continue;
      var found = (inc.entry_id !== undefined && idxById[inc.entry_id] !== undefined) ? idxById[inc.entry_id] : -1;
      if (found !== -1) {
        historyItems[found] = inc;
      } else {
        fresh.push(inc);
      }
    }
    for (var k = fresh.length - 1; k >= 0; k--) {
      historyItems.unshift(fresh[k]);
    }
    return fresh.length;
  }

  function loadHistory(silent, appendOffset) {
    // Skip while a request is already in flight (poll ticks AND user-initiated
    // loads) so slow responses can't overlap and render out of order.  A
    // user-initiated load that arrives mid-flight simply waits for the next
    // poll, which is already queued.
    if (historyLoading) return;
    historyLoading = true;
    var isAppend = (appendOffset !== undefined && appendOffset !== null);
    // Silent background refreshes and pagination appends keep the current list
    // on screen; only the user-initiated first load shows the skeleton.
    if (!silent && !isAppend) {
      historyList.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    }
    var url = '/api/history?limit=30';
    if (isAppend && appendOffset > 0) {
      url += '&offset=' + appendOffset;
    }
    getJson(url)
      .then(function (data) {
        historyLoading = false;
        var items = (data.items || []).slice(0, 30);
        var total = data.total != null ? data.total : null;
        if (isAppend) {
          // Append the next page, deduping against what is already loaded so a
          // raced poll + scroll can't show the same entry twice.
          var seen = {};
          for (var i = 0; i < historyItems.length; i++) {
            var cur = historyItems[i];
            if (cur && cur.entry_id !== undefined) seen[cur.entry_id] = true;
          }
          var added = 0;
          for (var j = 0; j < items.length; j++) {
            var it = items[j];
            if (!it) continue;
            if (it.entry_id === undefined || !seen[it.entry_id]) {
              if (it.entry_id !== undefined) seen[it.entry_id] = true;
              historyItems.push(it);
              added++;
            }
          }
          historyHasMore = (total != null) ? (historyItems.length < total) : (added > 0);
        } else if (historyItems.length > 30) {
          // Refresh of page 1 (offset=0) while more pages are loaded.  The
          // snapshot is authoritative only for the FIRST page — pruning from
          // it would collapse the 31..N pages the user already loaded on every
          // 5s poll.  Merge in place (upsert/prepend) WITHOUT pruning; deleted
          // entries heal via the full calibration below, the next load-more,
          // or a full refresh.  History is ordered pinned-DESC, timestamp-DESC,
          // so a deleted row can sit at the TOP (pinned) or in the MIDDLE — a
          // tail-trim would evict LIVE oldest entries and keep the ghost, and
          // mobile has no WS broadcast to self-heal from.  When the snapshot's
          // `total` says the loaded list has ghosts (length > total), fetch the
          // authoritative list (limit=total returns every remaining item) and
          // replace wholesale.
          mergeHistoryPage(items, false);
          if (total != null && historyItems.length > total) {
            // Full calibration: fetch the authoritative list at limit=total
            // and replace wholesale.  Mirrors store.calibrateHistory() in
            // app.js/ws.js — same contract (replace, recompute cursor,
            // re-render) plus a 30s throttle (mobile's 5s poll self-heals, but
            // a full limit=total download on every ghosted poll is wasteful).
            var calibNow = Date.now();
            if (_lastCalibMobile && (calibNow - _lastCalibMobile) < 30000) {
              // Throttled — just pin the cursor so Load-more can't skip live
              // entries; the next poll retries after the window elapses.
              _setHistCursor(total);
              renderHistory();
              return;
            }
            historyLoading = true;
            getJson('/api/history?limit=' + total)
              .then(function (calData) {
                historyLoading = false;
                _lastCalibMobile = Date.now();
                var calItems = (calData.items || []).slice(0, total);
                historyItems.splice(0, historyItems.length);
                for (var c = 0; c < calItems.length; c++) {
                  if (calItems[c] == null) continue;  // never store a malformed row
                  historyItems.push(calItems[c]);
                }
                _setHistCursor(calData.total != null ? calData.total : null);
                renderHistory();
              })
              .catch(function () {
                historyLoading = false;
                // Calibration failed — pin the cursor to min(length, total) so
                // Load-more can't skip live entries (mirrors the shared
                // function's failure path) and re-render so the list reflects
                // the current state.  A terminal state: stamp the throttle
                // budget so a persistently-failing server doesn't re-enter a
                // full download on every poll.
                _lastCalibMobile = Date.now();
                _setHistCursor(total != null ? total : null);
                renderHistory();
              });
            return;
          }
          historyHasMore = (total != null) ? (historyItems.length < total) : historyHasMore;
        } else {
          // Not paged: the page-1 snapshot is fully authoritative — prune rows
          // the snapshot no longer reports (desktop deletions) then merge in
          // place.  A cleared history arrives as an empty snapshot, which
          // prunes everything and empties the list.
          mergeHistoryPage(items, true);
          historyHasMore = (total != null) ? (historyItems.length < total) : true;
        }
        historyOffset = historyItems.length;
        renderHistory();
      })
      .catch(function (err) {
        historyLoading = false;
        // A 403 means the token this page was opened with is no longer valid
        // (it was regenerated / cleared) — tell the user to re-scan the QR
        // code, not to check Wi-Fi.  Surface it even on silent background
        // polls, otherwise the UI looks fresh while every refresh silently
        // 403s.
        if (err && err.status === 403) notifyTokenExpired();
        if (!silent) {
          var msg = (err && err.status === 403)
            ? esc(T.tokenExpired)
            : esc(T.loadFail) + '<br>' + esc(T.loadFailHint);
          historyList.innerHTML = '<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__text">' + msg + '</div></div>';
        }
      });
  }

  function renderHistory() {
    // The clear-all affordance only makes sense with something to clear.
    histBar.style.display = historyItems.length > 0 ? 'flex' : 'none';
    if (historyItems.length === 0) {
      historyList.innerHTML = '<div class="empty"><div class="empty__icon">📋</div><div class="empty__text">' + esc(T.emptyHistory) + '</div></div>';
      return;
    }
    historyList.innerHTML = '';
    historyItems.forEach(function (item, i) {
      var el = document.createElement('div');
      el.className = 'h-item';
      el.style.animation = 'none';
      el.innerHTML =
        '<div class="h-item__icon">' + typeIcon(item.content_type) + '</div>' +
        '<div class="h-item__body">' +
          '<div class="h-item__text">' + esc(item.text_preview || item.content_type || T.emptyPreview) + '</div>' +
          '<div class="h-item__meta">' + (item.pinned ? '📌 ' : '') + esc(relTime(item.timestamp)) + '</div>' +
        '</div>';
      el.addEventListener('click', function () { openItem(i); });
      historyList.appendChild(el);
    });
  }

  /* ── History: clear all ────────────────────────────────────── */

  var historyClearing = false;
  histClearBtn.addEventListener('click', function () {
    if (historyClearing || historyItems.length === 0) return;
    if (!window.confirm(T.histClearConfirm)) return;
    historyClearing = true;
    apiFetch('/api/history/clear', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
      .then(function (res) {
        historyClearing = false;
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok) {
          // Wipe the local list and pagination cursor — mirrors the desktop's
          // post-clear state so "load more" can't resurrect phantom pages.
          historyItems.splice(0, historyItems.length);
          historyOffset = 0;
          historyHasMore = false;
          renderHistory();
          showToast(T.histCleared);
        } else {
          showToast((res.data && res.data.error) || T.histClearFail, true);
        }
      })
      .catch(function () {
        historyClearing = false;
        showToast(T.histClearFail + ' · ' + T.loadFailHint, true);
      });
  });

  // Infinite scroll: load the next history page when the list scrolls to the
  // bottom.  Only fires while the history tab is active; the append keeps the
  // current scroll position (the scrollTop property survives the re-render).
  var contentEl = document.querySelector('.content');
  contentEl.addEventListener('scroll', function () {
    if (activeTabName() !== 'history') return;
    if (historyLoading || !historyHasMore) return;
    if (contentEl.scrollTop + contentEl.clientHeight >= contentEl.scrollHeight - 48) {
      loadHistory(true, historyOffset);
    }
  });

  /* ── Item detail + copy to phone ───────────────────────────── */

  function getFullText(item) {
    if (item.types && item.types.TEXT) {
      try {
        var raw = atob(item.types.TEXT);
        var bytes = new Uint8Array(raw.length);
        for (var j = 0; j < raw.length; j++) bytes[j] = raw.charCodeAt(j);
        return new TextDecoder('utf-8').decode(bytes);
      } catch (e) { /* fall through */ }
    }
    return item.text_preview || '';
  }

  // The backend stores image bytes under the "IMAGE" type (EMF under
  // "IMAGE_EMF"); item.image_fmt says how they were encoded. Pick the
  // matching MIME so BMP/TIFF clips render instead of breaking — the
  // bytes are NOT re-encoded server-side.
  function imageDataUrl(item) {
    var types = item.types || {};
    var fmt = item.image_fmt || '';
    var mime = fmt === 'bmp' ? 'image/bmp'
             : fmt === 'tiff' ? 'image/tiff'
             : 'image/png';
    if (types.IMAGE) return 'data:' + mime + ';base64,' + types.IMAGE;
    if (types.IMAGE_EMF) return 'data:image/x-emf;base64,' + types.IMAGE_EMF;
    return '';
  }

  function showImageModal(url) {
    modalImage.src = url;
    modalImage.alt = T.tabHistory;
    modalImage.style.display = '';
    modalText.style.display = 'none';
    modalCopyBtn.style.display = 'none';
    modalImage.classList.remove('modal__image--zoomed');
  }

  function setModalContent(item) {
    var imgUrl = imageDataUrl(item);
    if (imgUrl) {
      showImageModal(imgUrl);
    } else {
      // Drop any stale image from a previously-opened clip before showing text.
      modalImage.style.display = 'none';
      modalImage.removeAttribute('src');
      modalText.style.display = '';
      modalCopyBtn.style.display = '';
      modalText.textContent = getFullText(item) || item.text_preview || T.emptyPreview;
    }
  }

  function openItem(i) {
    var item = historyItems[i];
    modalTitle.textContent = T.tabHistory + ' · ' + relTime(item.timestamp);
    setModalContent(item);
    modalEl.classList.add('modal-mask--show');
    // Track which entry the modal shows by id — list indices shift between
    // renders (poll merges, pin reordering), so actions resolve by id.
    modalEntryId = (item.entry_id !== undefined && item.entry_id !== null) ? item.entry_id : null;
    modalDetailItem = null;
    updateModalUtils();
    // The list no longer carries full content — fetch it when the modal opens.
    if (item.entry_id) {
      getJson('/api/history/item?entry_id=' + encodeURIComponent(item.entry_id))
        .then(function (data) {
          if (data && data.item) {
            setModalContent(data.item);
            // Full payload arrived (with `types`) — the favorite button's
            // text-only enablement depends on it, so re-evaluate.
            modalDetailItem = data.item;
            updateModalUtils();
          }
        })
        .catch(function () { /* keep the preview */ });
    }
  }

  function closeModal() {
    modalEl.classList.remove('modal-mask--show');
    modalImage.classList.remove('modal__image--zoomed');
    modalEntryId = null;
    modalDetailItem = null;
  }

  // Tap the image to zoom in / out.
  modalImage.addEventListener('click', function () {
    modalImage.classList.toggle('modal__image--zoomed');
  });

  document.getElementById('modalClose').addEventListener('click', closeModal);
  modalEl.addEventListener('click', function (e) { if (e.target === modalEl) closeModal(); });

  document.getElementById('modalCopy').addEventListener('click', function () {
    // Copy is text-only — no-op when an image is being displayed.
    if (modalText.style.display === 'none') return;
    var text = modalText.textContent;
    if (!text) return;
    // navigator.clipboard needs a secure context (HTTPS) — on plain HTTP LAN
    // fall back to a hidden textarea + execCommand, and finally tell the user
    // to long-press the visible text.
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { showToast(T.copied); return; }
      } catch (e) { /* fall through */ }
      showToast(T.copyFail, true);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast(T.copied);
      }).catch(fallback);
    } else {
      fallback();
    }
  });

  /* ── Modal per-item actions (pin / push / favorite / delete) ── */

  var modalEntryId = null;
  var modalActionBusy = false;
  var modalDetailItem = null;

  function findHistById(eid) {
    for (var i = 0; i < historyItems.length; i++) {
      var it = historyItems[i];
      if (it && it.entry_id === eid) return it;
    }
    return null;
  }

  // Refresh the pin/favorite/delete row for the currently-open entry.
  // Hidden entirely for legacy rows without a stable entry_id — the server
  // can't address them. Favorite is text-only: disabled while an image fills
  // the modal. `types` may only exist on the detail payload, so prefer it
  // for format checks while pinned state comes from the live list row.
  function updateModalUtils() {
    var item = modalEntryId !== null ? findHistById(modalEntryId) : null;
    var has = !!item;
    histPinBtn.style.display = has ? '' : 'none';
    histFavBtn.style.display = has ? '' : 'none';
    histDelBtn.style.display = has ? '' : 'none';
    histPushBtn.style.display = has ? '' : 'none';
    if (!has) return;
    var detail = (modalDetailItem && modalDetailItem.entry_id === modalEntryId) ? modalDetailItem : item;
    var types = (detail && detail.types) || {};
    var isImageOnly = !!(types.IMAGE || types.IMAGE_EMF) && !types.TEXT;
    histPinBtn.textContent = item.pinned ? T.histUnpin : T.histPin;
    histFavBtn.textContent = T.histFav;
    histDelBtn.textContent = T.histDel;
    histPushBtn.textContent = T.histPush;
    histFavBtn.disabled = isImageOnly;
  }

  // A guard shared by all four actions: one modal, one in-flight mutation —
  // a double-tap must not fire two POSTs for the same entry.
  function modalAction(fn) {
    if (modalActionBusy || modalEntryId === null) return;
    modalActionBusy = true;
    fn(function done() { modalActionBusy = false; });
  }

  histPinBtn.addEventListener('click', function () {
    modalAction(function (done) {
      apiFetch('/api/pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ entry_id: modalEntryId }),
      })
        .then(function (res) {
          done();
          if (res.status === 403) { notifyTokenExpired(); return; }
          var pinned = !!(res.data && res.data.pinned);
          var item = findHistById(modalEntryId);
          if (res.data && res.data.ok && item) {
            item.pinned = pinned;
            reorderHistoryPinnedFirst();
            renderHistory();
            updateModalUtils();
            showToast(pinned ? T.histPinnedToast : T.histUnpinnedToast);
          } else {
            showToast(T.histPinFail, true);
          }
        })
        .catch(function () {
          done();
          showToast(T.histPinFail + ' · ' + T.loadFailHint, true);
        });
    });
  });

  // Keep the local list ordered like the server returns it (pinned first,
  // relative order preserved) so subsequent page merges and load-mores don't
  // interleave pinned rows unpredictably.
  function reorderHistoryPinnedFirst() {
    var pinnedArr = [];
    var rest = [];
    for (var i = 0; i < historyItems.length; i++) {
      (historyItems[i] && historyItems[i].pinned ? pinnedArr : rest).push(historyItems[i]);
    }
    historyItems.splice(0, historyItems.length);
    for (var p = 0; p < pinnedArr.length; p++) historyItems.push(pinnedArr[p]);
    for (var r = 0; r < rest.length; r++) historyItems.push(rest[r]);
  }

  // Push the FULL entry (all stored formats — text, HTML, image bytes) back
  // onto the computer's clipboard. This is the phone's "paste into the PC"
  // gesture and works for images too, unlike the phone-local copy button.
  histPushBtn.addEventListener('click', function () {
    modalAction(function (done) {
      apiFetch('/api/paste-rich', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ entry_id: modalEntryId }),
      })
        .then(function (res) {
          done();
          if (res.status === 403) { notifyTokenExpired(); return; }
          if (res.data && res.data.ok) {
            showToast(T.histPushOk);
          } else {
            showToast((res.data && res.data.error) || T.histPushFail, true);
          }
        })
        .catch(function () {
          done();
          showToast(T.histPushFail + ' · ' + T.loadFailHint, true);
        });
    });
  });

  // Save the entry's full text as a favorite (mirrors the desktop context
  // menu: fetch the complete payload, not the truncated list preview).
  histFavBtn.addEventListener('click', function () {
    modalAction(function (done) {
      var eid = modalEntryId;
      getJson('/api/history/item?entry_id=' + encodeURIComponent(eid))
        .then(function (data) {
          var full = (data && data.item) || {};
          var content = getFullText(full) || full.text_preview ||
            (findHistById(eid) || {}).text_preview || '';
          if (!content) throw new Error('empty');
          var titleLine = content.split('\n')[0].trim().slice(0, 60);
          return apiFetch('/api/favorites', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: titleLine, content: content, group: '' }),
          });
        })
        .then(function (res) {
          done();
          if (res.status === 403) { notifyTokenExpired(); return; }
          if (res.data && res.data.ok !== false) {
            showToast(T.histFavOk);
          } else {
            showToast((res.data && res.data.error) || T.histFavFail, true);
          }
        })
        .catch(function () {
          done();
          showToast(T.histFavFail + ' · ' + T.loadFailHint, true);
        });
    });
  });

  histDelBtn.addEventListener('click', function () {
    modalAction(function (done) {
      var eid = modalEntryId;
      if (!window.confirm(T.histDeleteConfirm)) { done(); return; }
      apiFetch('/api/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ entry_id: eid }),
      })
        .then(function (res) {
          done();
          if (res.status === 403) { notifyTokenExpired(); return; }
          if (res.data && res.data.ok) {
            for (var i = 0; i < historyItems.length; i++) {
              if (historyItems[i] && historyItems[i].entry_id === eid) {
                historyItems.splice(i, 1);
                break;
              }
            }
            // Shrink the pagination cursor with the array so "load more"
            // doesn't skip the entry that shifted into the deleted slot
            // (same contract as store.historyOffset on the desktop).
            historyOffset = Math.max(0, historyOffset - 1);
            closeModal();
            renderHistory();
            showToast(T.histDeleted);
          } else {
            showToast((res.data && res.data.error) || T.histDelFail, true);
          }
        })
        .catch(function () {
          done();
          showToast(T.histDelFail + ' · ' + T.loadFailHint, true);
        });
    });
  });

  /* ── Send ──────────────────────────────────────────────────── */

  var sendBtn = document.getElementById('sendBtn');
  sendBtn.addEventListener('click', function () {
    var text = sendText.value.trim();
    if (!text) { showToast(T.sendEmpty, true); return; }
    sendBtn.disabled = true;
    apiFetch('/api/push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text }),
    })
      .then(function (res) {
        sendBtn.disabled = false;
        // A 403 (stale token) surfaces as the localized token-expired message
        // instead of the server's English error string.
        if (res.status === 403) {
          showToast(T.tokenExpired, true);
          return;
        }
        if (res.data.ok) {
          showToast(T.sendOk);
          sendText.value = '';
        } else {
          showToast(res.data.error || T.sendFail, true);
        }
      })
      .catch(function () {
        sendBtn.disabled = false;
        showToast(T.sendFail + ' · ' + T.loadFailHint, true);
      });
  });

  /* ── Files: upload ─────────────────────────────────────────── */

  document.getElementById('uploadBtn').addEventListener('click', function () {
    fileInput.click();
  });

  function resetUploadUI() {
    uploadXhr = null;
    var btn = document.getElementById('uploadBtn');
    btn.textContent = T.uploadBtn;
    btn.disabled = false;
    uploadProgressWrap.style.display = 'none';
    fileInput.value = '';
  }

  function startUpload(files) {
    var btn = document.getElementById('uploadBtn');
    var totalBytes = 0;
    for (var k = 0; k < files.length; k++) totalBytes += files[k].size;
    var uploadedBytes = 0;
    var cancelled = false;

    btn.textContent = T.uploading;
    btn.disabled = true;
    uploadProgressFill.style.width = '0%';
    uploadProgressWrap.style.display = 'flex';
    uploadCancelBtn.textContent = T.uploadCancel;

    // The server upload endpoint accepts ONE file per request, so queue the
    // selected files and upload them one at a time (cumulative progress).
    var queue = files.slice();

    function uploadNext() {
      if (cancelled) return;
      if (queue.length === 0) {
        resetUploadUI();
        showToast(T.uploadOk);
        loadFiles();
        return;
      }
      var file = queue.shift();
      var form = new FormData();
      form.append('file', file);

      var xhr = new XMLHttpRequest();
      uploadXhr = xhr;
      xhr.open('POST', apiUrl('/api/upload'));
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) {
          var pct = Math.round(((uploadedBytes + e.loaded) / totalBytes) * 100);
          if (pct > 100) pct = 100;
          uploadProgressFill.style.width = pct + '%';
        }
      };
      xhr.onload = function () {
        var data = null;
        try { data = JSON.parse(xhr.responseText); } catch (e) { /* ignore */ }
        var ok = xhr.status >= 200 && xhr.status < 300 && data && data.ok;
        if (ok) {
          uploadedBytes += file.size;
          uploadNext();
        } else {
          resetUploadUI();
          showToast((data && data.error) || T.uploadFail, true);
        }
      };
      xhr.onerror = function () {
        resetUploadUI();
        showToast(T.uploadFail + ' · ' + T.loadFailHint, true);
      };
      xhr.onabort = function () {
        cancelled = true;
        resetUploadUI();
        showToast(T.uploadCancelled);
      };
      xhr.send(form);
    }

    uploadNext();
  }

  fileInput.addEventListener('change', function () {
    if (!fileInput.files || fileInput.files.length === 0) return;
    var files = Array.prototype.slice.call(fileInput.files);
    var total = 0;
    for (var i = 0; i < files.length; i++) total += files[i].size;
    // Pre-flight check: the server buffers the whole body and hard-caps at
    // 128 MB — reject oversized selections before starting the upload.  Leave
    // a 64 KB headroom so multipart boundaries / headers never push the actual
    // request body past the server's Content-Length cap.
    if (total > MAX_UPLOAD_BYTES - 64 * 1024) {
      showToast(T.uploadTooLarge, true);
      fileInput.value = '';
      return;
    }
    startUpload(files);
  });

  uploadCancelBtn.addEventListener('click', function () {
    if (uploadXhr) uploadXhr.abort();
  });

  /* ── Files: list + download ────────────────────────────────── */

  var filesLoading = false;
  function loadFiles(silent) {
    // Skip a silent poll tick while a request is already in flight.
    if (filesLoading && silent) return;
    filesLoading = true;
    if (!silent) {
      fileList.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    }
    getJson('/api/files')
      .then(function (data) {
        filesLoading = false;
        var files = (data && data.files) || [];
        if (files.length === 0) {
          fileList.innerHTML = '<div class="empty"><div class="empty__icon">📁</div><div class="empty__text">' + esc(T.emptyFiles) + '</div></div>';
          return;
        }
        fileList.innerHTML = '';
        files.forEach(function (f) {
          var el = document.createElement('div');
          el.className = 'f-item';
          el.innerHTML =
            '<div class="f-item__icon">📄</div>' +
            '<div class="f-item__body">' +
              '<div class="f-item__name">' + esc(f.name) + '</div>' +
              '<div class="f-item__meta">' + esc(f.size) + ' · ' + esc(f.time) + '</div>' +
            '</div>' +
            '<button class="f-item__delete" title="' + esc(T.fileDelete) + '">✕</button>';
          el.addEventListener('click', function () {
            var a = document.createElement('a');
            a.href = apiUrl('/api/download?file=' + encodeURIComponent(f.name));
            a.download = f.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast(T.fileDownload);
          });
          // The row itself downloads on tap; the delete button stops
          // propagation so it deletes instead of triggering a download.
          el.querySelector('.f-item__delete').addEventListener('click', function (ev) {
            ev.stopPropagation();
            deleteFile(f.name);
          });
          fileList.appendChild(el);
        });
      })
      .catch(function (err) {
        filesLoading = false;
        // Same stale-token handling as history: notify even on silent polls.
        if (err && err.status === 403) notifyTokenExpired();
        if (!silent) {
          var msg = (err && err.status === 403)
            ? esc(T.tokenExpired)
            : esc(T.loadFail) + '<br>' + esc(T.loadFailHint);
          fileList.innerHTML = '<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__text">' + msg + '</div></div>';
        }
      });
  }

  function deleteFile(name) {
    var label = '“' + name + '”';
    if (!window.confirm(ZH ? '删除文件 ' + label + '？' : 'Delete file ' + label + '?')) return;
    apiFetch('/api/files', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name }),
    })
      .then(function (res) {
        if (res.status === 403) { notifyTokenExpired(); return; }
        if (res.data && res.data.ok) {
          showToast(T.fileDeleted);
          loadFiles();
        } else {
          showToast((res.data && res.data.error) || T.uploadFail, true);
        }
      })
      .catch(function () {
        showToast(T.uploadFail + ' · ' + T.loadFailHint, true);
      });
  }

  /* ── Shared formatting helpers ──────────────────────────────── */

  function fmtSize(bytes) {
    return ClipsyncFormat.size(bytes);
  }

  function fmtSpeed(bytesPerSec) {
    return ClipsyncFormat.speed(bytesPerSec);
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function fmtClock(ts) {
    if (!ts) return '';
    var d = new Date(ts * 1000);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  /* ── Chat ──────────────────────────────────────────────────── */

  var chatDevices = [];
  var chatSessions = [];
  var chatOpenSession = null;
  var chatMessages = [];
  var chatLoading = false;
  var chatInviteBusy = '';
  var chatLastMsgCount = 0;
  var chatScrollBottom = false;
  var chatConvSigPrev = '';
  // Typing indicator: peer display deadline (ms epoch) + our own report
  // bookkeeping.  The server lazily expires its flag ~4s after the last
  // frame; the local deadline hides the row even when no poll lands.
  var chatPeerTypingUntil = 0;
  var chatTypingLastState = null;
  var chatTypingLastSent = 0;
  var chatSending = false;
  // Per-peer mute set from GET /api/chat/sessions (`muted: [peer_id...]`) —
  // the backend persists it and suppresses desktop notifications for muted
  // peers, so the phone bell mirrors the same state the desktop shows.
  var chatMutedSet = {};
  // Chat file attachment: busy flag (rendered into the composer template so
  // poll re-renders keep the state) + the session the picked file belongs to.
  var chatFileBusy = false;
  var chatFileSession = null;

  function chatStatusLabel(s) {
    var map = {
      invited: 'chatStatusInvited',
      inviting: 'chatStatusInviting',
      uninviting: 'chatStatusInviting',
      active: 'chatStatusActive',
      declined: 'chatStatusDeclined',
      declined_remote: 'chatStatusDeclined',
      closed: 'chatStatusClosed',
    };
    return T[map[s] || 'chatStatusInvited'] || '';
  }

  function chatStatusClass(s) {
    if (s === 'active') return 'chat-session__status--ok';
    if (s === 'invited' || s === 'inviting' || s === 'uninviting') return 'chat-session__status--warn';
    if (s === 'declined' || s === 'declined_remote') return 'chat-session__status--err';
    return '';
  }

  // The server's system-message text_keys are dotted keys that live in the
  // shared locale JSON (locales/*.json, injected as __I18N_JSON__) — prefer
  // that single source via jt(); fall back to the inline T dict below for
  // older payloads that don't carry a resolvable text_key.
  function chatSystemText(entry) {
    var tk = entry && entry.text_key;
    var raw = tk ? jt(tk) : '';
    if (!raw || raw === tk) {
      var tkey = '';
      if (tk === 'chat.system.peer_offline') tkey = 'chatSystemPeerOffline';
      else if (tk === 'chat.system.session_closed_by_peer') tkey = 'chatSystemClosedByPeer';
      else if (tk === 'chat.system.file_declined') tkey = 'chatSystemFileDeclined';
      else if (tk === 'chat.system.file_cancelled') tkey = 'chatSystemFileCancelled';
      raw = tkey ? T[tkey] : (entry ? entry.text || T.chatSystemUnknown : T.chatSystemUnknown);
    }
    if (!raw) return '';
    var fmt = (entry && entry.fmt) || {};
    var name = fmt.name || '';
    if (!name && chatOpenSession) {
      for (var i = 0; i < chatSessions.length; i++) {
        if (chatSessions[i].session_id === chatOpenSession) {
          name = chatSessions[i].peer_name || '';
          break;
        }
      }
    }
    if (name) raw = raw.replace(/\{name\}/g, name);
    return raw;
  }

  function chatFileStatus(m) {
    var st = (m && m.status) || 'pending';
    if (st === 'done') return m.outgoing ? T.chatFileSent : T.chatFileReceived;
    if (st === 'sending' && !m.outgoing) return T.chatFileReceiving;
    var map = {
      pending: 'chatFilePending',
      await_accept: 'chatFileAwaitAccept',
      sending: 'chatFileSending',
      failed: 'chatFileFailed',
      declined: 'chatFileDeclined',
      rejected: 'chatFileDeclined',
      cancelled: 'chatFileCancelled',
      cancelled_by_peer: 'chatFileCancelled',
      peer_offline: 'chatFileFailed',
      error_timeout: 'chatFileFailed',
      error_size_mismatch: 'chatFileFailed',
      error_security: 'chatFileFailed',
      error_disk: 'chatFileFailed',
    };
    return T[map[st] || 'chatFilePending'] || '';
  }

  function chatOpenSessionObj() {
    if (!chatOpenSession) return null;
    for (var i = 0; i < chatSessions.length; i++) {
      if (chatSessions[i].session_id === chatOpenSession) return chatSessions[i];
    }
    return null;
  }

  // Re-arm the local typing-display deadline from the latest session
  // snapshot (server flag lazily expires ~4s after the peer's last frame).
  function refreshChatPeerTyping() {
    var sess = chatOpenSessionObj();
    if (sess && sess.status === 'active' && sess.peer_typing) {
      chatPeerTypingUntil = Date.now() + 4500;
    } else {
      chatPeerTypingUntil = 0;
    }
  }

  // A cheap signature of the open conversation so silent polls can skip the
  // re-render (and the composer's focus) when nothing changed.
  function chatConvSignature() {
    var parts = [];
    for (var i = 0; i < chatMessages.length; i++) {
      var m = chatMessages[i];
      parts.push(m.entry_id + ':' + (m.status || '') + ':' + (m.ts || '') + ':' + (m.saved_path || ''));
    }
