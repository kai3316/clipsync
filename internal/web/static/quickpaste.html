<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060D">
<!-- iOS / Android standalone ("Add to Home Screen") metadata. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icon-192.png?token=__TOKEN__">
<link rel="manifest" href="/manifest.json?page=quickpaste&token=__TOKEN__">
<title>Quick Paste</title>
<script>
/* The server injects the app-configured locale here (__CLIPSYNC_I18N_LOCALE__
   becomes e.g. "zh-CN"); the fallback keeps this page valid if it is ever
   served without interpolation. */
try { window.__CLIPSYNC_I18N_LOCALE__ = __CLIPSYNC_I18N_LOCALE__; }
catch (e) { window.__CLIPSYNC_I18N_LOCALE__ = ''; }
</script>
<script>
/* Register the service worker so an installed phone page keeps working when
   offline (same as the dashboard).  Fails silently on plain-HTTP LAN access —
   browsers refuse SW registration outside secure contexts; expected. */
try {
  if ('serviceWorker' in navigator) {
    var _tok = (location.search.match(/[?&]token=([^&]+)/) || [])[1] || '';
    navigator.serviceWorker.register('/sw.js?token=' + encodeURIComponent(_tok)).catch(function () {});
  }
} catch (e) {}
</script>
<style>
/* ═══════════════════════════════════════════════════════════════════
   ClipSync Quick Paste — Neo-Futuristic Design System
   All tokens mirrored from css/theme.css for standalone use.
   ═══════════════════════════════════════════════════════════════════ */

:root {
  --clipsync-bg: #06080D;
  --clipsync-surface: #0C1020;
  --clipsync-panel: #111827;
  --clipsync-panel-2: #161E32;
  --clipsync-elevated: #182032;
  --clipsync-fg: #E8EDF5;
  --clipsync-fg-muted: #8899B4;
  --clipsync-fg-subtle: #556680;
  --clipsync-accent: #22D3EE;
  --clipsync-accent-2: #A78BFA;
  --clipsync-accent-3: #F472B6;
  --clipsync-accent-hover: #4CE0F5;
  --clipsync-accent-glow: rgba(34,211,238,0.15);
  --clipsync-accent-glow-strong: rgba(34,211,238,0.30);
  --clipsync-violet-glow: rgba(167,139,250,0.16);
  --clipsync-pink-glow: rgba(244,114,182,0.14);
  --clipsync-success: #00E599;
  --clipsync-danger: #FF4060;
  --clipsync-border: rgba(100,140,200,0.08);
  --clipsync-border-strong: rgba(100,140,200,0.16);
  --clipsync-border-glow: rgba(34,211,238,0.20);
  --clipsync-shadow-lg: 0 12px 48px rgba(0,0,0,0.50), 0 0 12px rgba(34,211,238,0.08);
  --clipsync-radius: 12px;
  --clipsync-radius-sm: 8px;
  --clipsync-font: "SF Pro Display", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --clipsync-font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", "Fira Code", monospace;
  --clipsync-transition-spring: 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
  --clipsync-transition-fast: 120ms cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: var(--clipsync-font);
  background: var(--clipsync-bg);
  color: var(--clipsync-fg);
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  overscroll-behavior: none;
  display: flex;
  flex-direction: column;
}

/* ── Aurora wash (mirrors dashboard base.css) + slow drift ──── */

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse 60% 45% at 12% -10%, var(--clipsync-violet-glow), transparent),
    radial-gradient(ellipse 60% 45% at 88% -10%, var(--clipsync-pink-glow), transparent),
    radial-gradient(ellipse 80% 55% at 50% -20%, var(--clipsync-accent-glow), transparent);
  animation: qpAuroraShift 18s ease-in-out infinite alternate;
}

/* ── Scan-line overlay ────────────────────────────────────────── */

body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.03) 2px,
    rgba(0, 0, 0, 0.03) 4px
  );
}

/* ═══════════════════════════════════════════════════════════════════
   Container
   ═══════════════════════════════════════════════════════════════════ */

.qp-container {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
  max-height: 100vh;
}

/* ═══════════════════════════════════════════════════════════════════
   Header
   ═══════════════════════════════════════════════════════════════════ */

.qp-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--clipsync-border);
  position: relative;
  /* Frosted-glass header — the aurora behind it gets blurred + saturated. */
  background: linear-gradient(180deg, rgba(10, 14, 30, 0.55), rgba(10, 14, 30, 0.28));
  backdrop-filter: blur(18px) saturate(170%);
  -webkit-backdrop-filter: blur(18px) saturate(170%);
}

.qp-header__left {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.qp-header__title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.2;
  background: linear-gradient(135deg, var(--clipsync-accent), var(--clipsync-accent-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow:
    0 0 18px var(--clipsync-accent-glow),
    0 0 36px var(--clipsync-accent-glow);
}

.qp-header__subtitle {
  font-size: 11px;
  color: var(--clipsync-fg-muted);
  font-weight: 500;
  line-height: 1.3;
}

.qp-header__close {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid var(--clipsync-border);
  border-radius: var(--clipsync-radius-sm);
  font-size: 16px;
  color: var(--clipsync-fg-muted);
  cursor: pointer;
  padding: 0;
  line-height: 1;
  transition: all var(--clipsync-transition-fast);
}

.qp-header__close:hover {
  color: var(--clipsync-fg);
  border-color: var(--clipsync-border-strong);
  background: var(--clipsync-accent-glow);
}

/* ═══════════════════════════════════════════════════════════════════
   Body (items list)
   ═══════════════════════════════════════════════════════════════════ */

.qp-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* ═══════════════════════════════════════════════════════════════════
   Item Card — glass neo card
   ═══════════════════════════════════════════════════════════════════ */

.qp-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--clipsync-radius);
  border: 1px solid var(--clipsync-border);
  background: linear-gradient(135deg, rgba(12, 16, 32, 0.75), rgba(17, 24, 39, 0.75));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  cursor: pointer;
  transition: all var(--clipsync-transition-spring);
  position: relative;
  overflow: hidden;
  opacity: 0;
  animation: qpSlideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

/* Re-rendered items (Arrow/Enter/click) skip the entry animation so the
   list doesn't replay the slide-up on every keystroke. Defined here, before
   the .qp-item--selected / .qp-item--pasted rules, so those still win and
   keep their border-glow / paste-flash animations. */
.qp-item--no-entry {
  opacity: 1;
  animation: none;
}

/* Subtle inner glow on hover */
.qp-item::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  opacity: 0;
  background: radial-gradient(ellipse at 70% 0%, var(--clipsync-accent-glow) 0%, transparent 60%);
  transition: opacity var(--clipsync-transition-fast);
  pointer-events: none;
}

.qp-item:hover::after {
  opacity: 1;
}

.qp-item:hover {
  border-color: var(--clipsync-border-glow);
  background: linear-gradient(135deg, rgba(12, 16, 32, 0.9), rgba(22, 30, 50, 0.9));
  box-shadow: 0 0 20px var(--clipsync-accent-glow), 0 4px 16px rgba(0, 0, 0, 0.3);
}

/* Selected state */
.qp-item--selected {
  border-color: var(--clipsync-accent) !important;
  box-shadow:
    0 0 24px var(--clipsync-accent-glow-strong),
    0 0 4px var(--clipsync-accent-glow-strong),
    inset 0 0 12px var(--clipsync-accent-glow) !important;
  transform: scale(1.03);
  background: linear-gradient(135deg, rgba(0, 212, 255, 0.06), rgba(17, 24, 39, 0.92)) !important;
}

/* Pasted flash animation */
.qp-item--pasted {
  /* qpPasteFlash only animates box-shadow/border-color, so without this the
     base .qp-item { opacity: 0 } resurfaces and the item vanishes mid-feedback. */
  opacity: 1;
  animation: qpPasteFlash 0.45s ease-out forwards;
}

/* ── Type icon ────────────────────────────────────────────────── */

.qp-item__icon {
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  background: var(--clipsync-panel);
  border-radius: var(--clipsync-radius-sm);
  border: 1px solid var(--clipsync-border);
}

/* ── Number badge ─────────────────────────────────────────────── */

.qp-item__number {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  font-family: var(--clipsync-font-mono);
  color: var(--clipsync-fg-muted);
  background: var(--clipsync-panel-2);
  border-radius: 6px;
  border: 1px solid var(--clipsync-border);
  transition: all var(--clipsync-transition-fast);
}

.qp-item--selected .qp-item__number {
  color: var(--clipsync-accent);
  border-color: var(--clipsync-accent);
  background: rgba(0, 212, 255, 0.12);
  box-shadow: 0 0 10px var(--clipsync-accent-glow);
}

/* ── Content ──────────────────────────────────────────────────── */

.qp-item__content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.qp-item__text {
  font-size: 13px;
  line-height: 1.4;
  color: var(--clipsync-fg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.qp-item__time {
  font-size: 10px;
  color: var(--clipsync-fg-subtle);
  font-family: var(--clipsync-font-mono);
}

/* ═══════════════════════════════════════════════════════════════════
   Skeleton shimmer
   ═══════════════════════════════════════════════════════════════════ */

.qp-skeleton {
  height: 48px;
  flex-shrink: 0;
  border-radius: var(--clipsync-radius);
  background: linear-gradient(
    90deg,
    var(--clipsync-panel) 0%,
    var(--clipsync-panel-2) 40%,
    var(--clipsync-panel) 80%
  );
  background-size: 200% 100%;
  opacity: 0;
  animation:
    qpSlideUp 0.3s ease-out forwards,
    qpShimmer 1.8s ease-in-out infinite;
}

/* ═══════════════════════════════════════════════════════════════════
   Empty state
   ═══════════════════════════════════════════════════════════════════ */

.qp-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 48px 20px;
  text-align: center;
  flex: 1;
}

.qp-empty__icon {
  font-size: 36px;
  opacity: 0.45;
}

.qp-empty__text {
  font-size: 13px;
  color: var(--clipsync-fg-muted);
  font-weight: 500;
}

.qp-retry {
  margin-top: 14px;
  padding: 10px 22px;
  border: 1px solid var(--clipsync-border-glow);
  border-radius: var(--clipsync-radius);
  background: var(--clipsync-panel);
  color: var(--clipsync-accent);
  font-size: 13px;
  font-weight: 600;
  font-family: var(--clipsync-font);
  cursor: pointer;
  transition: all var(--clipsync-transition-fast);
}

.qp-retry:hover {
  background: var(--clipsync-accent-glow);
  border-color: var(--clipsync-accent);
}

/* ═══════════════════════════════════════════════════════════════════
   Toast
   ═══════════════════════════════════════════════════════════════════ */

.qp-toast {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  padding: 7px 18px;
  background: rgba(14, 19, 40, 0.65);
  color: var(--clipsync-fg);
  border: 1px solid var(--clipsync-border-strong);
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  box-shadow: var(--clipsync-shadow-lg);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--clipsync-transition-fast);
  white-space: nowrap;
  max-width: 88vw;
  overflow: hidden;
  text-overflow: ellipsis;
}

.qp-toast--visible {
  opacity: 1;
}

.qp-toast--error {
  border-color: color-mix(in srgb, var(--clipsync-danger) 40%, transparent);
  color: var(--clipsync-danger);
}

/* ═══════════════════════════════════════════════════════════════════
   Keyframes
   ═══════════════════════════════════════════════════════════════════ */

@keyframes qpSlideUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes qpShimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

@keyframes qpPasteFlash {
  0% {
    box-shadow: 0 0 0 rgba(0, 229, 153, 0), inset 0 0 0 rgba(0, 229, 153, 0);
    border-color: var(--clipsync-success);
  }
  40% {
    box-shadow: 0 0 22px rgba(0, 229, 153, 0.35), inset 0 0 12px rgba(0, 229, 153, 0.08);
    border-color: var(--clipsync-success);
  }
  100% {
    box-shadow: 0 0 0 rgba(0, 229, 153, 0), inset 0 0 0 rgba(0, 229, 153, 0);
    border-color: var(--clipsync-border);
  }
}

/* ── Aurora background drift ─────────────────────────────────── */

@keyframes qpAuroraShift {
  0%   { transform: translate3d(0, 0, 0) scale(1); }
  50%  { transform: translate3d(-3%, 2%, 0) scale(1.06); }
  100% { transform: translate3d(3%, -2%, 0) scale(1.04); }
}

/* ── Title glow pulse ────────────────────────────────────────── */

@keyframes qpGlowPulse {
  0%, 100% { text-shadow: 0 0 18px var(--clipsync-accent-glow), 0 0 36px var(--clipsync-accent-glow); }
  50%      { text-shadow: 0 0 26px var(--clipsync-accent-glow-strong), 0 0 52px var(--clipsync-accent-glow-strong); }
}

/* ── Animated neon border for the selected card ──────────────── */

@keyframes qpBorderGlow {
  0%, 100% { border-color: var(--clipsync-accent); }
  33%      { border-color: var(--clipsync-accent-2); }
  66%      { border-color: var(--clipsync-accent-3); }
}

.qp-header__title {
  animation: qpGlowPulse 3.2s ease-in-out infinite;
}

/* Selected card gets a cycling neon border (cyberpunk touch). Keep opacity
   pinned to 1 (the base .qp-item has opacity:0 filled forward by its entry
   animation) and don't re-run qpSlideUp, or the card would vanish/re-slide. */
.qp-item--selected {
  opacity: 1;
  animation: qpBorderGlow 3.4s ease-in-out infinite;
}

/* ═══════════════════════════════════════════════════════════════════
   Scrollbar
   ═══════════════════════════════════════════════════════════════════ */

.qp-body::-webkit-scrollbar { width: 4px; }
.qp-body::-webkit-scrollbar-track { background: transparent; }
.qp-body::-webkit-scrollbar-thumb {
  background: var(--clipsync-border-strong);
  border-radius: 2px;
}
.qp-body::-webkit-scrollbar-thumb:hover {
  background: var(--clipsync-fg-subtle);
}

/* ── Coarse pointer (phone/tablet): bigger touch targets ──────── */
@media (pointer: coarse) {
  .qp-header { padding: calc(18px + env(safe-area-inset-top)) 16px 14px; }
  .qp-header__close { width: 44px; height: 44px; font-size: 18px; }
  .qp-item { padding: 14px 16px; }
  .qp-item__icon { width: 36px; height: 36px; font-size: 18px; }
  .qp-item__text { font-size: 15px; }
  .qp-item__time { font-size: 11px; }
}

/* ── Reduced motion: freeze aurora / pulse / entry animations ─── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>

<div class="qp-container">
  <!-- Header -->
  <header class="qp-header">
    <div class="qp-header__left">
      <div class="qp-header__title">&#x26A1; <span id="qpTitle" style="visibility:hidden">Quick Paste</span></div>
      <div class="qp-header__subtitle" id="qpSubtitle"></div>
    </div>
    <button class="qp-header__close" id="qpCloseBtn" title="Close (Esc)">&times;</button>
  </header>

  <!-- Items -->
  <div class="qp-body" id="items" role="listbox" aria-label="Clipboard items" tabindex="0">
    <div class="qp-skeleton" style="animation-delay: 0ms"></div>
    <div class="qp-skeleton" style="animation-delay: 60ms"></div>
    <div class="qp-skeleton" style="animation-delay: 120ms"></div>
  </div>

  <!-- Toast -->
  <div class="qp-toast" id="toast"></div>
</div>

<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════
     Parse URL parameters
     ═══════════════════════════════════════════════════════════════ */

  var params = new URLSearchParams(window.location.search);
  var TOKEN = params.get('token') || '';
  // The page is always served by the same server that hosts the API, so the
  // API origin is the page's own origin. The desktop popup still passes
  // host= for backwards compatibility; a phone scans the QR without it.
  var HOST = (params.get('host') || window.location.origin).replace(/\/+$/, '');

  // Whether this tab was opened as the desktop popup.  main.py opens it and
  // passes auto_close=1; that flag — NOT a touch heuristic — decides whether
  // the popup auto-closes / shows the X / accepts Esc.  A touch-screen laptop
  // reports maxTouchPoints>0, so gating CLOSE behavior on touch would leave
  // the popup open forever for those users.  (Keyboard NAVIGATION is gated on
  // IS_TOUCH below, which uses the coarse-pointer media query instead.)
  var AUTO_CLOSE = params.get('auto_close') === '1';
  // Whether main.py opened this as a Chromium --app window (mode=app).  Only
  // an --app window can be genuinely closed: the page POSTs
  // /api/quickpaste/done and main.py terminates the process.  The plain-tab
  // webbrowser fallback (no mode=app) cannot be script-closed, so the page
  // shows a "✓ Pasted" confirmation instead of dead close buttons.
  var IS_APP_WINDOW = params.get('mode') === 'app';
  // The --app popup's instance id, assigned by main.py on open.  POST
  // /api/quickpaste/done echoes it back so the host tears down exactly this
  // popup — never a newer one (and never the user's whole browser).
  var INSTANCE_ID = params.get('instance') || '';
  // Coarse-pointer devices (phones/tablets) tap items to paste; fine-pointer
  // devices (desktops, incl. touch-screen laptops with a trackpad) get
  // keyboard navigation (Arrow/Enter/1-9).  This is deliberately independent
  // of AUTO_CLOSE — a manually-opened desktop tab (no auto_close) keeps
  // keyboard support and the listbox focus.
  var IS_TOUCH = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  // The server knows the app's configured language and injects it as
  // window.__CLIPSYNC_I18N_LOCALE__; prefer that over the device's own
  // navigator.language so this page matches the desktop app's language.
  var serverLocale = window.__CLIPSYNC_I18N_LOCALE__ || '';
  var IS_ZH = (serverLocale || navigator.language || '').toLowerCase().indexOf('zh') === 0;
  document.documentElement.lang = IS_ZH ? 'zh-CN' : 'en';

  /* ═══════════════════════════════════════════════════════════════
     State
     ═══════════════════════════════════════════════════════════════ */

  var state = {
    items:        [],
    selected:     -1,
    loading:      true,
    error:        null,
    pastingIndex: -1,
    toastTimer:   null,
    // Set once the page reaches a done state (plain-tab "✓ Pasted" fallback).
    // render() and the keydown paste paths short-circuit so the list can't be
    // redrawn or pasted from again, and postDone() isn't re-fired.
    terminal:     false,
  };

  /* ═══════════════════════════════════════════════════════════════
     DOM refs
     ═══════════════════════════════════════════════════════════════ */

  var itemsEl = document.getElementById('items');
  var toastEl = document.getElementById('toast');
  // First items render plays the staggered slide-up; later re-renders
  // (Arrow/Enter/click) must not replay it, or the list flickers.
  var itemsRendered = false;

  /* ═══════════════════════════════════════════════════════════════
     API helpers
     ═══════════════════════════════════════════════════════════════ */

  function apiUrl(path) {
    var sep = path.indexOf('?') !== -1 ? '&' : '?';
    return HOST + path + sep + 'token=' + encodeURIComponent(TOKEN);
  }

  var REQUEST_TIMEOUT = 8000;

  // fetch wrapper with an AbortController timeout so a slow / unreachable
  // server can't leave the Quick Paste window on shimmering skeletons forever.
  function fetchWithTimeout(url, options) {
    var opts = options || {};
    var controller = new AbortController();
    opts.signal = controller.signal;
    var timer = setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT);
    return fetch(url, opts).then(function (r) {
      clearTimeout(timer);
      return r;
    }).catch(function (e) {
      clearTimeout(timer);
      if (e && e.name === 'AbortError') {
        var err = new Error('timeout');
        err.timeout = true;
        throw err;
      }
      throw e;
    });
  }

  function fetchHistory() {
    state.loading = true;
    state.error = null;
    render();

    // Request up to 9 items via the 'limit' query parameter
    fetchWithTimeout(apiUrl('/api/history?limit=9'))
      .then(function (r) {
        if (!r.ok) {
          var e = new Error('HTTP ' + r.status);
          e.status = r.status;
          throw e;
        }
        return r.json();
      })
      .then(function (data) {
        state.items = (data.items || []).slice(0, 9);
        state.loading = false;
        // Auto-select the first item
        if (state.items.length > 0 && state.selected < 0) {
          state.selected = 0;
        }
        render();
        // Put keyboard focus on the listbox so Arrow/Enter/1-9 work right away.
        // Fine-pointer devices get this regardless of AUTO_CLOSE — a manually
        // opened desktop tab is still keyboard-driven.
        if (state.items.length > 0 && !IS_TOUCH) {
          itemsEl.focus();
        }
      })
      .catch(function (err) {
        state.loading = false;
        state.items = [];
        if (err && err.status === 403) {
          // Stale / regenerated token — the QR link no longer works.
          state.error = IS_ZH
            ? '访问令牌已更改，请重新扫描电脑上的二维码'
            : 'The access token changed — re-scan the QR code on your computer';
        } else if (err && err.timeout) {
          state.error = IS_ZH ? '加载超时，请检查网络连接' : 'Request timed out — check the network';
        } else {
          state.error = err.message || (IS_ZH ? '加载历史失败' : 'Failed to load history');
        }
        render();
        showToast(state.error, true);
      });
  }

  /**
   * Get the full text from a history item, preferring decoded types.TEXT
   * over the potentially-truncated text_preview.
   */
  function getFullText(item) {
    if (item.types && item.types.TEXT) {
      try {
        var raw = atob(item.types.TEXT);
        var bytes = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) {
          bytes[i] = raw.charCodeAt(i);
        }
        return new TextDecoder('utf-8').decode(bytes);
      } catch (e) {
        // fall through to text_preview
      }
    }
    return item.text_preview || '';
  }

  function pasteItem(index) {
    if (state.terminal) { return; }
    if (index < 0 || index >= state.items.length) { return; }

    var item = state.items[index];

    var doPaste = function (text) {
      if (!text) {
        showToast(IS_ZH ? '没有文本内容' : 'No text content', true);
        return;
      }

      // Mark as pasting for the flash animation
      state.pastingIndex = index;
      render();

      // Timeout the push like every other request so a slow / unreachable
      // server can't leave the popup stuck on the pasting flash forever.
      fetchWithTimeout(apiUrl('/api/push'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text }),
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.ok) {
            showToast(IS_ZH ? '已发送到电脑' : 'Sent to computer');
            // The desktop popup closes after a beat so the user sees feedback;
            // a plain tab (no auto_close) stays open so more items can be
            // pasted in a row.  For the --app popup, POST /api/quickpaste/done
            // so main.py kills the process (the REAL close — window.close() is
            // blocked in a plain tab, which is why the v1.0.29 popup never
            // actually closed).  The plain-tab fallback cannot be closed, so
            // show a confirmation instead of a dead close attempt.
            if (AUTO_CLOSE) {
              postDone();
              if (IS_APP_WINDOW) {
                setTimeout(function () { closeWindow(); }, 350);
              } else {
                showPastedFallback();
              }
            }
          } else {
            showToast(data.error || (IS_ZH ? '发送失败' : 'Paste failed'), true);
            state.pastingIndex = -1;
            render();
          }
        })
        .catch(function () {
          showToast(IS_ZH ? '发送失败' : 'Paste failed', true);
          state.pastingIndex = -1;
          render();
        });
    };

    // History list responses no longer carry `types`, so when the item only
    // has a (possibly truncated) preview, fetch the full entry first.
    if (item.types && item.types.TEXT) {
      doPaste(getFullText(item));
    } else if (item.entry_id) {
      fetch(apiUrl('/api/history/item?entry_id=' + encodeURIComponent(item.entry_id)))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var full = item.text_preview || '';
          if (data && data.item && data.item.types) {
            full = getFullText(data.item) || full;
          }
          doPaste(full);
        })
        .catch(function () { doPaste(item.text_preview || ''); });
    } else {
      doPaste(getFullText(item));
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     Toast
     ═══════════════════════════════════════════════════════════════ */

  function showToast(msg, isError) {
    if (state.toastTimer) {
      clearTimeout(state.toastTimer);
      state.toastTimer = null;
    }
    toastEl.textContent = msg;
    toastEl.className = 'qp-toast qp-toast--visible';
    if (isError) { toastEl.classList.add('qp-toast--error'); }

    state.toastTimer = setTimeout(function () {
      toastEl.className = 'qp-toast';
      state.toastTimer = null;
    }, 2200);
  }

  /* ═══════════════════════════════════════════════════════════════
     Window close
     ═══════════════════════════════════════════════════════════════ */

  // POST /api/quickpaste/done so main.py terminates the --app process (the
  // real close mechanism).  donePosted is set ONLY once the server confirms
  // receipt (2xx) — a timeout or network failure leaves it false so the 60s
  // safety net (and its retry below) can re-fire the POST.  Carries this
  // popup's instance id so the host closes exactly this instance (never a
  // newer one, and never the user's whole browser).  Resolves true when the
  // host confirmed the teardown, false otherwise (callers may retry).
  var donePosted = false;
  function postDone() {
    if (donePosted) return Promise.resolve(true);
    return fetchWithTimeout(apiUrl('/api/quickpaste/done'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ instance: INSTANCE_ID }),
    }).then(function (r) {
      if (r.ok) {
        donePosted = true;
        return true;
      }
      throw new Error('HTTP ' + r.status);
    }).catch(function () {
      // Timeout / network / non-2xx: the host never confirmed.  donePosted
      // stays false so the 60s safety net (or an explicit close) retries.
      return false;
    });
  }

  // Plain-tab fallback (no --app available): the popup cannot be
  // script-closed, so after a successful paste drop the item list and show a
  // clear done state instead of leaving dead close buttons.  Accepted
  // degradation — the user closes the tab manually.  terminal=true makes the
  // state final: render() and the keydown paste paths short-circuit so the
  // list can't be redrawn or pasted from again, and postDone() isn't re-fired.
  function showPastedFallback() {
    state.terminal = true;
    itemsEl.innerHTML =
      '<div class="qp-empty">' +
        '<div class="qp-empty__icon">&#x2705;</div>' +
        '<div class="qp-empty__text">' + (IS_ZH ? '✓ 已粘贴 — 可以关闭此标签页' : '✓ Pasted — you can close this tab') + '</div>' +
      '</div>';
  }

  function closeWindow() {
    // Only the auto_close popup (main.py) attempts to close; window.close()
    // is a silent no-op in a plain tab, so a non-auto_close tab keeps the
    // Esc/X affordances hidden (they would be dead buttons).
    if (!AUTO_CLOSE) { return; }
    // Ask main.py to kill the --app process first — that is what actually
    // closes the popup.  window.close() stays as a harmless extra attempt
    // (it can work for some script-opened windows).
    postDone();
    try { window.close(); } catch (e) { /* ignore */ }
  }

  /* ═══════════════════════════════════════════════════════════════
     Render
     ═══════════════════════════════════════════════════════════════ */

  function getTypeIcon(type) {
    var ct = (type || '').toUpperCase();
    if (ct === 'TEXT' || ct === 'HTML' || ct === 'RTF') { return '📝'; }  /* 📝 */
    if (ct === 'IMAGE' || ct === 'IMAGE_EMF' || ct === 'IMAGE_PNG') { return '🖼'; }  /* 🖼 */
    if (ct === 'FILE') { return '📄'; }  /* 📄 */
    return '📋';  /* 📋 */
  }

  function getRelativeTime(ts) {
    if (!ts) { return ''; }
    var now = Date.now() / 1000;
    var diff = now - ts;
    if (diff < 10)   { return IS_ZH ? '刚刚' : 'just now'; }
    if (diff < 60)   { return Math.floor(diff) + (IS_ZH ? '秒前' : 's ago'); }
    if (diff < 3600) { return Math.floor(diff / 60) + (IS_ZH ? '分钟前' : 'm ago'); }
    if (diff < 86400) { return Math.floor(diff / 3600) + (IS_ZH ? '小时前' : 'h ago'); }
    if (diff < 604800) { return Math.floor(diff / 86400) + (IS_ZH ? '天前' : 'd ago'); }
    var d = new Date(ts * 1000);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function render() {
    // Terminal (plain-tab "✓ Pasted" fallback): freeze the done state — never
    // redraw the item list (or a stale loading/error/empty state) over it.
    if (state.terminal) { return; }
    // No active option after a re-render until the items loop restores it.
    itemsEl.removeAttribute('aria-activedescendant');

    // ── Loading ──────────────────────────────────────────────────
    if (state.loading) {
      itemsEl.innerHTML = '';
      for (var i = 0; i < 3; i++) {
        var skel = document.createElement('div');
        skel.className = 'qp-skeleton';
        skel.style.animationDelay = (i * 60) + 'ms';
        itemsEl.appendChild(skel);
      }
      return;
    }

    // ── Error ────────────────────────────────────────────────────
    if (state.error) {
      itemsEl.innerHTML = '';
      var errEl = document.createElement('div');
      errEl.className = 'qp-empty';
      errEl.innerHTML =
        '<div class="qp-empty__icon">&#x26A1;</div>' +
        '<div class="qp-empty__text">' + escHtml(state.error) + '</div>';
      // A one-tap Retry recovers from a timeout / transient network blip
      // without reloading the whole page.
      var retryBtn = document.createElement('button');
      retryBtn.className = 'qp-retry';
      retryBtn.textContent = IS_ZH ? '重试' : 'Retry';
      retryBtn.addEventListener('click', function () { fetchHistory(); });
      errEl.appendChild(retryBtn);
      itemsEl.appendChild(errEl);
      return;
    }

    // ── Empty ────────────────────────────────────────────────────
    if (state.items.length === 0) {
      itemsEl.innerHTML =
        '<div class="qp-empty">' +
          '<div class="qp-empty__icon">&#x1F4CB;</div>' +
          '<div class="qp-empty__text">' + (IS_ZH ? '暂无剪贴板历史' : 'No clipboard history') + '</div>' +
        '</div>';
      return;
    }

    // ── Items ────────────────────────────────────────────────────
    itemsEl.innerHTML = '';

    for (var i2 = 0; i2 < state.items.length; i2++) {
      (function (index) {
        var item = state.items[index];
        var el = document.createElement('div');
        el.className = 'qp-item';
        el.setAttribute('id', 'qp-item-' + index);
        el.setAttribute('role', 'option');
        el.setAttribute('aria-selected', index === state.selected ? 'true' : 'false');
        // Replay the staggered entry animation only on the first render;
        // re-renders (Arrow/Enter/click) would otherwise flicker every item.
        if (itemsRendered) {
          el.classList.add('qp-item--no-entry');
        } else {
          el.style.animationDelay = (index * 30) + 'ms';
        }

        if (index === state.selected) {
          el.classList.add('qp-item--selected');
        }
        if (index === state.pastingIndex) {
          el.classList.add('qp-item--pasted');
        }

        el.addEventListener('click', function () {
          state.selected = index;
          render();
          pasteItem(index);
        });

        var icon = getTypeIcon(item.content_type);
        var number = index + 1;
        var preview = item.text_preview || item.content_type || (IS_ZH ? '(空)' : '(empty)');
        var time = getRelativeTime(item.timestamp);

        el.innerHTML =
          '<div class="qp-item__icon">' + icon + '</div>' +
          '<div class="qp-item__number">' + number + '</div>' +
          '<div class="qp-item__content">' +
            '<div class="qp-item__text">' + escHtml(preview) + '</div>' +
            '<div class="qp-item__time">' + escHtml(time) + '</div>' +
          '</div>';

        itemsEl.appendChild(el);
      })(i2);
    }
    itemsRendered = true;
    if (state.selected >= 0) {
      itemsEl.setAttribute('aria-activedescendant', 'qp-item-' + state.selected);
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     Keyboard handling
     ═══════════════════════════════════════════════════════════════ */

  document.addEventListener('keydown', function (e) {
    var key = e.key;
    var n = state.items.length;

    // ── Escape → close ──────────────────────────────────────────
    // Gated on AUTO_CLOSE inside closeWindow(); handled first so it works
    // even on touch pages (where navigation below is disabled).
    if (key === 'Escape') {
      e.preventDefault();
      closeWindow();
      return;
    }

    // Terminal (plain-tab "✓ Pasted" fallback): no more navigation or paste —
    // only Escape (handled above) remains, and it is a harmless close attempt.
    if (state.terminal) { return; }

    // ── Keyboard navigation is a fine-pointer affordance ─────────
    // A coarse-pointer (touch) page relies on tapping items — its hint reads
    // "Tap an item".  This is independent of AUTO_CLOSE: a manually-opened
    // desktop tab (no auto_close) still navigates with the keyboard.
    if (IS_TOUCH) { return; }

    // ── Number keys 1-9 → direct paste ──────────────────────────
    if (key >= '1' && key <= '9') {
      e.preventDefault();
      var idx = parseInt(key) - 1;
      if (idx < n) {
        state.selected = idx;
        render();
        pasteItem(idx);
      }
      return;
    }

    // ── Arrow Down ──────────────────────────────────────────────
    if (key === 'ArrowDown') {
      e.preventDefault();
      if (n === 0) { return; }
      if (state.selected < 0) {
        state.selected = 0;
      } else {
        state.selected = Math.min(state.selected + 1, n - 1);
      }
      render();
      scrollToSelected();
      return;
    }

    // ── Arrow Up ────────────────────────────────────────────────
    if (key === 'ArrowUp') {
      e.preventDefault();
      if (n === 0) { return; }
      if (state.selected < 0) {
        state.selected = 0;
      } else {
        state.selected = Math.max(state.selected - 1, 0);
      }
      render();
      scrollToSelected();
      return;
    }

    // ── Enter → paste selected ──────────────────────────────────
    if (key === 'Enter') {
      e.preventDefault();
      if (state.selected >= 0 && state.selected < n) {
        pasteItem(state.selected);
      }
      return;
    }

    // ── Backspace → clear selection ─────────────────────────────
    if (key === 'Backspace') {
      e.preventDefault();
      state.selected = -1;
      render();
      return;
    }
  });

  function scrollToSelected() {
    var sel = itemsEl.querySelector('.qp-item--selected');
    if (sel) {
      sel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     Init — header text, window size, then fetch history
     ═══════════════════════════════════════════════════════════════ */

  // Adapt the header hints to the input method: coarse-pointer (touch) pages
  // tap items; fine-pointer (desktop) pages use the keyboard.  This is
  // independent of AUTO_CLOSE — a manually-opened desktop tab (no auto_close)
  // still gets the keyboard hint.  The --app popup additionally advertises Esc.
  var subtitleEl = document.getElementById('qpSubtitle');
  var titleEl = document.getElementById('qpTitle');
  if (titleEl) {
    titleEl.textContent = IS_ZH ? '快速粘贴' : 'Quick Paste';
    titleEl.style.visibility = 'visible';
  }
  // Localize the hardcoded HTML strings now that the locale is known, and
  // bind the X button.  Only an --app window shows the X — it is the one
  // close affordance that actually works there (POST done + process kill).
  // A plain-tab fallback hides it because window.close() is a silent no-op
  // and there is no process to kill.
  var closeBtn = document.getElementById('qpCloseBtn');
  if (closeBtn) {
    closeBtn.title = IS_ZH ? '关闭 (Esc)' : 'Close (Esc)';
    closeBtn.addEventListener('click', function (e) {
      e.preventDefault();
      closeWindow();
    });
    if (!IS_APP_WINDOW) {
      closeBtn.style.display = 'none';
    }
  }
  itemsEl.setAttribute('aria-label', IS_ZH ? '剪贴板条目' : 'Clipboard items');
  if (subtitleEl) {
    if (IS_TOUCH) {
      subtitleEl.textContent = IS_ZH ? '点击条目即可发送到电脑' : 'Tap an item to paste to this computer';
    } else if (AUTO_CLOSE && IS_APP_WINDOW) {
      subtitleEl.textContent = IS_ZH ? '按 1-9 粘贴 · ↑↓ 选择 · Esc 关闭' : 'Press 1–9 to paste · ↑↓ to navigate · Esc to close';
    } else {
      subtitleEl.textContent = IS_ZH ? '按 1-9 粘贴 · ↑↓ 选择' : 'Press 1–9 to paste · ↑↓ to navigate';
    }
  }

  // Ask the browser for a small floating-window size. Only the desktop popup
  // does this; plain tabs ignore resizeTo so skip them.
  if (AUTO_CLOSE) {
    try {
      window.resizeTo(400, 540);
      window.moveTo(
        (screen.availWidth - 400) / 2,
        (screen.availHeight - 540) / 2
      );
    } catch (e) { /* ignore */ }
  }

  // 60s safety net: an abandoned --app popup (opened but never pasted) would
  // otherwise leak its process.  POST done after 60s so main.py kills it.
  // If the host never confirms (network blip / server hiccup), retry a couple
  // of times with a short backoff, then give up and ask the user to close the
  // window by hand rather than looping forever.  postDone() is idempotent, so
  // a paste that already fired it (and was confirmed) is a no-op.
  if (AUTO_CLOSE) {
    var DONE_NET_ATTEMPTS = 3;
    var DONE_NET_RETRY_MS = 10000;
    var scheduleDoneNet = function (attempt) {
      setTimeout(function () {
        postDone().then(function (confirmed) {
          if (confirmed) { return; }
          if (attempt + 1 < DONE_NET_ATTEMPTS) {
            scheduleDoneNet(attempt + 1);
          } else {
            // Exhausted retries — the host never confirmed the teardown.
            // Show a persistent hint so the user closes the popup by hand.
            state.terminal = true;
            itemsEl.innerHTML =
              '<div class="qp-empty">' +
                '<div class="qp-empty__icon">&#x26A0;&#xFE0F;</div>' +
                '<div class="qp-empty__text">' + (IS_ZH ? '无法自动关闭 — 请手动关闭此窗口' : 'Could not auto-close — please close this window') + '</div>' +
              '</div>';
            showToast(IS_ZH ? '关闭失败，请手动关闭窗口' : 'Auto-close failed — close the window manually', 4000, true);
          }
        });
      }, attempt === 0 ? 60000 : DONE_NET_RETRY_MS);
    };
    scheduleDoneNet(0);
  }

  if (!HOST) {
    state.loading = false;
    state.error = IS_ZH ? '缺少服务器地址' : 'Missing host parameter';
    render();
  } else {
    fetchHistory();
  }

})();
</script>

</body>
</html>
