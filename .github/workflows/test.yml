name: Tests

# Tests are run locally before a release.  CI keeps only one small Ubuntu
# smoke job on branch pushes; the publishing workflows do not depend on it, so
# a platform-specific run can never hold a tagged build up.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxcb1 xclip

      - name: Install the package and its test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c scripts/constraints.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest tests -q
