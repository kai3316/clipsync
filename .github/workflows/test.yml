name: Test

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Collect logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/clipsync-logs"
          # upload-artifact does not expand '~', so resolve the per-OS log dir
          # with runner env vars and stage the files under RUNNER_TEMP first.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp -r "$APPDATA/ClipSync/"*.log "$RUNNER_TEMP/clipsync-logs/" 2>/dev/null || true
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp -r "$HOME/Library/Logs/ClipSync/"*.log "$RUNNER_TEMP/clipsync-logs/" 2>/dev/null || true
          else
            cp -r "$HOME/.local/share/clipsync/"*.log "$RUNNER_TEMP/clipsync-logs/" 2>/dev/null || true
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/clipsync-logs
          if-no-files-found: warn
