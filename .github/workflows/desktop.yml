name: Tauri Desktop

on:
  # Tags and a manual dispatch, nothing else.  A push to a branch does not
  # build three platforms' bundles here: that is expensive enough to be worth
  # doing once per release, and the tests it used to run belong on the machine
  # doing the work.  A dispatch on a branch still produces all of it -- it just
  # cannot publish, because `release` is gated on the ref being a tag.
  push:
    tags: ['v*']
  workflow_dispatch:

# Two runs for the same tag both carry a `release` job that uploads installers
# to it with `--clobber`, so whichever finishes last decides what the release
# holds.  Move the tag and that is the *older* commit's build -- the guard
# build.yml already keeps for its half of the release, needed here for this
# half.  Same ref supersedes same ref; a tag build is never cancelled by a
# push to master, which is a different ref.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    # Unsigned bundles, on purpose: what this job establishes is that each
    # platform turns the tree into an installable artifact at all.  Signing,
    # notarization and updater verification are a separate release gate, and
    # nothing here claims them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: clipsync-desktop-windows
          # Apple Silicon only, matching build.yml: Intel Macs are not supported.
          - os: macos-latest
            bundles: app,dmg
            artifact: clipsync-desktop-macos-arm64
          - os: ubuntu-24.04
            bundles: deb,appimage
            artifact: clipsync-desktop-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build the Python sidecar
        run: python -m PyInstaller --noconfirm clipsync-sidecar.spec
      - name: Smoke the packaged sidecar
        # Windows only, because that is where this has actually been run: the
        # other two runners get the build without the check rather than a check
        # nobody has watched pass.  What it holds: the Companion resources
        # embedded in the executable match the tree byte for byte, and the
        # packaged binary answers its own IPC and serves authenticated HTTP over
        # two full restart cycles.  None of that is visible to the Python suite,
        # which never loads the executable at all.
        if: runner.os == 'Windows'
        run: python scripts/smoke_sidecar.py dist/clipsync-sidecar.exe
      - name: Stage the sidecar under its target-triple name
        # Bash on every runner: the Windows default shell would not run this.
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          triple=$(rustc -vV | sed -n 's/^host: //p')
          echo "host target: $triple"
          mkdir -p desktop/src-tauri/binaries
          cp "dist/clipsync-sidecar${ext}" "desktop/src-tauri/binaries/clipsync-sidecar-${triple}${ext}"
          ls -l desktop/src-tauri/binaries
      - name: Write the packaging config
        # Mirrors scripts/build-tauri.ps1, without needing pwsh on macOS/Linux.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python - <<'PY'
          import json
          import sys

          sys.path.insert(0, ".")
          from internal.version import __version__

          bundle = {"externalBin": ["binaries/clipsync-sidecar"]}

          # The updater's payloads and their detached signatures.  Asked for on
          # a release build only: tauri.conf.json carries the public key, so the
          # bundler treats "sign this" without a private key in reach as an
          # error rather than a no-op, and a manual dispatch on a branch has no
          # secrets.  Set here rather than in the committed config so that a
          # developer running `tauri build` locally is not required to hold the
          # signing key at all.
          if "${{ github.ref }}".startswith("refs/tags/v"):
              bundle["createUpdaterArtifacts"] = True

          # externalBin is resolved against src-tauri, not against this file,
          # and names the sidecar without its triple -- Tauri appends
          # "-<target-triple><ext>" itself, which is why the staged file carries it.
          with open("build/tauri-package.json", "w", encoding="utf-8") as handle:
              json.dump({"version": __version__, "bundle": bundle}, handle)
          PY
          cat build/tauri-package.json
      - name: Build the desktop bundles
        working-directory: desktop
        env:
          # Read by the bundler when `createUpdaterArtifacts` is on -- the
          # contents of the minisign private key, not a path to it.  Unset on a
          # branch dispatch, which never turns that flag on.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm exec tauri build -- --config ../build/tauri-package.json --bundles ${{ matrix.bundles }}
      - name: Verify the macOS bundle is signed
        # An unsigned bundle is not merely warned about on Apple Silicon: the
        # kernel refuses to launch it, and the user is told the download is
        # damaged.  tauri.conf.json asks the bundler for an ad-hoc signature
        # (`bundle.macOS.signingIdentity`), and this asserts the bundler
        # actually produced one rather than quietly shipping the unsigned
        # bundle the user reported.  No Apple credentials are involved.
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app="desktop/src-tauri/target/release/bundle/macos/ClipSync.app"
          test -d "$app"
          # Fails on a missing or invalid signature, and on any nested binary
          # the bundler signed with a different identity than the app.
          codesign --verify --strict --deep --verbose=2 "$app"
          # An ad-hoc signature has no Team ID and no certificate chain; the
          # presence of either would mean this is a real identity, not the one
          # this project configured.
          if codesign -dv "$app" 2>&1 | grep -q '^Authority='; then
            echo "::error::$app is signed by a real identity; this project builds ad-hoc"
            exit 1
          fi
          if ! codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'; then
            echo "::error::$app does not carry an ad-hoc signature"
            exit 1
          fi
          # The sidecar is embedded in the bundle and has to be signed too.
          codesign --verify --strict --verbose=2 "$app/Contents/MacOS/clipsync-sidecar"
          echo "OK: $app and its sidecar carry ad-hoc signatures"
      - name: Run the bundled sidecar from inside the macOS bundle
        # The signatures above are necessary but not sufficient.  The sidecar is
        # a PyInstaller onefile build, so the Python framework is packed inside
        # the executable and extracted to a temp directory at run time carrying
        # whatever signature it had when the runner's Python was installed.
        # macOS refuses to load a dylib whose Team ID differs from its
        # process's, and that refusal happens after every check above has
        # passed -- which is how build.yml came to re-sign the legacy bundle at
        # all.  Running the sidecar from where the application will run it is
        # the only test that reaches the extract-and-load path.
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          sidecar="desktop/src-tauri/target/release/bundle/macos/ClipSync.app/Contents/MacOS/clipsync-sidecar"
          data=$(mktemp -d)
          # --history-only opens no sockets and starts no background services;
          # EOF on stdin ends the session and returns 0.  A dyld failure to load
          # the packed framework aborts the process instead, which is the
          # outcome this step exists to catch.
          if ! CLIPSYNC_CONFIG_DIR="$data" "$sidecar" --history-only </dev/null; then
            echo "::error::$sidecar did not run -- the packed Python runtime could not be loaded"
            exit 1
          fi
          echo "OK: the bundled sidecar ran and loaded its Python runtime"
      - name: Upload the bundles
        uses: actions/upload-artifact@v4
        with:
          # Installers only.  The macOS .app reaches an artifact zip without its
          # symlinks, so the dmg is the one to hand a user there; a Linux
          # AppImage needs a chmod +x after download; Windows' setup .exe runs
          # as it is.
          name: ${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*-setup.exe
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
      - name: Upload the updater payloads
        # Separate from the installers and tag-gated, because these exist only
        # when the build was signed: a branch dispatch never requests
        # `createUpdaterArtifacts`, so this glob would match nothing and
        # `if-no-files-found` would fail the leg.  The `.app.tar.gz` is here
        # rather than above because it is an update payload, not an installer:
        # the updater extracts it over the installed bundle, and no human is
        # meant to open it.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-updater
          path: |
            desktop/src-tauri/target/release/bundle/**/*.sig
            desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
          if-no-files-found: error

  release:
    # build.yml creates the release in its `prepare` job the moment the tag
    # lands, precisely so this uploader cannot race it; this job adds the
    # desktop installers to it, so one Releases page carries both apps.
    # Nothing is created or deleted here.
    #
    # `needs: package` is what makes the artifacts this job attaches the ones
    # just built.  It is worth naming because dropping it would not fail the
    # run: the job uploads whatever the download holds, so the release would
    # quietly be assembled from a partial or stale set and nothing on the page
    # would say so.
    #
    # The test gate that used to be named here (`needs: [package, desktop]`)
    # went with the `desktop` job: the suite runs locally now, and what this
    # workflow owes a tag is a signed bundle and an accurate manifest.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
      - name: Attach the desktop installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"

          # The release is normally already there by now.  This wait is a
          # safety net for the case where `prepare` lost a race with a re-push
          # of the same tag; it is not the mechanism the design relies on.
          for _ in $(seq 1 30); do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then break; fi
            sleep 20
          done
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null

          # Installers only -- a macOS .app would otherwise contribute one
          # release asset per file inside the bundle.  Read with -print0 so a
          # path with a space in it survives.  The .app.tar.gz is the one
          # exception: it is the macOS update payload, so it has to be
          # downloadable even though nobody opens it by hand.  The .sig files
          # are deliberately not attached -- their contents go into the
          # manifest below, and loose copies would only clutter the page.
          files=()
          while IFS= read -r -d '' f; do
            case "$f" in
              *-setup.exe|*.msi|*.dmg|*.deb|*.AppImage) files+=("$f") ;;
              *.app.tar.gz) files+=("$f") ;;
            esac
          done < <(find bundles -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No desktop installers were produced"
            exit 1
          fi
          printf 'Attaching: %s\n' "${files[@]}"
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"

      - name: Write the update manifest
        # One manifest for the whole release, assembled here rather than by the
        # three build legs: they run in parallel and cannot see each other's
        # artifacts, so per-leg manifests would need a merge step and a fourth
        # job.  The tag is the version, and `v` has to come off it -- the
        # updater parses this field as semver and rejects a leading `v`, which
        # would make every client's check fail silently.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"

          python3 - "$version" "$base" <<'PY'
          import datetime
          import json
          import pathlib
          import sys

          version, base = sys.argv[1], sys.argv[2]

          # The updater looks for `{os}-{arch}-{installer}` first and falls back
          # to `{os}-{arch}`.  Linux needs both of its own keys, because a .deb
          # and an AppImage are different payloads and a single bare
          # `linux-x86_64` entry could only ever name one of them -- a .deb
          # client served AppImage bytes fails the installer's own format check.
          # The bare entries are the fallback for a client whose bundle type the
          # plugin could not identify; on Linux that path installs an AppImage,
          # which is what they therefore name.
          wanted = {
              "windows-x86_64-nsis": "*-setup.exe",
              "darwin-aarch64-app": "*.app.tar.gz",
              "linux-x86_64-appimage": "*.AppImage",
              "linux-x86_64-deb": "*.deb",
              "windows-x86_64": "*-setup.exe",
              "darwin-aarch64": "*.app.tar.gz",
              "linux-x86_64": "*.AppImage",
          }

          # The artifact zip keeps the path it had under `bundle/`, so match on
          # the basename and never on the full path.
          artifacts, signatures = {}, {}
          for path in pathlib.Path("bundles").rglob("*"):
              if not path.is_file():
                  continue
              name = path.name
              if name.endswith(".sig"):
                  signatures[name[: -len(".sig")]] = path.read_text().strip()
                  continue
              for key, pattern in wanted.items():
                  if key not in artifacts and pathlib.PurePath(name).match(pattern):
                      artifacts[key] = name

          # A manifest naming an artifact that is not on the release, or one
          # with no signature, is a client-side failure no signal on this side
          # would ever show.  Refuse to publish either.
          missing = [key for key in wanted if key not in artifacts]
          if missing:
              sys.exit("no artifact for: " + ", ".join(missing))
          unsigned = [artifacts[key] for key in wanted if artifacts[key] not in signatures]
          if unsigned:
              sys.exit("no signature for: " + ", ".join(sorted(set(unsigned))))

          json.dump(
              {
                  "version": version,
                  "pub_date": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "platforms": {
                      key: {
                          "signature": signatures[artifacts[key]],
                          "url": f"{base}/{artifacts[key]}",
                      }
                      for key in wanted
                  },
              },
              sys.stdout,
              indent=2,
          )
          PY

          cat latest.json
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber latest.json
