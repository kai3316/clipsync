name: Mirror release to Cloudflare R2

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mirror"
        required: true
        default: "v1.3.2"

permissions:
  contents: read

concurrency:
  group: r2-mirror-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the configuration is present
        run: |
          set -euo pipefail
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done
          echo "Mirroring $TAG to $R2_PUBLIC_BASE"

      - name: Download the published release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          ls -lh dist

      - name: Install the S3 client
        run: |
          python3 -m pip install --quiet awscli

      - name: Upload the current installers and updater payloads
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # No `--delete` yet: the old manifest may still point at the old
          # filenames while this runs.  Upload the new assets first, switch the
          # manifest, then remove what the new manifest no longer names.
          aws s3 sync dist/ "s3://${R2_BUCKET}/latest/" \
            --endpoint-url "$ENDPOINT" \
            --exclude "latest.json" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Point the update manifest at R2
        run: |
          set -euo pipefail
          python3 - "$TAG" "$R2_PUBLIC_BASE" <<'PY'
          import json
          import pathlib
          import sys
          tag, base = sys.argv[1], sys.argv[2].rstrip("/")
          path = pathlib.Path("dist/latest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          for platform in (manifest.get("platforms") or {}).values():
              url = platform.get("url") or ""
              name = url.rsplit("/", 1)[-1]
              if name:
                  platform["url"] = f"{base}/latest/{name}"
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY

      - name: Upload the update manifest last
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp dist/latest.json "s3://${R2_BUCKET}/latest.json" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/json" \
            --cache-control "no-cache, max-age=0"

      - name: Publish stable download names
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # The documentation links must not carry a version.  Publish one
          # readable name per platform and architecture under `download/`; the
          # browser sees the current filename through Content-Disposition.  The
          # versioned files under `latest/` stay as the updater's payloads.
          mappings=(
            "windows-x64.exe|dist/ClipSync_*_x64-setup.exe"
            "macos-arm64.dmg|dist/ClipSync_*_aarch64.dmg"
            "macos-x64.dmg|dist/ClipSync_*_x64.dmg"
            "linux-x64.AppImage|dist/ClipSync_*_amd64.AppImage"
            "linux-x64.deb|dist/ClipSync_*_amd64.deb"
            "linux-arm64.AppImage|dist/ClipSync_*_aarch64.AppImage"
            "linux-arm64.deb|dist/ClipSync_*_arm64.deb"
          )
          for mapping in "${mappings[@]}"; do
            alias="${mapping%%|*}"
            pattern="${mapping#*|}"
            files=( $pattern )
            if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
              echo "::error::Expected exactly one file for $alias, got: ${files[*]:-none}"
              exit 1
            fi
            source="${files[0]}"
            filename="$(basename "$source")"
            aws s3 cp "$source" "s3://${R2_BUCKET}/download/${alias}" \
              --endpoint-url "$ENDPOINT" \
              --content-disposition "attachment; filename=\"${filename}\"" \
              --cache-control "public, max-age=3600"
          done

      - name: Remove files from the previous release
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # The manifest now names only the new files.  Anything else under
          # `latest/` is from an older build and can go; filenames include the
          # version, so a release that changed a name is covered too.
          keys=$(aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET" --prefix "latest/" \
            --query "Contents[].Key" --output text \
            --endpoint-url "$ENDPOINT")
          for key in $keys; do
            name="${key#latest/}"
            if [ ! -f "dist/$name" ]; then
              aws s3 rm "s3://${R2_BUCKET}/${key}" \
                --endpoint-url "$ENDPOINT" --only-show-errors
            fi
          done
          # Remove the old `releases/<tag>/` layout once and forever.
          aws s3 rm "s3://${R2_BUCKET}/releases/" \
            --endpoint-url "$ENDPOINT" --recursive

      - name: Verify the public domain serves the mirrored manifest
        run: |
          set -euo pipefail
          echo "HEAD $R2_PUBLIC_BASE/latest.json"
          curl -fsSI "$R2_PUBLIC_BASE/latest.json" | sed -n '1,6p'
