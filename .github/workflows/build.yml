name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Cancel overlapping runs for the same tag (e.g. a re-pushed tag) so the
# delete-then-create release step can never interleave with a concurrent run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    # Create the release as soon as the tag lands, before any building.
    #
    # The Tauri workflow attaches the desktop installers to this same release
    # and waits for it to appear.  That wait used to be satisfied only by the
    # `release` job below, which cannot start until all four build legs finish
    # -- and a macOS runner queue of 28 minutes blew straight past the Tauri
    # side's 10-minute budget, failing its uploader permanently.  Creating the
    # release up front means it exists within seconds, so neither uploader can
    # race the other.
    #
    # A draft, not a published release, and the difference is the whole update
    # check: every installed application reads the newest *published* release,
    # and the desktop client then reads `latest.json` off it -- a file only the
    # Tauri build produces, minutes later.  Published here, the release told
    # every client a new version was out and then 404'd the manifest that makes
    # it installable, which the card could only read as "install this one by
    # hand".  It is published by the desktop job that attaches the manifest, or
    # by `release` below if that never happens (see the timeout there).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # --repo is not optional here: without a checkout there is no .git in
          # the workspace, and gh resolves the repository from the working
          # directory -- it fails with "fatal: not a git repository" otherwise.
          # Passing it beats checking out a repo just to make one API call.
          REPO="$GITHUB_REPOSITORY"
          # Create only when missing; never delete.  A delete here would take
          # the desktop installers with it.
          NOTES=$(cat <<'EOF'
          Automated build of both applications for this tag.

          What is new in this release:

          - Unpairing an internet pairing now actually cuts the relay.  A
            device paired both ways holds *two* credentials -- one derived from
            the pairing code, and one exchanged over the LAN link -- and the
            unpair dropped only the first.  The second is keyed on the *LAN*
            pairing, which the unpair deliberately leaves alone, so the test
            for "can this peer be reached over the relay" fell through to the
            survivor: clipboard, chat and attachments kept flowing to a device
            the card had just stopped listing, frames arriving from it were
            still trusted, and no button anywhere could stop it, because that
            channel has no row of its own.  Both credentials go now.  It is not
            permanent: two machines on the same LAN re-enrol each other the next
            time the link comes up, which is the LAN fallback working as
            designed, and the device row still shows the LAN pairing that owns
            it.

          - A file sent to a device that is on both routes no longer dies when
            the LAN drops halfway through it.  The chunk size is fixed when the
            offer is made -- the receiver slices by the size it was told -- while
            the route is chosen per frame, LAN first and the relay as the
            fallback.  A transfer that started on the LAN and lost it mid-way
            therefore handed every remaining 256 KiB frame to a relay that
            refuses anything past its own envelope limit, failing a transfer
            that had already delivered most of itself.  A peer that can be
            reached over the relay is now chunked for the relay from the start,
            whether its LAN link is up or not.  A device with no relay
            credential is untouched and keeps the wire format peers already
            speak.

          - 发送消息 to a device reachable only over the relay opens the
            conversation instead of doing nothing.  The invite dialed the last
            address it knew, waited 15 seconds for a link that was never going
            to come up, gave up and reported the device unreachable -- while the
            very next thing the user clicked would have worked, because that
            peer answers on the relay whatever its LAN link is doing.  The
            address it dialed is usually not the peer's anyway: with no live
            sighting it falls back to a cached address and then to one persisted
            on disk, and a dial that fails clears neither, so a device that
            changed network keeps being dialed at where it used to be.  A failed
            dial now ends the conversation only for a peer the relay cannot
            carry either.

          - Clipboard content the LAN already delivered is no longer reported as
            未送达.  The delivery ledger settles a queued send on the receipt the
            far side publishes back, and the receiver sends one over the LAN for
            every frame it accepts there -- but only the relay's copy of that
            receipt was being read.  So a clip captured while the relay was down
            (the LAN delivered it, the relay publish was queued up) came back as
            a duplicate once the relay returned, the receiver's dedup dropped
            it, and a dropped frame earns no receipt of any kind; the ack window
            then expired and the row failed for content the other machine was
            already holding.  The LAN receipt settles the row now, and it
            settles it at once -- which also closes the window in which a late
            republish of content that had already arrived showed up a second
            time in the other machine's history.

          - The update buttons are greyed on a device with no local connection.
            Both directions ride the LAN and nothing else -- the sidecar refuses
            an offer that arrives over the relay, and the offer it sends has no
            relay fallback -- but the buttons were gated on an mDNS sighting,
            and a sighting keeps naming the version a device runs long after it
            stopped being dialable.  A peer whose port is blocked, or one that
            has just left the network, kept a live 发送更新 that answered the
            click with a 15-second dial and then 无法连接到该设备，它可能已离线。.
            The row's own 本地·离线 chip is the reason, and it sits beside the
            button.

          - The internet pairing card's 在线/离线 is live.  It is a reading
            rather than an event, and the card treated it as one: the sidecar
            decides it when asked, from a 90-second window over the last frame
            heard from each peer, and the only things that asked again were the
            card's own refresh button and an event that fires when a pairing is
            made or broken -- never when the window lapses, and never when a
            peer that had gone quiet speaks again.  So a peer that came back
            stayed 离线 and one that went away stayed 在线, for as long as the
            page stayed open.  The card re-reads itself while it is open.

          - 待投递消息 appears only when something is waiting.  It is a sum of
            the per-row 待补发 chips and it drew itself unconditionally, above
            rows that already said nothing, and its zero could not tell "nothing
            is queued" from "no ledger has answered yet" -- the same zero the
            per-row line refuses to draw.  The chips carry the detail, so this
            line is now the one thing they cannot say: that some peer has
            something waiting.

          The device name is now published in the mDNS record, to the local
          network.  That is what lets devices show the name you chose rather
          than a truncation of it; a device still on its default name publishes
          nothing, so a machine's hostname is not broadcast by it.

          1.0.7 published a macOS installer that cannot start at all, and its
          update check lives in the background process that never comes up, so
          a macOS install on 1.0.7 has to be replaced by hand.  Windows and
          Linux installs on 1.0.5 through 1.0.7 are unaffected and update
          themselves.

          Neither application is notarized, because that needs a paid Apple
          Developer account.  Both macOS downloads are ad-hoc signed, which is
          what lets them start at all on Apple Silicon.

          macOS can still refuse either one on first launch, and the two
          refusals need different answers.  If the dialog says the app "is
          damaged and can't be opened", it has no Open button: that is
          Gatekeeper rejecting an ad-hoc signature on a downloaded copy rather
          than a damaged download, and clearing the download's quarantine flag
          once is what gets past it.

                xattr -dr com.apple.quarantine /Applications/ClipSync.app

          Change the path if the app is not in /Applications.  For the older
          `clipsync-macos-arm64.zip`, unzip it first and point the command at
          the app you got.

          If instead it says the developer cannot be verified, right-click the
          app and choose Open, or allow it under System Settings > Privacy &
          Security.  That path stops working once macOS has shown the damaged
          dialog, which is why it is not the first thing to try.

          The Tauri desktop:
          - `ClipSync_<version>_x64-setup.exe` — Windows installer
          - `ClipSync_<version>_aarch64.dmg` — macOS Apple Silicon
          - `ClipSync_<version>_amd64.deb` / `.AppImage` — Linux x86_64
          - `ClipSync.app.tar.gz` — what the macOS app updates itself with;
            not something you download by hand
          - `latest.json` — the signed update manifest the app reads

          The desktop applications update themselves: every release publishes a
          `latest.json`, and the app reads it through a pointer that follows the
          newest release, so an installed desktop app is offered each new
          version and installs it without help — it downloads, installs and
          restarts, and on Linux the `.deb` asks for your password once.
          Installing by hand is needed for the previous Python application
          (1.0.2 and earlier), which has no updater in it at all, and for a
          macOS install on 1.0.7, whose updater lives in the background process
          that never starts.  Both are replaced by hand.

          The previous Python application:
          - `clipsync-windows.zip` — Windows `.exe`
          - `clipsync-macos-arm64.zip` — macOS Apple Silicon `.app` bundle
          - `clipsync-linux.tar.gz` — Linux x86_64 binary
          - `clipsync-linux-arm64.tar.gz` — Linux ARM64 binary
          EOF
          )
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it in place."
          else
            gh release create "$TAG" --repo "$REPO" --title "ClipSync $TAG" \
              --notes "$NOTES" --draft
          fi

  build:
    # No test job runs in this workflow, deliberately.  The suite runs on the
    # developer's machine, where it can be run in full; what a tag needs from
    # CI is a built, signed, published release.  `tests/test_release_gate.py`
    # holds the publishing graph to its shape instead -- that nothing here can
    # publish from a branch, and that the uploader waits for the legs that
    # produce what it uploads.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: clipsync-windows
          # macOS: Apple Silicon (arm64) only — Intel Macs are not supported.
          - os: macos-latest
            artifact: clipsync-macos-arm64
          - os: ubuntu-latest
            artifact: clipsync-linux
          - os: ubuntu-24.04-arm
            artifact: clipsync-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches internal version
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
        shell: bash
        run: |
          # github.ref_name is the tag that triggered this run (guaranteed on a
          # tag push); equivalent to `git describe --tags --exact-match HEAD`.
          ACTUAL="${{ github.ref_name }}"
          EXPECTED="v$(python -c 'from internal.version import __version__; print(__version__)')"
          echo "Expected version tag: $EXPECTED"
          echo "Actual tag at HEAD:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tag '$ACTUAL' does not match internal.version.__version__ ('$EXPECTED'). Bump internal/version.py before tagging."
            exit 1
          fi

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxcb1 xclip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller clipsync.spec

      - name: Re-sign macOS bundle (unified adhoc signature)
        if: runner.os == 'macOS'
        run: |
          # PyInstaller adhoc-signs the bootloader, but the collected
          # Python.framework keeps its original signature. On macOS 15+
          # the Team-ID mismatch makes dyld refuse to load Python
          # ("different Team IDs" -> "Failed to load Python shared library").
          # Re-sign the whole bundle adhoc so the .app runs everywhere.
          codesign --force --deep --sign - dist/clipsync.app
          codesign --verify --strict --deep dist/clipsync.app

      - name: Package for release (macOS ditto preserves symlinks)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent dist/clipsync.app ${{ matrix.artifact }}.zip

      - name: Package for release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/clipsync.exe -DestinationPath clipsync-windows.zip

      - name: Package for release (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist && tar -czf ../${{ matrix.artifact }}.tar.gz *

      - name: Smoke test (macOS bundle contains web UI)
        if: runner.os == 'macOS'
        run: |
          if unzip -l ${{ matrix.artifact }}.zip | grep -q 'internal/web/static/index.html'; then
            echo "OK: web UI bundled in ${{ matrix.artifact }}.zip"
          else
            echo "::error::Web UI (internal/web/static/index.html) missing from ${{ matrix.artifact }}.zip"
            exit 1
          fi

      - name: Smoke test (Linux bundle contains web UI)
        if: runner.os == 'Linux'
        run: |
          # Linux is a PyInstaller ONEFILE build: the static web UI is embedded
          # inside the `clipsync` binary, so inspect the archive with
          # pyi-archive-viewer rather than listing loose tar files.
          cd dist
          if python -m PyInstaller.utils.cliutils.archive_viewer -l clipsync \
               | grep -q 'internal/web/static/index.html'; then
            echo "OK: web UI bundled in clipsync binary"
          else
            echo "::error::Web UI (internal/web/static/index.html) missing from clipsync binary"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}*.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # `prepare` is named here because the first thing this job does is a
    # `gh release view` that fails outright when the release is not there yet,
    # and it is `prepare` that creates it.  Without this the two are ordered
    # only by `prepare` happening to be quick, which is a coincidence rather
    # than a guarantee -- and `build` no longer waits on a test job, so it now
    # starts sooner than it used to.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: clipsync-windows
          path: dist

      - name: Download macOS arm64 build
        uses: actions/download-artifact@v4
        with:
          name: clipsync-macos-arm64
          path: dist

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: clipsync-linux
          path: dist

      - name: Download Linux ARM64 build
        uses: actions/download-artifact@v4
        with:
          name: clipsync-linux-arm64
          path: dist

      - name: Upload the legacy builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # --repo for the same reason as in `prepare`: this job has no
          # checkout, so gh cannot infer the repository from the workspace.
          REPO="$GITHUB_REPOSITORY"
          # The release was created by the `prepare` job the moment the tag
          # landed, so it is already there.  Uploads --clobber, so a re-pushed
          # tag replaces its assets in place.
          gh release view "$TAG" --repo "$REPO" >/dev/null
          # Upload only the artifacts that actually exist, so a missing matrix
          # leg doesn't fail the whole release.
          for f in \
            dist/clipsync-windows.zip \
            dist/clipsync-macos-arm64.zip \
            dist/clipsync-linux.tar.gz \
            dist/clipsync-linux-arm64.tar.gz
          do
            if [ -f "$f" ]; then
              gh release upload "$TAG" "$f" --repo "$REPO" --clobber
            else
              echo "Skipping missing artifact: $f"
            fi
          done

      - name: Publish the release once it carries its update manifest
        # The desktop workflow attaches `latest.json` and publishes on the back
        # of it; this is the backstop for a desktop build that fails or never
        # finishes.  Waiting first is the point of it: a release whose manifest
        # is missing is visible to every installed application, and tells them
        # there is a new version and then fails to give them one to install.
        # Bounded at 30 minutes, the order of the worst runner queue seen here,
        # and published anyway when the wait runs out -- a broken desktop build
        # must not be able to hide a release the previous application installs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="$GITHUB_REPOSITORY"
          has_manifest() {
            gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' \
              | grep -qx latest.json
          }
          for _ in $(seq 1 90); do
            if has_manifest; then break; fi
            sleep 20
          done
          if ! has_manifest; then
            echo "::warning::No latest.json on $TAG after 30 minutes; publishing without a desktop update manifest."
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
