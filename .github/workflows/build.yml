name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Cancel overlapping runs for the same tag (e.g. a re-pushed tag) so the
# delete-then-create release step can never interleave with a concurrent run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    # Create the release as soon as the tag lands, before any building.
    #
    # The Tauri workflow attaches the desktop installers to this same release
    # and waits for it to appear.  That wait used to be satisfied only by the
    # `release` job below, which cannot start until all four build legs finish
    # -- and a macOS runner queue of 28 minutes blew straight past the Tauri
    # side's 10-minute budget, failing its uploader permanently.  Creating the
    # release up front means it exists within seconds, so neither uploader can
    # race the other.  A release is briefly visible with no assets; that is the
    # price of not having a timeout decide whether the desktop app ships.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # --repo is not optional here: without a checkout there is no .git in
          # the workspace, and gh resolves the repository from the working
          # directory -- it fails with "fatal: not a git repository" otherwise.
          # Passing it beats checking out a repo just to make one API call.
          REPO="$GITHUB_REPOSITORY"
          # Create only when missing; never delete.  A delete here would take
          # the desktop installers with it.
          NOTES=$(cat <<'EOF'
          Automated build of both applications for this tag.

          What is new in this release:

          - The device that is behind asks for the update.  Updating another
            machine was a push, in one direction: the newer side had to hold the
            installer and the older side had to be watched while it arrived.
            获取更新 on the newer device's row now does the asking -- it requests
            the installer that device already downloaded, checks it against the
            published release digest and installs it.  Sending is still there
            and still works; either end can start the exchange, and what a click
            that could not be answered does is say so instead of going quiet.
          - A device that removed this one says so, once, and in those words.
            The refusal is the answer to a connection this side opened, and the
            runtime publishes it on every attempt it makes -- the peer's own
            reconnects included -- so the reader got the same notice over and
            over, or a refusal over a removal that had not happened.  It names
            the removal, says the pairing has to be made again at the other
            device, and is said once per device per session, because nothing
            here can undo it.
          - The log viewer opens on what went wrong.  It had two problems.  It
            showed 暂无日志 on every build, because the background process wrote
            its log to a terminal and never created the file the viewer read.
            And it held one long account of a run, in which the two lines worth
            reading sit among thousands that are routine.  It reads the file
            now, and it is split into 问题 and 全部.
          - Notifications come from the application, not from the system.  Both
            were sent for the same event, so a clip, a pairing or a transfer
            arrived twice: once as a system notification and once in the window.
            The system ones are gone.  This is a background program; the events
            that need the user open the window, and the notice is there.
          - The relay's per-message size is a setting.  A broker that refuses a
            message over its limit does so by dropping it, so a file chunk too
            large for the relay dies in flight while the sender has already
            counted it sent.  The public brokers allow 256 KB and that figure
            was built in; a free tier commonly allows 64 KB.  Set what the relay
            in use publishes, and every chunk is sized to fit under it.
          - Pairing, pairing again, and the device list, seen from several
            devices at once.  A device can hold two pairings -- a pinned one on
            the local network, and one made with a code -- and each of the
            actions that ends trust was answered for one of them.  Removing a
            device ended its local pairing and left the code pairing standing,
            so a device the list called removed could still send clipboard, chat
            and files over the relay, and restoring it brought that back to
            life; revoking trust had the same hole, under a dialog that promises
            the device will not sync again.  A device paired both ways was drawn
            as two rows, one of them with no internet pairing and one with no
            local route.  Now a removed or revoked device is one on both routes,
            a device is one row carrying both its routes and every action either
            of them can carry, and a pairing left behind by an older build is
            dropped rather than kept.

          The device name is now published in the mDNS record, to the local
          network.  That is what lets devices show the name you chose rather
          than a truncation of it; a device still on its default name publishes
          nothing, so a machine's hostname is not broadcast by it.

          1.0.7 published a macOS installer that cannot start at all, and its
          update check lives in the background process that never comes up, so
          a macOS install on 1.0.7 has to be replaced by hand.  Windows and
          Linux installs on 1.0.5 through 1.0.7 are unaffected and update
          themselves.

          Neither application is notarized, because that needs a paid Apple
          Developer account.  Both macOS downloads are ad-hoc signed, which is
          what lets them start at all on Apple Silicon.

          macOS can still refuse either one on first launch, and the two
          refusals need different answers.  If the dialog says the app "is
          damaged and can't be opened", it has no Open button: that is
          Gatekeeper rejecting an ad-hoc signature on a downloaded copy rather
          than a damaged download, and clearing the download's quarantine flag
          once is what gets past it.

                xattr -dr com.apple.quarantine /Applications/ClipSync.app

          Change the path if the app is not in /Applications.  For the older
          `clipsync-macos-arm64.zip`, unzip it first and point the command at
          the app you got.

          If instead it says the developer cannot be verified, right-click the
          app and choose Open, or allow it under System Settings > Privacy &
          Security.  That path stops working once macOS has shown the damaged
          dialog, which is why it is not the first thing to try.

          The Tauri desktop:
          - `ClipSync_<version>_x64-setup.exe` — Windows installer
          - `ClipSync_<version>_aarch64.dmg` — macOS Apple Silicon
          - `ClipSync_<version>_amd64.deb` / `.AppImage` — Linux x86_64
          - `ClipSync.app.tar.gz` — what the macOS app updates itself with;
            not something you download by hand
          - `latest.json` — the signed update manifest the app reads

          The desktop applications update themselves: every release publishes a
          `latest.json`, and the app reads it through a pointer that follows the
          newest release, so an installed desktop app is offered each new
          version and installs it without help — it downloads, installs and
          restarts, and on Linux the `.deb` asks for your password once.
          Installing by hand is needed for the previous Python application
          (1.0.2 and earlier), which has no updater in it at all, and for a
          macOS install on 1.0.7, whose updater lives in the background process
          that never starts.  Both are replaced by hand.

          The previous Python application:
          - `clipsync-windows.zip` — Windows `.exe`
          - `clipsync-macos-arm64.zip` — macOS Apple Silicon `.app` bundle
          - `clipsync-linux.tar.gz` — Linux x86_64 binary
          - `clipsync-linux-arm64.tar.gz` — Linux ARM64 binary
          EOF
          )
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it in place."
          else
            gh release create "$TAG" --repo "$REPO" --title "ClipSync $TAG" --notes "$NOTES"
          fi

  build:
    # No test job runs in this workflow, deliberately.  The suite runs on the
    # developer's machine, where it can be run in full; what a tag needs from
    # CI is a built, signed, published release.  `tests/test_release_gate.py`
    # holds the publishing graph to its shape instead -- that nothing here can
    # publish from a branch, and that the uploader waits for the legs that
    # produce what it uploads.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: clipsync-windows
          # macOS: Apple Silicon (arm64) only — Intel Macs are not supported.
          - os: macos-latest
            artifact: clipsync-macos-arm64
          - os: ubuntu-latest
            artifact: clipsync-linux
          - os: ubuntu-24.04-arm
            artifact: clipsync-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches internal version
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
        shell: bash
        run: |
          # github.ref_name is the tag that triggered this run (guaranteed on a
          # tag push); equivalent to `git describe --tags --exact-match HEAD`.
          ACTUAL="${{ github.ref_name }}"
          EXPECTED="v$(python -c 'from internal.version import __version__; print(__version__)')"
          echo "Expected version tag: $EXPECTED"
          echo "Actual tag at HEAD:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tag '$ACTUAL' does not match internal.version.__version__ ('$EXPECTED'). Bump internal/version.py before tagging."
            exit 1
          fi

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxcb1 xclip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller clipsync.spec

      - name: Re-sign macOS bundle (unified adhoc signature)
        if: runner.os == 'macOS'
        run: |
          # PyInstaller adhoc-signs the bootloader, but the collected
          # Python.framework keeps its original signature. On macOS 15+
          # the Team-ID mismatch makes dyld refuse to load Python
          # ("different Team IDs" -> "Failed to load Python shared library").
          # Re-sign the whole bundle adhoc so the .app runs everywhere.
          codesign --force --deep --sign - dist/clipsync.app
          codesign --verify --strict --deep dist/clipsync.app

      - name: Package for release (macOS ditto preserves symlinks)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent dist/clipsync.app ${{ matrix.artifact }}.zip

      - name: Package for release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/clipsync.exe -DestinationPath clipsync-windows.zip

      - name: Package for release (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist && tar -czf ../${{ matrix.artifact }}.tar.gz *

      - name: Smoke test (macOS bundle contains web UI)
        if: runner.os == 'macOS'
        run: |
          if unzip -l ${{ matrix.artifact }}.zip | grep -q 'internal/web/static/index.html'; then
            echo "OK: web UI bundled in ${{ matrix.artifact }}.zip"
          else
            echo "::error::Web UI (internal/web/static/index.html) missing from ${{ matrix.artifact }}.zip"
            exit 1
          fi

      - name: Smoke test (Linux bundle contains web UI)
        if: runner.os == 'Linux'
        run: |
          # Linux is a PyInstaller ONEFILE build: the static web UI is embedded
          # inside the `clipsync` binary, so inspect the archive with
          # pyi-archive-viewer rather than listing loose tar files.
          cd dist
          if python -m PyInstaller.utils.cliutils.archive_viewer -l clipsync \
               | grep -q 'internal/web/static/index.html'; then
            echo "OK: web UI bundled in clipsync binary"
          else
            echo "::error::Web UI (internal/web/static/index.html) missing from clipsync binary"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}*.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # `prepare` is named here because the first thing this job does is a
    # `gh release view` that fails outright when the release is not there yet,
    # and it is `prepare` that creates it.  Without this the two are ordered
    # only by `prepare` happening to be quick, which is a coincidence rather
    # than a guarantee -- and `build` no longer waits on a test job, so it now
    # starts sooner than it used to.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: clipsync-windows
          path: dist

      - name: Download macOS arm64 build
        uses: actions/download-artifact@v4
        with:
          name: clipsync-macos-arm64
          path: dist

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: clipsync-linux
          path: dist

      - name: Download Linux ARM64 build
        uses: actions/download-artifact@v4
        with:
          name: clipsync-linux-arm64
          path: dist

      - name: Upload the legacy builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # --repo for the same reason as in `prepare`: this job has no
          # checkout, so gh cannot infer the repository from the workspace.
          REPO="$GITHUB_REPOSITORY"
          # The release was created by the `prepare` job the moment the tag
          # landed, so it is already there.  Uploads --clobber, so a re-pushed
          # tag replaces its assets in place.
          gh release view "$TAG" --repo "$REPO" >/dev/null
          # Upload only the artifacts that actually exist, so a missing matrix
          # leg doesn't fail the whole release.
          for f in \
            dist/clipsync-windows.zip \
            dist/clipsync-macos-arm64.zip \
            dist/clipsync-linux.tar.gz \
            dist/clipsync-linux-arm64.tar.gz
          do
            if [ -f "$f" ]; then
              gh release upload "$TAG" "$f" --repo "$REPO" --clobber
            else
              echo "Skipping missing artifact: $f"
            fi
          done
