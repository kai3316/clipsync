name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Cancel overlapping runs for the same tag (e.g. a re-pushed tag) so the
# delete-then-create release step can never interleave with a concurrent run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    # Create the release as soon as the tag lands, before any building.
    #
    # The Tauri workflow attaches the desktop installers to this same release
    # and waits for it to appear.  That wait used to be satisfied only by the
    # `release` job below, which cannot start until all four build legs finish
    # -- and a macOS runner queue of 28 minutes blew straight past the Tauri
    # side's 10-minute budget, failing its uploader permanently.  Creating the
    # release up front means it exists within seconds, so neither uploader can
    # race the other.
    #
    # A draft, not a published release, and the difference is the whole update
    # check: every installed application reads the newest *published* release,
    # and the desktop client then reads `latest.json` off it -- a file only the
    # Tauri build produces, minutes later.  Published here, the release told
    # every client a new version was out and then 404'd the manifest that makes
    # it installable, which the card could only read as "install this one by
    # hand".  It is published by the desktop job that attaches the manifest, or
    # by `release` below if that never happens (see the timeout there).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches internal version
        # Moved here from the deleted PyInstaller job, and it has to stay
        # somewhere: the uploader writes the tag into the updater manifest as the
        # version, so a tag that disagrees with `internal/version.py` ships a
        # manifest whose version is not the one the app reports, and every
        # client's update check fails silently from then on -- nothing on the
        # release page shows it.  This job runs first, so a mismatch now stops
        # the release before it is even created rather than after four builds.
        shell: bash
        run: |
          # github.ref_name is the tag that triggered this run (guaranteed on a
          # tag push); equivalent to `git describe --tags --exact-match HEAD`.
          ACTUAL="${{ github.ref_name }}"
          EXPECTED="v$(python -c 'from internal.version import __version__; print(__version__)')"
          echo "Expected version tag: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tag $ACTUAL does not match internal version $EXPECTED"
            exit 1
          fi

      - name: Create the release if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # --repo is not optional here: without a checkout there is no .git in
          # the workspace, and gh resolves the repository from the working
          # directory -- it fails with "fatal: not a git repository" otherwise.
          # Passing it beats checking out a repo just to make one API call.
          REPO="$GITHUB_REPOSITORY"
          # Create only when missing; never delete.  A delete here would take
          # the desktop installers with it.
          NOTES=$(cat <<'EOF'
          Automated build of the desktop application for this tag.

          What is new in this release:

          Found by reading a paired log set from two machines -- one Windows, one macOS --
          sent to explain two symptoms: clipboard sync that sometimes did not happen, and a
          Mac that Windows could not always discover.

          - **The macOS clipboard monitor no longer rebuilds its bridge ten times a second.**
            The log held **9605** lines of `NSPasteboard.generalPasteboard returned nil` --
            nearly the entire file.  The arithmetic: `POLL_INTERVAL` is 0.4s, one poll calls
            five `_pb_*` helpers, and each calls `_init_nspasteboard()`.  A **success** was
            cached; a **failure was not**, so every one of them rebuilt the bridge from
            scratch -- `find_library`, `LoadLibrary`, `objc_getClass`, two `sel_registerName`s
            and an `objc_msgSend` -- up to **12.5 failed library loads a second, forever**,
            with a log line each.  A failure is now cached with a 60-second cooldown, so a
            transient refusal still recovers and a permanent one stops costing anything.

          - **And it no longer spawns `pbpaste` ten times a second.**  When that bridge is
            unavailable the monitor falls back to hashing the clipboard, and `_poll_hash`
            called `_get_content_hash()` **twice** per poll -- once to seed itself and again
            inside the loop -- while each of those spawns `pbpaste` twice.  At 0.4s that is
            ten process spawns a second, on exactly the machines that could least afford it:
            the ones whose bridge failed, which is why the fallback is running at all.

          - **A reverse-DNS host name is no longer sent to the resolver every 30 seconds.**
            On this Mac `socket.getfqdn()` returns the reverse form of the host's own `::`,
            and the code asked `getaddrinfo` about it anyway: `Address lookup for
            '1.0.0.0...0.ip6.arpa' failed` **408 times** in one log, at a median interval of
            **30.0 seconds**, for a 70-character name no resolver can answer.  Such names --
            and `localhost` -- are filtered before the call.

          - **A presence query that fails to send now says so.**  This is the one that
            matters for the discovery symptom.  The mDNS presence round asks the network who
            is here every ten seconds, and its one silent failure point was a
            `contextlib.suppress(Exception)` around the send.  zeroconf **does** raise on an
            interface it cannot use -- this machine's log has `Error with socket
            (('172.19.0.1', 5353)): [WinError 59]`, an adapter left by WSL or Docker -- and
            when it did, the question was never asked, **nothing was written down**, and the
            application went on discovering nobody until it was restarted and built a new
            zeroconf.  That is the reported symptom exactly.  The send is still suppressed so
            a raising round cannot kill the presence thread, but it is no longer silent, and
            a round now logs `asked=` and `answered=`, which is what separates **"we asked
            and nobody answered"** from **"we never asked"**.

          - **The macOS clipboard bridge now diagnoses itself, in the log.**  Whether the
            bridge can be repaired depends on which part of it failed, and the log could not
            say: it ruled out a missing `libobjc` and a missing `NSPasteboard` class and
            stopped there.  When the fallback is chosen, one warning now carries every step
            -- is there a libobjc, does AppKit resolve, does `generalPasteboard` return
            anything, does `pbpaste` work, and does the pasteboard answer **after
            `NSApplicationLoad()`**, which is the documented way to bring AppKit up in a
            process that is not a bundled application.  A sidecar is exactly that, so if that
            last one flips, the fault is named.  The same check appears in the diagnostics
            report.

          **What this release does not fix, and says so rather than implying otherwise:**
          the discovery failure itself.  Windows discovered the Mac four times in the logs
          available and recovered from every loss, so it could not be reproduced here.  This
          release makes the next occurrence answerable from a log; if the new warning appears
          while the Mac is unreachable, the adapter is the cause and the fix is to bind mDNS
          to the real interface, or to rebuild zeroconf when a send fails instead of waiting
          for a restart.  The macOS bridge failing at all is likewise still open -- what is
          fixed is the cost of it failing.

          Still true from 1.0.34, and repeated because it is the question a
          returning user asks first:

          - **The previous Python application is discontinued.**  There is no
            `clipsync-windows.zip`, `clipsync-macos-arm64.zip`,
            `clipsync-linux.tar.gz` or `clipsync-linux-arm64.tar.gz` on this
            release, and there will not be one again.  If you are running the old
            Python build, its update check will offer you this version and then
            find nothing to download — that is expected, not a broken download.
            Install the desktop application from the assets below instead.

          1.0.36 through 1.0.39 carried: ARM64 Linux builds again, a per-device
          switch for what your clipboard is shared with, a warning on Linux when
          the system cannot read the clipboard at all, and the identity proof
          itself.

          1.0.7 published a macOS installer that cannot start at all, and its
          update check lives in the background process that never comes up, so
          a macOS install on 1.0.7 has to be replaced by hand.

          The application is not notarized, because that needs a paid Apple
          Developer account.  The macOS downloads are ad-hoc signed, which is
          what lets them start at all on Apple Silicon.

          macOS can still refuse one on first launch, and the two refusals need
          different answers.  If the dialog says the app "is damaged and can't
          be opened", it has no Open button: that is Gatekeeper rejecting an
          ad-hoc signature on a downloaded copy rather than a damaged download,
          and clearing the download's quarantine flag once is what gets past it.

                xattr -dr com.apple.quarantine /Applications/ClipSync.app

          Change the path if the app is not in /Applications.

          If instead it says the developer cannot be verified, right-click the
          app and choose Open, or allow it under System Settings > Privacy &
          Security.  That path stops working once macOS has shown the damaged
          dialog, which is why it is not the first thing to try.

          The download names:
          - `ClipSync_<version>_x64-setup.exe` — Windows installer
          - `ClipSync_<version>_aarch64.dmg` — macOS Apple Silicon
          - `ClipSync_<version>_amd64.deb` / `.AppImage` — Linux x86_64
          - `ClipSync.app.tar.gz` — what the macOS app updates itself with;
            not something you download by hand
          - `latest.json` — the signed update manifest the app reads

          The desktop application updates itself: every release publishes a
          `latest.json`, and the app reads it through a pointer that follows the
          newest release, so an installed desktop app is offered each new
          version and installs it without help — it downloads, installs and
          restarts, and on Linux the `.deb` asks for your password once.

          Installing by hand is needed only for a macOS install on 1.0.7, whose
          updater lives in the background process that never starts, and for the
          discontinued Python application described at the top.
          EOF
          )
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it in place."
          else
            gh release create "$TAG" --repo "$REPO" --title "ClipSync $TAG" \
              --notes "$NOTES" --draft
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # `prepare` is named here because the first thing this job does is a
    # `gh release view` that fails outright when the release is not there yet,
    # and it is `prepare` that creates it.  Without this the two are ordered
    # only by `prepare` happening to be quick, which is a coincidence rather
    # than a guarantee.
    #
    # This job no longer waits on a `build` job of its own: the PyInstaller legs
    # that produced the previous Python application's binaries are gone with that
    # application, and the desktop installers arrive from `desktop.yml`.  What is
    # left here is the release itself -- created by `prepare` the moment the tag
    # lands, published at the end of this job -- which is what the desktop
    # workflow attaches its installers to and waits for.
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release once it carries its update manifest
        # The desktop workflow attaches `latest.json` and publishes on the back
        # of it; this is the backstop for a desktop build that fails or never
        # finishes.  Waiting first is the point of it: a release whose manifest
        # is missing is visible to every installed application, and tells them
        # there is a new version and then fails to give them one to install.
        # Bounded at 30 minutes, the order of the worst runner queue seen here,
        # and published anyway when the wait runs out -- a broken desktop build
        # must not be able to hide a release the previous application installs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="$GITHUB_REPOSITORY"
          has_manifest() {
            gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' \
              | grep -qx latest.json
          }
          for _ in $(seq 1 90); do
            if has_manifest; then break; fi
            sleep 20
          done
          if ! has_manifest; then
            echo "::warning::No latest.json on $TAG after 30 minutes; publishing without a desktop update manifest."
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
