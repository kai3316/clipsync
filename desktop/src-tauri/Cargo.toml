[package]
name = "clipsync-desktop"
version = "0.1.0"
description = "ClipSync native desktop host"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
# The staged-update route verifies the release's minisign signature itself
# instead of re-downloading through the plugin (see `install_staged_update`);
# these are the plugin's own crates, promoted so that check can live here.
minisign-verify = "0.2"
base64 = "0.22"
semver = "1"
# Offline install-from-bytes on macOS/Linux decompresses and unpacks the signed
# payload without a second download.  `tar` itself is unix-only (see the
# target-specific table below), so a Windows build never needs its sources.
flate2 = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "fs", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"

[target.'cfg(unix)'.dependencies]
# macOS/Linux offline installs unpack the signed .app.tar.gz / AppImage archive.
# Kept target-specific so the Windows build -- and its offline check/test -- does
# not compile or fetch it; the updater plugin already pulls it in on unix.
tar = "0.4"

[target.'cfg(windows)'.dependencies]
# The job object that ties the sidecar to this process's lifetime.  See `src/confine.rs`
# for why the OS has to be the one holding that, rather than a shutdown path in here.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
winreg = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
