[package]
name = "clipsync-desktop"
version = "0.1.0"
description = "ClipSync native desktop host"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
# The job object that ties the sidecar to this process's lifetime.  See `src/confine.rs`
# for why the OS has to be the one holding that, rather than a shutdown path in here.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
winreg = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
