<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>ClipSync</title>
    <!-- The first frame, drawn before the bundle is parsed.  It is one opaque
         surface with a spinner and a word, not a skeleton: a pulsing mock of
         the shell painted over the real window made the startup look like two
         windows layered on top of each other.  The surface stays until `App.vue`
         has a status or a startup error to show. -->
    <style>
      html {
        color-scheme: light dark;
        background: #f5f6f8;
      }
      @media (prefers-color-scheme: dark) {
        html { background: #0f1117; }
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #f5f6f8;
        color: #5b6470;
        font: 500 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #boot .boot-copy {
        display: grid;
        justify-items: center;
        gap: 10px;
      }
      #boot .boot-wordmark {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #1f2937;
      }
      #boot .boot-hint { font-size: 13px; }
      #boot .boot-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(127, 127, 127, 0.22);
        border-top-color: #087c6b;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        #boot { background: #0f1117; color: #9aa4b2; }
        #boot .boot-wordmark { color: #e5e7eb; }
        #boot .boot-spinner { border-color: rgba(255, 255, 255, 0.16); border-top-color: #7cc4b3; }
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-spinner { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-copy">
        <div class="boot-spinner" aria-hidden="true"></div>
        <div class="boot-wordmark">ClipSync</div>
        <span class="boot-hint">正在启动…</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
